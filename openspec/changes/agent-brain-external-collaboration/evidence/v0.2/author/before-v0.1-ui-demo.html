<div class="demo-bar"><div class="demo-label"><span>◈</span><strong>合成资料 / 交互演示</strong><span>不连接真实账号</span></div><div class="demo-controls"><label for="scene">演示控制</label><select id="scene" data-testid="scene-select" aria-label="演示场景"><option value="normal">正常：完整闭环（模拟就绪）</option><option value="unconfigured">首次：未完成接入</option><option value="busy">异常：模型忙，交付待处理</option><option value="supplement">验收：需补充一次</option><option value="human">介入：范围扩大待决定</option><option value="unknown">异常：发布结果 UNKNOWN</option><option value="duplicate">异常：重复领取</option><option value="executorbusy">占用：等待同一执行者</option><option value="identity">异常：执行者身份变化</option><option value="offline">异常：资产 MCP 离线</option><option value="expired">异常：授权到期</option><option value="failed">异常：回传校验失败</option><option value="late">异常：停止后迟到回传</option></select><button data-action="reset" data-testid="reset-demo">重置演示</button></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='optracall.external-collaboration.demo.v1';
const TASKS=[{id:'requirement',type:'需求',letter:'R',name:'明确会员资料核查范围',status:'已完成',piece:'整理四店资料字段与缺失项'},{id:'analysis',type:'分析',letter:'A',name:'四店会员资料一致性核查',status:'进行中',piece:'核查四店会员字段映射与重复记录'},{id:'plan',type:'计划',letter:'P',name:'安排资料修订与复查计划',status:'草稿',piece:'编写资料修订排期与复查清单'},{id:'decision',type:'决策',letter:'D',name:'核定四店会员口径处理方案',status:'待资料',piece:'整理可选方案、证据与影响对照'},{id:'do',type:'执行',letter:'Do',name:'落实获准的资料修订',status:'未开始',piece:'在隔离副本准备修订脚本与差异'},{id:'teach',type:'反馈',letter:'T',name:'复盘核查结果与业务反馈',status:'未开始',piece:'汇总四店反馈与未解决问题'}];
const ASSETS=[{id:'semantic',type:'语义',name:'会员与有效会员定义',v:'v2.1',source:'SAP · 会员业务语义 / 已发布',scope:'四店会员；仅解释会员身份与有效状态',excerpt:'会员以本次合成资料 member_key 为核查标识。有效会员仅表示在册状态，不代表活跃、购买或同意营销。不能据此推断经营效果。',ref:'SEM-021',hash:'demo:sha256:834a21…7c91'}, {id:'metric',type:'指标',name:'跨店重复记录数',v:'v1.3',source:'SAP · 会员资料质量 / 已发布',scope:'2026-11-01 四店快照；按规范化 member_key 分组',excerpt:'跨店重复记录数 = 同一 member_key 出现在两个及以上门店的记录条数。手机号不作为唯一身份键。空键和异常键单列，不能静默补齐。',ref:'MET-013',hash:'demo:sha256:7b2e80…3a6d'}, {id:'method',type:'方法',name:'资料一致性检查清单',v:'v1.2',source:'方法库 · 已发布参考版',scope:'只读检查及报告；不修改业务系统',excerpt:'按字段存在性、类型、空值、跨店一致性逐项核查；保留原始值及差异位置。无法确定身份的记录标为 UNKNOWN，不自动合并。',ref:'MTH-012',hash:'demo:sha256:1f924b…87d2'}, {id:'mapping',type:'数据映射',name:'四店会员字段映射',v:'v0.4',source:'本任务数据说明 · 固定快照',scope:'合成四店；无个人联系值；仅字段说明及脱敏样例',excerpt:'A店 member_key ↔ B店 member_id ↔ C店 vip_key ↔ D店 customer_key。status 映射仅在本快照适用。四份合成 CSV 位于本次任务获准输入；不开放其他项目或010原件。',ref:'MAP-004',hash:'demo:sha256:a1c40f…d882'}];
const defaultState=()=>({schemaVersion:2,artifacts:null,artifactHistory:[],theme:'light',scene:'normal',task:'analysis',draft:'请保留未确认的身份映射，不要自动合并会员。',draftByTask:{analysis:'请保留未确认的身份映射，不要自动合并会员。'},promptByTask:{},draftSaved:false,auth:null,status:'suggested',history:[],selectedAsset:'semantic',assetError:'',assetLast:'',reads:[],candidate:false,supplemented:false,receiptChecked:false,late:false,paused:false,modelBusy:false,setup:{api:true,connector:true,full:true},goal:'核对四店会员资料的一致性，交回可追溯的差异表和检查说明。',lastPrompt:''});
let state=defaultState();try{const raw=sessionStorage.getItem(STORE);if(raw){const restored=JSON.parse(raw);if(restored&&restored.schemaVersion===2&&Array.isArray(restored.history)&&TASKS.some(x=>x.id===restored.task)&&['suggested','preparing','publishing','waiting','running','review','accepted','supplement','intervention','unknown','blocked','failed','stopped','pending'].includes(restored.status))state={...state,...restored};}}catch{}
let timers=[],dialogReturn=null,toastTimer=null;
function save(){try{sessionStorage.setItem(STORE,JSON.stringify(state));}catch{}}
function ownAuth(){return state.auth?.task===state.task}
function selectTask(id){if(state.task===id)return;state.draftByTask??={};state.promptByTask??={};state.draftByTask[state.task]=state.draft;state.promptByTask[state.task]=state.lastPrompt;state.task=id;state.draft=state.draftByTask[id]||'';state.lastPrompt=state.promptByTask[id]||''}
function task(){return TASKS.find(x=>x.id===state.task)||TASKS[1]}
function selectedAssets(){return ASSETS.filter(a=>state.auth?.assets?.includes(a.id))}
function setupReady(){return !!(state.setup?.api&&state.setup?.connector&&state.setup?.full)}
function usedAssets(){return selectedAssets().filter(a=>state.reads.some(r=>r.ref===a.ref&&r.v===a.v))}
function mappingUsed(){return usedAssets().some(a=>a.id==='mapping')}
function deliveryVersion(){return state.supplemented?'v1.1':'v1.0'}
function mappingLimit(){return mappingUsed()?'':'四店字段映射未获准或未实际读取，本次未取用、未核验字段含义；仅保留原字段名差异，接受工作片段时明确保留这一限制。'}
function activeAuth(){return !!state.auth&&!state.auth.revoked&&!state.auth.expired&&!['stopped','accepted'].includes(state.status)}
function btn(label,action,primary=false,extra=''){return `<button class="btn ${primary?'primary':''}" data-action="${action}" ${extra}>${label}</button>`}
function pill(label,color=''){return `<span class="pill ${color}">${label}</span>`}
const STATUS={suggested:['待授权','gray'],preparing:['准备中',''],publishing:['发布待核','amber'],waiting:['待领取',''],running:['执行中',''],review:['待验收','amber'],accepted:['已接受','green'],supplement:['需补充','amber'],intervention:['需你决定','amber'],unknown:['发布待核 · UNKNOWN','amber'],blocked:['读取受阻','amber'],failed:['回传失败','red'],stopped:['取消待核','red'],pending:['交付待处理','amber']};
function statusPill(){const s=STATUS[state.status]||STATUS.suggested;return pill(s[0],s[1])}
function stopTimers(){timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function event(label,body,source='OptraCall Agent',kind='normal'){state.history.push({label,body,source,kind,time:`演示 ${String(state.history.length+1).padStart(2,'0')}`});save()}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function navigate(page){location.hash=page;if(location.hash.slice(1)===page)render()}
function contextStrip(){return `<div class="context-strip"><span>项目：云杉零售四店会员资料核查</span><span>任务：${esc(task().type)} · ${esc(task().name)}</span><span>Case：会员资料治理</span><span>任务数：6（浏览不会新建）</span></div>`}
function title(eyebrow,heading,description,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${heading}</h1><p>${description}</p></div><div class="head-actions">${actions}</div></div>`}
function taskTabs(current){return `<nav class="tabs" aria-label="任务内容"><a href="#task/${state.task}" class="${current==='task'?'active':''}">任务对话</a><a href="#report" class="${current==='report'?'active':''}" data-testid="report-tab">报告与成果</a><a href="#draft" class="${current==='draft'?'active':''}" data-testid="draft-tab">保留的草稿</a><a href="#work" class="${current==='work'?'active':''}" data-testid="work-tab">外部协作${state.auth?'<span class="notice-count">1</span>':''}</a></nav>`}
function renderProject(){return title('PROJECT MAP','从原项目继续工作','六类任务承载不同用途；外部协作可承接其中的一段工作。',`<a class="btn" href="#case" data-testid="open-case">查看关联 Case ↗</a>`)+`<section class="project-banner"><span class="pill">云杉零售 · 全部为合成资料</span><h2>四店会员资料核查</h2><p>先厘清口径与差异，再决定修订。原任务、报告、验收和后续反馈留在 OptraCall。</p><div class="head-actions"><a class="btn primary" href="#task/analysis" data-testid="open-analysis">继续分析任务 →</a><a class="btn" href="#report">查看当前报告</a></div></section><div class="row between" style="margin-bottom:13px"><h2 style="font-size:16px">项目任务 <span class="muted small">6</span></h2><span class="small muted">需求 → 分析 → 计划 → 决策 → 执行 → 反馈</span></div><section class="six-grid" aria-label="六类任务">${TASKS.map(t=>`<a class="task-tile ${t.id==='analysis'?'feature':''}" href="#task/${t.id}" data-testid="task-${t.id}"><div class="row between"><span class="eyebrow">${t.letter} / ${t.type}</span>${pill(t.status,t.status==='进行中'?'green':'gray')}</div><strong>${t.name}</strong><p>可按目标外派片段：${t.piece}</p><div class="foot"><span>保留在原${t.type}任务</span><span>打开 →</span></div></a>`).join('')}</section><div class="callout section-space">这是已有项目的六个示例任务。打开任务、Case、报告或资产依据，只切换阅读位置；不会派单或创建新任务。</div>`}
function collabCard(){return `<section class="card collab"><div class="card-head"><h2>⇄ 外部协作</h2>${ownAuth()?statusPill():pill('待授权','gray')}</div><div class="pad">${!ownAuth()?`<div class="eyebrow" style="margin-bottom:8px">Agent 的建议</div><h3>${esc(task().piece)}</h3><p>这段核查可交给外部执行者完成；我会准备工单、跟进进度，并核验回传。业务判断仍回到本任务。</p><div class="tiny-line"></div><p><strong style="color:#59416f">只需确认一次必要授权</strong><br>目标、外派范围、执行者与资产权限一起确认，范围内无需逐条审批读取。</p>${state.auth?'<div class="callout section-space">本演示已有另一任务的外派，归属保持。<a class="btn text" href="#work">回原外派查看 →</a><p>要独立体验本类型的授权，可使用顶部演示控制重置。</p></div>':setupReady()?btn('查看建议并授权 →','authorize',true,'data-testid="authorize-open"'):'<a class="btn primary" href="#setup" style="width:100%;margin-top:15px" data-testid="complete-setup">先完成接入与联通验证 →</a>'}`:`<h3>${esc(state.auth.piece)}</h3><p>${statusDescription()}</p><div class="tiny-line"></div><dl class="meta"><dt>执行者</dt><dd>WorkBuddy 本机助手 · 模拟</dd><dt>资产权限</dt><dd>${selectedAssets().length} 项准确版本 · 只读</dd><dt>原任务</dt><dd>${esc(state.auth.taskType)} · 保持归属</dd></dl><a class="btn primary" href="#work" style="width:100%;margin-top:17px" data-testid="view-work">查看协作进展 →</a>`}</div></section>`}
function statusDescription(){return ({preparing:'我正把已确认的目标和准确资产引用整理为外派工作。',publishing:'正在核对 GitHub 发布回执。发布结果确认前不会重复发单。',waiting:state.scene==='executorbusy'?'同一 WorkBuddy 连接已有一项已触发/领取工作。当前工作等待执行者，不触发第二项。':'工单已确认发布。等待指定执行者按可信身份领取。',running:'指定执行者已取得 Host 台账中的唯一有效领取。我会在授权内跟进并核对交付。',review:'GitHub 已关闭并回传成果。我正核验引用与交付内容，关闭工单不会直接完成原任务。',accepted:'我已在授权内核验并接受这一工作片段。原任务可继续；资料仍未成为正式资产。',supplement:'发现差异定位不足。我已在原工单要求补充，无需扩大授权。',intervention:'执行者提出新增两店及联系值明细，超出当前授权。原四店成果保留，等你作业务取舍。',unknown:'API 发布结果不明。只核对原请求与回执，保持 UNKNOWN，不自动重发。',blocked:'当前资格或资产读取条件发生变化。新读取已停止，原结果与历史引用保持。',failed:'回传清单存在字段缺失。无效回传保留，未作为已接受成果。',stopped:'已取消后续委派并撤回后续访问，已请求外部停止；对方是否停止与已有动作仍待核。',pending:'外部交付已进入 Host 台账等待处理；原 Task 空闲且授权有效后，Agent 才会自动核验。',suggested:'等待你确认必要授权。'})[state.status]||''}
function renderTask(){return title('TASK / '+esc(task().type),esc(task().name),'项目和任务关系保持；按需委派工作片段，由原任务 Agent 收回结果。',`<a class="btn" href="#project" data-testid="back-project">← 项目地图</a><a class="btn" href="#case">关联 Case</a>`)+taskTabs('task')+`<div class="grid"><section class="card"><div class="task-overview"><span class="task-glyph">${task().letter}</span><div><h2 class="task-title">${esc(task().name)}</h2><small>合成快照 2026-11-01 · 原任务记录持续保留</small></div></div><div class="chat"><div class="speaker"><span class="mini-avatar">你</span>业务目标 · 已有上下文</div><p>${state.task==='analysis'?'帮我核对云杉零售四家店的会员资料：字段、状态与跨店重复是否一致。先查清差异，不要修改业务系统，也不要把不确定身份自动合并。':`继续推进「${esc(task().name)}」，沿用四店会员资料治理的范围。可把适合的工作片段交由外部执行，重要业务取舍回到这里。`}</p></div><div class="chat"><div class="speaker"><span class="mini-avatar">O</span>OptraCall Agent <span class="pill gray">合成交互</span></div><p>我保留了原报告与数据说明。${state.task==='analysis'?'四店字段名称存在差异，需按已发布口径逐项核对；其中一组跨店身份对应关系仍为 UNKNOWN。':'这项任务保持自身用途与目标，外派方式不会改变它在项目中的位置。'}</p><div class="quote">当前边界：只核查合成快照及获准依据；不改生产数据，不联系会员，不发布正式口径。</div><p>${ownAuth()&&state.status==='accepted'?'外部核查片段已接受。我已把差异表和验证说明接回本任务；原报告中的 UNKNOWN 继续保留，后续由业务负责人核定。':'我建议将「'+esc(task().piece)+'」交给外部执行者。你确认必要范围后，我会自主派单、跟进并验收。'}</p><div class="head-actions" style="margin-top:15px"><a class="btn" href="#report">查看原报告 ↗</a><a class="btn text" href="#assets">查看依据</a></div>${state.lastPrompt?`<div class="callout section-space"><strong>本次示例补充</strong><br>${esc(state.lastPrompt)}<br><small>已保存在原任务；没有新建 Task。</small></div>`:''}</div><div class="compose"><label class="sr-only" for="task-draft">原任务草稿</label><textarea id="task-draft" data-testid="task-draft" placeholder="继续和原任务 Agent 沟通…">${esc(state.draft)}</textarea><div class="compose-foot"><small>草稿随页面往返保留。演示发送只保存本地状态。</small>${btn('发送','send-draft',true,'data-testid="send-draft"')}</div></div></section><aside class="stack">${collabCard()}<section class="card"><div class="card-head"><h2>本任务保留</h2></div><div class="pad"><div class="list-row"><div><strong function renderReport(){return title('REPORT / 原报告','四店会员资料核查初稿','v0.3 · 合成快照 · 原始结论与 UNKNOWN 保持',`<a class="btn" href="#task/${state.task}" data-testid="report-task">← 原任务</a><a class="btn" href="#case">查看 Case</a>`)+taskTabs('report')+`<div class="grid"><article class="card report-paper"><div class="eyebrow">云杉零售 / SYNTHETIC REPORT</div><h2>四店会员资料核查</h2><p class="muted small">2026-11-27 · 原报告 v0.3 · 仅供交互演示</p><div class="tiny-line"></div><h3>1. 核查范围</h3><p>本次仅检查四店合成会员快照及数据说明，输出资料差异，不修改业务系统。会员身份解释依据固定版本 <button class="reference" data-action="source-semantic">[1]</button>。</p><h3>2. 当前发现</h3><div class="table-wrap"><table><thead><tr><th>核查项</th><th>合成发现</th><th>结论边界</th></tr></thead><tbody><tr><td>字段映射</td><td>4 店采用不同字段名</td><td>按 v0.4 映射核对 <button class="reference" data-action="source-mapping">[2]</button></td></tr><tr><td>跨店重复记录</td><td>26 条（合成）</td><td>不等同于重复会员人数</td></tr><tr><td>身份对应关系</td><td>1 组待核实</td><td>${pill('UNKNOWN','amber')}</td></tr></tbody></table></div><h3>3. 下一步</h3><p>核对差异位置和采用的准确资产版本，保留无法判断的身份映射。后续修订与业务采纳需沿原 Case 处理。</p><div class="callout section-space">本报告未被外部交付覆盖。已接受的工作片段以新增成果接回原任务；原结论、来源及未验证项继续保留。</div>${state.status==='accepted'?`<div class="receipt section-space"><strong>已关联新增成果</strong>外部核查交付 · 差异明细 ${deliveryVersion()} · Agent 已接受${mappingUsed()?'':'（字段映射未取用 / 未核验）'}。<br><a href="#delivery" class="btn text">查看交付与核验 →</a></div>`:''}</article><aside class="stack"><section class="card"><div class="card-head"><h2>报告依据</h2></div><div class="pad"><div class="list-row"><div><strong>[1] 会员与有效会员定义</strong><small>v2.1 · 原引用保留</small></div>${btn('查看','source-semantic')}</div><div class="list-row"><div><strong>[2] 四店会员字段映射</strong><small>v0.4 · 固定快照</small></div>${btn('查看','source-mapping')}</div><p class="small muted" style="margin-top:13px">打开不同引用可看到不同原文。关闭后回到原引用；不会改用最新版填补缺失。</p></div></section><section class="card"><div class="pad"><h3>继续工作</h3><p class="small muted" style="margin:8px 0 15px">报告、任务和 Case 可来回阅读，草稿与任务归属保持。</p><a class="btn primary" href="#task/${state.task}">返回原任务 →</a></div></section></aside></div>`}

function progressSteps(){const order=['preparing','publishing','waiting','running','review','accepted'];let index=order.indexOf(state.status);if(['supplement','intervention','blocked','failed','unknown','stopped'].includes(state.status))index=state.status==='unknown'?1:state.status==='stopped'?3:4;return `<ol class="steps">${[['preparing','准备外派内容','Agent 根据一次授权组织工作'],['publishing','发布并核对工单','GitHub 是工作交接渠道'],['waiting','指定执行者领取','Host 核验身份与单一有效领取'],['running','按需读取与执行','资产 MCP 只读提供获准版本'],['review','收回并核验结果','Agent 核验内容、引用与未验证项'],['accepted','继续原任务','接受片段不代表业务目标已达成']].map((s,i)=>`<li class="${i<index?'done':i===index?'current':''}"><strong>${s[1]}</strong><p>${s[2]}</p></li>`).join('')}</ol>`}

return title('EXTERNAL COLLABORATION','一段工作，始终回到原任务','Host 原子工作台账保存领取、交付和验收状态；GitHub 仅承载通信与证据。',`<a class="btn" href="#task/${state.task}" data-testid="continue-original">← 继续查看原任务</a>${btn(state.paused?'恢复本 Task 续接':'暂停本 Task 续接',state.paused?'resume-task':'pause-task',false,'data-testid="toggle-task-resume"')}${btn('查看本次授权','view-auth',false,'data-testid="view-authorization"')}`)+contextStrip()+taskTabs('work')+`<div class="grid"><div class="stack"><section class="card"><div class="pad"><div class="status-heading"><div class="status-symbol">⇄</div><div><div class="row wrap"><h2>${esc(state.auth.piece)}</h2><span data-testid="work-status">${statusPill()}</span></div><p class="small muted" style="margin-top:7px">WorkBuddy 本机助手 API · 官方能力已核 / 联用待实号验证 · 私有示例业务仓库</p></div></div><p class="small" style="line-height:1.9">${statusDescription()}</p>${workWarning()}<div class="two-stat section-space"><div class="stat-box"><small>GitHub 通信 / 证据</small><strong>${githubState()}</strong></div><div class="stat-box"><small>Host 台账 / 原任务验收</small><strong>${state.status==='accepted'?'已接受这一片段':state.status==='review'?'Agent 正在核验':state.status==='pending'?'待原 Task 处理':'尚未接受'}</strong></div></div><div class="head-actions section-space"><a class="btn" href="#delivery" data-testid="view-delivery">查看交付与验收</a><a class="btn" href="#assets" data-testid="view-assets">查看资产取用</a>${['unknown','publishing'].includes(state.status)?btn('核对原发布回执','check-receipt',false,'data-testid="check-original-receipt"'):''}${activeAuth()?btn('取消外派并撤回访问','stop',false,'data-testid="stop-work"'):''}</div></div></section><section class="card"><div class="card-head"><h2>工作交接与回执</h2>${pill('模拟 GitHub 历史','gray')}</div><div class="pad"><div class="receipt"><strong>Issue #DEMO-42 · ${['accepted','review','pending'].includes(state.status)?'Closed':'Open / 待核'}</strong><span class="mono">https://github.invalid/yunshan-demo/private-member-audit/issues/42</span><p class="small muted" style="margin-top:7px">合成链接，仅本页预览；不打开外站、不发出网络请求。</p>${btn('预览工单内容','issue-preview',false,'style="margin-top:10px" data-testid="issue-preview"')}</div><div class="section-space" data-testid="history">${state.history.length?state.history.map(e=>`<div class="event"><div class="when">${esc(e.time)} <span class="source">· ${esc(e.source)}</span></div><strong>${esc(e.label)}</strong><p>${esc(e.body)}</p></div>`).join(''):'<p class="muted small">授权范围已固定，正在准备外派内容。</p>'}</div></div></section></div><aside class="stack"><section class="card"><div class="card-head"><h2>Host 工作台账 · 自主推进</h2></div><div class="pad">${progressSteps()}</div></section><section class="card"><div class="card-head"><h2>三个边界</h2></div><div class="pad"><div class="list-row"><div><strong>工单 / GitHub</strong><small>传递要求、领取、评论与回传</small></div></div><div class="list-row"><div><strong>远端 MCP / 两组权限</strong><small>资产只读；工作领取、续租与交付</small></div></div><div class="list-row"><div><strong>验收 / 原任务 Agent</strong><small>空闲且授权有效时核验并沿原工具保存</small></div></div></div></section></aside></div>`}
function githubState(){if(state.status==='unknown'||state.status==='publishing')return '发布结果待核';if(['preparing'].includes(state.status))return '准备发布';if(['review','accepted','pending'].includes(state.status))return 'Closed · 已回传';if(state.status==='supplement')return 'Open · 补充中';if(state.status==='stopped')return state.late?'迟到回传已保留':'外部动作待核';return 'Open · 已关联'}
function workWarning(){let msg='',cls='amber';if(state.scene==='executorbusy'&&state.status==='waiting')msg='等待执行者：首期同一 WorkBuddy 连接只允许一项已触发/领取工作。当前工作排队，尚未发出第二次 API 触发；原任务和授权边界保持。';if(state.demoReopened)msg='演示页已重开，原阶段与已知事实保留。本静态页没有持久后台，未自动重演外部动作；可重置演示体验新流程。';if(state.paused)msg='本 Task 自动续接已暂停；外部工作及其授权继续有效。这不会停止外部执行者。恢复后仅在授权有效、模型空闲时继续处理。';if(state.status==='pending')msg=state.paused?'外部交付已保存为待处理，本 Task 自动续接暂停。外部工作未被取消；恢复 Task 续接后才自动核验。':'原 Task 模型正忙。Host 已把外部交付保存为待处理；模型空闲且授权有效后，再自动交回同一 Task 核验。';if(state.status==='unknown')msg='UNKNOWN：发布 API 超时。禁止自动重发；核对原请求与回执后再确定是否有工单。';if(state.status==='blocked')msg=state.scene==='identity'?'指定执行者的可信身份已变化，Host 已暂停其资格并拒绝新读取。换执行者需重新确认；不沿用旧权限。':state.scene==='expired'?'授权已到期，新读取返回 AUTH_EXPIRED。已读引用和原成果保留；续期需要必要授权。':'资产 MCP 当前离线，返回 INSTANCE_OFFLINE。实例恢复并重新核验资格后才能继续；不会改用其他版本。';if(state.status==='intervention')msg='需要你的业务取舍：新增门店和个人联系值超出原范围。可保持原四店范围，由 Agent 继续；扩大范围须另行明确授权。';if(state.status==='failed'){msg='MANIFEST_INVALID：回传缺少差异表文件字节与固定版本摘要；该次交付未通过校验。原失败回执保留。';cls='red'}if(state.status==='stopped'){msg='后续读取及工作访问已撤回，并已请求对方停止。外部进程是否已停止仍待核；已发布 Issue、已发生读取和副作用不会自动抹除。'+(state.late?' 迟到回传已隔离保存，不恢复授权、不改为已接受。':'');cls='red'}if(state.status==='supplement')msg='Agent 已要求补上差异位置与准确引用，属于原范围内的一次补充；无需你搬运附件或逐条审批。';return msg?`<div class="callout ${cls} section-space" data-testid="work-warning">${msg}${state.status==='pending'&&state.modelBusy?`<div style="margin-top:12px"><span class="eyebrow">演示控制</span> ${btn('模拟模型空闲','demo-idle',false,'data-testid="model-idle"')}</div>`:''}${state.status==='intervention'?`<div style="margin-top:12px">${btn('保持原范围，继续核验','keep-scope',true,'data-testid="keep-original-scope"')}</div>`:''}</div>`:''}
function renderAssets(){const a=ASSETS.find(x=>x.id===state.selectedAsset)||ASSETS[0];const allowed=state.auth?selectedAssets():ASSETS;return title('ASSET ACCESS','外部读取的是获准依据','语义、指标、方法与数据映射留在实际 OptraCall 运行端；经受保护入口只读提供。',`<a class="btn" href="#work">← 协作进展</a><a class="btn" href="#task/${state.task}">原任务</a>`)+contextStrip()+`<div class="grid"><div class="stack"><section class="card"><div class="card-head"><h2>${state.auth?'本次获准资产':'当前任务可供授权的资产'}</h2>${pill('准确版本 · 只读')}</div><div class="pad"><div class="callout">外部执行者在本任务范围内按需读取，无需你逐条批准。这里只演示读取与回源，不分发凭据、Skill 包或执行工具。</div><div class="evidence-tabs">${allowed.map(x=>`<button class="asset-choice ${x.id===a.id?'active':''}" data-asset="${x.id}" data-testid="asset-${x.id}">${x.type} · ${x.v}</button>`).join('')||'<p class="muted small">本次未授权外部读取任何资产。</p>'}</div><div class="table-wrap"><table class="asset-table"><thead><tr><th>资产 / 准确版本</th><th>出处</th><th>范围</th></tr></thead><tbody>${allowed.map(x=>`<tr><td><strong>${x.name}</strong><br>${x.v}</td><td>${x.source}</td><td>${x.scope}</td></tr>`).join('')}</tbody></table></div><div class="section-space"><h3>${esc(a.name)} · ${a.v}</h3><p class="small muted" style="margin-top:7px">${esc(a.source)} · ${a.ref} · ${a.hash}（演示摘要）</p><div class="quote" data-testid="asset-original-content">${esc(a.excerpt)}</div><p class="small muted">原文预览固定在本版本。错误读取不会覆盖这份内容或原报告结果。</p></div><div class="head-actions section-space">${btn('模拟外部读取此版本','read-asset',true,'data-testid="asset-read"')}</div>${state.assetError?`<div class="callout red section-space" role="alert" data-testid="asset-error">${esc(state.assetError)}<br><strong>原结果与原引用保持不变。</strong></div>`:''}${state.assetLast?`<div class="callout green section-space" data-testid="asset-success">${esc(state.assetLast)}</div>`:''}<details class="disclosure"><summary>演示控制：读取失败反例</summary><div class="form-field"><label for="read-case">模拟一次外部读取请求</label><select id="read-case" data-testid="read-case"><option value="normal">正常：读取上方准确版本</option><option value="other">越任务：读取其他项目资产</option><option value="version">错版本：请求不存在的 v9.9</option><option value="revoked">已撤回：使用旧读取资格</option><option value="offline">离线：运行实例不可用</option><option value="expired">过期：读取资格已到期</option></select></div>${btn('演示本次读取','read-case',false,'data-testid="run-read-case"')}<p>此处是原型验收控制，不是产品要求用户逐条管理的读取步骤。</p></details></div></section><section class="card"><div class="card-head"><h2>实际引用记录（合成）</h2>${pill(state.reads.length+' 条','gray')}</div><div class="pad" data-testid="asset-records">${state.reads.length?state.reads.map(r=>`<div class="list-row"><div><strong>${esc(r.name)} · ${esc(r.v)}</strong><small>${esc(r.by)} · ${esc(r.reason)} · ${esc(r.ref)}</small></div>${pill('读取已记录','green')}</div>`).join(''):'<p class="small muted">尚无外部读取回执；资产被列出不等于已经读取或采用。</p>'}</div></section></div><aside class="stack"><section class="card"><div class="card-head"><h2>入口与可用性</h2>${pill(state.scene==='offline'&&state.auth?'离线示例':'就绪示例',state.scene==='offline'&&state.auth?'amber':'green')}</div><div class="pad"><dl class="meta"><dt>资产所在</dt><dd>当前实际运行的 OptraCall 实例</dd><dt>对外入口</dt><dd>受保护 HTTPS · 合成地址<br><span class="mono">https://assets.optracall.invalid/mcp</span></dd><dt>运行条件</dt><dd>实例在线，执行者身份与本任务授权均有效</dd><dt>开放能力</dt><dd>资产只读；另有工作领取/续租/交付权限，不开放任意文件或执行</dd></dl><a class="btn text section-space" href="#setup">按需查看首次设置 →</a></div></section><section class="card"><div class="pad"><h3>失败时保留已有依据</h3><p class="small muted" style="margin-top:8px">错版本、撤回或离线都有具体结果。Agent 不会静默取最新版，也不会用另一项目的资产填补；原报告和历史引用继续保留。</p></div></section></aside></div>`}
function deliveryReady(){return ['pending','review','accepted','supplement','intervention','failed'].includes(state.status)||state.late}

function artifactRecords(version=deliveryVersion(),mode='pending'){
  const revision=version==='v1.1'?2:1;
  return ['diff','notes'].map(key=>({key,version,revision,name:(key==='diff'?'member-differences-':'verification-notes-')+version+(key==='diff'?'.csv':'.md'),local:mode,hash:mode==='failed'?'missing':'pending',claimed:mode==='failed'&&key==='diff'?'':key==='diff'?(revision===2?'demo:sha256:6bd9…82e3':'demo:sha256:5ac8…71d2'):(revision===2?'demo:sha256:f0a3…1b29':'demo:sha256:ef92…0a18'),observed:'',bytes:null,reason:mode==='failed'?'未取得文件字节 / 摘要缺失':''}));
}
function currentArtifacts(){
  if(state.artifacts?.version===deliveryVersion())return state.artifacts.items;
  return artifactRecords(deliveryVersion(),state.status==='failed'?'failed':'link-only');
}
function allArtifactsPreserved(){return currentArtifacts().length===2&&currentArtifacts().every(a=>a.local==='preserved'&&a.hash==='matched'&&a.claimed===a.observed)}
function prepareArtifactPreservation(){
  const version=deliveryVersion();
  if(state.artifacts?.version===version)return;
  if(state.artifacts)state.artifactHistory.push(JSON.parse(JSON.stringify(state.artifacts)));
  state.artifacts={version,items:artifactRecords(version)};
  event('附件已登记，等待模拟本机保全',version+' 两件外部产物先登记为待保全；外部链接和清单不代表本机已取得字节。','Host / 模拟附件回执');
  for(const [i,key] of ['diff','notes'].entries())later(()=>{
    if(!activeAuth()||state.artifacts?.version!==version)return;
    const a=state.artifacts.items.find(x=>x.key===key);
    if(!a||a.local!=='pending')return;
    a.local='preserved';a.hash='matched';a.observed=a.claimed;a.bytes=key==='diff'?(version==='v1.1'?4480:4160):(version==='v1.1'?2560:2368);
    event('附件模拟字节保全与摘要核对通过',a.name+'：模拟本机字节 '+a.bytes+' B；外部声明摘要与本机模拟摘要一致。未生成真实下载文件。','Host / 模拟保全回执');
    save();render();
  },650+i*600);
}
function registerFailedArtifacts(){
  state.artifacts={version:deliveryVersion(),items:artifactRecords(deliveryVersion(),'failed')};
  state.artifacts.items[1]={...state.artifacts.items[1],local:'link-only',hash:'not-checked',reason:'仅收到外部清单链接；未取得本机字节，摘要未核对'};
}
function artifactManifest(){
  const all=currentArtifacts(),complete=allArtifactsPreserved();
  return `<h3 class="section-space">附件 manifest <span class="small muted">· 外部来源 / ${deliveryVersion()}</span></h3><div class="callout ${state.status==='failed'?'red':complete?'green':'amber'}" style="margin:10px 0" data-testid="preservation-overall">${complete?'两件产物的模拟本机字节保全与摘要核对均通过；内容验收另由 Agent 判断。':'附件尚不完整可验收：每件产物都须完成本机字节保全与摘要核对，当前不允许自动接受。'}<br><small>以下路径、字节数和摘要均为合成状态演示；没有真实下载或本机产物文件。</small></div><div class="manifest">${all.map(a=>`<div class="manifest-item" data-testid="artifact-${a.key}"><span class="file-icon">${a.key==='diff'?'CSV':'MD'}</span><div style="min-width:0"><strong>${esc(a.name)}</strong><p>revision ${a.revision} · 外部清单链接（合成 .invalid）</p><p data-testid="preservation-${a.key}"><strong>模拟本机保全：${a.local==='preserved'?'已保存字节 · '+a.bytes+' B':a.local==='failed'?'缺件 / 保全失败':a.local==='link-only'?'仅链接 · 未保全':'待保全'}</strong></p><p data-testid="hash-${a.key}">摘要核对：${a.hash==='matched'?'模拟一致':a.hash==='missing'?'未通过 · 外部摘要缺失':a.local==='link-only'?'未核对':'待核对'}<br>外部声明：${esc(a.claimed||'缺失')}<br>本机模拟摘要：${esc(a.observed||'尚无字节摘要')}</p>${a.reason?`<p>${esc(a.reason)}</p>`:''}${btn(a.local==='preserved'?(a.key==='diff'?'查看差异表':'查看验证说明'):'查看产物保全状态',a.key==='diff'?'attachment-diff':'attachment-notes',false,'style="margin-top:8px" data-testid="'+(a.key==='diff'?'open-differences':'open-notes')+'"')}</div></div>`).join('')}</div>`;
}

function renderDelivery(){const ready=deliveryReady();return title('DELIVERY & ACCEPTANCE','外部交付，核验后接回原任务','以下附件均为外部来源；原任务 Agent 接受后沿原保存工具形成任务成果。',`<a class="btn" href="#work">← 协作进展</a><a class="btn primary" href="#task/${state.task}" data-testid="delivery-original">继续查看原任务 →</a>`)+contextStrip()+`<div class="grid"><div class="stack"><section class="card"><div class="card-head"><h2>外部来源 · 工作片段交付</h2>${statusPill()}</div><div class="pad">${ready?`${state.late?'<div class="callout red" data-testid="late-quarantine">迟到交付已隔离保存，属于待核材料。原授权已撤回，不接受、不复活原工作。</div>':''}<div class="row wrap" style="margin-bottom:14px">${pill('GitHub Closed ≠ 验收完成','gray')}${pill(state.status==='accepted'?'Agent 已接受这一片段':'Agent 尚未接受',state.status==='accepted'?'green':'amber')}</div><div class="table-wrap"><table><thead><tr><th>检查项</th><th>外部交付声明</th><th>原任务核验状态</th></tr></thead><tbody><tr><td>字段映射</td><td>${!mappingUsed()?'未取用映射依据，仅列原字段名差异':state.status==='supplement'?'4 店映射差异已列出；位置待补':'4 店映射差异已列出'}</td><td>${pill(!mappingUsed()?'未取用 / 未核验':state.status==='accepted'?'已验证':state.status==='supplement'?'需补充定位':'待核验',!mappingUsed()?'gray':state.status==='accepted'?'green':state.status==='supplement'?'amber':'gray')}</td></tr><tr><td>重复记录</td><td>26 条，按记录数口径</td><td>${pill(state.status==='accepted'?'已验证':'待核验',state.status==='accepted'?'green':'gray')}</td></tr><tr><td>身份对应</td><td>1 组无法确定，未自动合并</td><td>${pill(state.status==='accepted'?'UNKNOWN':'待核验 · 外部声称未知',state.status==='accepted'?'amber':'gray')}</td></tr><tr><td>业务系统写入</td><td>未执行；不在本次范围</td><td>${pill('未验证','gray')}</td></tr><tr><td>经营效果</td><td>尚无后续观察数据</td><td>${pill('未验证','gray')}</td></tr></tbody></table></div>${artifactManifest()}${state.supplemented?`<div class="receipt section-space"><strong>旧交付 v1.0 · 需补充 / 保留</strong><p class="small muted">同 work 的 revision 1，缺少差异位置。旧 delivery 和原领取历史保留；revision 2 使用新有效领取，在原 Issue #DEMO-42 追加回传，原授权未增权。</p>${btn('查看首次交付','attachment-initial',false,'style="margin-top:9px" data-testid="initial-delivery"')}</div>`:''}`:`<div class="empty">${state.auth?'尚未取得可验收的交付。Agent 将在授权内继续跟进。':'尚未授权外派。先在原任务确认目标与必要权限。'}</div>`}</div></section><section class="card"><div class="card-head"><h2>Agent 的验收结论</h2>${pill('原任务判断')}</div><div class="pad"><p class="small" style="line-height:1.9">${state.status==='accepted'?'已核对交付清单及可核验的差异位置，采用依据仅限实际获准读取的准确版本；两个附件的模拟本机字节保全和摘要核对均通过后，接受这一工作片段。'+mappingLimit()+'UNKNOWN 未被改成确定结论；本次未执行业务数据修订，也未验证经营效果。':state.status==='supplement'?'首次交付缺少差异行号与映射出处。我已在原工单要求一次补充，并保留首次未通过记录。补充仍在原授权内。':state.status==='failed'?'差异表缺件且摘要缺失，另一件仅有外部链接、尚未取得本机字节；未通过完整性与保全核验，失败材料保留，不接受。':state.late?'停止后收到的材料只保留为待核记录，不恢复原授权，不继续读取，也不自动接受。':'收到附件不表示专业质量通过。Agent 会在获准范围内核查内容、准确引用和未知；GitHub 的关闭状态不能替代验收。'}</p>${state.status==='accepted'?`<div class="callout section-space">接收成果只把这一片段接回原任务。若要沉淀为语义或分析资产，请沿既有候选、核定与发布流程处理。</div><div class="head-actions section-space">${btn(state.candidate?'已提交资产候选':'提交资产候选','candidate',false,'data-testid="submit-candidate" '+(state.candidate?'disabled':''))}<a href="#task/${state.task}" class="btn primary">继续原任务 →</a></div>${state.candidate?'<div class="callout green section-space" data-testid="candidate-status">已形成本地演示候选，状态为「待原流程核定」。没有发布正式资产，也未替换当前版本。</div>':''}`:''}</div></section></div><aside class="stack"><section class="card"><div class="card-head"><h2>交付声明的实际引用</h2></div><div class="pad">${ready&&usedAssets().length?usedAssets().map(a=>`<div class="list-row"><div><strong>${a.name}</strong><small>${a.v} · ${a.ref} · ${a.hash}</small></div></div>`).join(''):`<p class="small muted">${ready?'尚无获准资产的实际读取记录，交付不作资产采用声明。':'等待交付附带准确引用。'}</p>`}<a href="#assets" class="btn text section-space">核对来源、版本与读取记录 →</a></div></section><section class="card"><div class="pad"><h3>验收范围</h3><p class="small muted" style="margin-top:8px">Host 校验身份、权限、清单与保存回执。Agent 判断专业内容与适用性；重要业务取舍回到用户及原 Case。</p></div></section></aside></div>`}
function renderSetup(){return title('FIRST-TIME SETUP','连接一次，日常沿已授权范围工作','三个不同方向的接入。采用通用工作协议＋WorkBuddy 本机助手官方 API；不使用云任务。全部状态为模拟。',`<a class="btn" href="#task/${state.task}" data-testid="setup-back">← 回原任务</a>`)+`<div class="callout amber" style="margin-bottom:17px">本页是按需打开的首次设置概念演示。日常派单无需重新填写 MCP 凭据、机器身份或端点；本原型没有真实账号与令牌。</div><div class="stack"><section class="card"><div class="card-head"><h2>01 · 现有 GitHub 消费者连接</h2>${pill('配置就绪 · 示例','green')}</div><div class="pad"><div class="grid equal"><div><p class="small muted">OptraCall 向 GitHub 发布工单、读取评论及核对回执。沿现有连接管理，不复制一套账号配置。</p><dl class="meta section-space"><dt>示例仓库</dt><dd>yunshan-demo / private-member-audit · Private</dd><dt>最小能力</dt><dd>本仓库 Issue 与评论读写；不开放生产仓库写入</dd><dt>地址</dt><dd class="mono">https://github.invalid/yunshan-demo/private-member-audit</dd></dl></div><div class="callout">工单是工作交接与证据来源之一。GitHub 连接本身不会向外开放 OptraCall 的全部资产。</div></div><div class="head-actions section-space">${btn('演示连接检查','test-github',false,'data-testid="test-github"')}</div></div></section><section class="card"><div class="card-head"><h2>02 · WorkBuddy 本机助手 API</h2>${pill(state.setup?.api?'API 已授权 / 在线 · 模拟':'API 未授权 / 未验证',state.setup?.api?'green':'amber')}</div><div class="pad"><dl class="meta"><dt>执行者</dt><dd>WorkBuddy 本机助手官方 API · 本地助手适配，通用工作协议</dd><dt>需要验证</dt><dd>本机助手 API 触发、可信身份、原子领取、远端 MCP 查读及带版本回传的完整联通</dd><dt>领取边界</dt><dd>Host 为该工作裁定一个有效领取；重复领取不生成平行执行权</dd></dl><div class="callout section-space">官网已分别证明本机助手 API 与远端 MCP 支持；两者联用仍须实号验证。本页只模拟授权与在线检查，不含真实令牌。首期同一 WorkBuddy 连接仅一项已触发/领取工作，其余等待执行者。</div><div class="head-actions section-space">${btn('模拟 API 授权与在线检查','test-api',false,'data-testid="test-api"')}${btn('查看示例接入契约','executor-contract')}</div></div></section><section class="card"><div class="card-head"><h2>03 · 远端 MCP Connector 与服务</h2>${pill(state.setup?.connector?'Connector 已授权 · 模拟':'Connector 未授权',state.setup?.connector?'green':'amber')}</div><div class="pad"><div class="grid equal"><div><dl class="meta"><dt>资产位置</dt><dd>实际 OptraCall 运行端，资产不迁入 GitHub。</dd><dt>入口</dt><dd class="mono">https://assets.optracall.invalid/mcp<br>受保护的 HTTPS 入口 · 合成不可用地址</dd><dt>读取条件</dt><dd>运行实例在线；指定执行者身份、当前工作与授权范围有效；版本准确。</dd><dt>本期能力</dt><dd>同一远端 MCP 分两组权限：资产依据只读；工作领取、续租、交付。均受本工作授权，不含任意远端执行。</dd></dl></div><div class="callout">部署所在机器必须在外部读取时在线。关闭应用所在实例或入口失效时返回明确不可用；不静默回退到其他机器或当前最新版。</div></div><div class="head-actions section-space">${btn('模拟 MCP Connector 授权检查','test-mcp',false,'data-testid="test-mcp"')}<a class="btn text" href="#assets">查看本任务资产范围 →</a></div></div></section><section class="card"><div class="card-head"><h2>04 · 完整协作联通验证</h2>${pill(setupReady()?'通过 · 仅模拟':'未验证，不可自主执行',setupReady()?'green':'amber')}</div><div class="pad"><p class="small muted">必须串联验证：本机助手 API 触发 → Host 唯一有效领取 → MCP 准确资产查读 → 续租/交付 → 原任务自动核验。单项连接通过不能推断整条协作可用。</p><div class="head-actions section-space">${btn('模拟完整联通测试','test-full',true,'data-testid="test-full"')}<a href="#task/${state.task}" class="btn">回到日常任务</a></div><div class="callout section-space">${setupReady()?'演示已预设整链通过，所以日常可直接进行一次业务授权。该状态不是实号验证证明。':'尚未完成接入。请先模拟授权 API、MCP Connector，并完成整链测试；未通过前不显示可自主执行。'}</div></div></section></div>`}
function render(){document.documentElement.dataset.theme=state.theme||'light';const hash=location.hash.slice(1)||'project';let page=hash.split('/')[0];if(page==='task'){const id=hash.split('/')[1];if(TASKS.some(t=>t.id===id)){if(state.auth&&id!==state.auth.task){toast('该协作保留在原任务；其他任务也可外派，重置演示后体验。')}selectTask(id);save()}}if(state.auth&&['work','assets','delivery'].includes(page)){selectTask(state.auth.task);save()}$('#scene').value=state.scene;$('#readiness-label').textContent=setupReady()?'完整联通通过 · 模拟':'接入未完成 · 模拟';$('.readiness').style.color=setupReady()?'var(--green)':'var(--amber)';$('#crumb-current').textContent=({project:'项目概览',task:'任务',case:'Case',report:'原报告',draft:'草稿',work:'外部协作',assets:'资产依据',delivery:'交付验收',setup:'连接与接入'})[page]||'项目概览';document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===page||(page==='work'&&a.dataset.nav==='task')));$('#main').innerHTML=({project:renderProject,task:renderTask,case:renderCase,report:renderReport,draft:renderDraft,work:renderWork,assets:renderAssets,delivery:renderDelivery,setup:renderSetup}[page]||renderProject)();}
function openDialog({heading,sub='',body,foot='',drawer=false}){dialogReturn=document.activeElement;const d=$('#overlay');d.className=drawer?'drawer':'';d.innerHTML=`<div class="dialog-shell"><header class="dialog-head"><div><h2 id="dialog-title">${heading}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close" data-action="close-dialog" aria-label="关闭对话框" data-testid="close-dialog">×</button></header><div class="dialog-body">${body}</div><footer class="dialog-foot">${foot||btn('关闭','close-dialog')}</footer></div>`;d.showModal();requestAnimationFrame(()=>{const target=d.querySelector('[autofocus],input,textarea,select,button');target?.focus()})}
function closeDialog(){const d=$('#overlay');d.close();if(dialogReturn?.isConnected)dialogReturn.focus();else $('#main').focus();}
document.addEventListener('keydown',e=>{const d=$('#overlay');if(!d.open||e.key!=='Tab')return;const all=[...d.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!all.length){e.preventDefault();return}const first=all[0],last=all[all.length-1];if(e.shiftKey&&(document.activeElement===first||!d.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!d.contains(document.activeElement))){e.preventDefault();first.focus()}});
$('#overlay').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function openAuthorization(){if(!setupReady()){toast('完整协作联通尚未验证，先完成必要接入。');navigate('setup');return}if(state.auth){if(state.auth.task!==state.task){toast('本演示已有一项外派工作。重置演示后可在其他类型任务体验。');return}viewAuth();return}openDialog({heading:'确认一次，允许范围内自主推进',sub:'合成授权 · 不连接真实账号 · 可随时取消外派并撤回访问',drawer:true,body:`<div class="callout">确认后，Agent 将在这些边界内准备工单、发布、跟进、核验交付；正常读取与进度不再逐条询问你。</div><div class="form-field"><label for="auth-goal">业务目标</label><textarea id="auth-goal" data-testid="auth-goal" autofocus>${esc(state.goal)}</textarea></div><div class="form-field"><span>外派范围</span><div class="receipt"><strong>${esc(task().piece)}</strong>交回差异表、检查说明、实际资产引用与未完成项。只处理四店合成快照。<br><span class="muted">禁做：改生产数据、联系会员、读取个人联系值、扩大门店范围、发布正式资产。</span></div></div><div class="form-field"><label for="auth-executor">指定可信执行者</label><select id="auth-executor" data-testid="auth-executor"><option>WorkBuddy 本机助手 API · 模拟 / 联用未实证</option></select><small class="muted">只授权这位示例执行者。身份变化或更换执行者需重新核定。</small></div><div class="form-field"><span>GitHub 私有业务仓库</span><div class="receipt">yunshan-demo / private-member-audit<br><small class="muted">Private · 合成仓库 · 沿已配置连接</small></div></div><div class="form-field"><span>本任务获准资产 · 只读</span><small class="muted">按当前任务预选，可缩小；未选资产不向外提供。</small><div class="checks">${ASSETS.map(a=>`<label class="check"><input type="checkbox" value="${a.id}" checked name="auth-asset" data-testid="auth-asset-${a.id}"><span><strong>${a.type} · ${a.name} ${a.v}</strong><small>${a.scope}</small></span></label>`).join('')}</div></div><div class="form-field"><label for="auth-expiry">授权期限</label><select id="auth-expiry" data-testid="auth-expiry"><option value="24">确认后 24 小时，或本工作结束（以先到者为准）</option><option value="2">确认后 2 小时，或本工作结束（以先到者为准）</option></select></div><section id="auth-preview" class="authorization-preview" data-testid="authorization-preview"></section>`,foot:`${btn('暂不授权','close-dialog',false,'data-testid="decline-authorization"')}${btn('允许在此范围自主推进','grant',true,'data-testid="grant-autonomy"')}`});updateAuthPreview()}
function authForm(){return {task:state.task,taskType:task().type,piece:task().piece,goal:$('#auth-goal')?.value.trim()||'',executor:'WorkBuddy 本机助手 API · 模拟 / 联用未实证',repo:'yunshan-demo/private-member-audit · Private',assets:[...document.querySelectorAll('input[name="auth-asset"]:checked')].map(x=>x.value),hours:Number($('#auth-expiry')?.value||24),revoked:false,expired:false}}
function authSummary(a){return `<dl class="meta"><dt>原任务</dt><dd>${esc(a.taskType)} · ${esc(TASKS.find(t=>t.id===a.task)?.name)}</dd><dt>目标</dt><dd>${esc(a.goal)}</dd><dt>工作片段</dt><dd>${esc(a.piece)}</dd><dt>执行者</dt><dd>${esc(a.executor)}</dd><dt>工单去向</dt><dd>${esc(a.repo)}</dd><dt>只读资产</dt><dd>${a.assets.length?ASSETS.filter(x=>a.assets.includes(x.id)).map(x=>`${x.name} ${x.v}`).join('；'):'不开放任何资产读取'}</dd><dt>有效期</dt><dd>确认后 ${a.hours} 小时或本工作结束，以先到者为准${a.revoked?' · 已撤回':a.expired?' · 已到期':a.ended?' · 本工作已结束':''}</dd><dt>工作权限</dt><dd>本外派的领取、续租与交付；同一远端 MCP 中与资产只读分组授权，不含其他任务。</dd><dt>动作范围</dt><dd>Agent 自主派单、跟进、核验及要求原范围内补充；不改生产数据、不联系会员、不扩大范围、不发布正式资产。</dd></dl>`}
function updateAuthPreview(){if($('#auth-preview'))$('#auth-preview').innerHTML='<h3>将要允许的确切内容</h3>'+authSummary(authForm())}
function viewAuth(){if(!state.auth)return openAuthorization();openDialog({heading:'本次必要授权',sub:'授权快照保留，可回看；不会因浏览而扩大',drawer:true,body:authSummary(state.auth)+`<div class="callout section-space">资产留在实际 OptraCall 运行实例。执行者必须通过受保护入口、在本任务与有效期限内读取所选准确版本。</div>`,foot:activeAuth()?btn('取消外派并撤回访问','stop',false,'data-testid="revoke-from-authorization"')+btn('返回','close-dialog',true):btn('关闭','close-dialog')})}
function grant(){const a=authForm();if(!a.goal){$('#auth-goal').focus();toast('请保留清楚的业务目标。');return}state.auth=a;state.demoReopened=false;state.goal=a.goal;state.status='preparing';state.history=[];state.reads=[];state.candidate=false;state.supplemented=false;save();closeDialog();event('已确认本次授权',`${a.taskType}任务外派一个工作片段；只读 ${a.assets.length} 项准确资产版本，${a.hours} 小时内有效。`,'用户 / 授权快照');event('Host 已建立外派工作台账','领取、交付与验收按此工作原子更新；GitHub Issue 与评论仅作通信和证据。','Host / 模拟工作台账');navigate('work');runAutonomy()}
function resumeBlocked(){if(!activeAuth())return;state.status='running';event('环境条件恢复，继续原范围','Host 重新核对原执行者与授权；未扩大范围，也未重放已经发生的外部动作。','Host / 模拟回执');save();render();later(()=>reviewDelivery(),1400)}
function runAutonomy(){stopTimers();later(()=>{if(!activeAuth())return;state.status='publishing';event('Agent 已准备工单',`目标、禁做项、准确资产引用和验收要求已按授权整理；没有搬运原始资产到 GitHub。`);save();render();later(()=>{if(!activeAuth())return;if(state.scene==='unknown'){state.status='unknown';event('发布 API 超时 · UNKNOWN','原请求 demo-dispatch-01 已保留。无法确认是否已创建 Issue；仅核对原回执，禁止自动重发。','GitHub API / 模拟错误');save();render();return}state.status='waiting';event('发布回执已核对','Issue #DEMO-42 已关联原 Task；工单发布不等于执行完成。','GitHub / 模拟发布回执');if(state.scene==='executorbusy'){event('等待执行者，尚未 API 触发','同一 WorkBuddy 连接已有一项已触发/领取工作。官方未证明独立 task 查询能力，当前工作排队；不按最近消息归属结果。','Host / 模拟连接占用回执');save();render();return}event('触发指定本机助手','通过已授权 WorkBuddy 本机助手官方 API 触发执行者，使用通用工作协议回到 Host 领取；不调用云任务。','WorkBuddy 本机助手 API / 模拟触发回执');save();render();later(()=>{if(!activeAuth())return;state.status='running';event('指定执行者领取有效','Host 核对本次工作、可信执行者与当前授权，裁定一个有效领取。','Host / 模拟领取裁定');if(state.scene==='duplicate')event('重复领取已拒绝','第二个领取返回 CLAIM_CONFLICT；保留首个有效领取，不产生第二份读取权。','Host / 模拟冲突回执');if(['identity','offline','expired'].includes(state.scene)){state.status='blocked';if(state.scene==='expired')state.auth.expired=true;event('新读取已暂停',state.scene==='identity'?'EXECUTOR_CHANGED：执行者可信身份变化，旧资格暂停。':state.scene==='expired'?'AUTH_EXPIRED：授权已到期，拒绝后续读取。':'INSTANCE_OFFLINE：实际运行实例离线，无法读取获准资产。','资产 MCP / 模拟错误');save();render();return}recordAutoReads();event('有效领取已续租','Host 仅为当前有效领取续租；租约不扩大资产、门店或任务范围。','工作 MCP / 模拟续租回执');save();render();if(state.scene==='late'){later(()=>{stopWork(false);state.late=true;event('停止后收到迟到回传','材料仅隔离保留，未恢复原授权、未继续读取、未接受成果。','GitHub / 模拟迟到回执');save();render()},1100);return}later(()=>reviewDelivery(),1600)},1100)},1000)},900)}
function recordAutoReads(){selectedAssets().forEach(a=>{if(!state.reads.some(r=>r.ref===a.ref))state.reads.push({name:a.name,v:a.v,ref:a.ref,by:'WorkBuddy 本机助手 · 指定模拟身份',reason:'本次工作实际读取回执（模拟）'})});event('执行者按需读取获准版本',selectedAssets().length?selectedAssets().map(a=>`${a.name} ${a.v}`).join('；'):'本次未授权资产读取；执行者仅使用工单内获准描述。','远端资产 MCP / 模拟读取回执')}
function reviewDelivery(){if(!activeAuth())return;if(state.scene==='human'){state.status='intervention';event('出现超出授权的请求','执行者请求新增两店与个人联系值明细。已阻止新增读取，等待必要业务决定。');save();render();return}if(state.scene==='failed'){registerFailedArtifacts();state.status='failed';event('回传清单未通过校验','MANIFEST_INVALID：差异表文件字节与固定版本摘要缺失；另一件只收到链接。失败回执保留，不能完整验收。','Host / 模拟清单校验');save();render();return}prepareArtifactPreservation();if(state.modelBusy||state.paused){state.status='pending';event('外部交付已进入 Host 台账待处理','GitHub 回传仅作为证据。原 Task '+(state.modelBusy?'模型忙':'自动续接暂停')+'，未开始验收；空闲、续接开启且授权有效后再处理。','Host / 模拟原子交付回执');save();render();return}state.status='review';event('收到交付，GitHub 已关闭','delivery v1.0 差异表和检查说明已写入 Host 台账；此刻仍为待验收，原任务尚未据此完成。','GitHub / 模拟回传事件');save();render();later(()=>{if(!activeAuth())return;if(state.scene==='supplement'&&!state.supplemented){state.status='supplement';event('首次核验需补充','交付 v1.0 差异位置与映射出处不足。Agent 在原 Issue #DEMO-42 追加补充要求；保留旧 delivery 与首次未通过记录。');event('Host 已建立同工作新 revision','同一个 work 的 revision 2，仍关联原 Issue #DEMO-42 和原授权，不新建 Task 或第二张 Issue。旧 delivery v1.0 保留为需补充。','Host / 模拟 revision 回执');event('补充 revision 的新领取有效','Host 终止旧领取，为 revision 2 裁定一个新的有效领取。新领取继续受原资产/期限限制，旧领取不能交付当前 revision。','工作 MCP / 模拟原子领取');save();render();later(()=>{if(!activeAuth())return;state.supplemented=true;state.status='review';prepareArtifactPreservation();event('收到原范围内补充','revision 2 的 delivery v1.1 补充行号、映射出处与准确资产引用，仍回传同一 Issue。旧 v1.0 保留；未扩大读取范围。','GitHub / 执行者模拟补充');save();render();later(acceptDelivery,1600)},4200);return}acceptDelivery()},2200)}
function acceptDelivery(){if(!activeAuth()||state.status!=='review')return;if(state.paused||state.modelBusy){state.status='pending';event('核验暂存为待处理','本 Task 当前不可续接，保留原交付，等待同 Task 空闲且授权有效。','Host / 模拟待处理回执');save();render();return}if(!allArtifactsPreserved()){event('附件保全未完成，不接受','存在缺件、仅链接、待保全或摘要未核对的产物；保留外部材料与失败状态，不形成已接受成果。','Host / 模拟验收门槛');save();render();return}state.status='accepted';state.auth.ended=true;event('Agent 已核验并接受这一片段','核对 '+deliveryVersion()+' 清单、模拟字节保全及摘要、可核验的差异位置与实际获准引用；'+mappingLimit()+'1 组身份仍 UNKNOWN。外部来源标记保留，未发布正式资产。');event('Agent 已沿原保存工具形成本任务成果','原 Task Agent 调用既有成果保存工具，将 '+deliveryVersion()+' 验证说明、保全回执与外部交付引用保存为新增成果。'+mappingLimit()+'外部附件本身不冒充本机正式报告，原报告未被覆盖。','原任务 Agent / 模拟工具保存回执');save();render();toast('这一工作片段已接回原任务；业务决定和正式资产发布继续沿原流程。')}
function stopWork(show=true){stopTimers();if(state.auth)state.auth.revoked=true;state.status='stopped';event('已取消外派并撤回后续访问','Host 已撤回后续读取、领取/续租/交付资格，并请求对方停止。外部进程是否已停止、已有 GitHub 或其他外部动作仍待核，不假称已停止。','Host / 模拟停止回执');save();render();if(show)toast('后续访问已撤回，已请求外部停止；对方是否停止仍待核。')}
function requestStop(){if($('#overlay').open)closeDialog();openDialog({heading:'取消这段外部工作',sub:'撤回后续访问并请求对方停止，外部状态继续待核',body:`<p class="small">取消后，Agent 不再继续委派，Host 撤回后续访问并请求外部执行者停止。外部进程是否已经停止、已发布工单与已有副作用仍需核对；迟到回传只保留为待核材料。</p><div class="callout amber section-space">取消不会抹除已发生的读取和外部动作，也不保证外部进程已经停止；不会自动重发或恢复原权限。</div>`,foot:btn('继续工作','close-dialog')+btn('取消外派并撤回','confirm-stop',true,'data-testid="confirm-stop"')})}
function checkReceipt(){if(state.status!=='unknown'&&state.status!=='publishing')return;state.receiptChecked=true;event('已核对原请求与现有回执','模拟查询已查原请求 demo-dispatch-01，仍无可核定的发布回执。保持 UNKNOWN，没有新建工单或重发。','GitHub / 模拟核对回执');save();render();toast('已核对原请求；发布仍 UNKNOWN，未重发。')}
function readAsset(mode='normal'){const a=ASSETS.find(x=>x.id===state.selectedAsset)||ASSETS[0];const fail=(msg)=>{state.assetError=msg;save();render()};if(mode==='other')return fail('TASK_SCOPE_DENIED：目标资产属于「南区门店项目」，不在当前四店任务授权内。');if(mode==='version')return fail('ASSET_VERSION_NOT_FOUND：请求 '+a.name+' v9.9；本次只获准 '+a.v+'。不替换为最新版。');if(mode==='revoked')return fail('AUTH_REVOKED：本次请求使用已撤回的旧资格，新读取被拒绝。');if(mode==='offline')return fail('INSTANCE_OFFLINE：资产所在 OptraCall 实例离线。未切换来源，待实例恢复后重新核验。');if(mode==='expired')return fail('AUTH_EXPIRED：读取资格已到期，拒绝新读取。');if(!state.auth)return fail('AUTH_REQUIRED：尚未获得外部读取授权。当前原文仅供用户预览。');if(state.auth.ended)return fail('AUTH_ENDED：这一工作片段已经结束，后续外部读取不再有效；用户仍可回看原引用。');if(state.auth.revoked)return fail('AUTH_REVOKED：本外派已取消，后续读取已撤回。');if(state.auth.expired)return fail('AUTH_EXPIRED：本工作读取授权已到期。');if(state.scene==='identity'&&state.status==='blocked')return fail('EXECUTOR_CHANGED：可信执行者身份变化，原资格已暂停。');if(state.scene==='offline'&&state.status==='blocked')return fail('INSTANCE_OFFLINE：资产所在实际运行实例不可用。');if(!state.auth.assets.includes(a.id))return fail('ASSET_SCOPE_DENIED：该资产未包含在本次已确认范围。');state.assetError='';state.assetLast=`读取成功：${a.name} ${a.v}；来源 ${a.source}，范围 ${a.scope}。`;state.reads.push({name:a.name,v:a.v,ref:a.ref,by:'WorkBuddy 本机助手 · 指定模拟身份',reason:'演示控制发起的准确版本读取'});save();render()}
function sourceDialog(id){const a=ASSETS.find(x=>x.id===id);openDialog({heading:a.name+' '+a.v,sub:'原报告引用 · 固定版本 · 合成资料',body:`<dl class="meta"><dt>出处</dt><dd>${a.source}</dd><dt>准确引用</dt><dd>${a.ref} · ${a.hash}（演示摘要）</dd><dt>适用范围</dt><dd>${a.scope}</dd></dl><div class="quote section-space">${a.excerpt}</div><div class="callout">原文预览不会向外部执行者发放权限；读取失败或版本变化不会覆盖原报告引用。</div>`})}
function issuePreview(){if(!state.auth)return;openDialog({heading:'模拟 GitHub 工单',sub:'#DEMO-42 · Private · 合成资料，无外站跳转',drawer:true,body:`<h3>${esc(state.auth.piece)}</h3><p class="small section-space">${esc(state.auth.goal)}</p><div class="tiny-line"></div><dl class="meta"><dt>交付</dt><dd>差异表、检查说明、准确资产引用、未完成项与异常</dd><dt>禁做项</dt><dd>不改生产、不联系会员、不读个人联系值、不扩店、不发布正式资产</dd><dt>依据入口</dt><dd>从本任务受保护资产入口按需读取，不将实际资产放入 GitHub。</dd><dt>验收</dt><dd>由原任务 Agent 核验；Issue 关闭不视为已完成。</dd></dl><div class="callout section-space">工单中的资产引用仅指向授权范围。执行者仍须使用真实接入身份核验，本演示不包含凭据。</div>`})}
function attachment(which){const a=currentArtifacts().find(a=>a.key===(which==='diff'?'diff':'notes'));if(!a||a.local!=='preserved'||a.hash!=='matched'){openDialog({heading:'产物尚不可作为完整交付',sub:'外部来源 / 模拟保全状态',body:artifactManifest()});return}openDialog({heading:which==='diff'?'差异表 · '+(state.supplemented?'v1.1':'v1.0'):'验证说明 · '+(state.supplemented?'v1.1':'v1.0'),sub:'外部来源 · 模拟字节保全/摘要核对通过 · 不生成真实文件',body:which==='diff'?`<div class="table-wrap"><table><thead><tr><th>位置</th><th>检查项</th><th>结果</th></tr></thead><tbody><tr><td>A店 第12行 / B店 第87行</td><td>member_key 跨店重复</td><td>同一合成键，保留原记录</td></tr><tr><td>C店 第31行</td><td>状态值无法映射</td><td>UNKNOWN，不自动修正</td></tr><tr><td>D店 第44行</td><td>字段命名差异</td><td>${mappingUsed()?'customer_key 按实际读取的映射 v0.4 解释':'映射依据未取用；customer_key 字段含义未核验'}</td></tr></tbody></table></div><p class="small muted section-space">预览 3 条示例；manifest 声明共 26 条合成差异。没有真实个人资料。</p>`:`<dl class="meta"><dt>采用依据</dt><dd>${usedAssets().map(a=>a.name+' '+a.v).join('；')||'未授权资产，无采用声明'}</dd><dt>核验</dt><dd>差异位置、版本、范围与异常标记；不把格式通过当作业务事实真实。</dd><dt>未完成</dt><dd>${esc(mappingLimit())}1 组身份待核实；未修改业务系统，未验证经营效果。</dd><dt>副作用</dt><dd>仅示例 Issue 和评论；无业务数据写入。</dd></dl>`})}
function scenarioChanged(value){stopTimers();state=defaultState();state.scene=value;if(value==='unconfigured')state.setup={api:false,connector:false,full:false};if(value==='busy')state.modelBusy=true;save();if($('#overlay').open)closeDialog();navigate('task/analysis');toast('已切换演示场景。确认一次授权后，Agent 将自动演示该路径。')}
$('#scene').addEventListener('change',e=>scenarioChanged(e.target.value));
document.addEventListener('input',e=>{if(e.target.id==='task-draft'||e.target.id==='saved-draft'){state.draft=e.target.value;state.draftByTask??={};state.draftByTask[state.task]=state.draft;state.draftSaved=false;save()}if(e.target.closest('#overlay')&&($('#auth-preview')))updateAuthPreview()});
document.addEventListener('change',e=>{if(e.target.closest('#overlay')&&$('#auth-preview'))updateAuthPreview()});
document.addEventListener('click',e=>{const asset=e.target.closest('[data-asset]');if(asset){state.selectedAsset=asset.dataset.asset;state.assetError='';state.assetLast='';save();render();return}const el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action;switch(act){case'theme':state.theme=state.theme==='dark'?'light':'dark';save();render();break;case'authorize':openAuthorization();break;case'pause-task':state.paused=true;event('本 Task 自动续接暂停','仅暂停本地自动续接；外部工作、有效授权及已发动作不因此撤回。','用户 / 本地任务控制');save();render();toast('仅暂停本 Task 续接，外部工作未取消。');break;case'resume-task':state.paused=false;event('本 Task 自动续接恢复','原授权有效且模型空闲时自动处理待交付；不重发原外派。','用户 / 本地任务控制');save();if(state.status==='pending'&&!state.modelBusy&&activeAuth())reviewDelivery();else render();break;case'demo-idle':state.modelBusy=false;event('原 Task 模型已空闲','授权有效、自动续接开启时，交回同一 Task 自动核验。','Host / 模拟空闲事件');save();if(state.status==='pending'&&!state.paused&&activeAuth())reviewDelivery();else render();break;case'close-dialog':closeDialog();break;case'grant':grant();break;case'view-auth':viewAuth();break;case'stop':requestStop();break;case'confirm-stop':closeDialog();stopWork();break;case'check-receipt':checkReceipt();break;case'issue-preview':issuePreview();break;case'read-asset':readAsset();break;case'read-case':readAsset($('#read-case').value);break;case'source-semantic':sourceDialog('semantic');break;case'source-mapping':sourceDialog('mapping');break;case'attachment-initial':openDialog({heading:'首次外部交付 v1.0 · 已保留',sub:'同 work / revision 1 / 原 Issue #DEMO-42',body:'<div class="callout amber">首次交付缺少差异行号和映射出处，被 Agent 判为需补充，未作为当前已接受版本。</div><dl class="meta section-space"><dt>旧清单</dt><dd>member-differences-v1.0.csv；verification-notes-v1.0.md</dd><dt>旧保全</dt><dd>revision 1 两件产物的模拟字节保全 / 摘要核对记录保留。新 v1.1 重新保全核对，不继承旧结果。</dd><dt>原始不足</dt><dd>26 条合成差异没有准确行号，映射只写名称未写出处。</dd><dt>后续</dt><dd>同 work 建立 revision 2，新有效领取在同一 Issue 追加 v1.1；旧 delivery 与失败理由保留，授权范围不扩大。</dd></dl>'});break;case'attachment-diff':attachment('diff');break;case'attachment-notes':attachment('notes');break;case'candidate':if(state.status!=='accepted'||state.candidate)return;openDialog({heading:'提交资产候选',sub:'只准备候选，沿既有流程核定与发布',body:'<p class="small">将差异检查经验整理为本任务的资产候选，附原交付与准确引用。候选状态为「待核定」，不会改写当前语义、指标、方法或数据映射的正式版本。</p>',foot:btn('取消','close-dialog')+btn('提交候选，不发布','confirm-candidate',true,'data-testid="confirm-candidate"')});break;case'confirm-candidate':state.candidate=true;save();closeDialog();render();toast('已提交演示候选，待原流程核定；未发布正式资产。');break;case'keep-scope':state.scene='normal';state.status='review';prepareArtifactPreservation();event('用户决定保持原范围','不新增门店、不读取个人联系值。Agent 沿原四店范围继续核验。','用户 / 必要业务取舍');save();render();later(acceptDelivery,1600);break;case'save-draft':state.draft=$('#saved-draft').value;state.draftSaved=true;save();toast('原任务草稿已保留。');break;case'send-draft':if(!state.draft.trim()){toast('请先写下要补充的说明。');return}state.lastPrompt=state.draft.trim();state.draft='';state.draftByTask??={};state.promptByTask??={};state.draftByTask[state.task]='';state.promptByTask[state.task]=state.lastPrompt;save();render();toast('示例说明已保存在原任务。');break;case'reset':stopTimers();state=defaultState();save();if($('#overlay').open)closeDialog();navigate('project');toast('演示已重置；未连接或更改任何真实账号。');break;case'test-api':state.setup.api=true;state.setup.full=false;save();render();openDialog({heading:'本机助手 API 授权与在线 · 模拟',body:'<div class="callout green">模拟结果：指定 WorkBuddy 本机助手 API 已授权且在线。没有真实调用或令牌。</div><p class="small muted section-space">单项检查不足以允许自主执行。还需远端 MCP Connector 授权以及完整协作联通测试。</p>'});break;case'test-full':if(!state.setup?.api||!state.setup?.connector){toast('先完成模拟 API 授权/在线与 MCP Connector 授权检查。');return}state.setup.full=true;save();render();openDialog({heading:'完整协作联通 · 模拟通过',body:'<div class="callout green">已在原型状态中串联：API 触发 → 唯一有效领取 → 资产查读 → 续租/交付 → 同 Task 核验。</div><p class="small muted section-space">这不是实号验证证明；真实 WorkBuddy API 与 MCP 联用仍未验证。现在可回原任务体验日常一次业务授权。</p>'});break;case'test-github':openDialog({heading:'GitHub 连接检查 · 模拟结果',body:'<div class="callout green">示例消费者连接就绪：可在指定私有示例仓库发布 Issue、读取评论与回执。</div><p class="small muted section-space">这是内存中的预设结果，没有网络请求，未证明真实账号或权限可用。</p>'});break;case'test-mcp':state.setup.connector=true;state.setup.full=false;save();render();openDialog({heading:'受保护入口测试 · 模拟结果',body:'<div class="callout green">模拟 MCP Connector 已授权：实例在线、入口受保护，两组能力权限分离。还需完整协作联通测试。</div><p class="small muted section-space">本原型不启动 MCP 服务、不建立真实公网入口、不生成或显示令牌。实际部署和兼容仍需后续核验。</p>'});break;case'executor-contract':openDialog({heading:'执行者示例接入要求',body:'<ol class="small" style="padding-left:20px;line-height:2"><li>能用指定可信身份发现并领取原工作。</li><li>能通过受保护入口读取准确、获准的只读资产。</li><li>能回传交付清单、采用版本、实际动作与未完成项。</li><li>能识别撤回、过期与冲突，避免重复执行。</li><li>API 的 message_id 仅作账号消息历史游标，不当作独立任务 ID 或完成证明。回传须准确关联工作、revision 与认证领取事实；未知来源及人工聊天不进入原 Task 或模型。</li></ol><div class="callout amber section-space">已选择通用工作协议＋WorkBuddy 本机助手官方 API 适配。官网分别证明本机助手 API 和远端 MCP 能力，二者在本协作链中的联用仍待实号验证；不使用 WorkBuddy 云任务。</div>'});break;case'about':openDialog({heading:'关于本交互演示',body:'<p class="small">本文件是待审核的中文静态 UI 提案。所有企业、数据、身份、地址、工单与回执均为合成资料。无外部依赖、无网络调用，可离线打开。</p><div class="callout section-space">演示控制用于切换正常与异常状态；不是要求普通用户逐步操作的产品流程。状态可临时保存到本页命名空间 sessionStorage，失败时继续使用内存。</div>'});break;}});
