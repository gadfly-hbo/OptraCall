<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>OptraCall · #116 所有 Agent 对话｜合并推理过程、折叠长消息 UI Demo（设计待审）</title>
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-synthesis: none; color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #14131a; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; color: inherit; }
  button:disabled { cursor: not-allowed; }
  button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #a397e0; outline-offset: 3px; }

  /* ===== 评审控制栏（产品外壳之外） ===== */
  .demo-review-bar { background: #1e1c29; color: #eeeef2; border-bottom: 1px solid #38344c; padding: 8px 16px; font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; position: sticky; top: 0; z-index: 20; }
  .demo-review-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .demo-review-badge { background: #6550c9; color: #fff; font-weight: 600; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .demo-tab { border: 1px solid #494463; background: #282538; color: #e4e2f0; border-radius: 5px; padding: 4px 10px; font-size: 12px; }
  .demo-tab[aria-pressed="true"] { background: #6550c9; border-color: #6550c9; color: #fff; font-weight: 600; }
  .demo-act { border: 1px solid #5b5479; background: #302c42; color: #e4e2f0; border-radius: 5px; padding: 4px 10px; font-size: 12px; }
  .demo-act:hover { background: #3a3552; }
  .demo-hint { color: #b2b0be; font-size: 11px; }
  .demo-store-count { color: #9ce0b0; font-size: 11px; }

  .demo-stage { height: calc(100dvh - 46px); display: flex; justify-content: center; background: #14131a; }
  .demo-stage[data-viewport="narrow"] { align-items: flex-start; padding-top: 14px; }
  .demo-stage[data-viewport="narrow"] .app { width: 390px; height: calc(100dvh - 74px); border: 1px solid #3d3b47; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 60px #0009; }
  .demo-stage[data-viewport="narrow"] .sg-panel { padding: 12px; }

  /* ===== 产品令牌（复制自 src/host/ui/styles.css） ===== */
  .app { color-scheme: light; --canvas: #fff; --sidebar: #f7f7f9; --surface: #fff; --subtle: #f5f5f8; --hover: #ececf2; --ink: #24232b; --muted: #6c6b78; --faint: #777580; --line: #e6e5eb; --accent: #6550c9; --accent-soft: #eeebfb; --focus: #a397e0; --warning: #80530c; --warning-bg: #fff7e8; --error: #a12b36; --error-bg: #fff4f4; --ok: #1c7c4a; display: flex; flex-direction: column; min-height: 0; height: 100dvh; overflow: hidden; color: var(--ink); background: var(--canvas); font-size: 14px; line-height: 1.55; width: 100%; }
  .app[data-theme="dark"] { color-scheme: dark; --canvas: #1b1b20; --sidebar: #16161b; --surface: #232329; --subtle: #292930; --hover: #32323a; --ink: #eeeef2; --muted: #b2b0be; --faint: #a7a5b2; --line: #3d3b47; --accent: #b7a7ff; --accent-soft: #30294a; --focus: #c4b7ff; --warning: #edc887; --warning-bg: #372c1b; --error: #ffafb8; --error-bg: #39252b; --ok: #7fd3a4; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 10px 22px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .topbar-title { font-size: 13px; color: var(--muted); }
  .main-scroll { flex: 1; min-height: 0; overflow-y: auto; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip: rect(0,0,0,0); overflow: hidden; white-space: nowrap; border: 0; }
  .brand-mark { width: 29px; height: 29px; display: inline-flex; position: relative; color: var(--accent); flex-shrink: 0; }
  .brand-mark span { position: absolute; inset: 3px; border: 2px solid currentColor; border-radius: 50%; }
  .brand-mark i { position: absolute; width: 11px; height: 11px; right: 0; bottom: 0; border: 2px solid currentColor; border-radius: 50%; background: var(--canvas); }
  .brand-mark-xs { width: 18px; height: 18px; }
  .brand-mark-xs span { inset: 2px; border-width: 1.5px; }
  .brand-mark-xs i { width: 7px; height: 7px; border-width: 1.5px; }
  .message-author { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .message-author strong { font-weight: 550; }
  .message-author > span:last-child:not(.user-mark) { color: var(--muted); font-size: 11px; }
  .strategy-discussion-message .message-author { margin: 0 0 6px; }
  .msg-author { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 10.5px; color: var(--faint); }
  .msg-author strong { font-weight: 600; color: var(--muted); font-size: 11px; }
  .msg-author > span:last-child { font-size: 10px; }
  .user-mark { display: grid; place-items: center; height: 28px; width: 28px; border-radius: 50%; background: var(--subtle); font-size: 11px; color: var(--muted); }
  .primary-button { border: 1px solid transparent; background: #6550c9; color: #fff; border-radius: 7px; padding: 7px 14px; }
  .secondary-button { border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 7px; padding: 7px 14px; }
  .text-button { border: 0; background: transparent; color: var(--accent); padding: 4px 6px; border-radius: 5px; font-size: 12px; }
  .text-button:hover { background: var(--accent-soft); }
  .stop-button { display: inline-flex; gap: 5px; align-items: center; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--subtle); font-size: 12px; }

  /* ===== E1 项目任务对话（复制自 styles.css 层级） ===== */
  .chat-page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .task-banner { padding: 10px 22px 0; max-width: 800px; margin: 0 auto; width: calc(100% - 44px); font-size: 13px; color: var(--muted); }
  .task-banner strong { color: var(--ink); font-weight: 550; }
  .message-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .messages { max-width: 800px; margin: auto; padding: 18px 22px 16px; width: calc(100% - 44px); }
  .message { padding: 18px 0 22px; }
  .message-author { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .message-author strong { font-weight: 550; }
  .message-author > span:last-child:not(.user-mark) { color: var(--muted); font-size: 11px; }
  .message-content { padding-left: 37px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.85; }
  .message-content .strategy-discussion-reply { white-space: normal; }
  .message-meta { color: var(--muted); font-size: 11px; padding-left: 37px; margin: 6px 0 0; }
  .failed-meta { color: var(--error); }
  .report-action-row { display: flex; flex-wrap: wrap; gap: 4px; padding-left: 37px; margin-top: 8px; }
  .tool-message { border: 1px solid var(--line); border-radius: 8px; background: var(--subtle); margin: 6px 0; font-size: 12px; overflow: hidden; }
  .tool-message summary { cursor: pointer; padding: 9px 13px; color: var(--muted); }
  .tool-message pre { margin: 0; padding: 11px 13px; border-top: 1px solid var(--line); max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; line-height: 1.7; }
  .tool-message > code { display: block; margin: 0 13px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool-error { border-color: color-mix(in srgb, var(--error) 35%, var(--line)); }
  .tool-error summary { color: var(--error); }
  .run-progress { margin: 4px 0 14px 37px; font-size: 12px; color: var(--muted); }
  .composer-area { width: min(800px, calc(100% - 44px)); margin: 8px auto 14px; flex: 0 0 auto; }
  .composer { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 13px 16px; }
  .composer textarea { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); resize: vertical; min-height: 46px; font-size: 15px; line-height: 1.65; }
  .composer textarea:focus { outline: 0; }
  .composer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; }
  .composer-helper { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin: 8px 4px 0; color: var(--muted); font-size: 11px; }
  .error-notice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--error) 30%, var(--line)); background: var(--error-bg); color: var(--ink); border-radius: 9px; padding: 10px 13px; font-size: 12.5px; margin: 0 0 10px; }
  .error-notice strong { color: var(--error); }
  .error-notice p { margin: 3px 0 6px; }
  .error-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .semantic-mini { margin: 8px 0 0 37px; border: 1px solid var(--line); border-radius: 8px; background: var(--subtle); padding: 8px 12px; font-size: 11.5px; color: var(--muted); }
  .eb-native-context { margin: 8px 0 0 37px; font-size: 11.5px; color: var(--muted); }
  .eb-native-context summary { cursor: pointer; }
  .eb-native-context pre { background: var(--subtle); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 200px; overflow: auto; white-space: pre-wrap; }

  /* ===== E3/E4 共享转录（复制自 strategy-goals.css 层级） ===== */
  .sg-panel { max-width: 860px; margin: 0 auto; padding: 18px 22px 22px; width: calc(100% - 44px); }
  .sg-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sg-row-between { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .sg-muted { color: var(--muted); font-size: 12px; line-height: 1.7; }
  .sg-select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 240px; }
  .strategy-discussion > .sg-row-between h2 { margin: 0; font-size: 16px; }
  .strategy-discussion-messages { max-height: 52vh; overflow-y: auto; margin: 14px 0; border-top: 1px solid var(--line); }
  .strategy-discussion-message { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .strategy-discussion-message > strong { color: var(--muted); font-size: 12px; }
  .strategy-discussion-message > p { margin: 7px 0 0; font-size: 13px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
  .strategy-discussion-message.user { padding-left: 14px; border-left: 2px solid var(--accent-soft); }
  .strategy-discussion-reply { min-width: 0; font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
  .strategy-discussion-reply p { margin: 8px 0; }
  .strategy-discussion-reply :is(h3, h4, h5, h6) { margin: 14px 0 8px; font-size: 14px; line-height: 1.45; }
  .strategy-discussion-reply h3 { font-size: 16px; }
  .strategy-discussion-reply :is(ul, ol) { margin: 7px 0 12px; padding-inline-start: 22px; }
  .strategy-discussion-reply li { margin: 3px 0; }
  .sg-table-scroll { min-width: 0; max-width: 100%; overflow-x: auto; }
  .sg-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sg-table th, .sg-table td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 8px 10px; line-height: 1.7; min-width: 118px; }
  .sg-table th { font-weight: 550; color: var(--ink); background: var(--subtle); }
  .strategy-discussion-reply pre { overflow-x: auto; padding: 9px 11px; border-radius: 5px; background: var(--subtle); }
  .strategy-discussion-reply code { font-size: .94em; }
  .evidence-card { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; border: 1px solid var(--line); background: var(--subtle); border-radius: 8px; padding: 8px 12px; font-size: 12px; max-width: 100%; }
  .evidence-card .ev-loc { color: var(--accent); font-weight: 550; }
  .evidence-card .ev-quote { color: var(--muted); overflow-wrap: anywhere; }
  .strategy-discussion-composer { margin-top: 10px; }
  .strategy-discussion-composer textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); resize: vertical; min-height: 62px; padding: 10px 12px; font-size: 14px; }
  .composer-actions-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

  /* ===== E5 PPT 精修（复制自 refiner.css 层级，仅对话区） ===== */
  .refiner-page { width: min(860px, calc(100% - 44px)); margin: 0 auto; padding: 16px 0 26px; }
  .refiner-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
  .refiner-header h1 { font-size: 17px; font-weight: 550; margin: 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.accent { color: #6550c9; border-color: #cfc6ee; background: #eeebfb; }
  .app[data-theme="dark"] .chip.accent { color: #b7a7ff; border-color: #4a4270; background: #30294a; }
  .chip.ok { color: #1c7c4a; border-color: #bfe3cf; background: #eef7f1; }
  .app[data-theme="dark"] .chip.ok { color: #7fd3a4; border-color: #2f5c42; background: #1e2c24; }
  .refiner-error { color: var(--error); background: var(--error-bg); border: 1px solid color-mix(in srgb, var(--error) 30%, var(--line)); border-radius: 7px; padding: 8px 12px; font-size: 12.5px; margin: 0 0 10px; }
  .refiner-note { color: var(--muted); font-size: 12px; margin: 6px 0; overflow-wrap: anywhere; }
  .refiner-chat { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); }
  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 180px; max-height: 46vh; padding: 2px; }
  .msg { border-radius: 10px; padding: 8px 11px; font-size: 12.5px; max-width: 94%; }
  .msg.user { align-self: flex-end; background: #eeebfb; border: 1px solid #d9d0f2; }
  .msg.agent { align-self: flex-start; background: var(--subtle); border: 1px solid var(--line); }
  .app[data-theme="dark"] .msg.user { background: #30294a; border-color: #4a4270; }
  .msg .who { font-size: 10px; color: var(--faint); display: block; margin-bottom: 3px; }
  .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
  .msg-note { margin-top: 6px !important; font-size: 11px; color: var(--faint); }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); }
  .refiner-inspect-option { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }

  /* ===== 本设计的核心新元素：推理过程组 + 折叠预览 ===== */
  .process-group { margin: 2px 0 14px 37px; border: 1px solid var(--line); border-radius: 9px; background: var(--subtle); overflow: hidden; }
  .strategy-discussion-message .process-group, .sg-messages .process-group { margin: 10px 0 4px; }
  .process-toggle { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 9px 13px; color: var(--muted); font-size: 12px; text-align: left; }
  .process-toggle:hover { background: var(--hover); }
  .process-toggle .p-glyph { width: 15px; height: 15px; border: 1.5px dashed var(--faint); border-radius: 4px; flex-shrink: 0; }
  .process-toggle .p-count { color: var(--ink); font-weight: 550; }
  .process-toggle .p-live { color: var(--accent); font-size: 11px; }
  .process-toggle .chev { margin-left: auto; transition: transform .15s; color: var(--faint); }
  .process-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .process-steps { border-top: 1px solid var(--line); padding: 8px 12px 10px; display: grid; gap: 6px; }
  .process-step { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 12px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--faint); }
  .step-dot.ok { background: var(--ok); }
  .step-dot.err { background: var(--error); }
  .step-main { min-width: 0; }
  .step-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; color: var(--muted); }
  .step-head code { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .step-status { font-size: 11px; }
  .step-status.ok { color: var(--ok); }
  .step-status.err { color: var(--error); }
  .process-step .tool-message { margin: 5px 0 0; }

  .fold { position: relative; }
  .fold-inner { min-width: 0; }
  .fold.collapsed .fold-inner { max-height: calc(var(--fold-lines, 5) * 1.85em); overflow: hidden; }
  .fold.collapsed .fold-inner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.6em; background: linear-gradient(to bottom, transparent, var(--canvas)); pointer-events: none; }
  .strategy-discussion-message .fold.collapsed .fold-inner::after { background: linear-gradient(to bottom, transparent, var(--canvas)); }
  .fold-toggle { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 3px 4px; border-radius: 5px; }
  .fold-toggle:hover { background: var(--accent-soft); }
  .fold-toggle .chev { font-size: 10px; }
  .streaming-caret { display: inline-block; width: 8px; height: 1em; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 演示标注（评审用，产品外壳之外的说明） ===== */
  .demo-note { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; border: 1px dashed #b98a2f; color: #8a6114; background: #fff8ea; border-radius: 6px; padding: 3px 9px; font-size: 11px; margin: 6px 0 0; max-width: 100%; }
  .app[data-theme="dark"] .demo-note { border-color: #8a6a2a; color: #dcb86a; background: #2e2618; }
  .demo-note::before { content: "设计点"; font-weight: 600; background: #b98a2f; color: #fff; border-radius: 3px; padding: 1px 5px; font-size: 10px; }
  .baseline-panel { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; background: var(--surface); }
  .baseline-panel h3 { margin: 0 0 4px; font-size: 14px; }
  .baseline-panel .bl-tag { color: var(--error); font-size: 11px; font-weight: 600; }
  .baseline-problems { margin: 8px 0 12px; padding-inline-start: 20px; font-size: 12px; color: var(--muted); line-height: 1.8; }
  .empty-agent-block { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="demo-review-bar" id="reviewBar">
  <div class="demo-review-group">
    <span class="demo-review-badge">#116 设计待审</span>
    <button class="demo-tab" data-scene="task" aria-pressed="true">项目任务对话</button>
    <button class="demo-tab" data-scene="strategy" aria-pressed="false">战略共创</button>
    <button class="demo-tab" data-scene="role" aria-pressed="false">业务角色</button>
    <button class="demo-tab" data-scene="refiner" aria-pressed="false">PPT 精修</button>
    <button class="demo-tab" data-scene="baseline" aria-pressed="false">基线对照</button>
  </div>
  <div class="demo-review-group">
    <button class="demo-act" id="viewportBtn">窄屏 390px</button>
    <button class="demo-act" id="themeBtn">深色</button>
    <button class="demo-act" id="streamBtn">▶ 模拟流式输出</button>
    <button class="demo-act" id="refreshBtn">⟳ 模拟刷新/重连</button>
    <button class="demo-act" id="keyboardBtn">键盘演示</button>
    <button class="demo-act" id="resetBtn">清空折叠记忆</button>
    <span class="demo-store-count" id="storeCount"></span>
  </div>
  <div class="demo-hint">合成资料 · 内存状态 · 不连接 Host/模型。Tab 聚焦折叠控制后 Enter 展开/收起。</div>
</div>

<div class="demo-stage" data-viewport="wide">
  <div class="app" id="shell" data-theme="light">
    <header class="topbar"><div><span class="topbar-title" id="sceneTitle">任务对话 · 门店复购分析</span></div></header>
    <div class="main-scroll" id="sceneRoot"></div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   #116 UI Demo：共享「过程分组 + 长内容折叠」呈现层（设计候选）
   - 折叠记忆：真实 sessionStorage，按 会话key::消息身份 隔离
   - 身份模拟：native:xxx（对应产品 nativeEntryId）；u-xxx / p-xxx 为回退身份
   ============================================================ */
const STORE_KEY = 'optracall.demo.transcript-collapse.v1';
const store = {
  data: JSON.parse(sessionStorage.getItem(STORE_KEY) || '{}'),
  get(key) { return this.data[key]; },
  set(key, value) { this.data[key] = value; sessionStorage.setItem(STORE_KEY, JSON.stringify(this.data)); updateStoreCount(); },
  clear() { this.data = {}; sessionStorage.removeItem(STORE_KEY); updateStoreCount(); },
};
function updateStoreCount() {
  document.getElementById('storeCount').textContent = Object.keys(store.data).length ? `折叠记忆 ${Object.keys(store.data).length} 条` : '';
}
updateStoreCount();

/* ---------- 折叠组件（对应共享呈现层 D4/D5/D6） ---------- */
function applyFoldChoice(group, choice) {
  const inner = group.querySelector('.fold-inner');
  const btn = group.querySelector('.fold-toggle');
  if (choice === 'expanded') { group.classList.remove('collapsed'); btn.setAttribute('aria-expanded', 'true'); btn.querySelector('.t-label').textContent = '收起'; }
  else { group.classList.add('collapsed'); btn.setAttribute('aria-expanded', 'false'); btn.querySelector('.t-label').textContent = '展开全文'; }
}
function mountFoldables(root, sceneKey) {
  root.querySelectorAll('.fold').forEach(group => {
    if (group.dataset.mounted) return;
    group.dataset.mounted = '1';
    const lines = group.dataset.lines || '5';
    const id = group.dataset.foldId;
    const key = `${sceneKey}::${id}`;
    group.style.setProperty('--fold-lines', lines);
    const inner = document.createElement('div');
    inner.className = 'fold-inner';
    while (group.firstChild) inner.append(group.firstChild);
    group.append(inner);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fold-toggle';
    btn.innerHTML = '<span class="t-label">展开全文</span><span class="chev">⌄</span>';
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-controls', inner.id = 'fold-' + Math.random().toString(36).slice(2, 9));
    group.append(btn);
    group.classList.add('collapsed');
    btn.addEventListener('click', () => {
      const next = group.classList.contains('collapsed') ? 'expanded' : 'collapsed';
      applyFoldChoice(group, next);
      store.set(key, next);
    });
    // 短内容：排版未超过预览区 → 全文直接可读，不显示控制
    requestAnimationFrame(() => {
      if (inner.scrollHeight > inner.clientHeight + 2) {
        const saved = store.get(key);
        if (saved === 'expanded') applyFoldChoice(group, 'expanded');
      } else { group.classList.remove('collapsed'); btn.hidden = true; group.dataset.short = '1'; }
    });
  });
  root.querySelectorAll('.process-group').forEach(group => {
    if (group.dataset.mounted) return;
    group.dataset.mounted = '1';
    const steps = group.querySelector('.process-steps');
    const btn = group.querySelector('.process-toggle');
    const key = `${sceneKey}::${group.dataset.foldId}`;
    const setState = open => { steps.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
    btn.addEventListener('click', () => { const next = steps.hidden; setState(next); store.set(key, next ? 'expanded' : 'collapsed'); });
    if (store.get(key) === 'expanded') setState(true);
  });
}

/* ---------- 过程组（对应 D1/D2） ---------- */
function stepRow(step) {
  const status = step.err ? '<span class="step-status err">执行失败</span>' : '<span class="step-status ok">执行结果</span>';
  const details = [];
  if (step.command) details.push(`<code>${step.command}</code>`);
  details.push(`<details class="tool-message ${step.err ? 'tool-error' : ''}"><summary>${step.name} · ${step.err ? '执行失败' : '执行结果'}</summary>${step.command ? `<code>${step.command}</code>` : ''}<pre>${step.output}</pre></details>`);
  return `<div class="process-step"><span class="step-dot ${step.err ? 'err' : 'ok'}"></span><div class="step-main"><div class="step-head"><code>${step.name}</code>${status}${step.note ? `<span class="step-status">${step.note}</span>` : ''}</div>${details.join('')}</div></div>`;
}
function processGroup(id, steps, note) {
  return `<div class="process-group" data-fold-id="${id}">
    <button type="button" class="process-toggle" aria-expanded="false"><span class="p-glyph" aria-hidden="true"></span><span>推理过程</span><span class="p-count">· ${steps.length} 步</span>${note ? `<span class="p-live">${note}</span>` : ''}<span class="chev" aria-hidden="true">⌄</span></button>

}

let streamTimer = null;
function startStreaming() {
  if (currentScene !== 'task') switchScene('task');

  const status = document.getElementById('taskStatus');

  status.textContent = 'Pi 正在回复';
  stopBtn.hidden = false;
  let cursor = 0;
  const target = STREAM_TEXT;
  streamTimer = setInterval(() => {
    cursor = Math.min(target.length, cursor + 3);
    const target2 = document.getElementById('streamTarget');
    if (target2) target2.innerHTML = escapeHtml(target.slice(0, cursor)) + '<span class="streaming-caret" aria-hidden="true"></span>';
    if (cursor >= target.length) finalizeStreaming(false);
  }, 40);
  stopBtn.onclick = () => finalizeStreaming(true);
}
function stopStreaming() { if (streamTimer) { clearInterval(streamTimer); streamTimer = null; } }

/* ---------- 场景切换与评审栏 ---------- */
const SCENES = { task: renderTaskScene, strategy: renderStrategyScene, role: renderRoleScene, refiner: renderRefinerScene, baseline: renderBaselineScene };
function switchScene(name) {
  stopStreaming();
  currentScene = name;
  document.querySelectorAll('.demo-tab').forEach(tab => tab.setAttribute('aria-pressed', String(tab.dataset.scene === name)));
  SCENES[name]();
  sceneRoot.scrollIntoView();
}
document.getElementById('reviewBar').addEventListener('click', event => {
  const tab = event.target.closest('.demo-tab');
  if (tab) switchScene(tab.dataset.scene);
});
document.getElementById('viewportBtn').addEventListener('click', event => {
  const stage = document.querySelector('.demo-stage');
  const narrow = stage.dataset.viewport === 'narrow';
  stage.dataset.viewport = narrow ? 'wide' : 'narrow';
  event.currentTarget.textContent = narrow ? '窄屏 390px' : '宽屏还原';
});
document.getElementById('themeBtn').addEventListener('click', event => {
  const shell = document.getElementById('shell');
  const dark = shell.dataset.theme === 'dark';
  shell.dataset.theme = dark ? 'light' : 'dark';
  event.currentTarget.textContent = dark ? '深色' : '浅色';
});
document.getElementById('streamBtn').addEventListener('click', startStreaming);
document.getElementById('refreshBtn').addEventListener('click', () => { stopStreaming(); SCENES[currentScene](); });
document.getElementById('keyboardBtn').addEventListener('click', () => {
  if (currentScene === 'baseline') switchScene('task');
  const target = sceneRoot.querySelector('.fold-toggle:not([hidden]), .process-toggle');
  if (target) { target.focus(); target.scrollIntoView({ block: 'center' }); }
});
document.getElementById('resetBtn').addEventListener('click', () => { store.clear(); SCENES[currentScene](); });
switchScene('task');
</script>
