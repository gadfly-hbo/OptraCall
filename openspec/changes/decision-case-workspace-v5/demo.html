const escapeChars = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const pageNames = {settings:'设置',help:'使用指南',home:'工作台首页',stars:'决策星图',projects:'项目地图',project:'项目地图',task:'任务工作台',case:'Decision Case',create:'新建 Case'};
const validPages = new Set([...Object.keys(pageNames),'foundation']);
let state = scenes.ready;
let lastRoute;

function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => escapeChars[character]);
}

function link(page, id, context) {
  const params = new URLSearchParams();
  if (typeof context === 'string' && context) params.set('case', context);
  else if (context && typeof context === 'object') {
    for (const [key,value] of Object.entries(context)) {
      if (value !== undefined && value !== null && value !== '') params.set(key, String(value));
    }
  }
  return '#' + page + (id ? '/' + encodeURIComponent(id) : '') + (params.size ? '?' + params.toString() : '');
}

function currentRoute() {
  const [pathname, search] = location.hash.slice(1).split('?',2);
  const [page,id] = pathname.split('/',2);
  if (!validPages.has(page)) {
    const area=new URLSearchParams(location.search).get('management');
    if(!page&&['gsa','strategy'].includes(area))return {page:'foundation',id:area==='gsa'?'goals':'strategy',context:{},tab:''};
    return {page:'home',id:'',context:''};
  }
  const params = new URLSearchParams(search);
  const extras = Object.fromEntries(params);
  try {
    const grouped = ['foundation','settings','help'].includes(page);
    return {...extras, page, id:id ? decodeURIComponent(id) : '', context:grouped ? extras : params.get('case') || '', tab:params.get('tab')||'', panel:params.get('panel')||''};
  } catch {
    return {page:'home',id:'',context:''};
  }
}

function go(page, id) {
  const destination = link(page,id);
  if (location.hash !== destination) location.hash = destination;
  else render();
}

function navigation(route) {
  const current = route.page === 'foundation' ? route.id || 'overview'
    : ['case','create'].includes(route.page) ? 'stars' : ['task','project'].includes(route.page) ? 'projects' : route.page;
  const entry = (id, title, icon, page) => `<li><a class="nav-link" href="${link(page || id,page ? id : undefined)}"${id===current?' aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${uiIcon(id)}</span>${title}</a></li>`;
  return `<div class="nav-group"><p class="nav-heading">日常工作</p><ul>
    ${entry('home','工作台首页','▦')}${entry('stars','决策星图','⌘')}${entry('projects','项目地图','▤')}
    </ul></div><div class="nav-group"><a class="nav-heading foundation-index-link" href="#foundation" ${current==='overview'?'aria-current="page"':''}>基础建设总览</a><ul>
    ${foundations.map(item => entry(item.id,item.title,item.icon,'foundation')).join('')}
    </ul></div><div class="nav-group nav-utilities"><ul>${entry('settings','设置','')}</ul></div>`;
}

function foundationStatus(item) {
  const module = ['strategy','goals'].includes(item.id) ? strategyV4 : assetsV4;
  const status = module.status?.(item);
  if (typeof status === 'string' && status) return status;
  return item.id === 'goals'
    ? state.adoptedAnnual ? '已采用' : '未开始'
    : state.mode === 'ready' ? item.ready : '未开始';
}

function taskUrl(record) {
  const projectId = record.projectId || 'east';
  return link('task', projectId === 'east' ? 'retention' : projectId + '~analysis',record.id);
}

function homeHero(record) {
  const project = state.projects.find(item => item.id === record?.projectId);
  const seeded = record?.id === sample.case.id && state.mode === 'ready';
  const title = record?.title || '把一个经营问题带进工作台';
  const goal = record?.goal || '为眼前的问题确定一个可核对的目标';
  const strategy = record?.strategy || '选择一条值得尝试的策略';
  const projectUrl = project ? link('project',project.id,record.id) : link('projects');
  const facts = [
    {text:'明确目标与策略', confirmed:!!record?.goalBinding},
    {text:'关联执行项目', confirmed:!!project},
    {text:'留存复盘记录', confirmed:!!record?.reviewNotes?.length}
  ];
  const factCount = facts.filter(item => item.confirmed).length;
  const decision = seeded && record.decision;
  const stores = decision?.stores;
  const storeCount = stores ? stores.length : 3;
  const stockCount = stores ? stores.filter(store => store.reason.includes('缺货')).length : 2;
  const mixCount = storeCount - stockCount;
  const caption = seeded ? (decision ? '已确认核查范围' : '建议核查范围') : '已有工作记录';
  const chart = seeded
    ? `<div class="dh-chart" style="--portion:${storeCount ? stockCount / storeCount * 100 : 0}%">
        <div><strong>${storeCount}</strong><small>家门店</small></div>
      </div><dl class="dh-legend">
        <div><dt><i></i>核查缺货</dt><dd>${stockCount} 家</dd></div>
        <div><dt><i></i>核查品类结构</dt><dd>${mixCount} 家</dd></div>
      </dl>${decision ? `<a class="dh-source" href="${link('case',record.id)}">负责人 · ${safe(decision.owner)}</a>` : `<a class="dh-source" href="${safe(taskUrl(record) + '&panel=report')}">来源 · 华东复购诊断报告 v1</a>`}`
    : `<div class="dh-chart dh-chart-facts" style="--portion:${factCount / 3 * 100}%">
        <div><strong>${factCount}<em>/3</em></strong><small>类已记录</small></div>
      </div><ul class="dh-checklist">${facts.map(fact =>
        `<li><span class="${fact.confirmed ? 'is-complete' : ''}" aria-hidden="true">${fact.confirmed ? '✓' : '○'}</span>${fact.text}<small>${fact.confirmed ? '已有' : '待补'}</small></li>`
      ).join('')}</ul>`;
  return `<section class="dh-hero" aria-labelledby="focus-case">
    <div class="dh-case">
      <div class="dh-case-top"><span class="dh-case-tag"><i aria-hidden="true"></i>${record ? '当前 Case' : '首个 Case'}</span><span>${record ? safe(record.status || '待推进') : '项目可独立开始'}</span></div>
      <h2 id="focus-case">${safe(title)}</h2>
      <div class="dh-gs"><p><b aria-label="目标">G</b><span>${safe(goal)}</span></p><p><b aria-label="策略">S</b><span>${safe(strategy)}</span></p></div>
      <div class="dh-case-actions"><a class="button primary" href="${record ? link('case',record.id) : link('create')}">${record ? '继续推进 Case' : '新建 Case'}</a>
        ${project ? `<a class="dh-case-project" href="${projectUrl}">${safe(project.title)}</a>` :
          `<a class="dh-case-project" href="${link('project','east')}">打开示例项目</a>`}</div>
    </div>
    <aside class="dh-proof" aria-label="${caption}"><h3>${caption}</h3>${chart}</aside>
  </section>`;
}

function homeQueue(record) {
  if (!record) {
    return `<div class="dh-empty"><strong>还没有待处理事项</strong><p>可以先选一项门店问题，或到项目地图继续现有任务。</p><a href="${link('projects')}" class="text-link">打开项目地图</a></div>`;
  }
  const records = [record, ...state.cases.filter(item => item.id !== record.id)].filter(item => !['closed','已结束'].includes(item.status));
  const items = records.map(item => ({
    href:link('case',item.id), title:item.next || '明确这件事的下一步', context:item.title,
    status:item.status || '待推进', tone:item.decision ? 'active' : 'attention', owner:item.owner || item.goalBinding?.owner || '待指定',
    due:item.dueDate ? item.dueDate.replace(/^\d{4}-(\d{2})-(\d{2})$/, '$1/$2') : (item.id === sample.case.id ? '11/26' : '待安排')
  }));
  if (state.mode === 'ready') {
    const sampleCase = state.cases.find(item => item.id === sample.case.id);
    if (sampleCase) items.push({href:taskUrl(sampleCase) + '&panel=report',title:'核对复购诊断报告的依据',context:'华东会员复购下滑分析 · v1',
      status:'待核对',tone:'review',owner:'区域分析',due:'11/25'});
  }
  return `<ul class="dh-queue-list">${items.slice(0,4).map(item => `<li><a class="dh-queue-row" href="${safe(item.href)}">
    <span class="dh-status ${item.tone}">${safe(item.status)}</span>
    <span class="dh-queue-topic"><strong>${safe(item.title)}</strong><small>${safe(item.context)}</small></span>
    <span class="dh-owner"><span>${safe(item.owner)}</span><small>${safe(item.due)}</small></span>
  </a></li>`).join('')}</ul>`;
}

  const current = state.cases.find(item => item.id === state.activeCaseId) || state.cases[0];
  const seeded = current?.id === sample.case.id && state.mode === 'ready';
  const today = seeded && !current.decision ? '确定首批门店的核查范围' : current ? current.next || '安排当前 Case 的下一步' : '从第一个 Case 开始';
  const savedCase = state.cases.find(item => item.id === sample.case.id);
  const events = [...(state.activityLog || [])];
  if (state.mode === 'ready' && savedCase) {
    events.push(
      {title:'复购诊断报告已保存', detail:'华东会员复购下滑分析 · v1', label:'10:26', href:taskUrl(savedCase) + '&panel=report'},
      {title:'提出门店复购差异问题', detail:'核对缺货、首购品类与客群变化', label:'10:08', href:taskUrl(savedCase)}

  }
  const activity = events.length

        <a href="${safe(event.href || link('stars'))}"><strong>${safe(event.title)}</strong><small>${safe(event.detail)}</small></a></li>`).join('')}</ol>`
    : `<div class="dh-empty"><strong>暂无工作记录</strong><p>创建 Case 或在任务中记录第一条消息后，在这里继续查看。</p></div>`;
  return `<div class="desk-home">
    <header class="dh-head">
      <div><p class="dh-date"><time datetime="2026-11-25">11 月 25 日 · 星期三</time></p>
        <h1>${safe(today)}</h1>
        <p class="dh-intro">澄光零售<span aria-hidden="true"> / </span>${current ? `${state.cases.length} 个 Case 正在推进` : '从业务问题出发，按需补齐四项基础建设'}</p>
      </div>
      ${current ? `<a class="button secondary dh-new" href="${link('create')}"><b aria-hidden="true">+</b> 新建 Case</a>` : ''}
    </header>
    ${homeHero(current)}
    <div class="dh-sections">
      <section aria-labelledby="my-queue"><div class="dh-section-head"><h2 id="my-queue">需要你处理</h2><a href="${link('stars')}">查看全部 Case</a></div>${homeQueue(current)}</section>
      <section aria-labelledby="recent-activity"><div class="dh-section-head"><h2 id="recent-activity">最近活动</h2><a href="${state.mode === 'ready' ? link('task','retention') : link('project','east')}">${state.mode === 'ready' ? '继续任务' : '打开项目'}</a></div>${activity}</section>
    </div>
    <div class="dh-maps">
      <a href="${link('stars')}"><span class="dh-mini-map" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>决策星图</strong><small>${state.cases.length} 个 Case · 查看关联关系</small></span></a>
      <a href="${link('projects')}"><span class="dh-folders" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>项目地图</strong><small>${state.projects.length} 个项目 · 推进六类任务</small></span></a>
    </div>
    <section class="dh-foundation" aria-labelledby="foundations-title">
      <div class="dh-section-head"><h2 id="foundations-title">基础建设</h2><a href="#foundation">查看建设总览</a></div>
      <div class="foundation-tiles">${foundations.map(item => {
        const status = foundationStatus(item);
        return `<a class="foundation-tile" href="${link('foundation',item.id)}">
          <span class="foundation-label"><strong>${safe(item.title)}</strong><span class="pill ${status === '未开始' ? 'neutral' : 'good'}">${safe(status)}</span></span>
          <p>${safe(item.rhythm)}</p></a>`;
      }).join('')}</div>
    </section>
  </div>`;
}

function renderFoundation(route) {
  if (route.id === 'strategy' || route.id === 'goals') return strategyV4.render(route);
  if (route.id === 'semantic' || route.id === 'analysis') return assetsV4.render(route);
  return foundationIndex();
}

function render() {
  const route = currentRoute();
  const nextRoute = location.hash || '#home';
  if (route.page === 'settings' && lastRoute && !lastRoute.startsWith('#settings') && !lastRoute.startsWith('#help')) state.settingsOrigin = lastRoute;
  if (route.page === 'help' && lastRoute && !lastRoute.startsWith('#help')) state.helpOrigin = lastRoute;
  if (route.page === 'case' && state.cases.some(record => record.id === route.id)) {
    state.activeCaseId = route.id;
  }
  breadcrumb.textContent = route.page === 'foundation' ? foundations.find(item => item.id === route.id)?.title || '基础建设总览' : pageNames[route.page];
  document.title = breadcrumb.textContent + ' · OptraCall';
  const nav = navigation(route);
  document.getElementById('desktop-links').innerHTML = nav;
  document.getElementById('mobile-links').innerHTML = nav;

  const pages = {home:renderHome,stars:renderStars,projects:renderProjects,project:renderProjects,task:renderTask,case:renderCase,create:renderCreate,foundation:renderFoundation,settings:settingsV4.render,help:guideView};
  const notice = state.notice ? `<p class="notice" role="status">${safe(state.notice)}</p>` : '';
  state.notice = '';
  const origin = route.page === 'settings' ? backLink(state.settingsOrigin) : route.page === 'help' ? backLink(state.helpOrigin) : '';
  view.innerHTML = notice + origin + pages[route.page](route);
  const heading = view.querySelector('h1');
  heading?.setAttribute('tabindex','-1');
  if (lastRoute && lastRoute !== nextRoute) {
    window.scrollTo(0,0);
    heading?.focus({preventScroll:true});
  }
  if(route.page==='foundation' && route.id==='goals')strategyV4.showGoalTools5();else strategyV4.resetPin();
  persistGoalSession5();
  lastRoute = nextRoute;
}

function foundationAction(action) {
  if (action === 'foundation-review-annual') {
    state.annualReview = true;
    render();
    view.querySelector('[data-action="foundation-adopt-annual"]')?.focus();
    return true;
  }
  if (action === 'foundation-adopt-annual') {
    state.adoptedAnnual = {...sample.annual};
    state.annualReview = false;
    logActivity('采用年度目标 v2',state.adoptedAnnual.title,link('foundation','goals'));
    state.notice = '年度目标 v2 已在原型中采用。Case 关联需在 Case 内确认。';
    render();
    view.querySelector('h1')?.focus();
    return true;
  }
  if (action === 'foundation-record-feedback' && state.goalFeedback) {
    const feedback = state.goalFeedback;
    const previous = state.savedFeedback.findIndex(record => record.caseId === feedback.caseId);
    if (previous >= 0) state.savedFeedback[previous] = {...feedback};
    else state.savedFeedback.push({...feedback});
    logActivity('记录 Case 回顾材料',feedback.title,link('foundation','goals'));
    state.goalFeedback = null;
    state.notice = '已记录 Case 回顾材料，正式目标与策略版本保持原值。';
    render();
    view.querySelector('h1')?.focus();
    return true;
  }
  return false;
}

function closeNav(restoreFocus) {
  if (navDialog.open) navDialog.close();
  if (restoreFocus) navToggle.focus();
}

window.addEventListener('hashchange',render);
scene.addEventListener('change',() => {
  state = scenes[scene.value];
  go('home');
});

themeToggle.addEventListener('click',() => {
  const isDark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
  themeToggle.innerHTML = uiIcon(isDark ? 'sun' : 'moon');
  themeToggle.setAttribute('aria-label',isDark ? '切换到浅色主题' : '切换到深色主题');
});

navToggle.addEventListener('click',() => {
  navDialog.showModal();
  navDialog.querySelector('[aria-current="page"]')?.focus();
});
document.getElementById('close-nav').addEventListener('click',() => closeNav(true));
navDialog.addEventListener('cancel',event => { event.preventDefault(); closeNav(true); });
matchMedia('(max-width:810px)').addEventListener('change',event => { if (!event.matches) closeNav(false); });
document.getElementById('skip').addEventListener('click',event => {
  event.preventDefault();
  view.querySelector('h1')?.focus();
});
document.addEventListener('click',event => {
  const navLink = event.target.closest('#navigation a');
  if (navLink) closeNav(navLink.getAttribute('href') === link(currentRoute().page,currentRoute().id));
  const actionButton = event.target.closest('[data-action]');
  if (!actionButton) return;
  const {action,id} = actionButton.dataset;
  if (action.startsWith('case-')) window.handleCaseAction?.(action,id,actionButton,event);
  else if (action.startsWith('project-')) window.handleProjectAction?.(action,id,actionButton,event);
  else if (action.startsWith('foundation-')) foundationAction(action);
});
document.addEventListener('submit',event => {
  if (window.handleCaseSubmit?.(event.target,event)) return;
  window.handleProjectSubmit?.(event.target,event);
});

function logActivity(title,detail,href) {
  const label = new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
  state.activityLog ||= [];
  state.activityLog.unshift({title,detail,label,href});
}
const command = document.getElementById('command');
const query = document.getElementById('query');
const results = document.getElementById('results');

function commandEntries() {
  const entries = [];
  for (const item of state.cases) entries.push({group:'Decision Case', title:item.title, detail:item.status, href:link('case',item.id)});
  for (const project of state.projects) {
    entries.push({group:'项目',title:project.title,detail:'项目地图',href:link('project',project.id)});
    for (const type of previewTaskTypes) {
      const id = previewTaskId(project.id,type.id);
      const task = previewTaskFor(id);
      entries.push({group:'任务',title:task.title,detail:type.label,href:link('task',id)});
    }
  }
  for (const item of foundations) entries.push({group:'基础建设',title:item.title,detail:foundationStatus(item),href:link('foundation',item.id)});
  entries.push({group:'基础建设',title:'基础建设总览',detail:'四项建设与日常工作',href:link('foundation')});
  for (const [tab,title] of settingIndex) entries.push({group:'设置',title,detail:'工作区配置',href:link('settings','',{tab})});
  entries.push({group:'帮助',title:'使用指南',detail:'从 Case、战略或资产开始',href:link('help')});
  return entries;
}
function showResults() {
  const terms = query.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const entries = commandEntries().filter(item => terms.every(term => (item.title+item.group+item.detail).toLowerCase().includes(term)));
  if (!entries.length) {
    results.innerHTML = '<p class="command-empty" role="status">当前场景没有匹配结果，试试门店、目标或任务类型。</p>';
    return;
  }
  const groups = [...new Set(entries.map(item => item.group))];
  results.innerHTML = groups.map(group => '<section><h3>'+safe(group)+'</h3>'+entries.filter(item=>item.group===group).map(item=>'<a href="'+safe(item.href)+'"><strong>'+safe(item.title)+'</strong><small>'+safe(item.detail)+'</small></a>').join('')+'</section>').join('');
}
let searchOrigin;
function openCommand() {
  searchOrigin = document.activeElement;
  query.value = '';
  showResults();
  command.showModal();
  query.focus();
}
function closeCommand(restore = true) {
  command.close();
  if (restore) searchOrigin?.focus();
}
document.getElementById('open-search').addEventListener('click',openCommand);
document.getElementById('close-search').addEventListener('click',()=>closeCommand());
command.addEventListener('cancel',event=>{event.preventDefault();closeCommand()});
command.addEventListener('click',event=>{
  if (event.target.closest('#results a')) closeCommand(false);
});
query.addEventListener('input',showResults);
document.addEventListener('keydown',event=>{
  if (command.open) {
    const rows = [...results.querySelectorAll('a')];
    const index = rows.indexOf(document.activeElement);
    if (rows.length && ['ArrowDown','ArrowUp'].includes(event.key)) {
      event.preventDefault();
      const next = event.key === 'ArrowDown' ? (index+1)%rows.length : index<=0 ? rows.length-1 : index-1;

    }
    return;
  }
  if (event.key==='/' && !event.ctrlKey && !event.altKey && !event.metaKey && !document.querySelector('dialog[open]') && !event.target.closest('input,textarea,select,[contenteditable="true"]')) {

function persistGoalSession5(){
  try {
    sessionStorage.setItem(goalSessionKey5,JSON.stringify({schema:1,active:state.mode,scenes}));

function restoreGoalSession5(){
  try {
    const saved=JSON.parse(sessionStorage.getItem(goalSessionKey5)||'null');
    if(saved?.schema!==1||!['ready','empty'].includes(saved.active))return;
    for(const mode of ['ready','empty']){
      const snap=saved.scenes?.[mode];
      if(snap?.mode!==mode||!Array.isArray(snap.cases)||!Array.isArray(snap.projects))return;
    }
    for(const mode of ['ready','empty']){
      Object.assign(scenes[mode],saved.scenes[mode]);
      const desk=scenes[mode].goalDeskV4;
      if(desk){desk.tool='';desk.preview=false;desk.rowsOpen=false;desk.edit=false;}
    }

  } catch { /* A fresh example is available if no saved scene can be read. */ }
}

  }
  function page(route) {
    const area=route.id, p=params(route), tab=libraries[area].tabs.includes(p.tab)?p.tab:libraries[area].tabs[0], ent=scope();

    else if(tab==='workbench') content=workbench(area,ent,p);
    else if(['metrics','methods','materials'].includes(tab)&&['manage','edit'].includes(p.mode)) content=manage(area,tab,ent,p);
    else if(p.asset) content=detail(area,tab,ent,ent.entries.find(e=>e.tab===tab&&key(e)===p.asset));

  function current() {
    const r=currentRoute(),p=params(r),area=r.id;
    return {area,p,tab:libraries[area]?.tabs.includes(p.tab)?p.tab:libraries[area]?.tabs[0],ent:scope()};
  }
  function nav(hash) {
    if(location.hash===hash) render(); else location.hash=hash;

  function action(op,el) {
    if(!op.startsWith('asset-')) return false;
    const {area,p,tab,ent}=current();
    switch(op) {
      case 'asset-scope': st().picking=!st().picking; render(); break;
      case 'asset-open-scope': st().picking=true; render(); view.querySelector('[name="name"]')?.focus(); break;
      case 'asset-clear': delete st().queries[ent.id+'/'+tab]; render(); break;
      case 'asset-activate': {
        const e=ent.entries.find(x=>key(x)===el.dataset.id&&x.tab===tab&&x.status==='draft');

        logActivity(state.notice,ent.name,url(area,tab,{asset:key(e)})); render(); break;
      }
      case 'asset-preview': ent.preview=ent.entries.filter(e=>e.status==='candidate'&&e.ready).map(key); render(); break;
      case 'asset-publish': {
        if(!ent?.preview?.length) break;
        const entries=ent.preview.map(k=>ent.entries.find(e=>key(e)===k&&e.ready&&e.status==='candidate'));
        if(entries.some(e=>!e)) {ent.preview=null; render(); break;}
        entries.forEach(e=>{e.status='live'; ent.logs.unshift(e.title+' · '+version(e)+' · 已确认发布');});

      }
      case 'asset-revoke': {const g=ent?.grants.find(x=>x.id===el.dataset.id);if(g){g.revoked=true;state.notice='此项原型授权已撤回。';render();view.querySelector('.as-pack')?.setAttribute('open','');}break;}
    }
    return true;
  }
  function submit(f,ev) {
    const op=f.dataset.v4Form;
    if(!op?.startsWith('asset-')) return false;
    ev.preventDefault();
    if(!f.reportValidity()) return true;
    const {area,tab,ent,p}=current(), data=Object.fromEntries(new FormData(f)), read=n=>String(data[n]||'').trim();
    for(const el of f.querySelectorAll('[required]')) {
      if(!String(el.value).trim()) {el.focus();return true;}
    }
    switch(op) {
      case 'asset-search': st().queries[ent.id+'/'+tab]=read('query'); render(); break;
      case 'asset-scope': if(st().scopes.some(s=>s.id===read('scope'))) {st().current=read('scope');st().picking=false;nav(url(area,tab));} break;
      case 'asset-create-scope': {
        const name=read('name'), item=st().scopes.find(s=>s.name===name);

        st().scopes.push(newScope);st().current=newScope.id;st().picking=false;state.notice='已建立企业范围。';nav(url(area,tab));break;
      }
      case 'asset-save-prof': {
        const base=ent.entries.find(e=>key(e)===p.asset&&e.tab===tab), id=base?.id||'asset-'+next();
        const v=String(Math.max(0,...ent.entries.filter(e=>e.id===id).map(e=>Number(e.v)))+1);
        const record={id,v,tab,title:read('title'),status:'draft',scope:read('scope'),body:read('body'),limit:base?.limit||'',src:read('source'),loc:'本次原型整理',quote:read('body')};
        ent.entries.push(record);state.notice=tab==='materials'?'已保存工作稿，待启用。':'已保存未发布方法版本。';nav(url(area,tab,{asset:key(record)}));break;
      }
      case 'asset-metric': {
        if(ent.id!=='east-ent'||ent.entries.some(e=>e.id==='purchase-days')||!data.checked||!read('reviewer')) break;
        const e={id:'purchase-days',v:'1.0.0',tab:'metrics',title:'首购观察天数',status:'published',scope:'华东门店 · 有效首购会员',body:'观察截止日减有效首购日，单位为天。',limit:'首购日未知的样本不参与计算。',src:'首购观察天数.yaml',loc:'020_clean / 审核人 '+read('reviewer'),quote:'首购当日计 0 天，缺失日期的样本排除。'};
        ent.entries.push(e);state.notice='审核人和指标版本已记入原型。';nav(url(area,tab,{asset:key(e)}));break;
      }
      case 'asset-system':{
        const proj=state.projects.find(x=>x.id===read('project'));
        if(!proj||st().scopes.some(s=>s.id!==ent.id&&s.projectIds.includes(proj.id))) break;
        ent.system=read('title');ent.goal=read('body');ent.projectIds=[proj.id];state.notice='已建立本企业的原型建设体系。';render();break;
      }
      case 'asset-candidate':{
        const t=read('kind'); if(!ent.system||!['semantic','binding'].includes(t))break;
        const record={id:'studio-'+next(),v:'1',tab:t,title:read('title'),status:'candidate',scope:read('scope'),body:read('body'),limit:'来源与样本检查待完成。',src:read('source'),loc:'本轮建设候选 r1',quote:read('body')};
        ent.entries.push(record);state.notice='已保存待核候选。';nav(url('semantic',t,{asset:key(record)}));break;
      }
      case 'asset-grant': {
        const proj=state.projects.find(x=>ent.projectIds.includes(x.id)&&x.id===read('project')), start=read('start'), end=read('end'), level=read('level');
        let error='';
        if(!ent.hasPack||!proj) error='请选择本企业已关联的项目。';
        if(start&&end&&start>end) error='期间止须晚于或等于期间起。';
        if(level==='cite-summary'&&read('summary')!=='member-summary@1') error='请选择准确汇总资产版本。';
        if(level==='read-detail-recalculate'&&!read('paths')) error='请明确允许读取的明细路径。';
        if(!read('purposes').split(/[,，、]/).some(x=>x.trim())) error='请填写至少一个用途。';
        if(error){f.querySelector('[role="alert"]').textContent=error;return true;}
        const boundary=[read('stores')||'企业范围',level==='cite-summary'?'门店会员月汇总 v1 · 门店/月':level==='read-detail-recalculate'?read('paths'):'仅定义'].join(' · ');
        ent.grants.push({id:'grant-'+next(),projectName:proj.title,level,purposes:read('purposes'),start,end,basis:read('basis'),boundary});
        state.notice='已在当前原型保存项目资源授权。';render();view.querySelector('.as-pack')?.setAttribute('open','');break;
      }
    }
    return true;
  }
  function status(item) {
    const id=typeof item==='string'?item:item.id;
    if(!libraries[id]) return undefined;
    const entries=(scope()?.entries||[]).filter(e=>libraries[id].tabs.includes(e.tab));
    return entries.some(e=>good.includes(e.status))?'已发布':entries.length?'建设中':'未开始';
  }
  return {render:page,action,submit,status};
})();

    return block('自动衔接','工作开始时读取这份全局设置，并核对本次授权和适用范围。',
      '<div class="set-total"><div><strong>全局总控</strong><p>已开启 '+count+' / 5 项</p></div>'+button('auto-all',count===5?'全部关闭':'全部开启')+'</div>'+
      '<div class="set-node-list">'+autoNodes.map(([id,title,desc])=>'<div class="set-node"><div><strong>'+title+'</strong><p>'+desc+'</p></div><button type="button" class="set-switch" role="switch" aria-label="'+title+'" aria-checked="'+Boolean(s.nodes[id])+'" data-value="'+id+'" data-v4-action="set-auto-node"><span></span></button></div>').join('')+'</div>'+information('开关影响后续适用动作。已经开始的动作保留原停止入口。'));
  }
  function skillPanel() {
    return block('内置 Skill 目录','展开查看来源、用途和依赖。环境状态在实际使用前核验。',
      '<div class="set-details-list">'+skills.map(([name,id,dependencies,desc])=>'<details><summary><span><strong>'+name+'</strong><small>'+desc+'</small></span><code>'+id+'</code></summary><dl class="set-facts"><div><dt>当前来源</dt><dd>OptraCall 内置分析资产</dd></div><div><dt>依赖声明</dt><dd>'+dependencies+'</dd></div><div><dt>环境状态</dt><dd>待在实际环境核对</dd></div></dl></details>').join('')+'</div>'+
      actions('<a class="button secondary" href="'+link('projects')+'">查看项目地图</a>'+tabLink('model','核对模型配置')),badge('只读目录'));
  }
  function connections(s) {
    let controls=actions(button('open-db',s.dbOpen?'收起连接管理':'管理共享数据库连接'));
    if(s.dbOpen) {
      const db=s.dbChecked||s.db||{label:'华东门店分析库',engine:'postgresql'};
      controls+='<div class="set-inset"><strong>'+(s.db?'已保存的共享连接':'添加共享连接')+'</strong><form data-v4-form="set-db"><div class="set-field-grid">'+
      field('连接名称','<input name="label" required maxlength="80" value="'+safe(db.label)+'">')+
      field('数据库类型',select('engine',{postgresql:'PostgreSQL',mysql:'MySQL'},db.engine))+'</div>'+
      information('使用固定样例主机、受限账户和系统 CA。')+actions(submitButton('模拟测试连接')+
      button('save-db','保存已测配置',{disabled:!s.dbChecked}))+'</form>'+
      (s.dbChecked?information('待保存的测试回执 · '+safe(s.dbChecked.label)+' / '+safe(s.dbChecked.engine)):'')+'</div>';
    }
    return block('数据库与数据仓库','共享 PostgreSQL 或 MySQL 连接可以由项目后续申请使用。',controls,badge(s.db?'1 个共享连接':'0 个共享连接'))+
      block('商圈数据','本机快照用于项目选定范围内的商圈分析。',information('示例环境尚未载入商圈快照。'))+
      block('历史天气','Open-Meteo 提供历史日级天气。任务中可以显式启用，使用前核对项目范围。',
      actions('<a class="button secondary" href="'+link('projects')+'">前往项目地图</a>'));
  }
  function personal(s) {
    const filters=['全部资料','重点收藏','原有人工资料','异常历史','已排除'];
    const records=s.notes.map((n,i)=>[n,i]).filter(([n])=>{
      if(s.noteFilter==='重点收藏')return n.favorite;
      if(s.noteFilter==='异常历史'||s.noteFilter==='已排除')return false;
      return true;
    });
    return block('我的资料','可以记录人工笔记，核对后保留准确内容，或标记为重点收藏。',
      '<div class="set-filter">'+filters.map(f=>button('filter-note',f,{value:f,aria:'aria-pressed="'+(f===s.noteFilter)+'"'})).join('')+'</div>'+
      '<div class="set-notes">'+(records.length?records.map(([n,i])=>'<article><header><button class="set-text" type="button" data-v4-action="set-open-note" data-value="'+i+'" aria-expanded="'+(s.noteOpen===i)+'">'+safe(n.title)+'</button>'+badge(n.status,n.status==='草稿'?'pending':'ok')+'</header><small>'+safe(n.source)+(n.favorite?' · 重点收藏':'')+'</small>'+
      (s.noteOpen===i?'<p>'+safe(n.body)+'</p>'+actions(n.status==='草稿'?button('retain-note','确认保留当前版本',{value:i,primary:true}):button('favorite-note',n.favorite?'取消重点收藏':'重点收藏',{value:i})): '')+'</article>').join(''):information('当前范围没有资料。'))+'</div>'+
      (s.noteEditing?'<form class="set-inset" data-v4-form="set-note">'+field('标题','<input name="title" required maxlength="160">')+field('正文','<textarea name="body" rows="3" required maxlength="4000"></textarea>')+actions(submitButton('保存人工草稿')+button('new-note','取消编辑'))+'</form>':
      actions(button('new-note','新建人工笔记',{primary:true}))));
  }
  function modelPack(s) {
    const next=s.packs.length?'1.'+(1+Math.max(...s.packs.map(p=>Number(p.version.split('.')[1])))):'1.0';
    return block('模型注册表','在注册表核对模型包与版本，晋级前保留人工确认。',
      '<div class="set-notes">'+(s.packs.length?s.packs.map(p=>'<article><header><strong>门店复购预测 <small>v'+safe(p.version)+'</small></strong>'+badge(p.stage,p.stage==='Production'?'ok':'')+'</header>'+
      '<details><summary>版本信息</summary><p>任务类型 · 分类预测<br>训练用途 · 门店级会员复购概率预估<br>示例留出指标 · AUC 0.78</p></details>'+
      (p.stage==='Staging'?actions(button('prepare-promote','升级为 Production',{value:p.version})): '')+'</article>').join(''):information('尚无已导入的模型版本。'))+'</div>'+
      (s.promoteVer?'<div class="set-inset"><strong>确认晋级 v'+safe(s.promoteVer)+'</strong><p>'+ (s.packs.some(p=>p.stage==='Production')?'同名旧 Production 将自动归档。':'此版本将成为首个 Production。')+'</p>'+actions(button('promote','确认晋级',{primary:true})+button('cancel-promote','取消'))+'</div>':'')+
      actions(button('import-pack','模拟验货并导入 v'+next,{value:next})),badge(s.packs.length+' 个版本'));
  }
  function domain(s) {
    return block('参考来源登记','以版本和原文定位为单位登记参考，企业 Studio 可据此建设自己的资产。',
      '<div class="set-ref"><div><span class="v4-kicker">会员领域</span><h4>会员复购参考样例</h4><p>合成演练样例 · v0.1</p></div>'+badge(s.domainRef?'已登记':'待登记',s.domainRef?'ok':'pending')+'</div>'+
      '<details class="set-detail"><summary>查看原文与适用范围</summary><p>「同首购月份的会员可分别观察 30 天和 60 天复购。」<br>原文定位 · 样例参考 §2<br>维护方 · 工作台演示资料<br>适用范围 · 会员分析的口径讨论</p></details>'+
      actions(button('register-ref',s.domainRef?'本版已登记':'登记样例参考',{primary:true,disabled:s.domainRef})+
      '<a class="button secondary" href="'+link('foundation','semantic',{tab:'workbench',section:'coverage'})+'">进入企业 Studio 建设</a>')+
      information('企业正式口径、项目授权与参考登记分别管理。'));
  }
  const panels={usage,model,search,automation,skills:skillPanel,connections,personal,'model-pack':modelPack,'domain-pack':domain};
  function renderSettings(route) {
    const wanted=route.tab||route.context?.tab;
    const tab=Object.hasOwn(panels,wanted)?wanted:'model';
    const [,title]=entries.find(item=>item[0]===tab), group=groups.find(g=>g[1].some(item=>item[0]===tab))[0];
    const s=store();
    return '<section class="v4-page set-page"><header class="v4-head"><div><p class="v4-kicker">工作空间</p><h1 tabindex="-1">设置</h1><p class="v4-lead">管理工作用途、模型连接与个人资料。</p></div></header><div class="set-shell"><aside class="set-rail">'+nav(tab)+'</aside>'+mobileNav(tab)+'<div class="set-content"><header class="set-page-title"><div><p>'+group+'</p><h2>'+title+'</h2></div><span>本次演示环境</span></header>'+
      (s.notices[tab]?'<p class="set-feedback" role="status">'+safe(s.notices[tab])+'</p>':'')+panels[tab](s)+'</div></div></section>';
  }
  function action(name,el) {
    if(!name.startsWith('set-'))return false;
    const s=store(), val=el.dataset.value, n=Number(val);
    switch(name) {
      case 'set-credential': s.configured[s.model]=!s.configured[s.model]; s.verified[s.model]=false; notice('model',s.configured[s.model]?'已载入此配置的示例凭据。':'已移除此配置的示例凭据。'); break;
      case 'set-test-model': if(s.configured[s.model]){s.verified[s.model]=true;notice('model','模拟连接测试已返回一次响应。');} break;
      case 'set-move-search': if(Object.hasOwn(providers,val)){s.searchDraft=[...(s.searchDraft||s.searchOrder)].reverse(); if(s.searchDraft.join()===s.searchOrder.join())s.searchDraft=null; notice('search',s.searchDraft?'已调整顺序，保存后生效。':'顺序与已保存值一致。');} break;
      case 'set-save-search': if(s.searchDraft){s.searchOrder=s.searchDraft; s.searchDraft=null;notice('search','已保存检索顺序。');} break;
      case 'set-reset-search': s.searchDraft=s.searchOrder[0]==='minimax'?null:['minimax','deepseek'];notice('search',s.searchDraft?'已恢复默认顺序草稿，保存后生效。':'已恢复已保存的默认顺序。');break;
      case 'set-auto-node': if(autoNodes.some(([id])=>id===val))s.nodes[val]=!s.nodes[val]; render();break;
      case 'set-auto-all': {const enable=!autoNodes.every(([id])=>s.nodes[id]);autoNodes.forEach(([id])=>s.nodes[id]=enable);render();break;}
      case 'set-open-db': s.dbOpen=!s.dbOpen; render();break;
      case 'set-save-db': {
        if(!s.dbChecked)break;
        const form=el.closest('form'), draft=new FormData(form);
        if(String(draft.get('label')).trim()!==s.dbChecked.label||draft.get('engine')!==s.dbChecked.engine){s.dbChecked=null;const status=document.createElement('p');status.className='set-feedback';status.setAttribute('role','status');status.textContent='配置已更改，请重新模拟测试后保存。';form.append(status);el.disabled=true;break;}
        s.db={...s.dbChecked};s.dbChecked=null;notice('connections','已保存样例连接。项目授权须另行确认。');break;
      }
      case 'set-new-note': s.noteEditing=!s.noteEditing;render();break;
      case 'set-filter-note': s.noteFilter=val;s.noteOpen=-1;render();break;
      case 'set-open-note': s.noteOpen=s.noteOpen===n?-1:n;render();break;
      case 'set-retain-note': if(s.notes[n]?.status==='草稿'){s.notes[n].status='已保留';notice('personal','已保留核对过的笔记版本。');}break;
      case 'set-favorite-note': if(s.notes[n]){s.notes[n].favorite=!s.notes[n].favorite;notice('personal',s.notes[n].favorite?'已加入重点收藏。':'已取消重点收藏。');}break;
      case 'set-import-pack': if(!s.packs.some(p=>p.version===val)){s.packs.unshift({version:val,stage:'Staging'});notice('model-pack','样例模型包已模拟验货，已添加到 Staging。');}break;
      case 'set-prepare-promote': s.promoteVer=val;render();break;
      case 'set-cancel-promote': s.promoteVer='';render();break;
      case 'set-promote': if(s.packs.some(p=>p.version===s.promoteVer&&p.stage==='Staging')){s.packs.forEach(p=>{if(p.stage==='Production')p.stage='Archived';if(p.version===s.promoteVer)p.stage='Production';});s.promoteVer='';notice('model-pack','已确认示例版本晋级。');}break;
      case 'set-register-ref': s.domainRef=true;notice('domain-pack','已在示例目录登记会员复购参考 v0.1。');break;
      default: return false;
    }
    return true;
  }
  function submit(form,event) {
    const name=form?.dataset.v4Form;
    if(!name?.startsWith('set-'))return false;
    event?.preventDefault();
    if(!form.reportValidity())return true;
    const data=new FormData(form), s=store(), read=key=>String(data.get(key)||'').trim();
    if(name==='set-model') {
      const profile=read('profile'); if(!Object.hasOwn(models,profile))return true;
      s.model=profile;if(read('alias'))s.alias[profile]=read('alias');notice('model','已选用 '+(s.alias[profile]||models[profile][0])+'，供新建项目使用。');
    }else if(name==='set-db') {
      if(!read('label'))return true;
      s.dbChecked={label:read('label'),engine:read('engine')};notice('connections','模拟测试已返回，可保存这份已测配置。');
    }else if(name==='set-usage'){
      s.usage=read('kind');s.background=s.usage?read('background'):'';notice('usage',s.usage?'已保存默认讨论对象与背景。':'已清空默认用途，可以继续直接工作。');
    }else if(name==='set-note'){
      if(!read('title')||!read('body'))return true;
      s.notes.unshift({title:read('title'),body:read('body'),source:'人工笔记',status:'草稿',favorite:false});s.noteEditing=false;s.noteFilter='全部资料';s.noteOpen=0;notice('personal','已保存个人草稿。可核对后确认保留。');
    }else return false;
    return true;
  }
  return {render:renderSettings,action,submit};
})();

restoreGoalSession5();
themeToggle.innerHTML = uiIcon('moon');
render();
</script>
