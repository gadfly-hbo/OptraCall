<style>
:root {
  font: 14px/1.58 "Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; color-scheme:light;
  --canvas:#f6f5fa; --rail:#f0eef6; --surface:#fff; --subtle:#f9f7fc; --ink:#242037; --muted:#665f76;
  --line:#e3dfeb; --soft:#eeebfb; --accent:#6550c9; --accent-deep:#503ab1; --on-accent:#fff;
  --green:#276345; --green-bg:#e7f4eb; --amber:#724914; --amber-bg:#fff0d9;
  --shadow:0 1px 2px #291e4010,0 8px 25px #291e4006; --radius:13px;
}
:root[data-theme="dark"] {
  color-scheme:dark; --canvas:#17161e; --rail:#131219; --surface:#201f2a; --subtle:#292638; --ink:#f3effb;
  --muted:#beb4cd; --line:#3d364e; --soft:#372d50; --accent:#b7a7ff; --accent-deep:#d4c6ff; --on-accent:#251744;
  --green:#b2e9c4; --green-bg:#20392d; --amber:#ffda94; --amber-bg:#3d3022; --shadow:0 9px 24px #0003;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; color:var(--ink); background:var(--canvas); min-width:300px; }
h1,h2,h3,p,ol,ul,dl,dd { margin:0; }
h1,h2,h3 { line-height:1.35; }
a { color:inherit; text-decoration:none; }
button,input,textarea,select { font:inherit; color:inherit; }
button { cursor:pointer; }
:disabled { cursor:not-allowed; opacity:.55; }
:where(a,button,input,textarea,select,summary):focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
h1[tabindex]:focus { outline:none; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
.skip { position:fixed; top:7px; left:7px; z-index:9; transform:translateY(-150%); background:var(--surface); padding:8px 13px; }
.skip:focus { transform:none; }
.mark { width:43px; height:43px; display:inline-flex; position:relative; color:var(--accent); flex:none; }
.mark > span { position:absolute; inset:3px; border:3px solid currentColor; border-radius:50%; }
.mark > i { position:absolute; width:16px; height:16px; right:0; bottom:0; border:3px solid currentColor; border-radius:50%; background:var(--mark-bg,var(--canvas)); }
.mark.small { width:29px; height:29px; }
.mark.small > span { border-width:2px; }
.mark.small > i { width:11px; height:11px; border-width:2px; }
.rail { --mark-bg:var(--rail); position:fixed; inset:0 auto 0 0; width:232px; padding:22px 15px 16px; background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:auto; z-index:2; }
.brand { display:flex; align-items:center; gap:10px; padding:1px 5px; width:fit-content; letter-spacing:-.7px; font-size:20px; font-weight:760; }
.workspace { display:flex; gap:11px; align-items:center; padding:11px; margin:25px 0 23px; border-radius:11px; border:1px solid var(--line); background:var(--surface); }
.workspace-avatar { display:grid; place-items:center; width:35px; height:35px; border-radius:8px; color:var(--accent-deep); background:var(--soft); font-weight:750; }
.workspace strong { display:block; font-size:13px; }
.workspace small, .nav-heading { color:var(--muted); font-size:11px; }
.nav-heading { padding:0 9px 6px; font-weight:700; }
.nav-group + .nav-group { margin-top:22px; }
.nav-group ul { list-style:none; padding:0; display:grid; gap:3px; }
.nav-link { display:flex; align-items:center; min-height:38px; gap:8px; padding:0 10px; border-radius:7px; font-size:13px; color:var(--muted); }
.nav-icon { display:inline-grid; place-items:center; width:20px; height:20px; color:var(--accent-deep); font:17px/1 system-ui,sans-serif; }
.nav-link:hover, .nav-link[aria-current="page"] { color:var(--accent-deep); background:var(--soft); }
.nav-link[aria-current="page"] { box-shadow:inset 3px 0 var(--accent); font-weight:700; }
.rail-footer { margin-top:auto; padding-top:18px; }
.rail-footer p { border-top:1px solid var(--line); color:var(--muted); padding:12px 5px 0; font-size:11px; }
.shell { margin-inline-start:232px; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:8px 29px; background:var(--surface); border-bottom:1px solid var(--line); }
.crumbs { display:flex; align-items:center; gap:8px; color:var(--muted); white-space:nowrap; min-width:0; }
.crumbs a { font-size:12px; }

.crumbs a:hover, .text-link:hover { text-decoration:underline; }
.preview-controls { display:flex; align-items:center; gap:9px; margin-left:auto; }
.preview-controls label { font-size:11px; color:var(--muted); white-space:nowrap; }
.scene-select { min-height:33px; max-width:153px; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--surface); font-size:12px; }
.icon-button { display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 5px; border:1px solid var(--line); border-radius:7px; color:var(--accent-deep); background:var(--surface); font:18px/1 system-ui,sans-serif; }
.icon-button:hover { background:var(--soft); }
#nav-toggle { display:none; }
#view { max-width:1440px; margin:0 auto; padding:25px 30px 32px; }
.page-title { display:flex; align-items:end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 18px; }
.page-title h1 { font-size:clamp(26px,3.2vw,38px); font-weight:760; letter-spacing:-.055em; }
.page-title p { color:var(--muted); margin-top:4px; }
.eyebrow { font-size:11px; font-weight:720; color:var(--accent-deep); }
.muted, .caption { color:var(--muted); }
.caption { font-size:12px; }
.button { min-height:38px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--surface); cursor:pointer; font-size:13px; font-weight:700; text-align:center; }
.button:hover { border-color:var(--accent); color:var(--accent-deep); }
.button.primary, .button.is-primary { color:var(--on-accent); border-color:transparent; background:var(--accent); }
.button.primary:hover { background:var(--accent-deep); }
.button.plain { color:var(--accent-deep); background:transparent; border-color:transparent; }
.button.plain:hover { background:var(--soft); }
.pill { width:fit-content; display:inline-flex; align-items:center; gap:5px; padding:3px 7px; border-radius:20px; font-size:11px; font-weight:700; line-height:1.55; background:var(--soft); color:var(--accent-deep); white-space:nowrap; }
.pill.good { background:var(--green-bg); color:var(--green); }
.pill.warn { background:var(--amber-bg); color:var(--amber); }
.pill.neutral { background:var(--subtle); color:var(--muted); }
.card { min-width:0; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
.card-body { padding:16px; }
.card-body > :is(h2,h3) { margin-bottom:7px; }
.card-body p + p { margin-top:6px; }
.section-head { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:11px 14px; border-bottom:1px solid var(--line); }
.section-head h2 { font-size:16px; }
.grid, .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
.field { display:grid; gap:5px; text-align:start; }
.field label, .field > span { font-weight:650; font-size:12px; }
.field :is(input,textarea,select) { width:100%; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:7px; min-height:38px; }
.form-grid textarea { resize:vertical; }
.field.full { grid-column:1/-1; }
.toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-block:8px; }
.callout { padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--subtle); color:var(--muted); }
.list-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; }
.list-row + .list-row { border-top:1px solid var(--line); }
.text-link { color:var(--accent-deep); font-size:12px; font-weight:700; }
.home-date { color:var(--muted); font-size:12px; white-space:nowrap; }
.case-hero { isolation:isolate; min-height:240px; position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) minmax(245px,.58fr); align-items:center; gap:20px; padding:25px 27px; border-radius:17px; color:#fff; background:linear-gradient(118deg,#251941 5%,#37245e 61%,#4a337f 100%); }
.case-hero::before { content:""; position:absolute; z-index:-1; width:620px; aspect-ratio:1; top:-190px; right:-175px; border-radius:50%; border:1px solid #efe4ff45; box-shadow:inset 0 0 0 35px #cbb7fd14,inset 0 0 0 36px #efe4ff3b,inset 0 0 0 85px #cbb7fd0a,inset 0 0 0 86px #efe4ff27; pointer-events:none; }
.case-hero .kicker { display:flex; align-items:center; gap:8px; color:#e8dcff; font-size:12px; font-weight:700; }
.kicker::before { content:""; background:#c8b3ff; box-shadow:0 0 0 4px #d5bdff28; width:6px; height:6px; border-radius:50%; }
.case-hero h2 { margin:8px 0; font-size:clamp(25px,3.15vw,40px); letter-spacing:-.05em; overflow-wrap:anywhere; }
.case-hero .hero-summary { color:#e9ddf8; font-size:13px; overflow-wrap:anywhere; }
.case-hero .toolbar { margin:19px 0 0; }
.case-hero .button { background:#f2eaff; color:#342052; border-color:transparent; }
.case-hero .button:hover { background:#fff; }
.case-hero .button:focus-visible { outline-color:#fff; }
.case-hero .button.secondary { background:#fff0; color:#f7efff; border-color:#e2d3ff72; }
.case-hero .button.secondary:hover { background:#fff2; }
.hero-detail { display:grid; gap:10px; min-width:0; padding:13px 14px; border-radius:11px; background:#fff; box-shadow:0 12px 25px #21113460; color:#302642; }
.hero-detail h3 { font-size:13px; }
.case-brief { display:grid; gap:6px; }
.case-brief > div { display:grid; grid-template-columns:23px minmax(0,1fr); gap:6px; align-items:start; }
.case-brief dt { display:grid; place-items:center; width:21px; height:21px; border-radius:5px; color:#533bb9; background:#efeafd; font-size:12px; font-weight:800; }
.case-brief dd { font-size:12px; color:#514666; overflow-wrap:anywhere; }
.hero-detail .note { font-size:12px; color:#635678; border-top:1px solid #ece6f4; padding-top:8px; }
.hero-detail a { color:#503ab1; }
.home-grid { margin-top:16px; grid-template-columns:1.13fr 1fr; gap:15px; }
.home-list { list-style:none; padding:1px 14px; }
.home-list li + li { border-top:1px solid var(--line); }
.queue-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:9px; padding:9px 0; min-height:63px; }
.queue-row:hover strong { color:var(--accent-deep); }
.queue-row strong { display:block; font-size:13px; }
.queue-row small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
.queue-arrow { color:var(--accent-deep); }
.home-shortcuts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; padding:9px 12px 12px; }
.shortcut { min-width:0; display:grid; grid-template-columns:24px 1fr; align-items:center; gap:6px; padding:7px 8px; border-radius:8px; background:var(--subtle); border:1px solid var(--line); }
.shortcut strong { display:block; font-size:12px; }
.shortcut small { display:block; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
.shortcut:hover, .foundation-tile:hover { border-color:var(--accent); }
.quick-current { padding:8px 12px 1px; }
.quick-current .list-row { padding:0; }
.quick-current strong { font-size:13px; }
.foundation-home { margin-top:19px; }
.foundation-heading { display:flex; justify-content:space-between; align-items:end; gap:9px; margin-bottom:8px; }
.foundation-heading h2 { font-size:16px; }
.foundation-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
.foundation-tile { display:grid; gap:4px; padding:9px 10px; background:var(--surface); border:1px solid var(--line); border-radius:9px; min-width:0; }
.foundation-tile strong { font-size:12px; }
.foundation-tile p { font-size:11px; color:var(--muted); }
.foundation-label { display:flex; justify-content:space-between; gap:4px; align-items:center; }
.foundation-page .card + .card { margin-top:14px; }
.foundation-page .card-body .toolbar { margin-bottom:0; }
.foundation-page .card-body .callout { margin-top:8px; }
.foundation-page .card-body .list-row > strong { font-size:13px; }
.foundation-page .record-list { display:grid; gap:8px; margin:10px 0; padding-left:20px; }
.notice { margin:0 0 12px; padding:9px 12px; border-radius:7px; background:var(--soft); color:var(--accent-deep); font-size:13px; }
#navigation { display:none; }
@media(max-width:1120px) {
  .rail { width:198px; } .shell { margin-inline-start:198px; }
  #view, .topbar { padding-inline:21px; }
}
@media(max-width:810px) {
  .rail { display:none; } .shell { margin-inline-start:0; }
  #nav-toggle { display:inline-grid; }
  .topbar { padding-inline:13px; }
  #view { padding-inline:14px; }
  #navigation[open] { display:flex; flex-direction:column; position:fixed; inset:0 auto 0 0; margin:0; width:min(290px,86vw); height:100dvh; max-height:none; color:var(--ink); background:var(--rail); border:0; padding:16px; }
  #navigation::backdrop { background:#21193483; }
  .mobile-nav-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:17px; }
}
@media(max-width:620px) {
  .preview-controls label, .home-date, .crumbs a, .crumbs > span { display:none; }
  .preview-controls { gap:5px; }
  .scene-select { max-width:130px; }
  #view { padding-top:17px; }
  .case-hero, .home-grid, .grid { grid-template-columns:minmax(0,1fr); }
  .case-hero { padding:16px; gap:13px; }
  .case-hero .toolbar { margin-top:12px; }
  .foundation-tiles { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media(max-width:440px) { .form-grid { grid-template-columns:minmax(0,1fr); } }
@media(prefers-reduced-motion:no-preference) { .button,.nav-link,.shortcut { transition:background-color .15s,color .15s,border-color .15s; } }
.pv-view { display: grid; gap: 16px; min-width: 0; }
.pv-view :is(h1,h2,h3,p) { margin: 0; }
.pv-view h2 { font-size: 17px; line-height: 1.35; }
.pv-view h3 { font-size: 15px; }
.pv-view .pv-header { margin: 0; align-items: end; }
.pv-header p:not(.eyebrow) { margin-top: 6px; color: var(--muted,#6d637e); }
.pv-back { display: inline-flex; justify-self: start; align-items: center; width: fit-content; color: var(--accent,#6550c9); font-size: 13px; font-weight: 650; }
.pv-back:hover { text-decoration: underline; }
.pv-map-graph {

  justify-content: center;

.pv-object-row, .pv-project-task { align-items: center; border-top: 1px solid var(--line,#e4def0); color: inherit; }

.pv-folder, .pv-task-icon, .pv-avatar {

  border-radius: 7px;
  background: color-mix(in srgb,var(--accent,#6550c9) 12%,var(--surface,#fff));

.pv-folder { width: 34px; height: 34px; }

.pv-green { background: #e8f5ec !important; color: #285f42 !important; }

.pv-steps button:hover { background: color-mix(in srgb,var(--accent,#6550c9) 8%,var(--surface,#fff)); color: var(--accent,#6550c9); }
.pv-steps b { display: inline-grid; width: 20px; height: 20px; place-items: center; border: 1px solid var(--line,#e4def0); border-radius: 50%; font-size: 11px; font-weight: 650; }
.pv-steps button[aria-current] b { color: #fff; border-color: var(--accent,#6550c9); background: var(--accent,#6550c9); }
.pv-task-layout { display: grid; gap: 14px; align-items: start; min-width: 0; }
.pv-task-layout.is-open { grid-template-columns: minmax(0,1fr) minmax(245px,.5fr); }
.pv-chat { display: grid; align-content: start; gap: 10px; min-width: 0; }
.pv-chat > h2 { margin: 0 0 1px; }
.pv-message { display: grid; gap: 5px; overflow-wrap: anywhere; }
.pv-message-user { background: color-mix(in srgb,var(--accent,#6550c9) 3%,var(--surface,#fff)); }
.pv-message ul { margin: 0; padding-inline-start: 21px; }
.pv-message .button { justify-self: start; padding-inline: 0; }
.pv-identity { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.pv-avatar { width: 24px; height: 24px; font-size: 11px; font-weight: 650; }
.pv-identity :is(small,time), .pv-composer small, .pv-meta { color: var(--muted,#6d637e); font-size: 12px; }
.pv-identity time { margin-inline-start: auto; }
.pv-composer { display: grid; gap: 6px; }
.pv-composer label { font-size: 12px; font-weight: 650; }
.pv-composer textarea { width: 100%; resize: vertical; border: 1px solid var(--line,#e4def0); border-radius: 6px; padding: 8px; font: inherit; color: inherit; background: var(--surface,#fff); }
.pv-task-panel { position: sticky; top: 12px; overflow-wrap: anywhere; display: grid; gap: 8px; }
.pv-task-panel .pv-list-header { padding-bottom: 5px; border-bottom: 1px solid var(--line,#e4def0); }
.pv-task-panel .button { padding-inline: 5px; }
.pv-task-panel details, .pv-subtle { border: 1px solid var(--line,#e4def0); border-radius: 7px; padding: 7px 9px; color: var(--muted,#6d637e); }
.pv-task-panel details summary { cursor: pointer; color: var(--accent,#6550c9); font-weight: 650; }
.pv-task-panel details p { margin-top: 6px; }
.pv-file-list { display: grid; gap: 7px; padding: 0; margin: 0; list-style: none; }
.pv-file-list li { display: flex; justify-content: space-between; gap: 6px; }
.pv-file-list span { color: var(--muted,#6d637e); }
@media(max-width: 915px) {
  .pv-task-layout.is-open { grid-template-columns: minmax(0,1fr); }
  .pv-task-panel { position: static; grid-row: 1; }
}
@media(max-width: 640px) {
  .pv-map-graph { flex-direction: column; padding: 19px; min-height: 209px; }
  .pv-map-node { min-width: 0; width: min(100%,320px); }
  .pv-map-line { width: 1px; height: 18px; min-width: 1px; }
  .pv-map-gap { padding: 8px 0 0; }
  .pv-project-task { grid-template-columns: 32px 1fr auto; gap: 4px 7px; }
  .pv-project-task > span:nth-child(3) { grid-column: 2; grid-row: 2; }
  .pv-project-task b { grid-column: 3; grid-row: 1 / span 2; }
  .pv-steps button { font-size: 11px; gap: 2px; }
  .pv-steps b { width: 15px; height: 15px; font-size: 9px; }
}
.pv-map-card { overflow:hidden; }
.pv-map-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding:11px 16px; font-size:12px; }
.pv-map-bar > span { display:flex; align-items:center; gap:7px; font-weight:650; }
.pv-map-bar i { width:7px; height:7px; border-radius:50%; background:var(--accent); }
.pv-map-bar small,.pv-map-task-stack > span { font-size:11px; color:var(--muted); }
.pv-map-graph { padding:25px clamp(10px,2vw,30px); }
.pv-map-line { flex:1 1 32px; max-width:70px; min-width:10px; position:relative; }
.pv-map-line::after { content:""; position:absolute; width:5px; height:5px; right:1px; top:-2px; border-top:1px solid var(--accent); border-right:1px solid var(--accent); transform:rotate(45deg); }
.pv-map-node { flex:1 1 140px; min-width:0; border-radius:7px; overflow-wrap:anywhere; }
.pv-map-node-origin { border-left:3px solid var(--accent); }
.pv-map-task-stack { display:grid; grid-template-columns:repeat(2,minmax(45px,1fr)); gap:5px; flex:1 1 110px; max-width:180px; }
.pv-map-task-stack > span { grid-column:1/-1; }
.pv-map-task-stack a { display:flex; align-items:center; justify-content:space-between; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:4px; font-size:12px; padding:5px 8px; }
.pv-map-task-stack a span { color:var(--accent-deep); font-size:10px; }
.pv-map-task-stack a:hover { background:var(--soft); }
.pv-object-row > a > span { margin-top:3px; font-size:12px; color:var(--muted); }
.pv-object-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.pv-object-actions button { border:1px solid var(--line); border-radius:5px; padding:5px 7px; color:var(--muted); background:var(--surface); font-size:11px; }
.pv-object-actions button[aria-pressed=true] { color:var(--accent-deep); background:var(--soft); }
.pv-project-card { padding:19px; gap:10px; }
.pv-project-card .pv-folder { position:relative; width:36px; height:34px; }
.pv-project-card .pv-folder::after { content:""; width:18px; height:12px; border:1.6px solid currentColor; border-radius:2px; }
.pv-project-card .pv-folder::before { content:""; position:absolute; left:8px; top:7px; width:8px; height:4px; border:1.6px solid currentColor; border-bottom:0; border-radius:2px 2px 0 0; }
.pv-task-list { padding:0; overflow:hidden; }
.pv-task-list .pv-list-header { padding:15px 18px; }
.pv-task-list .pv-project-task { padding:13px 18px; gap:12px; }
.pv-project-task:hover { background:var(--subtle); }
.pv-project-task strong i { font-size:10px; font-style:normal; font-weight:550; color:var(--muted); margin-left:4px; }
.pv-task-icon { font-family:ui-monospace,monospace; font-size:12px; border-radius:5px; color:var(--accent-deep); background:var(--soft); }
@media(max-width:640px) {
  .pv-map-node { flex:none; width:min(100%,270px); padding:11px 14px; }
  .pv-map-line { flex:none; width:1px; height:17px; min-width:1px; }
  .pv-map-line::after { top:auto; bottom:1px; right:-2px; transform:rotate(135deg); }
  .pv-map-task-stack { flex:none; width:min(100%,270px); max-width:none; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .pv-task-list .pv-project-task { padding:11px 12px; gap:3px 8px; }
}

:root {
 --canvas:#fbfaf7; --surface:#fffefa; --subtle:#f4f2ee; --line:#dcd9d6; --ink:#211e29; --muted:#686271;
 --soft:#eee8fa; --accent:#6550c9; --rail:#191621; --rail-ink:#fbf8ff; --rail-muted:#c1bacf;
 --rail-line:#3c3549; --rail-select:#383044; --radius:9px; --shadow:none;
}
:root[data-theme="dark"] {
 --canvas:#17151d; --surface:#211e29; --subtle:#2a2632; --line:#443e4d;
 --soft:#352b4a; --ink:#f7f3fa; --muted:#c3bacc; --accent:#b7a7ff; --rail:#100f15;
}
html {font-size:16px} body {font-size:1rem; text-rendering:optimizeLegibility}
.rail,#navigation {--mark-bg:var(--rail);background:var(--rail);color:var(--rail-ink);border-color:var(--rail-line)}
.rail {width:240px;padding:24px 15px 16px}.shell {margin-inline-start:240px}
.rail .brand {color:var(--rail-ink);padding-inline:7px;font-size:22px;letter-spacing:-.07em}
.rail .brand .mark {color:#c6b1ff}
.rail .workspace {border-color:var(--rail-line);background:#ffffff07;color:var(--rail-ink);padding:10px 12px;margin:24px 0 13px;border-radius:8px}
.workspace-avatar {border-radius:8px;background:#d7cbff;color:#402a6d}
.workspace small,.rail .nav-heading,#navigation .nav-heading {color:var(--rail-muted)}
.rail .nav-heading,#navigation .nav-heading {font-size:12px;font-weight:550;letter-spacing:.07em}
.rail .nav-link,#navigation .nav-link {color:var(--rail-muted);font-size:14px;min-height:40px;gap:11px}
.rail .nav-icon,#navigation .nav-icon {color:inherit}
.rail .nav-link:hover,#navigation .nav-link:hover {background:#ffffff0d;color:white}
.rail .nav-link[aria-current],#navigation .nav-link[aria-current] {background:var(--rail-select);color:#dfd0ff;box-shadow:inset 2px 0 #b79bf1}
.rail .nav-group + .nav-group {margin-top:18px;border-top:1px solid var(--rail-line);padding-top:16px}
.rail-cta {display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 12px;color:#291841;background:#d8c7fb;font-weight:720;border-radius:7px;min-height:41px;margin-bottom:22px}
.rail-cta:hover {background:#e7dbff}
.rail-footer p {border-color:var(--rail-line);color:var(--rail-muted);font-size:12px}
.rail-footer .session-mark {display:inline-block;width:7px;height:7px;border-radius:50%;background:#b79bf1;margin-right:8px}
.topbar {background:var(--canvas);min-height:59px;padding:8px clamp(16px,2.6vw,40px);gap:10px}
.crumbs,.crumbs a,.crumbs strong {font-size:13px}
#view {padding:22px clamp(16px,2.65vw,42px) 38px;max-width:1580px}
.preview-controls {gap:12px}.preview-controls label {font-size:12px}
#open-search {display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:3px 8px;color:var(--muted);border:1px solid transparent;border-radius:5px;background:transparent;font-size:13px}
#open-search:hover {border-color:var(--line);color:var(--ink)}
kbd {font:12px/1.4 system-ui,sans-serif;min-width:18px;text-align:center;padding:1px 4px;border:1px solid var(--line);border-radius:3px}
.scene-select {font-size:13px}.icon-button {color:var(--ink);background:transparent}
#navigation .icon-button {color:var(--rail-ink)}
.nav-icon svg,.command-icon svg,#open-search svg,.icon-button svg,.rail-cta svg {display:block;width:19px;height:19px;flex:none}
#command {position:fixed;inset:min(13vh,100px) auto auto 50%;transform:translateX(-50%);margin:0;width:min(600px,calc(100vw - 24px));padding:0;max-height:min(75dvh,610px);border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 24px 85px #11071f55}
#command::backdrop {background:#18121f80}
#command[open] {display:flex;flex-direction:column}
.command-top {display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.command-top label {flex:1;min-width:0}.command-top input {border:0;min-height:35px;background:none;width:100%;font-size:16px;color:var(--ink)}
.command-icon {color:var(--accent-deep)}.command-results {padding:7px;overflow:auto}
.command-results h3 {font-size:12px;color:var(--muted);padding:6px 8px;font-weight:650}
.command-results a {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;border-radius:5px;font-size:14px}
.command-results a:hover,.command-results a:focus {background:var(--soft);color:var(--accent-deep)}
.command-results small {font-size:12px;color:var(--muted)}
.command-empty {padding:18px;color:var(--muted);font-size:14px}
.foundation-page {max-width:1040px}.foundation-page .card {box-shadow:none}
.foundation-page .card-body {padding:20px}.foundation-page .card-body h2 {font-size:22px;letter-spacing:-.04em}
.foundation-page > .page-title {margin-bottom:26px}
.foundation-page .eyebrow {font-size:13px}
@media(max-width:1200px) and (min-width:811px) {.rail{width:210px}.shell{margin-inline-start:210px}}
@media(max-width:900px) {#open-search .search-label,#open-search kbd {display:none}.preview-controls{gap:7px}}
@media(max-width:810px) {.shell{margin-inline-start:0}#view{padding-inline:15px}.rail{display:none}.topbar{padding-inline:12px}#navigation {background:var(--rail);color:var(--rail-ink)}#navigation .rail-cta{margin:8px 0 16px}}
@media(max-width:430px) {.preview-controls{gap:4px}.scene-select{max-width:116px}.topbar{gap:5px}.crumbs strong{font-size:12px}#open-search{padding:4px}}

/* Decision desk · primary workspace */
.desk-home {
  --desk-paper: #fbfaf7;
  --desk-type: #282531;
  --desk-secondary: #625d69;
  --desk-rule: #d7d3d7;
  --desk-purple: #6042b7;
  --desk-panel: #fffefa;
  --desk-quiet: #eeeaf4;
  --desk-lilac: #d9caff;
  color: var(--desk-type);
  --desk-pad: clamp(22px, 2.7vw, 42px);
}
:root[data-theme="dark"] .desk-home {
  --desk-paper:#1b191e;
  --desk-type:#f2eef4;
  --desk-secondary:#bdb6c5;
  --desk-rule:#403b45;
  --desk-purple:#c7b3ff;
  --desk-panel:#242127;
  --desk-quiet:#332d3d;
}
.dh-head, .dh-section-head, .dh-case-top, .dh-case-actions, .dh-legend > div, .dh-legend dt, .dh-maps > a {
  display:flex;
  align-items:center;
}
.dh-head {
  align-items:end; justify-content:space-between; gap:20px; margin:0 0 clamp(22px,2vw,31px);
}
.dh-date { font-size:.875rem; color:var(--desk-secondary); font-weight:620; font-variant-numeric:tabular-nums; }
.dh-head h1 {
  max-width:100%; margin:5px 0 5px; font-size:clamp(30px,3.25vw,47px); letter-spacing:-.055em; line-height:1.22;
  font-weight:770; overflow-wrap:anywhere;
}
.dh-intro { color:var(--desk-secondary); font-size:1rem; }
.dh-intro > span { padding-inline:3px; color:var(--desk-rule); }
.desk-home .dh-new {
  color:var(--desk-type); background:var(--desk-panel); border:1px solid var(--desk-rule);
  border-radius:5px; min-height:38px; padding-inline:13px; flex:none; font-size:.95rem; white-space:nowrap;
}
.desk-home .dh-new:hover { color:var(--desk-purple); border-color:var(--desk-purple); }
.dh-new b { font-size:17px; font-weight:500; }
.dh-hero {
  display:grid; grid-template-columns:minmax(0,2.35fr) minmax(228px,1fr); min-height:286px;
  border-radius:14px; overflow:hidden; border:1px solid #2e2637; background:#211a2e;
}
.dh-case {
  position:relative; isolation:isolate; min-width:0; padding:24px var(--desk-pad) 25px;
  display:flex; flex-direction:column; justify-content:center; overflow:hidden;
  background:linear-gradient(112deg,#201a2e 7%,#30223f 68%,#3b2c50);
  color:#fff;
}
.dh-case::after {
  content:""; z-index:-1; pointer-events:none; position:absolute; right:0; top:0; bottom:0; width:56%;
  background-image:linear-gradient(transparent calc(100% - 1px),#c2ace314 1px),linear-gradient(90deg,transparent calc(100% - 1px),#c2ace314 1px);
  background-size:29px 29px;
  mask-image:linear-gradient(103deg,transparent 10%,black 92%);
}
.dh-case-top { gap:12px; margin-bottom:14px; color:#d8cde2; font-size:.875rem; }
.dh-case-tag {
  display:inline-flex; align-items:center; gap:8px; padding:3px 9px; border-radius:4px; color:#e8dafd;
  background:#49395f; font-weight:700; letter-spacing:.01em;
}
.dh-case-tag i { width:6px; height:6px; background:#ceb4fa; border-radius:50%; }
.dh-case h2 { font-weight:620; font-size:clamp(27px,2.65vw,41px); letter-spacing:-.055em; line-height:1.31; margin:0 0 12px; overflow-wrap:anywhere; }
.dh-gs { display:grid; gap:4px; }
.dh-gs p { display:flex; align-items:baseline; gap:8px; color:#e8e0ef; line-height:1.6; font-size:1rem; overflow-wrap:anywhere; }
.dh-gs b {
  flex:none; border:1px solid #b29bcc7d; border-radius:3px; width:18px; text-align:center;
  line-height:17px; font:700 12px/17px "IBM Plex Mono",monospace; color:#dac5f4;
}
.dh-case-actions { margin-top:23px; gap:17px; flex-wrap:wrap; }
.dh-case-actions .button.primary {
  color:#241831; background:#dfccff; border:1px solid #e4d5fd; min-height:41px; padding-inline:16px;
  border-radius:5px; font-size:1rem; font-weight:700;
}
.dh-case-actions .button.primary:hover { background:#f2e9ff; color:#23132f; }
.dh-case-project { font-size:.93rem; color:#dfd5e8; border-bottom:1px solid #ac9ab8a6; }
.dh-case-project:hover { color:white; border-bottom-color:white; }
.dh-case a:focus-visible { outline-color:white; }
.dh-proof {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:16px 20px; color:var(--desk-type); background:var(--desk-panel);
}
.dh-proof h3 { align-self:flex-start; font-size:.95rem; font-weight:680; }
.dh-chart {
  --ring-main:#7957bd; --ring-other:#c7b5e8;
  position:relative; display:grid; padding:8px; border-radius:50%; flex:none;
  width:104px; height:104px; background:conic-gradient(from 0deg,var(--ring-main) 0 var(--portion),var(--ring-other) var(--portion) 100%);
}
.dh-chart.dh-chart-facts { --ring-other:var(--desk-rule); }
.dh-chart > div { border-radius:50%; background:var(--desk-panel); display:flex; align-items:center; justify-content:center; flex-direction:column; }
.dh-chart strong { font:650 2.25rem/1.1 "Inter",system-ui,sans-serif; letter-spacing:-.07em; }
.dh-chart em { font-size:.8rem; font-style:normal; letter-spacing:0; margin-left:2px; color:var(--desk-secondary); }
.dh-chart small { font-size:.86rem; color:var(--desk-secondary); }
.dh-legend, .dh-checklist { display:grid; gap:4px; width:min(100%,218px); padding:0; margin:0; }
.dh-legend > div { justify-content:space-between; gap:6px; font-size:.93rem; }
.dh-legend dt { gap:7px; color:var(--desk-secondary); }
.dh-legend i { width:8px; height:8px; border-radius:2px; background:#7957bd; }
.dh-legend > div:nth-child(2) i { background:#c7b5e8; }
.dh-legend dd { font-weight:650; font-variant-numeric:tabular-nums; }
.dh-source { font-size:.84rem; color:var(--desk-purple); text-decoration:underline; text-underline-offset:3px; }
.dh-checklist { list-style:none; font-size:.93rem; }
.dh-checklist li { display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:5px; }
.dh-checklist small { color:var(--desk-secondary); }
.dh-checklist .is-complete { color:var(--desk-purple); font-weight:700; }
.dh-sections { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:clamp(20px,2.7vw,40px); margin-top:clamp(23px,2.4vw,35px); }
.dh-section-head { justify-content:space-between; gap:8px; padding-bottom:9px; border-bottom:1px solid var(--desk-rule); }
.dh-section-head h2 { min-width:0; font-size:1.25rem; font-weight:710; letter-spacing:-.045em; }
.dh-section-head a, .dh-section-head > span { color:var(--desk-secondary); font-size:.87rem; white-space:nowrap; }
.dh-section-head a:hover, .dh-queue-row:hover strong, .dh-events a:hover strong, .dh-maps a:hover strong { color:var(--desk-purple); text-decoration:underline; text-underline-offset:3px; }
.dh-queue-list { list-style:none; padding:0; }
.dh-queue-list li { border-bottom:1px solid var(--desk-rule); }
.dh-queue-row { display:grid; grid-template-columns:58px minmax(0,1fr) max-content; align-items:center; gap:12px; padding:12px 4px; min-height:70px; }
.dh-queue-row:hover { background:var(--desk-panel); }
.dh-queue-topic { min-width:0; }
.dh-queue-topic strong, .dh-events a strong, .dh-maps strong { display:block; font-weight:670; font-size:1.03rem; overflow-wrap:anywhere; }
.dh-queue-topic small, .dh-events small, .dh-maps small { display:block; color:var(--desk-secondary); margin-top:3px; font-size:.86rem; overflow-wrap:anywhere; }
.dh-status { justify-self:start; padding:2px 7px; min-width:51px; border:1px solid transparent; border-radius:4px; text-align:center; font-size:.86rem; font-weight:650; }
.dh-status.attention { background:#f6eaba; color:#6e571c; }
.dh-status.review { background:#eae3f3; color:#5c467a; }
.dh-status.active { background:#d8eee7; color:#245f4c; }
.dh-owner { display:grid; justify-items:end; gap:1px; font-size:.92rem; }
.dh-owner small { color:var(--desk-secondary); font-size:.83rem; }
.dh-events { list-style:none; padding:5px 0 0; }
.dh-events > li { position:relative; display:grid; grid-template-columns:47px minmax(0,1fr); gap:11px; padding:8px 0 6px 14px; }
.dh-events > li::before { content:""; position:absolute; width:7px; height:7px; border:2px solid var(--desk-purple); border-radius:50%; top:17px; left:1px; box-sizing:border-box; background:var(--desk-paper); }
.dh-events > li:not(:last-child)::after { content:""; position:absolute; width:1px; top:26px; left:4px; bottom:-14px; background:var(--desk-rule); }
.dh-event-time { font:550 .84rem/1.9 "IBM Plex Mono",ui-monospace,monospace; color:var(--desk-secondary); font-variant-numeric:tabular-nums; }
.dh-events a { display:block; }
.dh-empty { padding:17px 2px; }
.dh-empty strong { font-size:1rem; }
.dh-empty p { margin:5px 0 8px; font-size:.95rem; color:var(--desk-secondary); }
.dh-maps { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:17px; }
.dh-maps > a { gap:12px; min-width:0; padding:10px 13px; border:1px solid var(--desk-rule); background:var(--desk-panel); border-radius:8px; }
.dh-maps > a:hover { border-color:var(--desk-purple); }

/* Case decision workspace */
.cf-view { --cf-pad:clamp(18px,2.1vw,30px); overflow-wrap:anywhere; }

.cf-decision { display:grid; grid-template-columns:minmax(0,1fr) minmax(168px,.29fr); align-items:start; gap:16px var(--cf-pad); padding:var(--cf-pad); border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line)); border-inline-start:4px solid var(--accent); border-radius:12px; background:linear-gradient(105deg,var(--surface),var(--subtle)); }

.cf-decision-editor > summary::after, .cf-disclosure > summary::after { content:""; width:7px; height:7px; border-right:1.6px solid; border-bottom:1.6px solid; transform:translateY(-2px) rotate(45deg); }

.sheet5-dialog .v4-actions{margin-top:.65rem}.sheet5-editor-body>.sheet5-details{margin-top:.8rem;margin-bottom:.4rem}.sheet5-dialog .sheet5-hint{font-size:.85rem;color:var(--accent-deep)}

.sp-head p,.sp-kicker,.sp-summary,.sp-time small,.sp-wrap td small,.sp-request p,.sp-source p,.sp-save{color:var(--muted)}
.sp-kicker{font-size:.82rem;font-weight:650}.sp-wrap .gv-metrics{margin:0;padding:17px 0}.sp-wrap .gv-metrics p{font-size:.86rem}
.sp-wrap .gv-metrics strong{font-size:clamp(1.55rem,2.7vw,2.6rem)}
.sp-section{margin-top:22px;margin-bottom:10px}.sp-section .button,.sp-picks .button,.sp-source .button,.sp-editor>header .button{font-size:.86rem;min-height:32px}
.sp-picks{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sp-picks .button{padding:3px 8px}.sp-picks .button[aria-pressed=true]{color:var(--accent-deep);border-color:var(--accent);background:var(--soft)}

.sp-sheet table{width:100%;border-collapse:collapse;table-layout:fixed}.sp-sheet th:first-child{width:37%}.sp-sheet table th{font-size:.85rem}.sp-sheet table td{vertical-align:top;font-size:.9rem}
.sp-wrap td small{display:block;font-size:.82rem}.sp-time{display:flex;gap:8px;flex-wrap:wrap}.sp-time>div{flex:1 1 160px;background:var(--subtle);padding:10px 12px;border-radius:6px}.sp-time b,.sp-time strong,.sp-time small{display:block}.sp-time b{font-size:.9rem}.sp-time strong{font-size:1.08rem}.sp-time small{font-size:.82rem}
.sp-strategy,.sp-brief{padding:13px 16px;margin:15px 0;background:var(--soft);border-left:3px solid var(--accent);border-radius:6px}
.sp-strategy p,.sp-brief p,.sp-empty p,.sp-issues{font-size:.91rem;margin-top:6px}
.sp-brief h3{margin:5px 0}.sp-wrap details summary{cursor:pointer;font-weight:650}.sp-brief details,.sp-source{margin-top:11px;font-size:.9rem}.sp-source{padding:8px 0 11px;border-bottom:1px solid var(--line)}
.sp-source p,.sp-request p{margin:8px 0}.sp-wrap summary:hover{color:var(--accent-deep)}
.sp-empty{padding:14px 0;border-block:1px dashed var(--line)}.sp-summary,.sp-issues{padding:9px 0}

.sp-jump{display:none}.sp-wrap [tabindex="-1"]:focus{outline-color:var(--accent)}.sp-summary{margin-top:10px}.sp-wrap .sp-save{color:var(--green)}
@media(max-width:1080px){.sp-columns{grid-template-columns:minmax(220px,.79fr) minmax(0,1.35fr);gap:10px}.sp-columns>.v4-panel{padding:15px}.sp-metrics span{font-size:.88rem}}

@media(max-width:450px){.sp-wrap .gv-metrics{gap:4px}.sp-wrap .gv-metrics>div{padding-inline:5px}.sp-wrap .gv-metrics>div:first-child{padding-left:0}.sp-wrap .gv-metrics small,.sp-wrap .gv-metrics p{font-size:.8rem}.sp-wrap .gv-metrics strong{font-size:1.65rem}.sp-columns .v4-panel{padding:13px}.sp-brief,.sp-strategy{padding:10px 11px}.sp-formal .gv-table{overflow-x:auto}.sp-wrap .button{min-height:35px}.sp-formal .v4-actions,.sp-wrap .v4-actions{gap:5px}}

.pg5-figures>div{padding:0 .85rem;min-width:0}.pg5-figures>div:first-child{padding-left:0}.pg5-figures>div+div{border-left:1px solid var(--line)}
.pg5-figures dt,.pg5-figures small,.pg5-subhead small,.pg5-conclusion small,.pg5-review-foot label,.pg5-aside-detail span{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.pg5-figures dd{font-size:clamp(1.24rem,2.25vw,1.95rem);color:var(--ink);margin:3px 0;line-height:1.3;letter-spacing:-.035em;font-weight:670;font-variant-numeric:tabular-nums}
.pg5-table{overflow:auto}.pg5-table table{width:100%;border-collapse:collapse;text-align:left;font-size:.88rem}.pg5-table td,.pg5-table th{border-bottom:1px solid var(--line);padding:7px}.pg5-table th{color:var(--muted);font-weight:650}

.pg5-follow blockquote,.pg5-review blockquote{margin:.35rem 0 0;font-size:.88rem;overflow-wrap:anywhere;color:var(--muted)}

.pg5-intake{margin-top:1.2rem;border-block:1px solid var(--line);padding:.25rem 0 .75rem}.pg5-subhead,.pg5-row-actions,.pg5-review-foot,.pg5-reports>div{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.pg5-reports>div{padding:.55rem .7rem}.pg5-reports>div+div{border-top:1px solid var(--line)}
.pg5-review-heading{border-top:1px solid var(--line);padding-top:.6rem;margin-top:.7rem}.pg5-review-heading h3,.pg5-review-heading p{margin:.15rem 0}.pg5-review-heading p{font-size:.88rem;color:var(--muted)}
.pg5-conclusion{padding:.7rem .85rem}.pg5-conclusion h4{max-width:100%;overflow-wrap:anywhere}.pg5-row-actions .gv-box{margin:.1rem 0}.pg5-archive{border-top:1px solid var(--line);padding:.7rem 0;overflow-wrap:anywhere}
.pg5-review-foot{margin:1rem 0;padding:1rem 0;border-block:1px solid var(--line);justify-content:flex-start}
.pg5-review-foot form{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.pg5-review-foot label{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pg5-review-foot input{width:8rem;padding:7px;border-radius:5px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
@media(max-width:990px){.pg5-follow{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.pg5-follow .v4-panel,.pg5-review{padding:.8rem}.pg5-result{padding:.2rem .6rem .7rem}.pg5-figures>div{padding:0 .4rem}.pg5-figures dd{font-size:1.22rem}.pg5-figures dt,.pg5-figures small{font-size:.78rem}.pg5-figures dt{min-height:2.4em}.pg5-table td,.pg5-table th{padding:.38rem .22rem}.pg5-review-foot form{align-items:flex-start;flex-direction:column}}

<body>
<a id="skip" class="skip" href="#view">跳到主要内容</a>
<aside class="rail" aria-label="工作区导航">
  <a class="brand" href="#home" aria-label="OptraCall 工作台首页"><span class="mark" aria-hidden="true"><span></span><i></i></span>OptraCall</a>
  <div class="workspace"><span class="workspace-avatar" aria-hidden="true">澄</span><div><strong>澄光零售</strong><small>经营工作区</small></div></div>
  <a href="#create" class="rail-cta"><span aria-hidden="true" data-glyph="plus"></span>新建 Case</a>
  <nav id="desktop-links" aria-label="模块"></nav>
  <footer class="rail-footer"><p><span class="session-mark"></span>本地演示 · 示例数据</p></footer>
</aside>
<div class="shell">
  <header class="topbar">
    <button id="nav-toggle" class="icon-button" type="button" aria-label="打开导航" aria-haspopup="dialog">☰</button>
    <div class="crumbs"><a href="#home">澄光零售</a><span aria-hidden="true">›</span><strong id="breadcrumb">工作台首页</strong></div>
    <div class="preview-controls">
      <button type="button" id="open-search" aria-label="搜索工作区" aria-haspopup="dialog"><span data-glyph="search"></span><span class="search-label">搜索工作区</span><kbd aria-hidden="true">/</kbd></button>
      <label for="scene">场景</label>
      <select id="scene" class="scene-select" aria-label="原型场景">
        <option value="ready">已有基础建设</option>
        <option value="empty">从零开始</option>
      </select>
      <a class="icon-button top-help" href="#help" aria-label="使用指南" title="使用指南"><span data-glyph="help"></span></a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="切换到深色主题">☾</button>
    </div>
  </header>
  <main id="view" aria-label="主要内容"></main>
</div>
<dialog id="navigation" aria-labelledby="nav-title">
  <div class="mobile-nav-head"><h2 id="nav-title">工作区导航</h2><button class="icon-button" id="close-nav" type="button" aria-label="关闭导航">×</button></div>
  <a class="rail-cta" href="#create">新建 Case</a><nav id="mobile-links" aria-label="模块"></nav>
</dialog>
<dialog id="command" aria-labelledby="command-title">
  <header class="command-top"><span class="command-icon" data-glyph="search"></span><label><span class="sr-only" id="command-title">搜索当前工作区</span><input id="query" type="search" placeholder="搜索 Case、项目、任务、基础建设或设置" autocomplete="off"></label><button class="icon-button" type="button" id="close-search" aria-label="关闭搜索">×</button></header>
  <div class="command-results" id="results"></div>
</dialog>
<script>
const caseFlow = (() => {
  const statusLabels = {
    pending: '待推进',
    analyzing: '分析中',
    awaiting_confirmation: '待判断',
    observing: '观察中',
    closed: '已结束'
  };
  const inputExample = {
    title: '验证华东低复购门店的优先干预',
    goal: '找出华东低复购门店的主要原因',
    strategy: '先核对缺货和首购商品结构，再决定是否试点',
    outcome: '确认首批 3 家门店与可核对的缺货记录',
    owner: '区域运营',
    scope: '澄光零售 · 华东'
  };
  const priorityStores = [
    {id:'hongkou', name:'上海虹口店', reason:'核对高频商品缺货与到货记录'},
    {id:'binjiang', name:'杭州滨江店', reason:'核对高频商品缺货与陈列记录'},
    {id:'yuanqu', name:'苏州园区店', reason:'按首购品类重新比较复购差异'}
  ];

  function getCase(id) {
    return state.cases.find(record => record.id === id);
  }

  function recordActivity(title, detail, caseId) {
    if (typeof logActivity === 'function') logActivity(title,detail,link('case',caseId));
  }

  function createDraft(route) {
    if (state.caseCreateDraft?.mode !== state.mode) {
      state.caseCreateDraft = {
        mode: state.mode,
        path: route.id === 'annual' && state.adoptedAnnual ? 'annual' : 'local',
        entry: route.id,
        title: '',
        projectId: state.projects[0]?.id || '',
        candidate: null
      };
    }
    const draft = state.caseCreateDraft;
    if (route.id !== draft.entry) {
      draft.entry = route.id;
      if (route.id === 'annual' && state.adoptedAnnual) draft.path = 'annual';
    }
    return draft;
  }

  function badge(text, tone = '') {
    return '<span class="pill ' + tone + '">' + safe(text) + '</span>';
  }

  function heading(eyebrow, title, description, action = '') {
    return `<header class="page-title"><div><p class="eyebrow">${eyebrow}</p><h1 tabindex="-1">${safe(title)}</h1>
      <p>${safe(description)}</p></div>${action}</header>`;
  }

  function bounceTo(title) {
    requestAnimationFrame(() => document.getElementById(title)?.focus({ preventScroll: true }));
  }

  function feedbackDetail(record) {
    const feedback = record.feedback || (record.id === 'retention'
      ? '已有初步观察。三家低复购门店中，两家与高频商品缺货重合，仍需补查到货记录。'
      : '当前暂无执行反馈。可以携带已有判断和待验证问题回到目标管理。');
    const reviews = record.reviewNotes || [];
    const latest = reviews.length ? `<ol class="cf-notes" aria-label="已记录复盘">${reviews.map(review =>
      `<li><p>${safe(review)}</p></li>`).join('')}</ol>` : '';
    const form = ['closed', '已结束'].includes(record.status) ? '' : `<details class="cf-disclosure">
      <summary>记录一次复盘</summary>
      <form id="case-review-form">
        <input type="hidden" name="recordId" value="${safe(record.id)}">
        <label class="field"><span>复盘记录</span>
          <textarea name="review" rows="3" maxlength="1000" placeholder="记录一条判断、事实或待补依据" required></textarea>
        </label>
        <button class="button secondary" type="submit">保存复盘</button>
      </form></details>`;
    return `<section class="cf-section" aria-labelledby="case-feedback-heading">
      <div class="cf-section-head"><h2 id="case-feedback-heading" tabindex="-1">反馈与复盘</h2><span>${reviews.length} 条复盘</span></div>
      <p class="cf-evidence-summary">${safe(feedback)}</p>
      ${latest}${form}
      <button class="button plain" type="button" data-action="case-review" data-id="${safe(record.id)}">带原依据到目标管理</button>
    </section>`;
  }

  function decisionForm(record) {
    const withStores = record.id === 'retention';
    const scope = withStores ? `<fieldset class="cf-stores field"><legend>本次核查的门店</legend>
      ${priorityStores.map(store => `<label class="cf-store"><input type="checkbox" name="stores" value="${store.id}" checked>
        <span><strong>${store.name}</strong><small>${store.reason}</small></span></label>`).join('')}
      <p id="cf-scope-error" class="cf-error" role="alert" hidden>请选择至少一家门店。</p></fieldset>` : '';
    return `<details class="cf-decision-editor">
      <summary>${withStores ? '核对门店并指定责任人' : '确认行动与责任人'}</summary>
      <form id="case-decision-form">
        <input type="hidden" name="recordId" value="${safe(record.id)}">
        ${scope}
        <div class="form-grid">
          <label class="field"><span>责任人</span><input name="owner" maxlength="100" required placeholder="输入负责本次行动的人" value="${safe(record.owner || '')}"></label>
          <label class="field"><span>计划完成日期</span><input type="date" name="dueDate" required value="${safe(record.dueDate || '2026-11-26')}"></label>
        </div>
        <label class="field"><span>下一步行动</span><textarea name="next" maxlength="400" rows="2" required>${safe(withStores ? '回收所选门店的核查记录，复查首购品类结构。' : record.next || '')}</textarea></label>
        <button class="button primary" type="submit">确认并进入执行</button>
      </form>
    </details>`;
  }

  function decisionSection(record, stage) {
    const saved = record.decision;
    const closed = ['closed','已结束'].includes(record.status);
    const withStores = record.id === 'retention';
    const title = record.next || '安排第一项行动，并明确责任人';
    return `<section class="cf-decision" aria-labelledby="case-today">
      <div class="cf-decision-copy">
        <div class="cf-decision-top">${badge(stage, saved ? 'good' : 'warn')} <span>${saved ? '已确认的下一步' : '当前决策节点'}</span></div>
        <h2 id="case-today" tabindex="-1">${safe(title)}</h2>
        ${withStores ? `<p>${saved ? '已记录首批核查范围，实际执行结果可在下方复盘。' : '已有可比组分析。请核对首批门店、指定责任人，再进入执行。'}</p>` : ''}
        ${closed || saved ? '' : decisionForm(record)}
      </div>
      <dl class="cf-decision-facts">
        <div><dt>责任人</dt><dd>${safe(record.owner || '待指定')}</dd></div>
        <div><dt>计划完成</dt><dd>${safe(record.dueDate || (withStores ? '2026-11-26' : '待明确'))}</dd></div>
        ${withStores ? `<div><dt>${saved ? '已确认门店' : '建议核查'}</dt><dd>${saved ? saved.stores.length : priorityStores.length} 家门店</dd></div>` : ''}
      </dl>
      ${saved ? `<details class="cf-receipt"><summary>查看已确认的决定</summary>
        <p>${safe(saved.owner)} 负责，计划于 ${safe(saved.dueDate)} 完成。</p>
        ${saved.stores?.length ? `<ul>${saved.stores.map(store => `<li>${safe(store.name)} · ${safe(store.reason)}</li>`).join('')}</ul>` : ''}
        <p>${safe(saved.next)}</p></details>` : ''}
    </section>`;
  }

  function detail(route) {
    const record = getCase(route.id || state.activeCaseId);
    if (!record) {
      return heading('Decision Case', '找不到这个 Case', '回到工作台查看当前示例工作区的事项。',
        `<a class="button primary" href="${link('home')}">返回工作台</a>`);
    }
    const project = state.projects.find(item => item.id === record.projectId);
    const stage = statusLabels[record.status] || record.status || '待推进';
    const annual = state.adoptedAnnual;
    const linkedToAnnual = annual && (
      record.goalBinding?.id === annual.id && record.goalBinding?.version === annual.version ||
      !record.goalBinding && record.goal === annual.title && record.strategy === annual.strategy
    );
    const projectHref = project ? link('project', project.id) + '?case=' + encodeURIComponent(record.id) : '';
    const action = project
      ? `<a class="button secondary" href="${projectHref}">打开关联项目</a>`
      : `<a class="button secondary" href="${link('projects')}">打开项目地图</a>`;
    const bindings = record.goalHistory?.length
      ? `<details class="callout"><summary>查看过往关联</summary>${record.goalHistory.map(previous =>
          `<p><strong>${safe(previous.title)}</strong> · v${safe(previous.version)}<br>${safe(previous.strategy)}</p>`
        ).join('')}</details>`
      : '';
    const association = linkedToAnnual
      ? `<p>已关联年度目标 v${safe(annual.version)}。</p>`
      : annual
        ? `<div class="callout"><strong>可关联已采纳年度目标</strong><p>${safe(annual.title)} · v${safe(annual.version)}</p>
          <details><summary>核对关联与版本</summary><p>策略 · ${safe(annual.strategy)}</p>
          <p>保存后，原 Case 的目标与策略会留在关联历史，已保存的报告与复盘记录仍引用当时版本。</p>
          <button class="button secondary" type="button" data-action="case-link-annual" data-id="${safe(record.id)}">确认关联年度目标 v${safe(annual.version)}</button></details></div>`
        : `<p>年度目标采纳后，可回到这里为当前 Case 建立正式关联。</p>`;
    const intro = heading('Decision Case', record.title,
      project ? '关联项目 · ' + project.title : '当前暂无关联项目', action);
    return `<div class="cf-view">${intro}
      ${decisionSection(record,stage)}
      <div class="cf-columns">
        <section class="cf-section" aria-labelledby="case-goal-heading">
          <div class="cf-section-head"><h2 id="case-goal-heading" tabindex="-1">目标、策略与行动</h2>${badge('已采纳', 'good')}</div>
          <dl class="cf-mapping">
            <div><dt><abbr title="目标">G</abbr>目标</dt><dd>${safe(record.goal)}</dd></div>
            <div><dt><abbr title="策略">S</abbr>策略</dt><dd>${safe(record.strategy)}</dd></div>
            <div><dt><abbr title="行动">A</abbr>行动</dt><dd>${project ? `<a href="${projectHref}">${safe(project.title)}</a>` : '暂未关联项目'}</dd></div>
          </dl>
          <div class="cf-binding">${association}${bindings}</div>
        </section>
        ${feedbackDetail(record)}
      </div></div>`;
  }

  function field(label, name, value, placeholder) {
    return `<label class="field"><span>${label}</span><input name="${name}" value="${safe(value || '')}" placeholder="${placeholder}" required maxlength="180"></label>`;
  }

  function snapshot(candidate) {
    return `<dl class="case-goal-snapshot">
      <div><dt>G · 目标</dt><dd>${safe(candidate.goal)}</dd></div>
      <div><dt>S · 策略</dt><dd>${safe(candidate.strategy)}</dd></div>
      <div><dt>可核成果</dt><dd>${safe(candidate.outcome)}</dd></div>
      <div><dt>责任角色</dt><dd>${safe(candidate.owner)}</dd></div>
      <div><dt>归属</dt><dd>${safe(candidate.scope)}</dd></div>
    </dl>`;
  }

  function projectField(draft) {
    const options = state.projects.map(project =>
      `<option value="${safe(project.id)}"${project.id === draft.projectId ? ' selected' : ''}>${safe(project.title)}</option>`
    );
    return `<label class="field"><span>关联项目（可选）</span><select name="projectId"><option value="">稍后关联</option>${options.join('')}</select></label>`;
  }

  function candidateForm(draft) {
    const preset = draft.inputs || {};
    return `<form id="case-candidate-form">
      <div class="toolbar"><h2>为这件事准备 G/S</h2><button class="button plain" type="button" data-action="case-example">填入示例</button></div>
      <div class="form-grid">
        ${field('Case 名称', 'title', draft.title, '例如 验证一项门店经营问题')}
        ${field('G · 目标', 'goal', preset.goal, '这件事要达成什么')}
        ${field('S · 策略', 'strategy', preset.strategy, '打算怎样推进')}
        ${field('可核成果', 'outcome', preset.outcome, '什么结果能作为下一步依据')}
        ${field('责任角色', 'owner', preset.owner, '例如 区域运营')}
        ${field('归属', 'scope', preset.scope, '企业或个人的明确归属')}
        ${projectField(draft)}
      </div>
      <div class="toolbar"><button class="button primary" type="submit">保存目标候选</button></div>
    </form>`;
  }

  function confirmForm(draft) {
    if (!draft.adopted) {
      return `<h2 id="case-candidate-title" tabindex="-1">核对目标候选</h2>
        ${badge('待采纳', 'amber')}${snapshot(draft.candidate)}
        <p>采纳后，这组 G/S 才能用于创建正式 Case。</p>
        <div class="toolbar"><button class="button primary" type="button" data-action="case-adopt">明确采纳此目标</button>
          <button class="button plain" type="button" data-action="case-edit">返回修改</button></div>`;
    }
    return `<h2 id="case-adopted-title" tabindex="-1">创建正式 Case</h2>
      ${badge('已采纳 · 本事项 G/S', 'good')}${snapshot(draft.candidate)}
      <form id="case-create-form"><div class="form-grid">
        ${field('Case 名称', 'title', draft.title, '输入名称')}${projectField(draft)}
        </div><div class="toolbar"><button class="button primary" type="submit">创建 Case</button></div></form>`;
  }

  function annualForm(draft) {
    const goal = state.adoptedAnnual;
    return `<h2>使用已采纳目标与策略</h2>
      ${badge('已采纳 · v' + goal.version, 'good')}
      <div class="list-row"><div><span class="eyebrow">G · 目标</span><p><strong>${safe(goal.title)}</strong></p></div></div>
      <div class="list-row"><div><span class="eyebrow">S · 策略</span><p><strong>${safe(goal.strategy)}</strong></p></div></div>
      <form id="case-create-form"><div class="form-grid">
        ${field('Case 名称', 'title', draft.title, '例如 复购下滑的优先干预')}${projectField(draft)}
        </div><div class="toolbar"><button class="button primary" type="submit">创建 Case</button></div></form>`;
  }

  function create(route) {
    const draft = createDraft(route);
    const hasAnnual = Boolean(state.adoptedAnnual);
    const canUseAnnual = draft.path === 'annual' && hasAnnual;
    const picker = hasAnnual
      ? `<div class="toolbar" aria-label="选择目标来源">
          <button class="button ${canUseAnnual ? 'primary' : 'secondary'}" type="button" aria-pressed="${canUseAnnual}" data-action="case-path" data-id="annual">选择已有 G/S</button>
          <button class="button ${canUseAnnual ? 'secondary' : 'primary'}" type="button" aria-pressed="${!canUseAnnual}" data-action="case-path" data-id="local">就在这里补 G/S</button>
        </div>` : '';
    const intro = heading('Decision Case', '新建 Case', state.adoptedAnnual
      ? '选用已采纳的目标与策略，或就地准备这件事的 G/S。'
      : '直接为眼前这件事准备目标与策略。年度战略和资产建设可稍后进行。');
    const step = canUseAnnual || draft.adopted ? 2 : draft.candidate ? 1 : 0;
    const steps = [
      ['准备目标与策略','明确这件事要达成的目标及行动方向'],
      ['核对并采纳','确认目标、可核成果、责任与归属'],
      ['创建正式 Case','选择项目，开始推进']
    ];
    return `<div class="cf-view cf-create">${intro}
      <div class="cf-create-layout">
        <section class="card" aria-label="创建 Case"><div class="card-body">
          ${picker}
          ${canUseAnnual ? annualForm(draft) : draft.candidate ? confirmForm(draft) : candidateForm(draft)}
        </div></section>
        <aside class="cf-create-aside"><h2>创建进度</h2><ol class="cf-steps">
          ${steps.map(([name,detail],index) => `<li ${index===step ? 'aria-current="step"' : ''} class="${index < step ? 'complete' : ''}">
            <span class="cf-step-mark" aria-hidden="true"></span><div><strong>${name}</strong><p>${detail}</p></div></li>`).join('')}
        </ol><a href="${link('home')}">返回工作台首页</a></aside>
      </div></div>`;
  }

  function collect(form, draft) {
    const values = Object.fromEntries([...new FormData(form)].map(([key, value]) => [key, String(value).trim()]));
    if ('title' in values) draft.title = values.title;
    if ('projectId' in values) draft.projectId = values.projectId;
    return values;
  }

  function valid(values, form) {
    for (const [key, value] of Object.entries(values)) {
      const field = form.elements.namedItem(key);
      if (field?.required && !value) {
        field.value = '';
        field.reportValidity();
        return false;
      }
    }
    return true;
  }

  function submit(form, event) {
    if (form.id === 'case-decision-form') {
      event.preventDefault();
      const values = new FormData(form);
      const record = getCase(values.get('recordId'));
      if (!record || record.decision || ['closed','已结束'].includes(record.status)) return true;
      const choices = values.getAll('stores');
      const selectedStores = priorityStores.filter(store => choices.includes(store.id));
      if (record.id === 'retention' && !selectedStores.length) {
        form.querySelector('#cf-scope-error').hidden = false;
        form.querySelector('[name="stores"]').focus();
        return true;
      }
      const owner = String(values.get('owner') || '').trim();
      const dueDate = String(values.get('dueDate') || '').trim();
      const next = String(values.get('next') || '').trim();
      if (!valid({owner,dueDate,next},form)) return true;
      const decision = {owner,dueDate,next,stores:selectedStores.map(store => ({...store})),recordedAt:new Date().toISOString()};
      Object.assign(record,{owner,dueDate,next,status:'执行中',decision});
      recordActivity('已确认行动与责任人',record.title + ' · ' + owner + ' · ' + next,record.id);
      render();
      bounceTo('case-today');
      return true;
    }
    if (form.id === 'case-review-form') {
      event.preventDefault();
      const record = getCase(form.elements.namedItem('recordId').value);
      const field = form.elements.namedItem('review');
      const review = field.value.trim();
      if (!record || ['closed', '已结束'].includes(record.status)) return true;
      if (!review) {
        field.value = '';
        field.reportValidity();
        return true;
      }
      record.reviewNotes ??= [];
      record.reviewNotes.push(review);
      record.lastReviewedAt = new Date().toISOString();
      recordActivity('已保存 Case 复盘',record.title + ' · ' + review,record.id);
      render();
      bounceTo('case-feedback-heading');
      return true;
    }
    if (!['case-candidate-form', 'case-create-form'].includes(form.id)) return false;
    event.preventDefault();
    const draft = state.caseCreateDraft;
    if (!draft) return true;
    const values = collect(form, draft);
    if (!valid(values, form)) return true;
    if (form.id === 'case-candidate-form') {
      draft.inputs = values;
      draft.candidate = values;
      draft.adopted = false;
      render();
      bounceTo('case-candidate-title');
      return true;
    }
    const annual = draft.path === 'annual' ? state.adoptedAnnual : null;
    const candidate = draft.path === 'local' && draft.adopted ? draft.candidate : null;
    if (!annual && !candidate) return true;
    state.nextCaseId = (state.nextCaseId || 0) + 1;
    const id = 'case-new-' + state.nextCaseId;
    const goalBinding = annual
      ? { ...annual }
      : {
          id: id + '-goal',
          title: candidate.goal,
          strategy: candidate.strategy,
          outcome: candidate.outcome,
          owner: candidate.owner,
          scope: candidate.scope,
          version: 1
        };
    const project = state.projects.find(project => project.id === values.projectId);
    const next = candidate ? candidate.outcome : '进入项目核对现有资料，并确定首项行动。';
    state.cases.unshift({
      id,
      title: values.title,
      goal: goalBinding.title,
      strategy: goalBinding.strategy,
      projectId: project?.id,
      status: '待推进',
      next,
      goalBinding,
      goalHistory: []
    });
    state.activeCaseId = id;
    state.caseCreateDraft = null;
    recordActivity('已创建 Case',values.title,id);
    go('case', id);
    return true;
  }

  function action(action, id, target) {
    const draft = state.caseCreateDraft;
    switch (action) {
      case 'case-example': {
        const form = target.closest('form');
        for (const [key, value] of Object.entries(inputExample)) form.elements.namedItem(key).value = value;
        form.elements.namedItem('title').focus();
        return true;
      }
      case 'case-path': {
        if (!draft || !['local', 'annual'].includes(id)) return true;
        const form = target.closest('.card-body').querySelector('form');
        if (form) {
          const values = collect(form, draft);
          if ('goal' in values) draft.inputs = values;
        }
        draft.path = id;
        render();
        document.querySelector('[data-action="case-path"][aria-pressed="true"]')?.focus();
        return true;
      }
      case 'case-edit':
        if (draft) {
          draft.candidate = null;
          draft.adopted = false;
          render();
          document.querySelector('#case-candidate-form input')?.focus();
        }
        return true;
      case 'case-adopt':
        if (draft?.candidate) {
          draft.adopted = true;
          render();
          bounceTo('case-adopted-title');
        }
        return true;
      case 'case-review': {
        const record = getCase(id);
        if (!record) return true;
        state.goalFeedback = {
          caseId: record.id,
          title: record.title,
          goal: record.goal,
          strategy: record.strategy,
          status: statusLabels[record.status] || record.status,
          note: record.feedback || (record.id === 'retention'
            ? '两家低复购门店与高频商品缺货重合；沿原记录补查到货数据，再核对下一轮目标。'
            : '保留原 Case 的判断、可核成果和待验证前提，供目标回顾时核对。'),
          reviews: [...(record.reviewNotes || [])]
        };
        go('foundation', 'goals');
        return true;
      }
      case 'case-link-annual': {
        const record = getCase(id);
        const annual = state.adoptedAnnual;
        if (!record || !annual || record.goalBinding?.id === annual.id && record.goalBinding?.version === annual.version) return true;
        const previous = record.goalBinding || { title: record.goal, strategy: record.strategy, version: 1 };
        record.goalHistory = [...(record.goalHistory || []), { ...previous }];
        record.goalBinding = { ...annual };
        record.goal = annual.title;
        record.strategy = annual.strategy;
        recordActivity('已关联年度目标',record.title + ' · ' + annual.title + ' v' + annual.version,record.id);
        render();
        bounceTo('case-goal-heading');
        return true;
      }
      default:
        return false;
    }
  }

  return { detail, create, action, submit };
})();

function renderCase(route) { return caseFlow.detail(route); }
function renderCreate(route) { return caseFlow.create(route); }
window.handleCaseAction = (action, id, target) => caseFlow.action(action, id, target);
window.handleCaseSubmit = (form, event) => caseFlow.submit(form, event);

const previewTaskTypes = [
  { id: 'requirement', label: '需求 Requirement', title: '明确复购诊断口径', purpose: '待决问题、范围、判断标准和资料缺口' },
  { id: 'analysis', label: '分析 Analysis', title: '华东会员复购下滑分析', purpose: '对比可比门店，整理依据和备选解释' },
  { id: 'plan', label: '计划 Plan', title: '制定首批门店核查方案', purpose: '负责人、时间、资源和退出条件' },
  { id: 'decision', label: '决策 Decision', title: '确认 3 家优先核查门店', purpose: '比较方案及风险，提交负责人取舍' },
  { id: 'do', label: '执行 Do', title: '追踪门店核查记录', purpose: '记录行动、偏差及实际观察' },
  { id: 'teach', label: '反馈 Teach', title: '复盘第一轮核查结果', purpose: '对照预期、实际和下一步' },
];

function previewProjectFor(id) {
  return state.projects.find(item => item.id === id);
}

function previewAssociatedCases(projectId) {
  return state.cases.filter(item => item.projectId === projectId);
}

function previewTaskId(projectId, type) {
  return projectId === 'east' && type === 'analysis' ? 'retention' : [projectId, type].join('~');
}

function previewTaskFor(id) {
  const [projectId, type] = id?.includes('~') ? id.split('~') : ['east', 'analysis'];
  const project = previewProjectFor(projectId);
  const taskType = previewTaskTypes.find(item => item.id === type);
  if (!project || !taskType || (id !== 'retention' && id !== previewTaskId(projectId, type))) return null;
  const title = projectId === 'east' ? taskType.title : project.title + ' · ' + taskType.label.split(' ')[0];
  return { id, title, project, type: taskType, hasReport: state.mode === 'ready' && id === 'retention' };
}

function previewContextLink(page, id, context) {
  const path = link(page, id);
  return context ? path + '?case=' + encodeURIComponent(context) : path;
}

function previewProjectBack(page, id, text, context) {
  return '<a class="pv-back" href="' + safe(previewContextLink(page, id, context)) + '"><span aria-hidden="true">←</span> ' + safe(text) + '</a>';
}

function renderStars() {
  const cases = state.cases;
  const featured = cases.find(item => item.id === (state.previewStarCase || state.activeCaseId)) || cases[0];
  let graph;
  if (featured) {
    const project = previewProjectFor(featured.projectId);
    graph = `
      <section class="card pv-map-card" aria-label="Case 与项目关系">
        <header class="pv-map-bar"><span><i aria-hidden="true"></i> 决策关系图</span><small>${cases.length} 个 Case · ${state.projects.length} 个项目</small></header>
        <div class="pv-map-graph">
        <div class="pv-map-node pv-map-node-origin">
          <span>Case</span>
          <a href="${safe(link('case', featured.id))}">${safe(featured.title)} <b aria-hidden="true">↗</b></a>
          <small>${safe(featured.status || '推进中')}</small>
        </div>
        ${project ? `<i class="pv-map-line" aria-hidden="true"></i>
        <div class="pv-map-node pv-map-node-project">
          <span>关联项目</span>
          <a href="${safe(previewContextLink('projects', project.id, featured.id))}">${safe(project.title)} <b aria-hidden="true">↗</b></a>
          <small>项目任务 · 6 类</small>
        </div><i class="pv-map-line" aria-hidden="true"></i>
        <div class="pv-map-task-stack"><span>项目任务</span>${previewTaskTypes.map(type => `<a href="${safe(previewContextLink('task',previewTaskId(project.id,type.id),featured.id))}">${safe(type.label.split(' ')[0])}<span aria-hidden="true">↗</span></a>`).join('')}</div>` : `<p class="pv-map-gap">这个 Case 尚未关联项目。<a href="${safe(link('projects'))}">查看项目地图 →</a></p>`}
      </div></section>
      <section class="card card-body pv-map-list">
        <h2>所有 Case</h2>
        ${cases.map(item => `<div class="pv-object-row"><a href="${safe(link('case', item.id))}"><strong>${safe(item.title)}</strong><span>${safe(item.next || '查看业务进展')}</span></a><div class="pv-object-actions"><span class="pill">${safe(item.status || '推进中')}</span><button type="button" data-action="project-star" data-id="${safe(item.id)}" aria-pressed="${item.id === featured.id}">${item.id === featured.id ? '图中已选' : '在图中查看'}</button></div></div>`).join('')}
      </section>`;
  } else {
    graph = `<section class="card card-body pv-empty">
      <div class="pv-empty-illustration" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2>还没有 Case</h2><p>从眼前一件值得跟进的业务事项开始。</p>
      <div class="toolbar"><a class="button primary" href="${safe(link('create'))}">＋ 新建 Case</a><a class="button secondary" href="${safe(link('projects'))}">打开项目地图</a></div>
    </section>`;
  }
  return `<div class="pv-view">
    ${previewProjectBack('home', undefined, '工作台首页')}
    <header class="page-title pv-header"><div><p class="eyebrow">Decision Case</p><h1>决策星图</h1><p>按业务事项查看 Case 与原项目的关系。</p></div>
      ${cases.length ? `<a class="button secondary" href="${safe(link('create'))}">＋ 新建 Case</a>` : ''}
    </header>${graph}
  </div>`;
}

function renderProjects(route) {
  const project = previewProjectFor(route.id);
  if (route.id && !project) return `<div class="pv-view">${previewProjectBack('projects', undefined, '项目地图')}<section class="card card-body pv-empty"><h1>这个项目暂不可读取</h1><p>请返回项目地图选择一个项目。</p></section></div>`;
  if (!project) {
    return `<div class="pv-view">
      ${previewProjectBack('home', undefined, '工作台首页')}
      <header class="page-title pv-header"><div><h1>项目地图</h1><p>每个项目保留自己的文件、任务和原会话，可以独立开始工作。</p></div></header>
      <section class="pv-project-grid" aria-label="项目列表">
        ${state.projects.map(item => {
          const linkedCases = previewAssociatedCases(item.id);
          return `<article class="card card-body pv-project-card">
            <div class="pv-project-top"><span class="pv-folder" aria-hidden="true"></span><span class="pill">${linkedCases.length ? '已关联 ' + linkedCases.length + ' 个 Case' : '可独立工作'}</span></div>
            <h2>${safe(item.title)}</h2><p>${safe(item.summary || '共享项目资料，分别继续各任务。')}</p>
            <a class="button primary" href="${safe(link('projects', item.id))}">打开项目 <span aria-hidden="true">→</span></a>
          </article>`;
        }).join('') || `<section class="card card-body pv-empty"><h2>暂无项目</h2><p>先添加一个示例项目即可进入分析。</p><button class="button primary" type="button" data-action="project-seed">添加示例项目</button></section>`}
      </section>
    </div>`;
  }
  const cases = previewAssociatedCases(project.id);
  const context = cases.find(item => item.id === route.context);
  return `<div class="pv-view">
    <div class="toolbar pv-task-returns">
      ${previewProjectBack('projects', undefined, '项目地图')}
      ${context ? previewProjectBack('case', context.id, '返回来源 Case') : ''}

function previewCloseReader(root, task) {
  const dialog = root.querySelector('dialog');
  if (dialog.open) dialog.close();
  const reader = previewReaderState(task);
  if (['files','requirements'].includes(reader.area) && task.hasReport) reader.area = 'evidence';
  const restore = previewReadOrigin;
  previewReadOrigin = null;
  root.querySelector('.pv-reader-desktop').innerHTML = previewReaderContents(task,reader,false);
  const fallback = root.querySelector('.pv-work-tabs button[aria-pressed="true"]');
  (restore?.isConnected ? restore : fallback)?.focus();
}

function previewOpenReader(root, task, target, area, sourceId) {
  const reader = previewReaderState(task);
  const dialog = root.querySelector('dialog');
  const inPanel = target.closest('[data-reader-host]');
  if (!inPanel) previewReadOrigin = target;
  if (inPanel && !previewReadOrigin?.isConnected) previewReadOrigin = root.querySelector('.pv-work-tabs button[aria-pressed="true"]');
  reader.area = area;
  if (sourceId) reader.source = sourceId;
  const desktop = root.querySelector('.pv-reader-desktop');
  desktop.innerHTML = previewReaderContents(task,reader,false);
  const host = previewNarrow.matches ? dialog : desktop;
  if (host === dialog) {
    dialog.innerHTML = previewReaderContents(task,reader,true);
    if (!dialog.open) dialog.showModal();
  }
  const heading = sourceId ? host.querySelector('[data-reader-heading]') : null;
  (heading || host.querySelector('.pv-reader-heading h3'))?.focus();
}

window.handleProjectAction = (action,id,target) => {
  if (action === 'project-seed') {
    if (!previewProjectFor('east')) state.projects.push({ id:'east', title:'华东门店经营诊断', summary:'从一项复购问题开始。' });
    go('projects','east');
    return true;
  }
  if (action === 'project-star' && state.cases.some(item => item.id === id)) {
    state.previewStarCase = id;
    render();
    focusPreviewTask('.pv-object-actions button[aria-pressed="true"]');
    return true;
  }
  const root = target.closest('[data-preview-task]');
  const task = root ? previewTaskFor(root.dataset.previewTask) : null;
  if (!task) return false;
  if (action === 'project-panel-close') previewCloseReader(root,task);
  else if (action === 'project-evidence' && previewSources.some(item => item.id === id)) previewOpenReader(root,task,target,'evidence',id);
  else if (action === 'project-reader' && ['activity','evidence'].includes(id)) previewOpenReader(root,task,target,id);
  else if (action === 'project-panel' && ['files','requirements'].includes(id)) previewOpenReader(root,task,target,id);
  else if (action === 'project-panel' && ['report','chat','review'].includes(id)) {
    const reader = previewReaderState(task);
    const [path, query] = location.hash.split('?');
    const params = new URLSearchParams(query);
    if (id === 'chat') params.delete('panel');
    else params.set('panel','report');
    const search = params.toString();
    history.replaceState(history.state,'',path + (search ? '?' + search : ''));
    reader.area = task.hasReport ? 'evidence' : 'files';
    previewReadOrigin = null;
    render();
    focusPreviewTask('.pv-work-tabs button[aria-pressed="true"]');
  } else return false;
  return true;
};

window.handleProjectSubmit = (form,event) => {
  const id = form.dataset.projectCompose;
  if (!id) return false;
  event.preventDefault();
  const message = form.querySelector('textarea')?.value.trim();
  if (!message) return true;
  state.previewTaskMessages ||= {};
  (state.previewTaskMessages[id] ||= []).push(message);
  state.taskDrafts[id] = '';
  const task = previewTaskFor(id);
  const route = currentRoute();
  if (typeof logActivity === 'function' && task) logActivity('添加任务消息',task.title,previewContextLink('task',id,route.context));
  render();
  focusPreviewTask('#pv-task-input');
  return true;
};

document.addEventListener('input',event => {
  const input = event.target;
  if (input.id !== 'pv-task-input') return;
  const id = input.form?.dataset.projectCompose;
  if (id) state.taskDrafts[id] = input.value;
});
document.addEventListener('cancel',event => {
  if (event.target.id !== 'pv-reader-dialog') return;
  const root = event.target.closest('[data-preview-task]');
  const task = previewTaskFor(root.dataset.previewTask);
  event.preventDefault();
  previewCloseReader(root,task);
},true);
document.addEventListener('click',event => {
  if (event.target.id !== 'pv-reader-dialog') return;
  const box = event.target.getBoundingClientRect();
  if (event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom) return;
  const root = event.target.closest('[data-preview-task]');
  previewCloseReader(root,previewTaskFor(root.dataset.previewTask));
});
previewNarrow.addEventListener('change',() => {
  const dialog = document.querySelector('#pv-reader-dialog[open]');
  if (!dialog) return;
  const root = dialog.closest('[data-preview-task]');
  previewCloseReader(root,previewTaskFor(root.dataset.previewTask));
});
