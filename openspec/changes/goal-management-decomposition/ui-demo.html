        <span class="demo-caption">合成资料 · Agent 为脚本模拟 · 切换场景将重置演示</span><button class="small ghost" id="reset-demo" data-testid="reset-demo">重置场景</button><button class="small" id="reopen-demo" data-testid="reopen-demo">模拟重新打开</button>
      </section><p>界面基线来自 main d4b60b5 的真实 Host 页面与组件。GSA 计划 A、目标拆解表、发布校验和阶段跟进为本次新增设计，尚未上线。</p></details>
    </div>
  </main>

<dialog id="conversation-dialog" class="conversation-dialog" aria-labelledby="conversation-dialog-title"><header class="conversation-heading"><h2 id="conversation-dialog-title">目标管理 Agent</h2><button id="close-conversation" data-testid="close-conversation">收起对话</button></header><div class="conversation-expanded" id="conversation-dock"></div></dialog>
<div class="toast" role="status" aria-live="polite" id="toast" hidden></div>
<dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<script>
(()=>{
  'use strict';
  const STORE='optracall.goal-decomposition.design-demo.v1';
  const $=id=>document.getElementById(id);
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone=value=>JSON.parse(JSON.stringify(value));
  let memoryOnly=false;
  function initial(scenario='normal'){return {schema:2,scenario,lostOutcome:'saved',gsaConfirmed:false,generated:false,tab:'plan',messages:[],draftRevision:1,delayed:false,reservePurpose:'新品上市预留',reserveOwner:'商品负责人',gapStrategy:true,aligned:false,alignedValue:50,alignmentBasis:'',alignmentDraftValue:'',alignmentDraftBasis:'',alignmentError:'',published:[],knownPublishedNo:null,editingDraft:true,operation:null,operationCount:0,saveCount:0,report:null,checkHistory:[],activeCheckId:null,nextCheckPlanNo:null,threshold:'configured'};}
  function restore(){try{const value=JSON.parse(sessionStorage.getItem(STORE));if(value&&[1,2].includes(value.schema)&&['normal','conflict','lost'].includes(value.scenario)){if(value.schema===1){value.editingDraft=!value.knownPublishedNo;value.checkHistory=value.check?[{...value.check,id:'CHECK-001',threshold:value.threshold||'configured',caseChoice:value.caseChoice||null}]:[];value.activeCheckId=value.checkHistory[0]?.id||null;value.nextCheckPlanNo=null;value.schema=2;delete value.check;delete value.caseChoice;}return value;}}catch{}return initial();}
  let state=restore(),dialogInvoker=null,toastTimer;
  const uiDefaults=()=>({mainTab:'goals',selectedGoal:'sales',workspaceOpen:false,conversationOpen:false,conversationOwner:'selected',drafts:{sales:'',member:'',independent:''},altMessages:{member:[],independent:[]},theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',sidebarOpen:innerWidth>760});
  state.ui={...uiDefaults(),...(state.ui||{})};state.ui.drafts={sales:'',member:'',independent:'',...(state.ui.drafts||{})};state.ui.altMessages={member:[],independent:[],...(state.ui.altMessages||{})};
  const conversationContent=document.createElement('div');conversationContent.className='conversation-content';
  let conversationExpanded=false,primaryOpen=true,projectsOpen=true;
  const conversationKey=()=>state.ui.conversationOwner==='independent'?'independent':state.ui.selectedGoal;
  const goalTitle=()=>state.ui.selectedGoal==='sales'?'1月净销售额达到120万元':'会员复购提升候选';
  function captureInput(){const input=$('chat-input');if(input)state.ui.drafts[input.dataset.owner||conversationKey()]=input.value;}

  function persist(){try{sessionStorage.setItem(STORE,JSON.stringify(state));}catch{memoryOnly=true;}}
  function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4800);}
  const selectedCheck=()=>state.checkHistory.find(c=>c.id===state.activeCheckId)||null;
  const currentPublished=()=>state.published.find(p=>p.no===state.knownPublishedNo);
  const checkPlan=()=>{const c=selectedCheck();return state.published.find(p=>p.no===(c?.planNo||state.nextCheckPlanNo||state.knownPublishedNo));};
  function comparisonFor(report,p){const weeks=p.weeks||(p.delayed?[20,25,40,30]:[25,30,35,25]);const actuals=report==='two-periods'?[23.75,28.5]:[27],plans=report==='two-periods'?weeks.slice(0,2):[weeks[1]];return {actuals,plans,percentages:actuals.map((actual,index)=>(actual-plans[index])/plans[index]*100)};}
  function triggerFor(report,threshold,percentages){if(report==='incomplete')return {type:'incomparable',reason:'数据待补，不计已确认偏离期'};if(threshold==='none')return {type:'unconfigured',reason:'未设置提示阈值'};let consecutive=0;for(let i=percentages.length-1;i>=0&&percentages[i]<0;i--)consecutive++;if(percentages.at(-1)<=-10+1e-8)return {type:'magnitude',reason:'本期不利偏差达到 10% 幅度阈值'};if(consecutive>=2)return {type:'consecutive',reason:'连续 2 期偏低，达到连续期数阈值'};return {type:'none',reason:'未达到不利偏差或连续偏低提示条件'};}
  const statusText=()=>state.operation?.status==='unknown'?'发布结果待核':state.editingDraft&&state.generated?(state.knownPublishedNo?'修订草稿 · 当前生效 v'+state.knownPublishedNo:'拆解草稿'):state.knownPublishedNo?'已发布 · v'+state.knownPublishedNo:state.gsaConfirmed?'待发起拆解':'待确认总目标';
  const hasConflict=()=>state.scenario==='conflict'&&!state.aligned;
  const allocations=()=>{const value=state.scenario==='conflict'&&state.aligned?state.alignedValue:50;return [{id:'G-01',scope:'线下 × 羽绒服',amount:value,owner:'门店负责人',strategy:'重点门店新品陈列'},{id:'G-02',scope:'线上 × 羽绒服',amount:value===45?35:30,owner:'电商负责人',strategy:'平台活动增量'},{id:'G-03',scope:'线上 × 针织',amount:20,owner:'电商负责人',strategy:'会员专属组合'},{id:'G-04',scope:'线下 × 针织',amount:15,owner:'门店负责人',strategy:'基础款连带销售'}];};
  function canPublish(){return state.gsaConfirmed&&state.generated&&!hasConflict()&&state.reservePurpose.trim()&&state.reserveOwner.trim()&&state.gapStrategy&&state.editingDraft&&!state.operation;}
  function opDetails(){if(!state.operation)return '';const op=state.operation;return `<details class="details"><summary>发布操作与准确引用</summary><div class="details-body"><dl><dt>原操作</dt><dd class="mono">${esc(op.id)}</dd><dt>草稿修订</dt><dd>r${op.draftRevision}</dd><dt>总目标 GSA</dt><dd class="mono">GSA-retail-202701 / v1</dd><dt>状态</dt><dd>${esc(op.status==='accepted'?'已完成':op.status==='not-executed'?'已确认未执行':'结果待核')}</dd><dt>提交次数</dt><dd>${op.attempts} 次，同一个业务意图</dd><dt>正式版本数</dt><dd>${state.knownPublishedNo?state.published.filter(pub=>pub.no<=state.knownPublishedNo).length+(state.operation?.status==='unknown'?' 个已核实，新发布待核':''):'尚无已核实版，原发布结果待核'}</dd></dl><p style="margin-top:10px">这些标识由系统保存。负责人无需手工填写或记住。</p></div></details>`;}
  function pageHead(){const tabs=[['goals','目标与策略'],['adopt','核对与采用'],['cases','年度决策事项'],['history','版本与反馈']];return `<header class="management-heading"><div><h1>目标管理</h1><p>核对目标和策略，再承接年度决策事项。</p></div><button class="header-action" data-action="existing-import">导入 Excel</button><button class="primary header-action" data-action="existing-new-goal">＋ 新建候选目标</button></header><nav class="management-tabs" aria-label="目标管理工作视图">${tabs.map(([tab,label])=>`<button data-action="main-${tab}" data-testid="main-tab-${tab}" ${state.ui.mainTab===tab?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`;}
  function goalList(){return `<div class="view-toolbar"><div class="view-filter"><label for="perspective">适用视角</label><select id="perspective" data-testid="perspective"><option value="all">全部视角</option><option value="organization">营利组织</option></select><button class="text-button" data-action="refresh-goals">刷新目标与来源</button></div><span class="muted">2个目标 · 候选与已采纳版本分别保留</span></div><div class="goal-list" role="region" tabindex="0" aria-label="目标列表"><table><thead><tr><th scope="col">目标项</th><th scope="col">指标</th><th scope="col">基线与性质</th><th scope="col">目标值</th><th scope="col">单位</th><th scope="col">版本</th></tr></thead><tbody><tr aria-selected="${state.ui.selectedGoal==='sales'}"><th scope="row"><button class="text-button goal-link" data-action="select-sales" data-testid="goal-entry" aria-pressed="${state.ui.selectedGoal==='sales'}">1月净销售额达到120万元</button></th><td>成果标准</td><td><details><summary>查看基线</summary>可比期108万元；本次测算112万元。</details></td><td><details><summary>查看交付标准</summary>2027年1月完整净销售报表核对达到120万元。</details></td><td>—</td><td><span class="sg-badge">v1 · 已采用</span></td></tr><tr aria-selected="${state.ui.selectedGoal==='member'}"><th scope="row"><button class="text-button goal-link" data-action="select-member" data-testid="goal-secondary" aria-pressed="${state.ui.selectedGoal==='member'}">会员复购提升候选</button></th><td>成果标准</td><td><details><summary>待补</summary>尚未选定可比会员队列与观察窗。</details>待补</td><td><details><summary>查看交付标准</summary>核对会员回访试点和可比观察窗口。</details></td><td>—</td><td><span class="sg-badge pending">v1 · 待采用</span></td></tr></tbody></table></div>`;}
  function selectedDetail(){const sales=state.ui.selectedGoal==='sales';return `<section class="selected-detail" aria-labelledby="selected-goal-title"><div class="detail-heading"><div><h2 id="selected-goal-title">${goalTitle()}</h2><p>营利组织 · 部门：零售事业部</p></div><label class="version-select">查看准确版本<select id="exact-goal-version"><option>${sales?'v1 · 已采纳 · 当前采用':'v1 · 候选'}</option></select></label></div><details><summary>目标说明</summary><p class="small-text muted" style="margin-top:8px">${sales?'2027年1月在零售事业部全渠道与门店达到净销售额120万元，实际完成情况由完整可比报表核对。':'先核对会员回访试点范围、成熟队列与可比观察窗。本次原型不演示此目标的拆解发布。'}</p></details><details><summary>战略背景与准确来源</summary><p class="small-text muted" style="margin-top:8px">${sales?'本次新增工作流演示承接正式战略发布 S-2027 / v3 · 目标 G-2027-01。准确原来源不因后续拆解改变。':'合成手动候选 · 战略尚未正式发布时可拟定，正式发布后由负责人核对承接。'}</p><p class="small-text muted">所有资料与来源均为虚构演示，不表示真实 main 已建立这些业务资产。</p></details><div class="goal-facts"><div class="goal-fact"><strong>衡量依据</strong>${sales?'2027年1月完整净销售报表核对达到120万元。本次拆解按合成 SAP 净销售额 v2 核对同口径金额。':'核对会员回访试点和可比观察窗口，具体指标与目标值待补。'}</div><div class="goal-fact"><strong>基线</strong>${sales?'合成可比期108万元，可达测算112万元，正式承诺120万元。':'待补，不将缺失基线当作零。'}</div><div class="goal-fact"><strong>责任与期限</strong>林负责人 · 2027-01-31</div></div><div class="goal-actions"><button data-action="existing-goal-case" ${sales?'':'disabled'}>从此目标创建Case</button><button data-action="existing-goal-project" ${sales?'':'disabled'}>从此目标开始项目</button><button class="text-button" data-action="existing-revise-goal">提出目标修订</button></div>${sales?`<div class="new-work-entry"><div><span class="new-capability">本次新增设计</span><p>${state.gsaConfirmed?'总目标 GSA v1 已确认，贡献与时间计划在本目标内继续。':'现有 G 与 S 已采用；计划 A 尚未确认，先核对完整总目标 GSA。'}</p></div><button class="${state.gsaConfirmed?'':'primary'}" data-action="start-decomposition" data-testid="start-decomposition">${state.gsaConfirmed?'继续拆解与发布':'开始目标拆解'}</button></div>`:'<div class="note" style="margin-top:14px">本次未演示此目标的拆解。它的独立讨论与输入不会混入120万元目标。</div>'}</section>`;}
  function baselinePanels(){return `<section class="baseline-panel"><div class="detail-heading"><h2>同一目标，按职责承接</h2><button disabled>记录贡献关系</button></div><p>企业BSC与GSA直接引用同一目标版本；部门和个人按职责贡献，不复制一份企业指标或机械分摊比例。</p><div class="table-scroll"><table><thead><tr><th>目标关系</th><th>职责与协同</th><th>依据／必要条件</th><th>版本</th></tr></thead></table></div><p class="empty-relation">此准确目标版本尚无已记录关系，不据此推断业务上没有贡献或必要条件。</p></section><section class="baseline-panel"><h3>策略、资源与必要条件</h3><div class="goal-facts"><div class="goal-fact"><strong>策略安排</strong>${state.ui.selectedGoal==='sales'?'稳定可比业务，新品增长与平台活动共同补足增量。':'先在两家门店核对回访队列。'}</div><div class="goal-fact"><strong>资源与约束</strong>沿用已获准材料；新增资源按原授权入口办理。</div><div class="goal-fact"><strong>必要条件／待核前提</strong>计划贡献尚待后续实绩验证。</div></div></section><section class="baseline-panel"><h3>上层行动与检查安排</h3><p style="margin-top:12px">此准确目标版本尚无已关联的实际行动与检查安排。只有原 Case、项目任务或行动看板的明确授权记录才在此显示。总目标 GSA 的计划 A 单独保存，确认计划不产生行动授权。</p></section>`;}
  function adoptionPanel(){if(state.ui.selectedGoal!=='sales')return `<section class="baseline-panel"><h3>G 与 S 采用对照</h3><p style="margin-top:12px">会员候选尚未采用，本次只展示原有入口与独立上下文。120万元目标的 GSA、拆解与发布操作不会附着到本目标。</p><button data-action="existing-member-adopt">核对并采纳此版本（入口说明）</button></section>`;return `<section class="baseline-panel" id="gsa-review" aria-labelledby="gsa-title"><div class="detail-heading"><h3 id="gsa-title">G + S + 计划 A 采用对照</h3><span class="new-capability">本次扩展计划 A</span></div><div class="adopt-comparison"><h3>总目标 GSA 核对</h3><div class="adopt-comparison-grid"><fieldset><legend>当前已采用 G 与 S</legend><dl><dt>目标 G</dt><dd>1月净销售额120万元</dd><dt>衡量要求</dt><dd>2027.01 全渠道与门店，合成 SAP 净销售额 v2。</dd><dt>策略 S</dt><dd>新品增长与平台活动共同补足增量。</dd><dt>计划 A</dt><dd>${state.gsaConfirmed?'本轮已补齐并确认计划 A，准确 GSA v1 保留。':'原采用记录未确认本期计划 A，不能直接开始子目标拆解。'}</dd></dl></fieldset><fieldset><legend>本次核对 GSA ${state.gsaConfirmed?'v1 · 已确认':'草稿'}</legend><dl><dt>目标 G</dt><dd>正式目标120万元；同口径测算112万元；差额8万元，分别保留。</dd><dt>期限／责任</dt><dd>2027-01-31 · 零售事业部 · 林负责人</dd><dt>策略 S</dt><dd>稳定可比业务，重点门店新品试点与平台活动，增量按不重叠范围估算。</dd><dt>计划 A</dt><dd>月初核对新品试点与可售货品；第2周检查全渠道可比净销售额与增量依据；月末对照准确实绩复盘。</dd></dl></fieldset></div></div><p class="small-text muted">计划 A 是关键行动与上层阶段检查点，具体任务、人员安排和执行授权留到后续承接。一次确认完整 GSA，不重复录入已有数值。</p><details class="details"><summary>本次明确决定（已预填，可选编辑）</summary><div class="details-body"><textarea id="gsa-decision" aria-label="本次明确决定">${esc(state.ui.gsaDecision||'明确沿用正式目标120万元与对应策略，采用本次列明的关键行动及阶段检查点，形成总目标GSA v1。具体任务与经营执行仍按原入口办理。')}</textarea></div></details><div class="adopt-actions" style="margin-top:15px">${state.gsaConfirmed?'<button class="primary" data-action="open-decomposition">回到本目标继续拆解</button>':'<button class="primary" data-action="confirm-gsa" data-testid="confirm-gsa">确认 GSA，开始拆解</button>'}<p>${state.gsaConfirmed?'已确认版保留，不重复确认。':'确认后展开同一目标 Agent 并聚焦输入，不自动发送。'}</p></div></section>`;}
  function conversationShell(){return `<details class="goal-role-discussion" id="goal-conversation" data-testid="goal-conversation" ${state.ui.conversationOpen?'open':''}><summary data-testid="conversation-toggle">与目标管理 Agent 讨论</summary><label class="owner-selector">目标管理对话<select id="conversation-owner" data-testid="goal-owner-select"><option value="selected" ${state.ui.conversationOwner==='selected'?'selected':''}>所选目标 · ${goalTitle()} v1</option><option value="independent" ${state.ui.conversationOwner==='independent'?'selected':''}>独立草稿 · 零售事业部</option></select></label><div class="conversation-toolbar"><button class="text-button" data-action="expand-conversation" data-testid="expand-conversation" aria-haspopup="dialog" aria-expanded="${conversationExpanded}">放大对话</button></div><div id="conversation-inline"></div></details>`;}
  function conversationMarkup(){const key=conversationKey(),sales=key==='sales',messages=sales?state.messages:state.ui.altMessages[key];const blocked=sales&&state.operation&&state.operation.status!=='accepted';return `<section class="main-chat" aria-label="目标管理 Agent"><div class="chat-log" id="chat-log" aria-live="polite">${messages.map(m=>`<article class="message ${m.role}">${m.role==='user'?'<div class="author">你</div>':'<div class="agent-author"><span class="brand-mark" aria-hidden="true"></span>OptraCall <small>ui-baseline-synthetic</small></div>'}<div>${esc(m.text).replace(/\n/g,'<br>')}</div></article>`).join('')}</div>${sales&&state.gsaConfirmed&&state.editingDraft&&!state.operation?`<div class="suggestion-row">${!state.generated?'<button class="suggestion" data-action="suggest-initial" data-testid="suggest-initial">按渠道、品类拆解，并安排周计划</button>':'<button class="suggestion" data-action="suggest-delay" data-testid="suggest-delay">新品延后两周，活动预算不变</button><button class="text-button" data-action="show-evidence">查看测算与增量依据</button>'}</div>`:''}<form class="composer" id="chat-form"><label for="chat-input">想梳理哪一个目标或策略？</label><textarea id="chat-input" data-testid="chat-input" data-owner="${key}" placeholder="${key==='independent'?'独立草稿可讨论目标或测算，不承接本目标发布操作。':sales&&state.gsaConfirmed?'提出拆解要求或经营约束…':'先讨论当前目标和策略，计划 A 确认后再进入拆解。'}" ${blocked?'disabled':''}>${esc(state.ui.drafts[key]||'')}</textarea><div class="composer-foot"><label class="model-label">会话模型<select aria-label="会话模型"><option>界面核查 · 合成模型</option></select></label><span class="send-actions"><button type="submit" data-testid="send-message" ${blocked?'disabled':''}>发送</button></span></div></form>${blocked?'<p class="small-text muted" style="margin-top:10px">本目标发布结果待核，原输入与发布意图已保留，请先核对原操作。</p>':''}${key==='independent'?'<p class="small-text muted" style="margin-top:10px">独立草稿只演示说明与测算讨论，不会更改所选目标的 GSA、拆解或正式发布。</p>':''}</section>`;}
  function goalWorkspace(){return `<section class="goal-workspace" id="goal-workspace"><div class="goal-workspace-heading"><div><h2>本目标的拆解与跟进 <span class="new-capability">本次新增设计</span></h2><p class="small-text muted" style="margin-top:4px">${goalTitle()} · 总目标 GSA v1 · 计划 A 已确认，不是行动授权</p></div><span class="status ${state.operation?.status==='unknown'?'warning':!state.editingDraft?'success':''}" data-testid="page-status">${statusText()}</span></div><nav class="steps" aria-label="当前目标内的工作视图"><button class="step ${state.tab==='plan'?'active':''}" data-action="tab-plan" data-testid="plan-tab">拆解与发布</button><button class="step ${state.tab==='follow'?'active':''}" data-action="tab-follow" data-testid="follow-tab" ${!state.knownPublishedNo?'disabled':''}>阶段跟进</button></nav>${state.tab==='follow'?follow():plan()}</section>`;}
  function annualCases(){return `<section class="baseline-panel"><h3>年度决策事项</h3><p style="margin-top:12px">当前准确目标下的 Case 保留其原目标、策略和计划引用。</p>${state.ui.selectedGoal==='sales'&&state.checkHistory.some(c=>c.caseChoice)?state.checkHistory.filter(c=>c.caseChoice).map(c=>`<div class="review-line"><span>${c.caseChoice==='existing'?'Case C-014 · 活动后新品转化':'Case C-015 · 独立事项草稿'}</span><strong>${esc(c.id)} · 拆解表 v${c.planNo}</strong></div>`).join(''):'<p>本演示尚未记录负责人选定的阶段 Case。提示达到阈值时，优先续接已有同一事项。</p>'}<p class="boundary">此页沿用原有年度事项位置。完整 Case 编辑与经营执行不在本次原型中办理。</p></section>`;}
  function mainHistory(){const verifiedPublications=state.published.filter(pub=>state.knownPublishedNo!==null&&pub.no<=state.knownPublishedNo);return `<section class="baseline-panel"><h3>目标版本</h3><div class="review-line"><span>${goalTitle()} · v1</span><strong>${state.ui.selectedGoal==='sales'?'已采用':'候选待采纳'}</strong></div><p style="margin-top:12px">目标更新不会静默改写已确认方案、Case、报告或人的旧选择。受影响工作按原引用核对。</p></section>${state.ui.selectedGoal==='sales'?`<section class="baseline-panel"><h3>拆解发布版与阶段检查 <span class="new-capability">本次新增记录</span></h3>${verifiedPublications.length?verifiedPublications.map(pub=>`<div class="review-line"><span>目标拆解表 v${pub.no}${pub.no===state.knownPublishedNo?' · 当前生效':''}</span><strong>GSA v1 · 草稿 r${pub.draftRevision}</strong></div>`).join(''):'<p style="margin-top:12px">尚无已核实的正式拆解发布版，草稿与原目标仍保留。</p>'}${state.operation?.status==='unknown'?'<div class="note warning" style="margin-top:12px" data-testid="history-publish-pending">新发布操作结果待核。这里只显示已核实的历史版本，请回所选目标的拆解与发布核对原操作，不重复提交。</div>':''}${state.checkHistory.map(check=>`<div class="review-line"><span>${esc(check.id)} · 原计划 v${check.planNo} · ${esc(check.sourceRef)}</span><button class="text-button" data-action="history-check" data-check-id="${esc(check.id)}">回看这一版检查</button></div>`).join('')}</section>`:''}<section class="baseline-panel"><h3>三层反馈及原记录</h3><p style="margin-top:12px">原反馈按准确来源回看。复盘与下一阶段完整流程在 Spec 中，当前原型重点验证发布、冲突与失答恢复。</p></section>`;}
  function mainPage(){return pageHead()+goalList()+selectedDetail()+(state.ui.mainTab==='adopt'?adoptionPanel():state.ui.mainTab==='cases'?annualCases():state.ui.mainTab==='history'?mainHistory():conversationShell()+(state.ui.selectedGoal==='sales'&&state.ui.workspaceOpen&&state.gsaConfirmed?goalWorkspace():'')+baselinePanels());}
  function metrics(){return `<div class="metric-grid"><div class="metric"><span>正式目标值</span><strong>120<em>万</em></strong><small>来源于正式战略发布版</small></div><div class="metric"><span>可达测算值</span><strong>112<em>万</em></strong><small>同期间、同范围、同口径</small></div><div class="metric gap"><span>待策略补足的差额</span><strong>8<em>万</em></strong><small>120 − 112，保留原测算</small></div></div>`;}
  function conflict(){if(!hasConflict())return '';return `<div class="issue-card" role="alert" data-testid="cross-conflict"><div class="issue-head"><h3>同口径交叉项尚未对齐</h3><span class="status error">只能保存草稿</span></div><div class="issue-body"><p class="small-text">1 月 · 零售事业部 · 净销售额 · 线下 × 羽绒服</p><div class="compare"><div>渠道计划<strong>50 万</strong><p>依据 · 门店目标表 r4</p></div><div class="versus">差 5 万</div><div>商品计划<strong>45 万</strong><p>依据 · 商品配置表 r3</p></div></div><p class="small-text muted">另一处「线上 × 羽绒服」同时为 30 万与 35 万。两个视图各自合计都是 120 万，但两处同口径交叉项均需对齐。差异不能转成预留。Agent 不替双方决定哪个数值有效。</p><details class="details"><summary>查看两边原明细与合计</summary><div class="details-body"><table><thead><tr><th>相同交叉单元</th><th>渠道计划</th><th>商品计划</th></tr></thead><tbody><tr><td>线下 × 羽绒服</td><td>50</td><td>45</td></tr><tr><td>线上 × 羽绒服</td><td>30</td><td>35</td></tr><tr><td>线上 × 针织</td><td>20</td><td>20</td></tr><tr><td>线下 × 针织</td><td>15</td><td>15</td></tr><tr><td>新品上市预留</td><td>5</td><td>5</td></tr><tr><td>合计（万元）</td><td>120</td><td>120</td></tr></tbody></table><p style="margin-top:9px">本演示支持双方采用任一原有方案的完整明细。50 万方案同时把商品视图的「线上 × 羽绒服」35 万调为 30 万。45 万方案同时把渠道视图的「线上 × 羽绒服」30 万调为 35 万。先展示变化，不能只改一个单元就宣称对平。</p></div></details><form id="align-form"><div class="form-row"><div class="form-field"><label for="aligned-value">双方已协商一致值 · 万元</label><input id="aligned-value" data-testid="aligned-value" type="number" step="1" min="0" placeholder="45 或 50" value="${esc(state.alignmentDraftValue)}" required ${state.alignmentError?'aria-invalid="true"':''}></div><div class="form-field"><label for="alignment-basis">双方确认依据</label><input id="alignment-basis" data-testid="alignment-basis" type="text" placeholder="例如，商品与渠道负责人已确认采用门店明细 r4" value="${esc(state.alignmentDraftBasis)}" required></div></div>${state.alignmentError?`<p class="small-text" style="color:var(--error);margin-top:8px" role="alert">${esc(state.alignmentError)}</p>`:''}<div class="actions" style="margin-top:12px"><button type="submit" class="small" data-testid="apply-alignment">按双方确认明细更新并重新校验</button></div></form></div></div>`;}
  function draftTable(){const rows=allocations();const allocated=rows.reduce((sum,r)=>sum+r.amount,0);return `<div class="table-scroll"><table aria-label="目标拆解草稿明细" data-testid="decomposition-table"><thead><tr><th>子目标 / 责任范围</th><th>正式分配</th><th>负责人</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.scope)}<span class="subtle-line">${esc(r.id)} · ${esc(r.strategy)}</span></td><td class="table-target">${r.amount} 万</td><td>${esc(r.owner)}</td></tr>`).join('')}<tr class="reserve-row"><td>新品上市预留<span class="subtle-line">单独预留，不计入子目标已分配</span></td><td class="table-target">5 万</td><td>${esc(state.reserveOwner||'待补责任人')}</td></tr><tr class="total-row"><td>已分配 ${allocated} + 预留 5</td><td>120 万</td><td>${allocated===115?'金额对平 ✓':'金额待核'}</td></tr></tbody></table></div>`;}
  function splitBody(){return `<div class="card-body">${metrics()}<div class="allocation-line"><span>已分配 <strong>115 万</strong></span><span>有用途、有责任人的预留 <strong>5 万</strong></span></div><div class="allocation-bar" aria-label="115万元已分配，5万元预留"><span></span></div>${conflict()}${state.aligned?`<div class="note success" style="margin-top:15px" data-testid="alignment-result">双方已采用 ${state.alignedValue} 万方案的完整明细。${state.alignedValue===50?'商品视图的线上 × 羽绒服同步从 35 万调整为 30 万':'渠道视图的线上 × 羽绒服同步从 30 万调整为 35 万'}，两个视图重新汇总均为 120 万。<br><span class="small-text">确认依据 · ${esc(state.alignmentBasis)}</span></div>`:''}</div>${draftTable()}<div class="card-body" style="border-top:1px solid var(--line)"><div class="subhead" style="margin-top:0"><h3>8 万测算缺口，预计怎样补足</h3><button class="inline-button" data-action="show-gap" data-testid="edit-gap">${!state.editingDraft||state.operation?'查看':'核对 / 编辑'}</button></div><p class="small-text muted" data-testid="gap-strategy">${state.gapStrategy?'新品非活动期增量 5 万 + 平台额外增量 3 万 = 8 万。两项范围不重叠，均为计划预期，后续按实绩检验。':'尚未说明补缺策略及预期贡献，暂不能发布。'}</p><div class="subhead"><h3>时间计划 · 按商品与经营节奏</h3><button class="inline-button" data-action="show-timeline">查看检查点</button></div><div class="bar-chart" aria-label="分周计划，已分配共115万元"><div class="week"><div class="week-bar" style="height:54px">${state.delayed?20:25} 万</div>第 1 周</div><div class="week current"><div class="week-bar" style="height:66px">${state.delayed?25:30} 万</div>第 2 周</div><div class="week"><div class="week-bar" style="height:78px">${state.delayed?40:35} 万</div>第 3 周</div><div class="week"><div class="week-bar" style="height:54px">${state.delayed?30:25} 万</div>第 4 周</div></div><p class="small-text faint" style="margin-top:10px">${state.delayed?'新品上市推迟两周，前两周各移后 5 万，后两周各承接 5 万。总分配与 8 万补缺策略不变。':'基础款提供稳定贡献，活动与新品形成不同周曲线。115 万已排期，5 万预留待明确后修订发布。'}</p><details class="details"><summary>预留用途、责任人与发布前校验</summary><div class="details-body"><p>预留用途 · ${esc(state.reservePurpose||'尚未填写')}<br>预留责任人 · ${esc(state.reserveOwner||'尚未填写')}</p>${state.editingDraft&&!state.operation?'<button class="small" data-action="edit-reserve" style="margin-top:10px" data-testid="edit-reserve">编辑预留</button>':''}<div class="check-list"><div class="rule-line"><span class="check">${state.reservePurpose&&state.reserveOwner?'✓':'!'}</span><span>${state.reservePurpose&&state.reserveOwner?'已分配 115 + 有用途、有责任人的预留 5 = 正式目标 120':'预留用途或责任人待补，余额不能作为合法预留'}</span></div><div class="rule-line"><span class="check">${hasConflict()?'!':'✓'}</span><span>${hasConflict()?'两处同口径交叉项未对齐，发布受阻':'同口径交叉项一致'}</span></div><div class="rule-line"><span class="check">${state.gapStrategy?'✓':'!'}</span><span>${state.gapStrategy?'补缺策略与预期贡献覆盖 8 万差额':'补缺策略或贡献待补'}</span></div><div class="rule-line"><span class="check">✓</span><span>引用 GSA v1、SAP v2；责任范围与阶段检查点已列明</span></div></div></div></details>${opDetails()}</div>`;}
  function recovery(){if(state.operation?.status!=='unknown'&&state.operation?.status!=='not-executed')return '';const op=state.operation;return `<section class="card" style="margin-bottom:16px" data-testid="recovery-card"><div class="card-body"><div class="note warning"><strong>${op.status==='not-executed'?'已查明，原发布操作确定未执行':'发布请求已发出，结果还未核实'}</strong><p style="margin-top:5px">${op.status==='not-executed'?'服务端已确认原请求未提交，且没有在途写入。原草稿和发布意图仍在，可明确重试同一编号与同一内容，不创建第二份操作。':'连接中断不能证明发布失败。先只读核对原操作，保留已确认的草稿与可能已保存的正式版。'}</p></div><div class="actions" style="margin-top:13px">${op.status==='not-executed'?'<button class="primary" data-action="retry-publish" data-testid="retry-publish">重试原发布意图</button>':'<button class="primary" data-action="query-publish" data-testid="query-publish">核对原发布结果</button>'}<span class="small-text muted">${op.queries?'已只读核对 '+op.queries+' 次':'不会重新发送发布请求'}</span></div>${op.lastQuery==='unknown'?'<p class="small-text" role="status" style="margin-top:11px;color:var(--warning)">仍无法确认结果。保持待核，正式发布按钮继续停用。可以稍后再查或重新打开本演示。</p>':''}</div></section>`;}
  function publishedReceipt(){if(!state.knownPublishedNo)return '';const p=currentPublished();return `<section class="card" style="margin-bottom:16px" data-testid="published-receipt"><div class="receipt"><div class="receipt-title"><span class="receipt-icon" aria-hidden="true">✓</span><div><h3>目标拆解表 v${p.no} 已正式发布${state.editingDraft?' · 当前仍生效':''}</h3><p class="small-text muted">${state.editingDraft?'下方正在编辑新的拆解草稿。修订期间，原发布版及其检查、Case 选择仍可回看。':'负责人已核对并发布。下游使用准确版本，已完成的检查不会随新版本切换。'}</p></div></div><div class="reference"><div><strong>零售事业部 · 2027 年 1 月</strong><code>${esc(p.id)} / v${p.no} · GSA v1 · ${p.delayed?'修订后周计划':'初始周计划'}</code></div><button class="inline-button" data-action="show-reference" data-testid="view-reference">查看下游引用</button></div><div class="actions" style="margin-top:13px"><button class="small" data-action="tab-follow" data-testid="start-follow">${selectedCheck()?'回看阶段检查与 Case':'选定实绩，开始阶段跟进'} <span aria-hidden="true">→</span></button>${!state.editingDraft?'<button class="small ghost" data-action="revise" data-testid="revise-plan">修订拆解计划</button>':''}</div></div></section>`;}
  function plan(){if(!state.gsaConfirmed)return '<p>请先在核对与采用中确认完整总目标 GSA。</p>';return `${publishedReceipt()}${recovery()}<div class="work-grid"><section class="card" aria-labelledby="split-title"><div class="card-head"><div><h2 id="split-title">目标拆解表</h2><p class="small-text faint" style="margin-top:3px">${state.generated?state.editingDraft?'依据 GSA v1 · 草稿 r'+state.draftRevision:'依据 GSA v1 · 已发布版本':'等 Agent 形成可核对的方案'}</p></div><span class="status ${hasConflict()&&state.generated?'error':!state.editingDraft&&state.knownPublishedNo?'success':''}">${!state.editingDraft&&state.knownPublishedNo?'正式版 v'+state.knownPublishedNo:hasConflict()&&state.generated?'交叉项待对齐':'草稿'}</span></div>${state.generated?splitBody():`<div class="card-body">${metrics()}</div><div class="empty-state"><div class="empty-illustration" aria-hidden="true"><i></i><i></i><i></i></div><h3>把贡献分配与时间计划放在一起核对</h3><p>向左侧 Agent 发送请求后，<br>这里会呈现子目标、预留、补缺策略与阶段计划。</p></div>`}<div class="publish-footer"><p>${state.operation?.status==='unknown'?'原发布结果待核。先核对原操作，不重复提交。':hasConflict()&&state.generated?'交叉冲突必须先拉齐。草稿和双方依据都会保留。':!state.editingDraft?'本版已发布。执行任务、人员安排和经营授权按后续入口承接。':'核对后一次发布拆解计划。具体任务和执行授权由下游承接。'}</p><div class="actions"><button class="small" data-action="save-draft" data-testid="save-draft" ${!state.generated||!state.editingDraft||state.operation?'disabled':''}>保存草稿</button><button class="primary" data-action="review-publish" data-testid="publish-button" ${canPublish()?'':'disabled'}>${!state.editingDraft?'已发布':'核对并发布'}</button></div></div></section></div>`;}
  function follow(){
    const p=checkPlan();if(!p){state.tab='plan';return plan();}
    const c=selectedCheck(),pending=c?.report==='incomplete',two=c?.report==='two-periods';
    const weeks=p.weeks||(p.delayed?[20,25,40,30]:[25,30,35,25]);
    const {actuals,plans,percentages}=c?.comparison||comparisonFor(c?.report||state.report,p);
    const savedThreshold=c?.threshold||state.threshold;
    const format=value=>String(Number(value.toFixed(2)));
    const signed=value=>(value>0?'+':'')+format(value)+'%';
    const readOnly=!!c;

    return `<div class="follow-layout"><div class="stack"><section class="card"><div class="card-head"><div><h2>${readOnly?'回看已完成的阶段检查':'先选实绩，再对照准确计划'}</h2><p class="small-text faint" style="margin-top:4px">第 2 周汇总检查点 · 目标拆解表 v${p.no} · 零售事业部 G-TOTAL</p></div><span class="status ${c&&!pending?'success':pending?'warning':''}">${c?pending?'数据待补':'已保存检查':'待选实绩'}</span></div><div class="card-body">

  function caseCard(c,p,percentages){
    const choice=c.caseChoice?`<div class="note success" style="margin-top:12px" data-testid="case-choice-result">${c.caseChoice==='existing'?'已选择续接 Case C-014。':'已明确选择新建 Case 草稿 C-015。'}保留 ${esc(c.id)}、GSA v1、拆解表 v${p.no}、G-TOTAL、汇总检查点及原实绩引用。后续行动仍需原入口授权。</div>`:'';
    if(c.report==='incomplete')return choice;
    const trigger=c.trigger||triggerFor(c.report,c.threshold||'configured',percentages);
    if(trigger.type==='unconfigured')return '<p class="small-text muted" style="margin-top:15px" data-testid="case-no-threshold">偏差分析已完成。尚未设置 Case 提示阈值，不额外阻断本次检查。</p>'+choice;
    const magnitude=trigger.type==='magnitude',prompt=trigger.type==='magnitude'||trigger.type==='consecutive';
    if(!prompt)return '<p class="small-text muted" style="margin-top:15px" data-testid="case-no-trigger">按本记录准确计划计算，'+esc(trigger.reason)+'。</p>'+choice;
    return `<div class="case-card" data-testid="case-prompt"><h3>${esc(trigger.reason)}</h3><p>${magnitude?'本期低于计划达到 10% 即提示，不需要再等到连续 2 期。':'同一报告的实绩为 23.75 / 28.5 万，本记录计划为 25 / 30 万，单期均偏低 5%，连续 2 期达到提示条件。'}</p><p>已有关联事项 <strong>Case C-014 · 活动后新品转化</strong>（进行中），与当前 G+S 匹配，建议优先续接。</p>${choice||`<div class="actions" style="margin-top:12px"><button class="primary small" data-action="continue-case" data-testid="continue-case">续接已有 Case</button><button class="small" data-action="new-case" data-testid="new-case">另建 Case</button><button class="small ghost" data-action="observe" data-testid="observe">继续观察</button></div>`}</div>`;
  }
  function applyTheme(){document.documentElement.dataset.theme=state.ui.theme;$('theme-toggle').setAttribute('aria-label',state.ui.theme==='light'?'切换为深色':'切换为浅色');$('theme-icon').innerHTML=state.ui.theme==='light'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg>';}
  function placeConversation(){const inline=$('conversation-inline');if(conversationExpanded){$('conversation-dock').append(conversationContent);}else if(inline){inline.append(conversationContent);}}
  function render(){captureInput();conversationContent.remove();persist();applyTheme();$('scenario').value=state.scenario;$('lost-label').hidden=state.scenario!=='lost';$('lost-outcome').value=state.lostOutcome;$('lost-outcome').disabled=!!state.operation;$('workspace').innerHTML=mainPage()+`<p class="content-note">界面沿用 main d4b60b5 · 讨论稿基线 0a45c50 · 虚构资料与脚本模拟 · 新增设计尚未上线${memoryOnly?' · 当前仅内存演示，重新打开不能恢复':''}</p>`;conversationContent.innerHTML=conversationMarkup();placeConversation();const log=$('chat-log');if(log)log.scrollTop=log.scrollHeight;const details=$('goal-conversation');details?.addEventListener('toggle',()=>{state.ui.conversationOpen=details.open;persist();});updateSidebar();}

  function updateSidebar(){const mobile=innerWidth<=760,sidebar=$('sidebar'),host=$('sidebar-host'),dialog=$('sidebar-dialog');if(mobile){host.hidden=true;if(sidebar.parentElement!==dialog)dialog.append(sidebar);if(state.ui.sidebarOpen&&!dialog.open)dialog.showModal();if(!state.ui.sidebarOpen&&dialog.open)dialog.close();}else{if(dialog.open)dialog.close();if(sidebar.parentElement!==host)host.append(sidebar);host.hidden=!state.ui.sidebarOpen;}$('sidebar-toggle').setAttribute('aria-expanded',String(state.ui.sidebarOpen));$('sidebar-toggle').setAttribute('aria-label',state.ui.sidebarOpen?'收起侧栏':'展开侧栏');if(mobile)$('sidebar-toggle').setAttribute('aria-haspopup','dialog');else $('sidebar-toggle').removeAttribute('aria-haspopup');}

  function sendConversation(text){const key=conversationKey();text=text.trim();if(!text)return;state.ui.drafts[key]='';if($('chat-input'))$('chat-input').value='';if(key==='sales'&&state.gsaConfirmed&&state.editingDraft&&!state.operation){sendMessage(text);return;}if(key==='sales'&&state.operation&&state.operation.status!=='accepted'){notify('原发布结果待核，请先核对原操作。');return;}const messages=key==='sales'?state.messages:state.ui.altMessages[key];messages.push({role:'user',text});messages.push({role:'agent',text:key==='independent'?'这是零售事业部独立草稿的模拟讨论，可说明目标或测算依据。它不采用所选目标，也不生成或发布120万元目标的拆解。':key==='member'?'当前为会员复购候选的独立模拟讨论，建议先核对试点范围与成熟观察窗。本次未演示该目标的拆解，不沿用120万元目标的发布状态。':!state.gsaConfirmed?'已读取当前目标与策略。现有 G 与 S 已采用，但本期计划 A 仍须在“核对与采用”中一起确认，然后再拆解子目标。':'本次讨论以当前正式版为依据，不改写发布内容。要调整阶段计划，可在本目标内另起拆解修订草稿。'});render();}
  function openDialog(title,body,footer=''){dialogInvoker=document.activeElement;$('dialog-content').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="ghost small" data-dialog-close aria-label="关闭弹窗">✕</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;$('detail-dialog').showModal();const focus=$('detail-dialog').querySelector('[autofocus],input,textarea,button');focus?.focus();}

  function addAgent(text){state.messages.push({role:'agent',text});}
  function sendMessage(text){text=text.trim();state.ui.drafts.sales='';if(!text||!state.editingDraft||state.operation)return;if(!state.gsaConfirmed){notify('先确认总目标 GSA，再进入子目标拆解。');return;}state.messages.push({role:'user',text});if(!state.generated){state.generated=true;addAgent(state.scenario==='conflict'?'已形成拆解草稿。发现渠道与商品两份计划虽然各合计 120 万，但线下 × 羽绒服分别为 50 万与 45 万，线上 × 羽绒服也同时为 30 万与 35 万。须由双方先对齐交叉明细，不能用预留冲掉差异。':'已形成右侧草稿。已分配 115 万，5 万预留由商品负责人承担。8 万测算缺口分别由非活动期新品预计 5 万与平台额外增量预计 3 万补足。请核对责任、分配与计划后发布。');}else if(/延后|推迟|两周|2周/.test(text)){state.delayed=true;state.draftRevision++;addAgent('已把新品上市计划后移两周，前两周各移后 5 万，后两周各承接 5 万。已分配金额仍为 115 万，预留仍为 5 万；正式目标与原测算分别保留。修改依据已记入本草稿。');}else{addAgent('已把你的补充作为草稿约束保留。本原型只模拟已定义的交互，不生成真实预测。可继续核对预留、补缺策略及交叉项，或用“新品延后两周”体验草稿更新。');}render();}
  function completePublish(op){let existing=state.published.find(p=>p.operationId===op.id);if(!existing){existing={no:state.published.length+1,id:'GDT-retail-202701',operationId:op.id,gsa:'GSA-retail-202701/v1',draftRevision:op.draftRevision,delayed:state.delayed,weeks:state.delayed?[20,25,40,30]:[25,30,35,25],scope:'零售事业部全渠道与门店',allocations:clone(allocations()),reserve:{amount:5,purpose:state.reservePurpose,owner:state.reserveOwner},gapStrategies:[{name:'新品非活动期增量',expected:5},{name:'平台额外增量',expected:3}]};state.published.push(existing);}return existing;}
  function publish(){if(!canPublish()){notify('发布条件尚未满足，请处理具体待核项。');return;}state.operationCount++;const op={id:'demo-publish-'+String(state.operationCount).padStart(4,'0'),draftRevision:state.draftRevision,status:'accepted',attempts:1,queries:0,receipt:'accepted',versionNo:null,lastQuery:null};state.operation=op;if(state.scenario==='lost'){op.status='unknown';op.receipt=state.lostOutcome==='saved'?'accepted':state.lostOutcome==='not-executed'?'not-executed':state.lostOutcome==='not-found'?'not-found':'unknown';if(op.receipt==='accepted')op.versionNo=completePublish(op).no;render();notify('发布响应中断。原意图已保留，请先核对原操作结果。');}else{op.versionNo=completePublish(op).no;state.knownPublishedNo=op.versionNo;state.editingDraft=false;render();notify('目标拆解表 v'+op.versionNo+' 已发布，可按准确版本引用。');}}

  function reviewPublish(){if(!canPublish())return;const no=state.published.length+1;openDialog('核对并发布目标拆解表',`<p class="small-text muted">本次确认的是贡献分配与阶段计划。发布后形成可供下游引用的准确版本。</p><div style="margin-top:13px"><div class="review-line"><span>总目标依据</span><strong>GSA v1 · 正式目标 120 万</strong></div><div class="review-line"><span>可达测算 / 差额</span><strong>112 万 / 8 万</strong></div><div class="review-line"><span>已分配 + 明确预留</span><strong>115 万 + 5 万 = 120 万</strong></div><div class="review-line"><span>预留用途 / 责任人</span><strong>${esc(state.reservePurpose)} / ${esc(state.reserveOwner)}</strong></div><div class="review-line"><span>交叉项与补缺策略</span><strong>已对齐 · 预计贡献覆盖 8 万</strong></div><div class="review-line"><span>将形成正式版</span><strong>目标拆解表 v${no}</strong></div></div><p class="boundary">发布不创建任务，不代负责人安排人员或授权经营行动。下游由各自原入口承接。</p>`,`<button data-dialog-close>返回核对</button><button class="primary" data-action="confirm-publish" data-testid="confirm-publish">确认发布 v${no}</button>`);}
  function showReserve(){openDialog('核对预留用途与责任人',`<p class="small-text muted">预留 5 万属于目标分配，单独列示。缺少用途或责任人时不能发布。</p><form id="reserve-form" style="margin-top:15px"><div class="form-field"><label for="reserve-purpose">预留用途</label><input id="reserve-purpose" data-testid="reserve-purpose" value="${esc(state.reservePurpose)}"></div><div class="form-field" style="margin-top:12px"><label for="reserve-owner">责任人</label><input id="reserve-owner" data-testid="reserve-owner" value="${esc(state.reserveOwner)}"></div><div class="actions" style="margin-top:18px;justify-content:flex-end"><button class="primary" type="submit" data-testid="save-reserve">保存到草稿</button></div></form>`);}
  function showGap(){const editable=state.editingDraft&&!state.operation;openDialog('测算缺口与补足策略',`<div class="review-line"><span>正式目标 − 可达测算</span><strong>120 − 112 = 8 万</strong></div><div class="review-line"><span>新品非活动期增量</span><strong>预计 5 万</strong></div><div class="review-line"><span>平台额外增量</span><strong>预计 3 万</strong></div><p class="small-text muted" style="margin-top:13px">新品按非活动期范围测算，平台增量仅计活动额外贡献，两者不重复。预期贡献不是已实现结果。Agent 自主选择方法并说明证据，Host 只核对发布契约。</p>${editable?`<form id="gap-form" style="margin-top:16px"><label style="display:flex;gap:8px;align-items:flex-start;font-size:12px"><input type="checkbox" id="gap-present" data-testid="gap-present" ${state.gapStrategy?'checked':''}><span>草稿已包含上述补缺策略、贡献及范围依据</span></label><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="primary" type="submit" data-testid="save-gap">保存到草稿</button></div></form>`:''}`);}
  function reference(){const p=state.tab==='follow'?checkPlan():currentPublished();openDialog('下游引用准确的发布版',`<p class="small-text muted">${p?'本期正式版已固定。':'本原型展示计划发布后的引用形式。'}项目任务与 Case 各自记录准确版本及子目标，不随新草稿自动切换。</p><div style="margin-top:12px"><div class="review-line"><span>总目标</span><strong>GSA-retail-202701 / v1</strong></div><div class="review-line"><span>拆解计划</span><strong>GDT-retail-202701 / v${p?.no||1}</strong></div><div class="review-line"><span>本次汇总目标 / 检查点</span><strong>G-TOTAL / CP-202701-W2-TOTAL</strong></div><div class="review-line"><span>下游采用状态</span><strong>尚未办理行动授权</strong></div></div><p class="boundary">子目标引用示例为本表 G-01（线下 × 羽绒服），与本次总目标汇总检查分别记录。若只调整子目标检查点，修订拆解表即可。触及总目标 G、S 或上层 A 时须重新核对总目标 GSA。历史检查保留原版。</p>`);}
  function timeline(){openDialog('时间计划与阶段检查点',`<p class="small-text muted">每个责任目标均有对应阶段计划。此处展示总目标 G-TOTAL 的第 2 周汇总检查，阶段金额与本表引用版绑定。各子目标有独立检查点，不能把本表汇总金额当作单个子目标计划。</p><div style="margin-top:12px"><div class="review-line"><span>第 2 周汇总 · CP-202701-W2-TOTAL</span><strong>阶段计划 ${state.delayed?25:30} 万</strong></div><div class="review-line"><span>月末 · CP-202701-END</span><strong>期末正式目标 120 万</strong></div></div><p class="boundary">新品上市、可售货品与平台活动共同影响时间曲线。Agent 按实际约束安排，月份、周和单日粒度按需要展开。本原型仅展示周计划。</p>`);}
  function evidence(){openDialog('本次草稿采用的示例依据',`<div class="info-list"><div><h3>我情 · 可比经营数据 r2</h3><p>门店与渠道覆盖一致的净销售额、商品可售节奏。示例测算可达 112 万。</p></div><div><h3>行情与敌情 · 已获准材料</h3><p>活动日历与竞品公开促销观察仅作为外部假设。资料不足时说明影响，不强制凑齐三类材料。</p></div><div><h3>增量与经营约束</h3><p>新品与平台活动按不重叠范围估算 5 万、3 万。需要后续实绩验证，不能把数学对平当成因果成立。</p></div></div><p class="boundary">所有内容均为虚构资料。Demo 不执行预测算法或真实工具，正式产品沿统一 Pi 接入在权限内自主选择方法。</p>`);}
  function handleAction(action,source){
    if(['main-goals','main-adopt','main-cases','main-history'].includes(action)){captureInput();state.ui.mainTab=action.slice(5);if(innerWidth<=760&&state.ui.sidebarOpen)closeSidebar();render();return;}
    if(action==='select-sales'||action==='select-member'){captureInput();state.ui.selectedGoal=action==='select-sales'?'sales':'member';state.ui.conversationOwner='selected';render();return;}
    if(action==='start-decomposition'){if(state.gsaConfirmed){openDecomposition();}else{captureInput();state.ui.mainTab='adopt';render();$('gsa-review')?.scrollIntoView({block:'start'});}return;}
    if(action==='open-decomposition'){openDecomposition();return;}
    if(action==='expand-conversation'){expandConversation();return;}
    if(action==='toggle-theme'){captureInput();state.ui.theme=state.ui.theme==='light'?'dark':'light';applyTheme();persist();return;}
    if(action==='toggle-sidebar'){state.ui.sidebarOpen=!state.ui.sidebarOpen;updateSidebar();if(state.ui.sidebarOpen&&innerWidth<=760)$('sidebar-dialog').querySelector('.mobile-close')?.focus();persist();return;}
    if(action==='close-sidebar'){closeSidebar();return;}
    if(action==='toggle-primary'){primaryOpen=!primaryOpen;$('primary-links').hidden=!primaryOpen;source?.setAttribute('aria-expanded',String(primaryOpen));return;}
    if(action==='toggle-projects'){projectsOpen=!projectsOpen;$('project-space').hidden=!projectsOpen;source?.setAttribute('aria-expanded',String(projectsOpen));return;}
    if(action==='refresh-goals'){notify('已回读本次合成目标与来源，当前选中目标、输入和原发布意图保持。');return;}
    if(action==='history-check'){state.activeCheckId=source?.dataset.checkId;state.nextCheckPlanNo=null;state.ui.mainTab='goals';state.ui.workspaceOpen=true;state.tab='follow';render();$('goal-workspace')?.scrollIntoView({block:'start'});return;}
    if(action==='help'){openDialog('目标管理原型说明','<p>主导航、目标列表、四个工作视图及目标 Agent 对话沿用 main d4b60b5 的真实界面。</p><p>本次新增总目标 GSA 的计划 A、Agent 拆解草稿、负责人发布及原操作失答恢复。新增能力用虚构资料与脚本模拟，尚未上线。</p><p>先选中目标并开始目标拆解，在“核对与采用”一次确认 GSA，然后向原目标 Agent 普通发送请求。底部“原型评审”可切换异常场景。</p>');return;}
    if(action.startsWith('existing-')){const labels={'existing-new-project':'新建项目','existing-strategy':'战略选择','existing-cases':'决策星图','existing-projects':'项目地图','existing-semantic':'语义资产','existing-analysis':'分析资产','existing-archived':'已归档项目','existing-settings':'设置','existing-analysis-workspace':'分析工作区','existing-decision-workspace':'决策工作区','existing-import':'导入 Excel','existing-new-goal':'新建候选目标','existing-goal-case':'从此目标创建 Case','existing-goal-project':'从此目标开始项目','existing-revise-goal':'提出目标修订','existing-member-adopt':'采用会员候选'};if(innerWidth<=760&&state.ui.sidebarOpen)closeSidebar();openDialog(labels[action]||'既有产品入口','<p>这是 main 中已有的产品入口，本次保留界面位置。</p><p>当前原型只演示所选120万元目标的 GSA、拆解与发布、阶段跟进。此入口在原产品办理，本原型不创建项目、修改目标、配置或授权行动。</p>');return;}
    switch(action){case'confirm-gsa':state.gsaConfirmed=true;openDecomposition();notify('总目标 GSA v1 已确认。已展开原目标 Agent，发送请求后才生成拆解草稿。');break;case'suggest-initial':$('chat-input').value='按渠道、品类拆解目标，并结合新品与平台活动安排周计划。预留 5 万用于新品上市，由商品负责人承担。';$('chat-input').focus();break;case'suggest-delay':$('chat-input').value='新品延后两周，活动预算不变，请更新受影响的周计划。';$('chat-input').focus();break;case'save-draft':if(state.generated&&!state.operation&&state.editingDraft){state.saveCount++;persist();notify('草稿 r'+state.draftRevision+' 已保存。'+(hasConflict()?'交叉冲突与双方依据原样保留。':'尚未形成正式发布版。'));}break;case'review-publish':reviewPublish();break;case'confirm-publish':closeDialog();publish();break;case'query-publish':query();break;case'retry-publish':retry();break;case'tab-plan':state.tab='plan';render();break;case'tab-follow':if(state.knownPublishedNo){state.tab='follow';render();}break;case'edit-reserve':showReserve();break;case'show-gap':showGap();break;case'show-reference':reference();break;case'show-timeline':timeline();break;case'show-evidence':evidence();break;case'revise':state.ui.conversationOpen=true;state.editingDraft=true;state.operation=null;state.draftRevision++;state.tab='plan';addAgent('已在原 GSA v1 下建立新的拆解草稿，旧发布版及其引用保持原样。微小计划调整可只修订拆解表；若触及 G、S、上层 A，应先重新确认 GSA。');render();notify('已另起拆解修订草稿，可继续提出调整。');break;case'continue-case':if(selectedCheck())selectedCheck().caseChoice='existing';render();notify('已选择续接已有 Case，准确计划与实绩引用已带入演示承接卡。');break;case'new-case':openDialog('确认另建 Case 草稿',`<p class="small-text">已有同一问题的 Case C-014。若本次确有独立决策问题，可另建草稿，并保留与原事项的关联。</p><p class="boundary">这里只模拟负责人明确选择，不启动行动，也不产生真实 Case。</p>`,`<button data-dialog-close>返回已有事项</button><button class="primary" data-action="confirm-new-case" data-testid="confirm-new-case">明确另建 Case 草稿</button>`);break;case'confirm-new-case':closeDialog();if(selectedCheck())selectedCheck().caseChoice='new';render();notify('已模拟建立独立 Case 草稿，后续取舍与行动由负责人承接。');break;case'next-check':state.activeCheckId=null;state.nextCheckPlanNo=state.knownPublishedNo;state.report=null;render();notify('已明确选用当前生效 v'+state.knownPublishedNo+' 开始下一次检查，历史检查保持原版。');break;case'observe':notify('本次检查和提示已保留，负责人选择继续观察，没有创建 Case。');break;}}
  document.addEventListener('click',event=>{const close=event.target.closest('[data-dialog-close]');if(close){closeDialog();return;}const button=event.target.closest('[data-action]');if(button&&!button.disabled)handleAction(button.dataset.action,button);});
  document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();sendConversation($('chat-input').value);}if(event.target.id==='align-form'){event.preventDefault();const value=Number($('aligned-value').value),basis=$('alignment-basis').value.trim();state.alignmentDraftValue=$('aligned-value').value;state.alignmentDraftBasis=basis;if(![45,50].includes(value)||!basis){state.alignmentError='本演示请采用双方已确认的 45 万或 50 万完整方案，并填写双方确认依据。正式产品由 Agent 核对完整明细，不能只改一个交叉值。';render();$('aligned-value')?.focus();return;}state.aligned=true;state.alignedValue=value;state.alignmentBasis=basis;state.alignmentError='';state.draftRevision++;addAgent('已依据双方确认采用 '+value+' 万方案的完整明细，同时展示受影响的另一个交叉单元，重新汇总各视图合计仍为 120 万。冲突没有转成预留，可继续核对后发布。');render();notify('双方确认依据与受影响明细已保存，交叉项重新校验通过。');}if(event.target.id==='reserve-form'){event.preventDefault();state.reservePurpose=$('reserve-purpose').value.trim();state.reserveOwner=$('reserve-owner').value.trim();state.draftRevision++;closeDialog();render();notify(state.reservePurpose&&state.reserveOwner?'预留用途与责任人已更新。':'草稿已保存，预留字段待补，发布保持停用。');}if(event.target.id==='gap-form'){event.preventDefault();state.gapStrategy=$('gap-present').checked;state.draftRevision++;closeDialog();render();notify(state.gapStrategy?'补缺策略已保留在草稿中。':'草稿已保存，补缺策略待补，不能发布。');}if(event.target.id==='report-form'){event.preventDefault();if(selectedCheck())return;const report=$('report-select').value;if(!report){notify('请选定本次使用的实绩资料。');$('report-select').focus();return;}const plan=checkPlan();if(!plan)return;state.report=report;const comparison=comparisonFor(report,plan),trigger=triggerFor(report,state.threshold,comparison.percentages);const check={id:'CHECK-'+String(state.checkHistory.length+1).padStart(3,'0'),report,planNo:plan.no,goalId:'G-TOTAL',checkpointId:'CP-202701-W2-TOTAL',caseChoice:null,threshold:state.threshold,comparison,trigger,sourceRef:report==='incomplete'?'actual-202701-w2-partial/r1':report==='two-periods'?'actual-202701-w1-w2/r1':'actual-202701-w2-complete/r2'};state.checkHistory.push(check);state.activeCheckId=check.id;state.nextCheckPlanNo=null;render();notify(report==='incomplete'?'覆盖不完整，保留待补，不给整体偏差结论。':'新检查已保存，按所选的准确发布版分析，原检查记录保持原样。');}});
  document.addEventListener('change',event=>{if(event.target.id==='scenario'){if($('chat-input'))$('chat-input').value='';state=initial(event.target.value);state.ui=uiDefaults();render();notify('演示场景已重置，请从确认 GSA 开始。');}if(event.target.id==='lost-outcome'&&!state.operation){state.lostOutcome=event.target.value;persist();}if(event.target.id==='check-history'){state.activeCheckId=event.target.value||null;const check=selectedCheck();state.report=check?.report||null;state.nextCheckPlanNo=null;render();notify('已打开所选历史检查，计划版本、实绩与 Case 选择保持原样。');}if(event.target.id==='conversation-owner'){captureInput();state.ui.conversationOwner=event.target.value;render();}if(event.target.id==='perspective'){notify('已选择适用视角。本演示两项目标均属营利组织，当前选择与草稿保留。');}if(event.target.id==='threshold-select'){state.threshold=event.target.value;render();notify((selectedCheck()?'下次检查的配置已更新，本记录阈值与触发理由保持原样。':state.threshold==='none'?'未配置阈值，阶段比较仍可使用。':'已使用示例阈值，任一条件达到就提示 Case。'));}});
  document.addEventListener('input',event=>{if(event.target.id==='chat-input'){state.ui.drafts[event.target.dataset.owner||conversationKey()]=event.target.value;persist();}if(event.target.id==='gsa-decision'){state.ui.gsaDecision=event.target.value;persist();}});
  $('close-conversation').addEventListener('click',collapseConversation);$('conversation-dialog').addEventListener('cancel',event=>{event.preventDefault();collapseConversation();});$('sidebar-dialog').addEventListener('cancel',event=>{event.preventDefault();closeSidebar();});
  let wasMobile=innerWidth<=760;addEventListener('resize',()=>{const mobile=innerWidth<=760;if(mobile!==wasMobile){wasMobile=mobile;state.ui.sidebarOpen=!mobile;updateSidebar();persist();}});
  $('reset-demo').addEventListener('click',()=>{if($('chat-input'))$('chat-input').value='';state=initial(state.scenario);state.ui=uiDefaults();render();notify('本场景的合成状态已重置。');});
  $('reopen-demo').addEventListener('click',()=>{persist();if(memoryOnly){notify('当前浏览器不提供存储，无法模拟重开恢复。请通过本地 HTTP 预览打开。');return;}location.reload();});
  $('detail-dialog').addEventListener('close',()=>{if(dialogInvoker?.isConnected)dialogInvoker.focus();});
  Object.defineProperty(window,'demoInspect',{value:()=>Object.freeze(clone({scenario:state.scenario,gsaConfirmed:state.gsaConfirmed,generated:state.generated,draftRevision:state.draftRevision,conflict:hasConflict(),aligned:state.aligned,alignedValue:state.alignedValue,publishedCount:state.published.length,published:state.published,knownPublishedNo:state.knownPublishedNo,operationCount:state.operationCount,operation:state.operation,saveCount:state.saveCount,gapStrategy:state.gapStrategy,reservePurpose:state.reservePurpose,reserveOwner:state.reserveOwner,editingDraft:state.editingDraft,check:selectedCheck(),checkHistory:state.checkHistory,activeCheckId:state.activeCheckId,nextCheckPlanNo:state.nextCheckPlanNo,threshold:state.threshold,caseChoice:selectedCheck()?.caseChoice||null,ui:state.ui})),writable:false,configurable:false});
  render();
})();
</script>
