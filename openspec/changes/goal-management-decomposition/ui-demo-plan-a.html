<script>
(()=>{
  'use strict';

  const pageUrl = new URL(location.href);
  const queryEntry = pageUrl.searchParams.get('entry');
  const fileEntry = document.documentElement.dataset.entry;
  const hashEntry = {'#try-confirmed':'confirmed','#try-missing':'missing'}[location.hash];
  const previewEntry = [queryEntry, fileEntry, hashEntry].find(value => ['ready','confirmed','missing','plan-a'].includes(value));
  function newTrialId(){
    return globalThis.crypto?.randomUUID?.() || (Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  }
  function trialId(){
    if (!previewEntry) return '';
    const requested = pageUrl.searchParams.get('trial');
    if (requested && /^[a-zA-Z0-9-]{1,80}$/.test(requested)) return requested;
    const kind = performance.getEntriesByType('navigation')[0]?.type;
    if (kind==='reload' || kind==='back_forward'){
      const prior = history.state?.optraTrialId;
      if (prior) return prior;
    }
    const id = newTrialId();
    try { history.replaceState({...history.state,optraTrialId:id},''); } catch {}
    return id;
  }
  const STORE='optracall.goal-journey.v1' + (previewEntry ? '.'+previewEntry+'.'+trialId() : '');
  function openFreshEntryExample(mode){
    if (!['ready','confirmed','missing'].includes(mode)) return;
    const next = new URL(location.href);
    next.searchParams.set('entry',mode);
    next.searchParams.set('trial',newTrialId());
    next.hash='';
    location.assign(next.href);
  }
  function firstEntryPreview(){
    if (!previewEntry) return false;
    try { return !sessionStorage.getItem(STORE); } catch { return true; }
  }
  const seedEntryPreview = firstEntryPreview();
  const $=id=>document.getElementById(id);
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone=value=>JSON.parse(JSON.stringify(value));
  let memoryOnly=false;
  function initial(scenario='normal'){return {schema:2,scenario,lostOutcome:'saved',gsaConfirmed:false,generated:false,tab:'plan',messages:[],draftRevision:1,delayed:false,reservePurpose:'新品上市预留',reserveOwner:'商品负责人',gapStrategy:true,aligned:false,alignedValue:50,alignmentBasis:'',alignmentDraftValue:'',alignmentDraftBasis:'',alignmentError:'',published:[],knownPublishedNo:null,editingDraft:true,operation:null,operationCount:0,saveCount:0,report:null,checkHistory:[],activeCheckId:null,nextCheckPlanNo:null,threshold:'configured'};}
  function restore(key=STORE){try{const value=JSON.parse(sessionStorage.getItem(key));if(value&&[1,2].includes(value.schema)&&['normal','conflict','lost'].includes(value.scenario)){if(value.schema===1){value.editingDraft=!value.knownPublishedNo;value.checkHistory=value.check?[{...value.check,id:'CHECK-001',threshold:value.threshold||'configured',caseChoice:value.caseChoice||null}]:[];value.activeCheckId=value.checkHistory[0]?.id||null;value.nextCheckPlanNo=null;value.schema=2;delete value.check;delete value.caseChoice;}return value;}}catch{}return initial();}
  let state=restore(),dialogInvoker=null,toastTimer;
  const uiDefaults=()=>({selectedGoal:'sales',draftInput:'',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',sidebarOpen:innerWidth>760,selectedVersion:'',versionSelections:{},sourceAccess:{},caseYear:'',newCases:[],caseContinuations:[],handoffs:[],reviewSelected:[],nextCycleDraft:null});
  state.ui={...uiDefaults(),...(state.ui||{})};
  delete state.ui.surface;
  let primaryOpen=true,projectsOpen=true;
  const isSales=()=>state.ui.selectedGoal==='sales';
  const verifiedPublications=()=>state.published.filter(pub=>state.knownPublishedNo!==null&&pub.no<=state.knownPublishedNo);
  function captureInput(){const input=$('chat-input');if(input&&isSales())state.ui.draftInput=input.value;}

  function persist(){try{sessionStorage.setItem(STORE,JSON.stringify(state));}catch{memoryOnly=true;}}
  function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4800);}
  const selectedCheck=()=>state.checkHistory.find(c=>c.id===state.activeCheckId)||null;
  const currentPublished=()=>state.published.find(p=>p.no===state.knownPublishedNo);
  const checkPlan=()=>{const c=selectedCheck();return state.published.find(p=>p.no===(c?.planNo||state.nextCheckPlanNo||state.knownPublishedNo));};
  function reportInfo(id){
    const reports={

  function updateGsaEditor(){

    const missing=draft.actions.some(row=>currentPolishIssue(row,0)||gsaColumns.some(f=>!row[f.key]));
    const note=!changes.length?'当前内容与生效版一致。':missing?'请补齐每项计划的行动、阶段检查点及观察依据。':!draft.reason?'请填写修订原因。':'确认后形成新版本。';

    document.querySelector('[data-testid="gsa-confirm-revision"]').disabled=!changes.length||missing||!draft.reason||gsaLocked();

  function saveGsaEdit(confirm){

      state.ui.gsaInitialActions=clone(draft.actions);
      if(entryCandidate()){
        const first=draft.actions[0],f=entryFields();
        for(const field of gsaColumns)f[field.key]=first[field.key];

    }else{
      const previous=gsaPlan(draft.base);
      const changes=changeList(previous.actions,draft.actions);
      if(!changes.length)return;
      if(confirm){
        if(!draft.reason||draft.actions.some(row=>currentPolishIssue(row,0)||gsaColumns.some(f=>!row[f.key])))return;
        const next=makeGsaPlan(draft.base+1,draft.actions,draft.reason,changes,new Date().toISOString());
        state.ui.gsaHistory=[...clone(gsaHistory()),next];
        delete state.ui.gsaRevisionDraft;
        state.ui.versionSelections={...state.ui.versionSelections,sales:'gsa-v'+next.version};

  }


  // The trial has one active sales goal and a read-only historical goal.
  // Eligibility uses the active goal/strategy values, independent of source type.
  function adviceContext(){
    if(!isSales()||gsaLocked()||(entryCandidate()&&!entryFields().linked))return null;
    const goal=goalInfo(),plan=gsaPlan()||makeGsaPlan(0,[],'',[],null);
    if(!plan.strategy||plan.goalValue==null||!goal.period||!goal.scope)return null;
    return {period:goal.period,scope:goal.scope,strategy:plan.strategy,metric:'净销售额',target:plan.goalValue+' '+plan.unit};
  }
  const adviceThemes=[
    {key:'store',matches:/到货|可售|陈列|重点门店|缺货/},
    {key:'increment',matches:/不重叠|去重|重复计入|贡献边界|非活动期/},
    {key:'campaign',matches:/平台|活动期|投放|促销/},
    {key:'closing',matches:/月底|月末|结账|退款|对账/}
  ];
  function adviceTheme(row){
    for(const text of [row.action,row.checkpoint,row.basis])
      for(const theme of adviceThemes)if(theme.matches.test(text||''))return theme.key;
    return null;
  }
  const adviceEmpty=row=>gsaColumns.filter(f=>!String(row[f.key]||'').trim());
  function nextAdviceTheme(rows){
    const used=new Set(rows.map(adviceTheme).filter(Boolean));
    return adviceThemes.find(theme=>!used.has(theme.key))?.key||null;
  }
  function rowCanTakeAdvice(row,others){
    const gaps=adviceEmpty(row);
    return gaps.length>0 && (gaps.length<gsaColumns.length || !!nextAdviceTheme(others));
  }
  function adviceHint(ready){
    return ready?'模拟 Agent 参考本期 G 和 S。推荐只补空项。先写几个关键词，也可一键优化本行并撤销。':'先在本期 GSA 表承接战略发布版 G 和 S，再让 Agent 推荐计划。';
  }
  function inlineAdviceInfo(rows){
    const ready=!!adviceContext(),first=rows[0],adding=adviceEmpty(first).length===0;
    const allowed=ready && (adding?!!nextAdviceTheme(rows):rowCanTakeAdvice(first,rows.slice(1)));
    return {adding,allowed,label:adding?'让 Agent 推荐并新增一项计划 A':'让 Agent 推荐计划 A',
      hint:ready&&!allowed?'本示例的不同计划建议已覆盖，可继续手工填写。':adviceHint(ready)};
  }
  function adviceInlineControls(rows){
    const info=inlineAdviceInfo(rows);
    return `<div class="plan-advice-inline"><button type="button" class="small plan-advice-trigger" data-plan-advice data-action="plan-advice-inline" data-testid="plan-a-recommend-inline" aria-describedby="plan-a-inline-hint" ${info.allowed?'':'disabled'}>${info.label}</button>
      ${entryCandidate()?polishButtons(rows[0],null):''}<small id="plan-a-inline-hint" data-testid="plan-a-inline-hint">${info.hint}</small></div>`;
  }
  function syncAdviceInline(){
    const button=document.querySelector('[data-testid="plan-a-recommend-inline"]');

  function syncAdviceEditor(rows){
    const ready=!!adviceContext(),form=$('gsa-editor');
    if(!form)return;
    form.querySelectorAll('[data-action="plan-advice-row"]').forEach((b,i)=>{
      const row=rows[i];
      b.disabled=!ready || !rowCanTakeAdvice(row,rows.filter((_,j)=>i!==j));
      b.textContent=adviceEmpty(row).length?'让 Agent 推荐本项计划 A':'本项已填齐';

  }
  // Generate content only in response to an explicit recommendation click.
  function samplePlanAdvice(ctx,theme,row){
    const action=row.action?.trim(),cp=row.checkpoint?.trim(),basis=row.basis?.trim();
    if(theme==='store')return {action:'在重点门店试行新品陈列，登记可售货品、缺货与陈列执行情况。',
      checkpoint:ctx.period+'首周末核对试点门店到货、上架与可售范围，标记需补货的门店。',
      basis:'建议对照新品到货单、陈列检查记录及可比门店的'+ctx.metric+'日报。'};
    if(theme==='campaign')return {action:'按平台活动日历登记参与渠道、活动商品与纳入口径的订单。',
      checkpoint:ctx.period+'第 2 周末核对活动覆盖及同口径'+ctx.metric+'，区分已退款订单。',
      basis:'建议核对平台活动日历、活动订单明细及同归属期退款记录。'};
    if(theme==='closing')return {action:'在全渠道对齐订单与退款归属期，汇总当月可比'+ctx.metric+'。',
      checkpoint:ctx.period+'结账后，对照正式目标 '+ctx.target+' 核对当期金额及范围缺口。',
      basis:'建议核对各渠道结账报表、退款明细及本期'+ctx.metric+'指标定义。'};
    if(theme==='increment')return {action:'为新品非活动期订单与平台活动订单划定不重叠的贡献范围，单列归属待核订单。',
      checkpoint:ctx.period+'活动结算后，抽核订单的渠道、活动标记和商品归属，检查增量是否重复计入。',
      basis:'建议对照新品清单、活动范围与订单标记，按同一'+ctx.metric+'口径复核。'};
    return {action:cp?'围绕「'+cp+'」安排'+ctx.scope+'的落实检查，依据'+ctx.strategy+'核对本期执行范围。'

  function advisedRow(ctx,row,others){
    if(!ctx||!rowCanTakeAdvice(row,others))return null;

  function additionalAdvisedRow(ctx,rows){

  function recommendInline(){

  function rawAdviceEditor(){

  function recommendEditor(source,adding){

  const inlinePolishUndo=new WeakMap(),editorPolishUndo=new Map();
  const polishKeys=['action','checkpoint','basis'];
  let editorPolishIssues={};
  function polishDraftIssues(actions){
    return Object.fromEntries(actions.filter(row=>currentPolishIssue(row,0)).map(row=>[row.id,editorPolishIssues[row.id]]));
  }
  function currentPolishIssue(row,index){
    const issue=(index===null?state.ui.polishIssues:editorPolishIssues)?.[row.id];
    if(!issue)return '';
    // Evaluate the whole current input, including after deletion and IME edits. Only flagged rows use this check.
    const supplied=polishParts(row.basis).flatMap(text=>text.split(/但是|但(?=可|使|用|采|以|凭)/))
      .some(text=>text.trim()&&! /^(?:也|请|仅|只|暂|仍|同时)?(?:不|禁止|勿|排除|免做|不得|避免|拒绝|无须|无需|未明确|待定|待补|待明确|依据待)/.test(text.trim()));
    return supplied?'':issue;

  function setPolishIssue(row,index,issue){

  }
  function polishIssueHint(issue){return issue?'观察依据待补：'+issue+'。请填写允许使用的依据。':'';}
  function polishRecord(row,index){

  function polishState(row,index){

  }
  function polishButtons(row,index){

  // Locally simulated language support. Match affirmative work, keeping restrictions in the original sentence.
  const polishActivities=[
    [/回访|走访|续约|访谈|访客|客户跟进|联系客户|联系会员/,'列出本次要联系的对象，登记需要跟进的问题','逐项核对联系记录与待跟进问题','本次联系记录及后续反馈'],
    [/盘点|查库存|库存|缺货|补货|补货单|断货/,'核对账面数量与现场记录，标出需复核的条目','核查盘点范围、账实差异和待处理条目','相同范围的库存台账与盘点记录'],
    [/陈列|摆货|摆放|货架|陈设/,'按陈列要求逐项核对陈列位置，登记需调整的项目','对照陈列要求核查完成项和未完成项','对应门店的陈列清单与现场记录'],
    [/退款|退货|结账|对账|核销/,'按原有口径核对交易记录，单列差异项','逐笔复核归属及尚未解释的差异','相同口径的交易明细与核对记录'],
    [/培训|带教|演练/,'整理要覆盖的内容，记录需要再讲解的环节','对照安排核查实际覆盖内容和待复习项目','本次培训内容清单与练习记录'],
    [/活动|促销|转化|投放/,'列出涉及的环节及待验证的变化','按约定范围核对各环节记录，标出待验证项','同一范围的活动安排与过程记录'],
    [/签收|交接|验收|交付/,'逐项列出交付内容与待核差异','逐项核对交付清单与对应记录，标出差异','对应的交接清单与原始记录'],

    [/温度|温控|冷链/,'记录观察对象和测量条件，标出需复核的读数','核查原始读数及异常项的复核情况','同一对象的测量记录与复核备注']
  ];
  const polishRestrict=/(?:仅|只|禁止|不得|不要|不再|不含|不计|不做|不看|不用|不追加|不新增|不纳入|不扩|不涉及|不超过|不低于|不早于|不晚于|不能|不可|排除|除外|限于|勿)/;

  function polishParts(text){return String(text||'').trim().split(/[；;。！？\n]+|(?<!\d)[，,]|[，,](?!\d)/).map(x=>x.trim()).filter(Boolean);}
  function polishText(text){

  function polishJoin(original,core,detail){

  function formPlanPolish(original,context){
    const action=polishText(original.action),checkpoint=polishText(original.checkpoint),basis=polishText(original.basis);
    const all=[action,checkpoint,basis].filter(Boolean),parts=all.flatMap(polishParts);
    const preferred=parts.filter(x=>/^(?:只|仅|限于)/.test(x));
    const pos=[...preferred,...parts].map(x=>x.split(/(?:禁止|不得|不要|不|免做|免于|无需|无须|暂停|暂缓|取消|跳过|停止|排除|避免|勿)/)[0]).filter(Boolean);
    const activity=pos.map(x=>polishActivities.find(a=>a[0].test(x))).find(Boolean);

    const subject=action||checkpoint||basis;
    const focus=subject.length<=60?'「'+subject.replace(/[。；;]+$/,'')+'」':'本行已列明的事项';
    const genericAction=action?'列明需要完成的事项，记录待处理问题':'围绕'+focus+'列明本期要落实的事项';
    const genericCheck='对照'+(action?focus:'本行约定')+'逐项核查完成情况与待处理问题';
    const planningOnly=parts.some(x=>/(?:只|仅)(?:拟定|拟订|编写|整理|准备|设计|起草|讨论|梳理|制定).*(?:方案|预案|计划|草案)|(?:暂不|不)(?:实际)?(?:实施|执行|上线|落地)/.test(x));
    const noRecord=parts.some(x=>/(?:不得|不要|不作|不做|不|勿|禁止|免于)(?:再|另行|留存|做)?(?:保留|登记|记录|拍照|保存|留痕)/.test(x));
    let actionDetail=activity?activity[1]:genericAction;
    let cpDetail=activity?activity[2]:genericCheck;
    let evidence=activity?activity[3]:'与'+focus+'对应的原始工作记录';
    if(context.strategy.includes('新品')&&pos.some(x=>/新品/.test(x))&&activity?.[0].test('陈列')){
      cpDetail='按本项新品范围核查陈列位置，区分已落实与待调整的项目';
    }
    if(!restricted && pos.some(x=>/销售贡献|销售额|成交额|销售增量/.test(x)))
      cpDetail+='，涉及销售贡献时按本期'+context.metric+'口径核对';
    if(planningOnly){actionDetail='在草案中列明适用范围和待确认事项';cpDetail='核对草案是否覆盖所列事项及约束';evidence='本项草案及其审阅意见';}
    if(noRecord){
      actionDetail='按原文限定的方式落实本项安排';
      cpDetail='在原有约束内复核本项安排是否落实';
      evidence='允许使用的现有信息';
    }
    // A single field often contains the action, deadline, permitted evidence and exclusions.
    // Carry whole qualifying clauses across fields so thresholds, dates and negations keep their meaning.
    const sourceNoun=/(?:日报|周报|月报|报表|清单|记录|凭证|照片|截图|图像|数据|流水|台账|回执|日志|小票|签字|签收单|口头确认|口述|当面确认|口头反馈|POS|CRM|ERP|表格)/i;
    const sourceClause=x=>/^(?:(?:观察)?依据[：:]|(?:证据|来源)[：:]|以.+(?:为准|为据|为依据)|凭.+(?:记录|清单))/.test(x) ||
      (sourceNoun.test(x) && /(?:用|参考|对照|根据|为准|依据|为证|为据|仅看|只看|接受|采信|认可|允许|不看|不查|不取|不采|不调|不得|排除|不留|不拍|不能|禁止)/.test(x));
    const sources=[...new Set(parts.filter(sourceClause))];
    const forbidden=x=>/^(?:也|请|同时)?(?:不|禁止|勿|排除|免做|不得|避免|拒绝|无须|无需)/.test(x);
    const deniedSources=sources.filter(forbidden),permittedSources=sources.filter(x=>!forbidden(x));
    const noPositiveSource=deniedSources.length>0&&!permittedSources.length &&
      (!basis||polishParts(basis).every(x=>forbidden(x)||!sourceNoun.test(x)));
    const oralSource=permittedSources.some(x=>/口头|口述|当面确认/.test(x));
    const outsideBasis=sources.filter(x=>!polishParts(basis).includes(x));
    const mixedWork=x=>! /^(?:不|禁|免|勿|拒)/.test(x) && /(?:日报|周报|表|清单|记录|凭证|小票|回执|台账|流水|截图|照片|签字单)(?:来|去|逐项|逐笔)?(?:复核|核对|盘点|核验|检查|验收|排查).+/.test(x);
    const actionClauses=input=>polishParts(input).filter(x=>!sourceClause(x)||mixedWork(x));
    const limitedSource=deniedSources.length>0||permittedSources.some(x=>/(?:只|仅|限于)/.test(x));
    const onlyMaterial=pos.find(x=>/^(?:只|仅)(?:整理|编写|拟定|起草|梳理|准备|制定).+/.test(x));
    if(onlyMaterial){
      const item=onlyMaterial.replace(/^(?:只|仅)(?:整理|编写|拟定|起草|梳理|准备|制定)/,'');
      actionDetail='按原范围梳理'+item+'，标出尚待完善的条目';
      cpDetail='逐项核对'+item+'的覆盖情况，列出待补内容';
      evidence='本次整理的'+item;
    }
    if(limitedSource){
      actionDetail=noPositiveSource?'先明确可用依据，再逐项核对原定安排':'按本行指定的依据逐项核对，无法验证的事项保留待核';
      cpDetail='用本行限定的依据核查'+(pos.some(x=>/新品陈列/.test(x))?'新品陈列要求':'原定事项')+'，区分已有依据和仍待核实的项目';
    }
    const preserveAll=noPositiveSource||all.some(x=>x.length>420)||sources.join('，').length+(basis||'').length>450;
    const actionSource=action||[checkpoint,basis].find(field=>actionClauses(field).some(x=>/陈列|补货|回访|复购|盘点|联系|整理|推动|落实|排查|收集|订货|核对|盘查|举办|搭建|梳理|尝试|核验|安排/.test(x)))||'';
    const workParts=actionClauses(actionSource);
    const work=preserveAll||workParts.length===polishParts(actionSource).length?actionSource:workParts.join('，');
    const givenScope=work.match(/^([^，,；;。]+(?:家门店|家店|个门店|个试点|片区|区域))([，,；;])/);
    const actionCore=givenScope&&!/^(?:在|仅|只|限|排除|除|不)/.test(work)?'在'+work:work;
    if(!actionCore && !activity && (basis||sources.length)){
      const allowed=sources.find(x=>/^(?:仅|只)(?:能|可)?(?:能|可)?(?:用|看|以|凭|参考|对照)/.test(x));
      const named=allowed?.replace(/^(?:仅|只)(?:能|可)?(?:能|可)?(?:用|看|以|凭|参考|对照)/,'').replace(/(?:为准|为据|为依据)$/,'');
      const material=named&&named.length<=45?'「'+named+'」':'本行允许使用的资料';
      const subject=context.strategy.includes('新品')&&context.strategy.includes('活动')?'本期新品或平台活动':'本期策略';
      actionDetail='核查'+material+'中是否有与'+subject+'相符的条目，能对应的逐项核对，其余列为待核';
      cpDetail='复核已匹配的条目与本期策略是否相符，单列资料无法验证的部分';
    }
    const actionLine=actionCore||(activity?(restricted?'在原定范围内，':'')+actionDetail:'');
    const timeClause=[...actionClauses(checkpoint),...workParts].find(x=>polishTime.test(x));
    let timing=timed?'按本行给定的时间安排':'在'+context.period+'阶段检查时';
    if(timeClause && timeClause.length<=120){
      const deadline=timeClause.match(/^(?:在)?((?:(?:本|下|上)?周[一二三四五六日天末]|星期[一二三四五六日天]|月[初末底]|(?:\d{4}年)?\d{1,2}月\d{1,2}[日号]|\d{4}-\d{2}-\d{2})(?:之前|之后|以前|以后|前|后|当日|当天|以内|内)?)(?=完成|复核|核对|检查|落实|安排|盘点|收集|进行|复盘|[，,]|$)/);
      timing=deadline?deadline[1]:'按「'+timeClause+'」的约定';
    }
    const actualChecks=actionClauses(checkpoint);
    const cpCore=preserveAll||actualChecks.length===polishParts(checkpoint).length?checkpoint:actualChecks.join('，');
    const cpSentence=cpCore||timing+'，'+cpDetail;
    const supplied=basis||sources.join('，');
    let basisCore=supplied
      ?(/^[^，,。；;]{1,45}(?:记录|表|凭证|照片|清单|台账|流水|回执|日志|截图|周报|小票|签字单)$/.test(supplied)&&!polishRestrict.test(supplied)&&! /^(?:用|查|看|以|按|对照|参考|依据|核对|核查|比对|保留|建议)/.test(supplied)?'对照'+supplied:supplied)
      :'建议以'+evidence+'为依据';
    if(noPositiveSource){
      basisCore='依据待明确；'+(basis?[basis,...outsideBasis].join('，'):deniedSources.join('，'));
    }else if(basis && outsideBasis.length){
      const limit=outsideBasis.join('，');
      basisCore=/(?:只|仅|不|禁|排除)/.test(limit)?limit+'。核对原填依据是否在允许范围内：「'+basis+'」':basisCore+'。按本行约定，'+limit;
    }
    return {
      action:polishJoin(original.action,actionLine,actionCore||!activity?actionDetail:noRecord?'核对执行要求是否符合原有限制':'注明各项的处理状态'),
      checkpoint:polishJoin(original.checkpoint,cpSentence,cpCore?cpDetail:''),
      unresolved:noPositiveSource?deniedSources.join('，'):'',
      basis:noPositiveSource?original.basis:polishJoin(original.basis,basisCore,oralSource?'口头确认未能说明的部分列为待核':limitedSource?'凭证不能证明的部分列为待核':noRecord?'核查时遵守本行的信息留存限制':'标明记录对应的事项，保留可回查的出处')
    };
  }
  function applyPlanPolish(source,undo){
    const index=source.dataset.polishAt==='inline'?null:Number(source.dataset.polishAt);
    const ctx=adviceContext();
    if(!ctx || (index===null&&(!entryCandidate()||state.gsaConfirmed)))return;
    const draft=index===null?null:rawAdviceEditor();
    if(index!==null && (!draft||draft.base!==gsaVersion()))return;
    const row=index===null?gsaDraftActions()[0]:draft.actions[index];
    if(!row)return;
    const ledger=index===null?inlinePolishUndo:editorPolishUndo,recordKey=index===null?state.ui:row.id,prior=ledger.get(recordKey);
    let values={},kept=0;
    if(undo){
      if(!prior)return;
      for(const k of polishKeys){
        if(!prior.edited.has(k)&&row[k]===prior.after[k])values[k]=prior.before[k];
        else{values[k]=row[k];kept++;}
      }
      if(!prior.edited.has('basis') && row.basis===prior.after.basis)setPolishIssue(row,index,prior.beforeIssue);
      ledger.delete(recordKey);
    }else{
      if(!polishState(row,index).can)return;
      const original={...row};
      // Reapplying after a manual edit should not polish the previous simulated additions again.
      for(const k of polishKeys)if(prior&&!prior.edited.has(k)&&row[k]===prior.after[k])original[k]=prior.source[k];
      values=formPlanPolish(original,ctx);
      if(polishKeys.every(k=>row[k]===values[k])&&currentPolishIssue(row,index)===(values.unresolved||'')){notify('本行已保留完整，无需调整。');return;}
      ledger.set(recordKey,{before:{...row},beforeIssue:currentPolishIssue(row,index),source:original,after:values,edited:new Set()});
      setPolishIssue(row,index,values.unresolved);
    }
    for(const k of polishKeys){
      const input=index===null?$('entry-'+k):$('gsa-'+k+'-'+(index+1));
      input.value=values[k];
      if(index===null)entryFields()[k]=values[k];
    }
    if(index===null){persist();updateEntryReadiness();}else updateGsaEditor();
    notify(undo?(kept?'已撤销本次优化，保留后来手改的字段。':'已撤销本次优化，恢复原先填写。'):values.unresolved?'已优化行动与检查点。请补充允许使用的观察依据。':'已参考'+ctx.period+'的 G 和 S 优化本行，可继续修改。');
  }

  function entryCandidate(){
    return state.ui.entrySample==='missing' && !state.gsaConfirmed;
  }
  function entryFields(){
    return state.ui.entryFields ??= {linked:false,action:'',checkpoint:'',basis:''};
  }
  const entryInputs = [
    {key:'action',label:'计划 A',hint:'说明准备采取的计划动作'},
    {key:'checkpoint',label:'阶段检查点',hint:'写明何时检查、核对什么'},
    {key:'basis',label:'观察依据',hint:'填写届时用来核对的报表或业务记录'}
  ];
  function entryIssues(){
    if(state.gsaConfirmed)return [];
    const source=entryCandidate() && !entryFields().linked?[{id:'entry-link-source',label:'正式目标 G 与来源'},{id:'entry-link-source',label:'具体策略 S'}]:[];
    return source.concat(gsaDraftIssues());
  }


  function entryActionLabel(count){
    return count?'查看并补齐 '+count+' 项':'确认 GSA，进入目标拆解';
  }
  function entryStateLabel(count){
    return count?'GSA 资料待补':'资料已齐备 · 待确认';
  }
  function entryChecklist(){
    const issues=entryIssues();
    if(!issues.length)return '<section id="entry-checklist" class="trial-checklist trial-complete" data-testid="entry-checklist"><strong role="status" data-testid="entry-missing-list">资料已齐备，可核对并确认 GSA。</strong></section>';
    return `<section id="entry-checklist" class="trial-checklist" data-testid="entry-checklist" aria-labelledby="trial-checklist-title">
      <div role="status" data-testid="entry-missing-list"><strong id="trial-checklist-title">进入拆解前还需补齐 ${issues.length} 项资料</strong>
      <ul>${issues.map(item=>`<li>${esc(item.label)}</li>`).join('')}</ul></div></section>`;
  }
  function closeTrialPicker(restoreFocus=true){
    const panel=$('demo-controls');
    panel.open=false;
    panel.classList.remove('trial-picker-floating');
    const trigger=document.querySelector('[data-testid="trial-picker"]');
    trigger?.setAttribute('aria-expanded','false');
    if(restoreFocus)trigger?.focus({preventScroll:true});
  }

  function entryButton(){
    const count=entryIssues().length;
    return `<button type="button" class="primary entry-primary" data-action="${count?'entry-review-issues':'confirm-gsa'}" data-testid="confirm-gsa">${entryActionLabel(count)} <span aria-hidden="true">→</span></button>`;
  }
  function resetEntryExample(scenario){
    const mode=state.ui.entrySample||'ready',theme=state.ui.theme,sidebarOpen=state.ui.sidebarOpen;
    if($('chat-input'))$('chat-input').remove();
    state=initial(scenario);
    state.ui={...uiDefaults(),entrySample:mode,theme,sidebarOpen};
    state.gsaConfirmed=mode==='confirmed';
  }
  const entryMemory = new Map();
  function entrySnapshotKey(mode){return STORE+'.entry-sample.'+mode;}
  function startEntryExample(mode){
    if(!['ready','confirmed','missing'].includes(mode))return;
    const previous=state.ui.entrySample||'ready';
    if(previous===mode)return;
    captureInput();
    persist();
    const current=clone(state);
    entryMemory.set(previous,current);
    try{sessionStorage.setItem(entrySnapshotKey(previous),JSON.stringify(current));}
    catch{memoryOnly=true;}
    const scenario=state.scenario,theme=state.ui.theme,sidebarOpen=state.ui.sidebarOpen;
    const saved=entryMemory.has(mode)?clone(entryMemory.get(mode)):restore(entrySnapshotKey(mode));
    if($('chat-input'))$('chat-input').value='';
    if(saved.ui){
      state=saved;
      state.ui={...uiDefaults(),...saved.ui,entrySample:mode,theme,sidebarOpen};
    }else{
      state=initial(scenario);
      state.ui={...uiDefaults(),theme,sidebarOpen,entrySample:mode};
      state.gsaConfirmed=mode==='confirmed';
    }
    // Remove the departing composer before render() captures its input again.
    if($('chat-input'))$('chat-input').remove();
    render();
    $('demo-controls').open=false;
    $('main-scroll').scrollTop=0;
    document.querySelector('[data-testid="current-goal"]')?.focus({preventScroll:true});
  }

      <div class="card-head"><div><h2 id="gsa-title">确认总目标 GSA</h2>
      <p class="muted small-text">2027 年 1 月 · 零售事业部全渠道 · 林负责人</p></div></div>
      
      <div class="gsa-rows"><div class="gsa-row"><span class="gsa-letter">G/S</span><div>
        <h3>${fields.linked?'已承接正式目标与策略':'承接适用的正式战略发布'}</h3>
        <p>${fields.linked?'正式目标 G 为 120 万元，策略 S1 为新品增长与平台活动。':'当前候选尚缺正式目标值、来源及具体策略。以下发布版适用于本期范围。'}</p>
        <div class="entry-source" data-testid="entry-source-card"><span class="source-badge">S-2027 v3</span>
          <strong>零售事业部 · 2027 年 1 月</strong><p>G-2027-01 · 全渠道净销售额 120 万元<br>S1 · 新品增长与平台活动共同补足增量</p>
          ${fields.linked?'<span class="entry-linked" data-testid="entry-source-linked">已承接至本期候选</span>':'<button type="button" class="small" id="entry-link-source" data-action="entry-link-source" data-testid="entry-link-source">承接战略发布版 G 和 S</button>'}</div>
      </div></div><div class="gsa-row"><span class="gsa-letter">A</span><div><h3>本期计划与检查依据</h3>${adviceInlineControls(gsaDraftActions())}
        <div class="entry-fields">${entryInputs.map(f=>`<label for="entry-${f.key}">${f.label}<input required maxlength="600" id="entry-${f.key}" data-entry-field="${f.key}" data-testid="entry-${f.key}" placeholder="${f.hint}" value="${esc(fields[f.key])}"></label>`).join('')}</div>${gsaDraftActions().length>1?gsaActionList(gsaDraftActions().slice(1)):''}
      </div></div></div>
      <div class="gsa-footer"><p>确认后，Agent 将基于本期 G、S、A 起草拆解表。</p><button type="button" data-action="confirm-gsa" data-testid="entry-confirm-form" ${issues.length?'disabled':''}>确认并进入目标拆解</button></div>
      </section>`;

  function entrySummary(issues){
    return issues.length?'待补 '+issues.map(x=>x.label).join('、')+'。':'G、S、计划 A、阶段检查点和观察依据已齐备。';

  function updateEntryReadiness(){

  function focusEntryIssue(){
    if(state.tab!=='plan'){state.tab='plan';render();}

  function decisions(){const year=state.ui.caseYear||goalInfo().year,rows=caseRecords().filter(c=>year==='all'||c.year===year);openAux('关联决策',`<p class="small-text muted">先查看以本目标某准确版为主目标的 Case。按当前目标周期展示，年度筛选可选。没有待决事项时，无需先建 Case。</p><label class="form-field" style="display:block;margin-top:12px"><span class="small-text">年度范围</span><select id="case-year" data-testid="case-year" style="margin-left:8px"><option value="${goalInfo().year}" ${year===goalInfo().year?'selected':''}>目标周期 · ${goalInfo().year}</option><option value="all" ${year==='all'?'selected':''}>全部已关联年度</option></select></label>${rows.length?rows.map(c=>`<div class="record-card"><h3>${c.id} · ${esc(c.title)} <span class="status ${c.status==='进行中'?'':'warning'}">${c.status}</span></h3><p>主目标 · ${esc(c.goalVersion)}<br>具体策略 · ${esc(c.strategy)}<br>范围／周期 · ${esc(c.scope)} · ${esc(c.period)}<br>原依据 · ${esc(c.basis)}${c.planRef?'<br>准确拆解与检查 · '+esc(c.planRef):''}</p>${c.historical?'<p>已关闭或历史版本，仅查看原记录，不自动当作进行中事项续接。</p>':c.status==='草稿待确认'?'<p>已保存草稿，去原 Case 入口继续核对。尚非进行中，不自动续接或授权。</p>':'<p>同一问题优先续接此事项，原目标与原证据不自动切换到新拆解版。</p>'}<div class="actions"><button class="small" data-action="case-detail" data-case-id="${c.id}" data-testid="case-${c.id}">查看原 Case</button>${c.status==='进行中'&&!c.historical?`<button class="small" data-action="case-continue" data-case-id="${c.id}">续接此 Case</button>`:''}</div></div>`).join(''):'<div class="aux-empty">此范围没有已关联 Case，不推断没有经营问题。</div>'}<div class="actions" style="margin-top:15px">${isSales()?'<button class="primary small" data-action="case-new" data-testid="proactive-case">为重点试点主动建立 Case</button>':'<span class="small-text muted">本目标仅演示历史只读，不办理新 Case。</span>'}</div><p class="boundary">主动 Case 可从原已采用 G+S 准入，不要求先发布新拆解表、配置阈值或选择实绩。本页只是原 Case 入口的窄演示，不重建 Case 全系统。</p>`);}
  function findCase(id){return caseRecords().find(c=>c.id===id);}
  function caseDetail(id){const c=findCase(id);if(!c)return;openAux('原 Case 详情 · '+c.id,`<h3>${esc(c.title)}</h3><dl class="version-source-grid"><dt>主目标</dt><dd>${esc(c.goalVersion)} · ${goalInfo().id}</dd><dt>具体 S</dt><dd>${esc(c.strategy)}</dd><dt>原范围</dt><dd>${esc(c.scope)} · ${esc(c.period)}</dd><dt>状态</dt><dd>${c.status}${c.historical?' · 历史记录，不自动续接':''}</dd><dt>原依据</dt><dd>${esc(c.basis)}</dd>${c.planRef?'<dt>准确拆解／检查</dt><dd>'+esc(c.planRef)+'</dd>':''}<dt>后续</dt><dd>${c.status==='已关闭'?'原关闭结论与效果观察保留，继续阅读不重新打开。':c.status==='草稿待确认'?'草稿待原 Case 入口核对确认，尚非进行中，不产生经营授权。':'尚需负责人做经营取舍。打开或续接不等于已有行动授权。'}</dd></dl>${caseFollowups(c)}${c.status==='进行中'&&!c.historical?`<button class="small" data-action="case-continue" data-case-id="${c.id}" data-testid="continue-original-case">续接此原 Case</button>`:''}${c.status==='草稿待确认'?`<button class="small" data-action="case-draft-entry" data-case-id="${c.id}" data-testid="case-draft-entry">去原 Case 入口继续（草稿待确认）</button>`:''}<p class="boundary">仅模拟进入原 Case 的准确详情，完整方案编辑、任务派发及反馈仍在原产品入口办理。</p>`);}
  function continueOriginalCase(id){const c=findCase(id);if(!c||c.status!=='进行中'||c.historical){notify('此记录只供历史查看，不能自动续接为进行中事项。');return;}if(!state.ui.caseContinuations.some(r=>r.caseId===id&&r.goal===state.ui.selectedGoal))state.ui.caseContinuations.push({caseId:id,goal:state.ui.selectedGoal,goalVersion:c.goalVersion,basis:c.basis});persist();notify('已明确选择续接 '+id+'，原目标版本与原依据保留，未新建 Case 或授权行动。');caseDetail(id);}
  function newCase(){if(!isSales())return;openAux('为重点试点主动建立 Case',`<p class="small-text muted">沿原已采用目标 v1 的 G+S 建立试点事项，不依赖新拆解表。优先核对现有同一问题 Case。</p><form id="proactive-case-form" style="margin-top:15px"><div class="form-field"><label for="case-title">事项名称</label><input id="case-title" data-testid="case-title" style="width:100%" value="新品陈列重点试点"></div><dl class="version-source-grid"><dt>主目标</dt><dd>原目标 G-retail-202701/v1 · 正式目标 120 万元</dd><dt>具体 S</dt><dd>S1 新品增长与平台活动</dd><dt>范围</dt><dd>2027 年 1 月 · 零售事业部重点试点门店</dd></dl><p class="boundary">明确建立合成 Case 草稿，不创建执行任务，不产生经营授权。</p><button type="submit" class="primary small" data-testid="confirm-proactive-case">确认建立 Case 草稿</button></form>`);}
  function existingExecution(){return isSales()?{project:'P-007',title:'新品试点准备',plan:'项目方案 v2 · 已确认',goal:'原目标 G-retail-202701/v1（G/S）',scope:'重点门店',board:'B-021',action:'门店陈列试点',owner:'陈店长',progress:'已完成',feedback:'待整理试点反馈',authority:'原 Case C-014 决定 D2 · 明确授权 2026-11-20'}:{project:'P-E03',title:'华东直营首购回访',plan:'项目方案 v3 · 已确认',goal:'原 GSA-east-2026q4/v1（历史23%）',scope:'华东直营试点门店',board:'B-E07',action:'首购后7日回访试点',owner:'周店长',progress:'已完成',feedback:'成熟队列复购观察已记录',authority:'原 Case C-E11 决定 D4 · 2026-10-01 明确授权'};}
  function execution(){const records=state.ui.handoffs.filter(r=>r.goal===state.ui.selectedGoal),pubs=isSales()?verifiedPublications():[],existing=existingExecution();openAux('执行承接',`<p class="small-text muted">计划、项目方案和真实行动授权分别回看。GSA 确认、拆解发布或预览都不会自动创建项目、任务或授权经营行动。</p><h3 class="aux-section-title">目标层计划</h3><div class="note">${isSales()?state.gsaConfirmed?'总目标 GSA v'+gsaVersion()+' 的计划 A 已确认，仍只是计划。':'本期总 GSA 的计划 A 尚未确认，原 G/S 与原授权记录仍可回看。':'旧目标的原 GSA A 来自原 Case／项目／看板实际安排，按原口径保留；不补造新计划 A。'}</div><h3 class="aux-section-title">已有项目与实际授权记录</h3><div class="record-card"><h3>${existing.project} · ${existing.title}</h3><p>${existing.plan}<br>原目标引用 · ${existing.goal}<br>实际授权 · ${existing.authority}<br>实际负责人 · ${existing.owner} · 进度 ${existing.progress}<br>反馈 · ${existing.feedback}</p><div class="actions"><button class="small" data-action="project-detail">原项目方案详情</button><button class="small" data-action="board-detail">原行动看板详情</button></div></div>${isSales()?'<button class="text-button" data-action="original-project-preview" data-testid="original-project-preview" style="margin-top:12px">从原已采用 G/S 发起项目 · 原入口预览</button>':''}<h3 class="aux-section-title">按正式拆解目标行承接</h3>${isSales()&&state.operation?.status==='unknown'?'<div class="note warning" style="margin-bottom:12px">新发布结果待核，只能使用已核实的旧正式版，不能用未知版本或草稿生成执行。</div>':''}${pubs.length?`<form id="handoff-preview-form"><div class="form-row"><div class="form-field"><label for="handoff-plan">准确正式拆解版</label><select id="handoff-plan" data-testid="handoff-plan" style="width:100%">${pubs.map(pub=>`<option value="${pub.no}" ${pub.no===state.knownPublishedNo?'selected':''}>v${pub.no}${pub.no===state.knownPublishedNo?' · 当前生效':' · 历史版'}</option>`).join('')}</select></div><div class="form-field"><label for="handoff-line">目标行</label><select id="handoff-line" data-testid="handoff-line" style="width:100%">${pubs.find(pub=>pub.no===state.knownPublishedNo).allocations.map(row=>`<option value="${row.id}">${row.id} · ${row.scope}</option>`).join('')}</select></div></div><button type="submit" class="primary small" style="margin-top:13px" data-testid="preview-handoff">预览准确版本承接</button></form>`:'<div class="aux-empty" data-testid="handoff-no-published">暂无可用的已核实正式拆解表。仍可查看已有项目／看板与原已采用目标的项目入口，但不能用本次新草稿生成执行。</div>'}${records.length?`<h3 class="aux-section-title">已明确选择的承接引用</h3>${records.map(r=>`<div class="record-card"><h3>${r.projectId} · 项目方案草稿</h3><p>${r.planRef} · ${r.line.id} ${r.line.scope} · ${r.line.amount} 万<br>计划责任 · ${r.line.owner}<br>状态 · 已明确承接引用，项目方案尚未确认，无实际行动授权</p><button class="small" data-action="handoff-detail" data-handoff-id="${r.id}">查看原承接记录</button></div>`).join('')}`:''}<p class="boundary">同一目标／准确拆解版／目标行已有承接时，优先打开原记录。新版本不会静默迁移旧项目或改写其行动证据。</p>`);}
  function originalExecutionDetail(kind){const e=existingExecution();if(kind==='project')openAux('原项目方案 · '+e.project,`<h3>${e.title}</h3><dl class="version-source-grid"><dt>方案状态</dt><dd>${e.plan}</dd><dt>准确原引用</dt><dd>${e.goal}</dd><dt>范围</dt><dd>${e.scope}</dd><dt>行动权威</dt><dd>实际授权由原 Case／看板记录核对，不从“项目方案已确认”推断全部行动已授权。</dd></dl><button class="small" data-action="board-detail">查看原行动看板</button>`);else openAux('原行动看板 · '+e.board,`<h3>${e.action}</h3><dl class="version-source-grid"><dt>明确授权依据</dt><dd>${e.authority}</dd><dt>原目标／方案</dt><dd>${e.goal} · ${e.project}</dd><dt>实际负责人</dt><dd>${e.owner}</dd><dt>实际进度</dt><dd>${e.progress}</dd><dt>原反馈</dt><dd>${e.feedback}</dd></dl><p class="boundary">这是已有合成行动记录的只读演示。新 GSA 计划、发布拆解或项目承接不会修改这条授权或进度。</p>`);}
  function previewHandoff(no,lineId){const pub=verifiedPublications().find(pub=>pub.no===Number(no)),line=pub?.allocations.find(row=>row.id===lineId);if(!isSales()||!pub||!line){notify('未能核对准确正式版与目标行，原选择保留。');return;}const existing=state.ui.handoffs.find(r=>r.goal==='sales'&&r.version===pub.no&&r.line.id===lineId);if(existing){handoffDetail(existing.id);return;}const checkpoint=pub.checkpoints?.find(cp=>cp.goalId===lineId);if(!checkpoint){openAux('原行级检查点待核','<p class="small-text">准确正式拆解快照没有可读取的本行检查点，保留原表与目标行身份，不从当前草稿或行金额补造历史凭据。本次新拆解行承接暂不提交，仍可回看原已采用目标的项目入口及已有执行记录。</p>');return;}openAux('确认承接到项目方案草稿',`<p class="small-text muted">固定已发布的准确版本与本目标行。常规项目工作不要求先建 Case。</p><dl class="version-source-grid"><dt>总目标</dt><dd>${esc(pub.gsa)} · G-retail-202701</dd><dt>正式拆解</dt><dd>GDT-retail-202701/v${pub.no}</dd><dt>目标行</dt><dd>${line.id} · ${line.scope} · ${line.amount} 万</dd><dt>计划责任</dt><dd>${line.owner}</dd><dt>检查点</dt><dd>${checkpoint.date} 期末核对 ${checkpoint.target} 万 · ${checkpoint.id}。不把总表周计划当成本行目标。</dd></dl><div class="note">本次只形成项目方案草稿的准确引用。具体任务、人员安排、项目方案确认及行动授权仍在原项目／Case／看板办理。</div><div class="actions" style="margin-top:15px"><button class="primary small" data-action="confirm-handoff" data-plan-no="${pub.no}" data-line-id="${lineId}" data-testid="confirm-handoff">明确承接为项目方案草稿</button></div>`);}
  function confirmHandoff(no,lineId){const pub=verifiedPublications().find(p=>p.no===Number(no)),line=pub?.allocations.find(r=>r.id===lineId);if(!pub||!line||!isSales())return;const checkpoint=pub.checkpoints?.find(cp=>cp.goalId===lineId);if(!checkpoint){notify('原正式快照的行级检查点待核，保留原选择，未新增承接记录。');return;}let record=state.ui.handoffs.find(r=>r.goal==='sales'&&r.version===pub.no&&r.line.id===lineId);if(!record){record={id:'handoff-'+(state.ui.handoffs.length+1),goal:'sales',version:pub.no,projectId:'P-DEMO-'+(state.ui.handoffs.length+1),planRef:'GDT-retail-202701/v'+pub.no,gsaRef:pub.gsa,line:clone(line),checkpoint:clone(checkpoint),authority:null,projectPlanStatus:'draft'};state.ui.handoffs.push(record);}persist();handoffDetail(record.id);notify('已明确保存准确承接引用，未创建实际执行任务或行动授权。');}
  function handoffDetail(id){const r=state.ui.handoffs.find(r=>r.id===id&&r.goal===state.ui.selectedGoal);if(!r)return;openAux('原承接记录 · '+r.projectId,`<h3>项目方案草稿 · 尚未确认方案</h3><dl class="version-source-grid"><dt>父总目标 GSA</dt><dd>${r.gsaRef?esc(r.gsaRef):'原承接记录未记录父 GSA，需沿准确冻结拆解表回源，不能用当前默认值补填。'}</dd><dt>准确原计划</dt><dd>${r.planRef}</dd><dt>目标行</dt><dd>${r.line.id} · ${r.line.scope} · ${r.line.amount} 万</dd><dt>计划责任</dt><dd>${r.line.owner}</dd><dt>原检查点</dt><dd>${r.checkpoint.id} · ${r.checkpoint.date} · ${r.checkpoint.target} 万</dd><dt>实际授权</dt><dd>无。承接引用不等于任务、人员或经营行动授权。</dd><dt>进度／反馈</dt><dd>尚无实际执行记录。</dd></dl><p class="boundary">这是同一引用的原记录，重复承接不会新增项目草稿。以后发布新版，也不自动改写本记录。</p>`);}
  function reviewPage(){const selected=state.ui.reviewSelected||[];return `<section class="card"><div class="card-head"><div><h2>到期对照与下一阶段</h2><p class="small-text muted" style="margin-top:4px">合成到期情景 · 最后生效正式目标，不受拆解周计划修订影响</p></div><span class="status">原检查保留</span></div><div class="card-body"><div class="legacy-grid"><div><span>最后生效正式目标 G</span><strong>120 万</strong></div><div><span>期初承诺 · 仅作备忘</span><strong>120 万</strong></div><div><span>期末可比实绩</span><strong>123 万</strong></div></div><div class="note success">${gsaVersion()?'按本期最后确认的总 GSA v'+gsaVersion()+' 评估':'按原正式战略目标评估'}，期末净销售额比 120 万元目标高 3 万元。总量达成不证明新品或平台活动的贡献已获因果验证。</div><details class="details"><summary>阶段检查仍按各自原版本回看</summary><div class="details-body">${state.checkHistory.length?state.checkHistory.map(c=>`<p>${esc(c.id)} · ${esc(checkParentLabel(c))} · 拆解表 v${c.planNo} · ${esc(c.sourceRef)} · ${esc(c.trigger.reason)}${c.caseChoice?' · 原 Case 选择保留':''}</p>`).join(''):'尚无已保存阶段检查，本合成期末摘要不补造缺失过程证据。'}</div></details><h3 class="aux-section-title">负责人选择带入下一期的结论或待验证假设</h3><label class="review-choice"><input type="checkbox" name="review-conclusion" value="new-product" ${selected.includes('new-product')?'checked':''}><span><strong>继续观察重点门店新品陈列试点（待验证假设）</strong><br><span class="muted">原依据 Case C-014 / ACT-01/r1 只说明试点资料。Case 仍进行中，实际执行反馈待整理，尚不能认定策略有效；适用范围仅重点直营门店，继续试验与扩展均标待验证。</span></span></label><label class="review-choice"><input type="checkbox" name="review-conclusion" value="timing" ${selected.includes('timing')?'checked':''}><span><strong>新品上市延后时重排阶段目标，不改写历史检查</strong><br><span class="muted">原依据为本次拆解发布版与原阶段检查引用，适用范围为同类供货约束。未发生修订时只作待验证建议。</span></span></label><div class="actions" style="margin-top:15px"><button class="primary" data-action="draft-next-cycle" data-testid="draft-next-cycle">让 Agent 据所选结论起草下一期</button></div>${state.ui.nextCycleDraft?`<div class="record-card" data-testid="next-cycle-draft"><h3>2027 年 2 月目标草稿 · 未采用／未发布</h3>${state.ui.nextCycleDraft.reviewGsaRef?'<p>形成草稿时的复盘依据 · '+esc(state.ui.nextCycleDraft.reviewGsaRef)+'</p>':''}<p>${state.ui.nextCycleDraft.conclusions.map(c=>esc(c.title)+' · 原依据 '+esc(c.source)+' · 适用范围 '+esc(c.scope)).join('<br>')}</p><p>正式目标值与资源约束待下一期总目标 GSA 核对，原复盘与本期生效目标不变。Agent 输出为脚本模拟。</p></div>`:''}</div></section>`;}
  function metrics(){return `<div class="metric-grid"><div class="metric"><span>正式目标值</span><strong>120<em>万</em></strong><small>来源于正式战略发布版</small></div><div class="metric"><span>可达测算值</span><strong>112<em>万</em></strong><small>同期间、同范围、同口径</small></div><div class="metric gap"><span>待策略补足的差额</span><strong>8<em>万</em></strong><small>120 − 112，保留原测算</small></div></div>`;}
  function gsa(){if(entryCandidate())return entryForm();return `<div class="gsa-layout"><section class="card" aria-labelledby="gsa-title"><div class="card-head"><div><h2 id="gsa-title">确认总目标 GSA</h2><p class="muted small-text" style="margin-top:5px">G 与 S 已从正式战略 S-2027 v3 带入，请核对本期计划 A。</p></div><span class="status">待确认</span></div><div class="gsa-rows"><div class="gsa-row"><span class="gsa-letter">G</span><div><h3>1 月净销售额达到 120 万元</h3><p>零售事业部 · 2027.01.01—01.31<br>净销售额 = 已支付商品金额 − 同归属期退款，不含运费。基线为可比门店与渠道。</p><div class="source-line"><span class="source-badge">SAP 净销售额 / v2</span><span>战略发布 S-2027 v3 · G-2027-01</span></div></div></div><div class="gsa-row"><span class="gsa-letter">S</span><div><h3>新品增长与平台活动共同补足增量</h3><span class="gsa-origin">已承接策略 S1</span><p>稳定可比业务贡献，重点门店开展新品陈列与回访，平台活动聚焦新增转化。新品与活动贡献按不重叠范围估算。</p></div></div><div class="gsa-row"><span class="gsa-letter">A</span><div><h3>本期计划与检查依据</h3>${adviceInlineControls(gsaDraftActions())}${gsaActionList(gsaDraftActions())}</div></div></div></section><aside class="stack"><div>${metrics()}<div class="note">测算帮助判断可达性。正式目标仍为 120 万，8 万差额需要在拆解发布前说明补足策略与预期贡献。</div></div><div class="card"><div class="card-body info-list"><div><h3>已带入当前工作</h3><p>正式战略发布版、指标定义、经营范围及可用的获准资料。</p></div><div><h3>确认后与 Agent 协作</h3><p>按贡献分配子目标，再结合商品与经营节奏排出时间计划。方法和工具由 Agent 按问题选择。</p></div><div><h3>只处理必要的经营取舍</h3><p>无需重录已承接的目标，也不要求逐项审批普通读取。</p></div></div></div></aside></div>`;}
  function chat(){

  function conflict(){if(!hasConflict())return '';return `<div class="issue-card" role="alert" data-testid="cross-conflict"><div class="issue-head"><h3>同口径交叉项尚未对齐</h3><span class="status error">只能保存草稿</span></div><div class="issue-body"><p class="small-text">1 月 · 零售事业部 · 净销售额 · 线下 × 羽绒服</p><div class="compare"><div>渠道计划<strong>50 万</strong><p>依据 · 门店目标表 r4</p></div><div class="versus">差 5 万</div><div>商品计划<strong>45 万</strong><p>依据 · 商品配置表 r3</p></div></div><p class="small-text muted">另一处「线上 × 羽绒服」同时为 30 万与 35 万。两个视图各自合计都是 120 万，但两处同口径交叉项均需对齐。差异不能转成预留。Agent 不替双方决定哪个数值有效。</p><details class="details"><summary>查看两边原明细与合计</summary><div class="details-body"><table><thead><tr><th>相同交叉单元</th><th>渠道计划</th><th>商品计划</th></tr></thead><tbody><tr><td>线下 × 羽绒服</td><td>50</td><td>45</td></tr><tr><td>线上 × 羽绒服</td><td>30</td><td>35</td></tr><tr><td>线上 × 针织</td><td>20</td><td>20</td></tr><tr><td>线下 × 针织</td><td>15</td><td>15</td></tr><tr><td>新品上市预留</td><td>5</td><td>5</td></tr><tr><td>合计（万元）</td><td>120</td><td>120</td></tr></tbody></table><p style="margin-top:9px">本演示支持双方采用任一原有方案的完整明细。50 万方案同时把商品视图的「线上 × 羽绒服」35 万调为 30 万。45 万方案同时把渠道视图的「线上 × 羽绒服」30 万调为 35 万。先展示变化，不能只改一个单元就宣称对平。</p></div></details><form id="align-form"><div class="form-row"><div class="form-field"><label for="aligned-value">双方已协商一致值 · 万元</label><input id="aligned-value" data-testid="aligned-value" type="number" step="1" min="0" placeholder="45 或 50" value="${esc(state.alignmentDraftValue)}" required ${state.alignmentError?'aria-invalid="true"':''}></div><div class="form-field"><label for="alignment-basis">双方确认依据</label><input id="alignment-basis" data-testid="alignment-basis" type="text" placeholder="例如，商品与渠道负责人已确认采用门店明细 r4" value="${esc(state.alignmentDraftBasis)}" required></div></div>${state.alignmentError?`<p class="small-text" style="color:var(--error);margin-top:8px" role="alert">${esc(state.alignmentError)}</p>`:''}<div class="actions" style="margin-top:12px"><button type="submit" class="small" data-testid="apply-alignment">按双方确认明细更新并重新校验</button></div></form></div></div>`;}
  function draftTable(){

  function publishedReceipt(){

          ${p.allocations.map(row=>{const cp=p.checkpoints?.find(point=>point.goalId===row.id);return `<tr><td><strong>${esc(row.scope)}</strong><br><small class="faint">${esc(row.id)}</small></td><td>${row.amount} 万元</td><td>${esc(row.owner)}</td><td>${esc(row.strategy)}</td><td>${cp?esc(cp.date)+' · '+cp.target+' 万元':'原版未记录'}</td></tr>`;}).join('')}
          <tr><td>预留</td><td>${p.reserve.amount} 万元</td><td>${esc(p.reserve.owner)}</td><td>${esc(p.reserve.purpose)}</td><td>按用途单列</td></tr>

  function addAgent(text){state.messages.push({role:'agent',text});}
  function sendMessage(text){
    text = text.trim();
    if(!text || !state.editingDraft || state.operation)return;
    if(!state.gsaConfirmed){notify('请先确认总目标 GSA。');return;}
    state.ui.draftInput='';
    if($('chat-input'))$('chat-input').value='';
    state.messages.push({role:'user',text});
    const restores = /恢复原(?:来|有|始|定)?(?:的)?(?:上市|活动|新品|周)?(?:排期|计划|节奏|档期|时间)|撤销延期/.test(text);
    const delays = /(?:新品(?:上市)?(?:活动)?|上市(?:活动)?).{0,12}(?:延后|推迟|延期|后移|推后|延迟).{0,7}(?:两|二|2)\s*(?:个)?周/.test(text);
    const changedBudget = /(?:提高|增加|减少|削减|增减|调高|调低|调整|修改).{0,5}预算|预算.{0,8}(?:增至|减至|增加|减少|降至|提高|改为)/.test(text);
    const initialRequest = !state.generated;
    if(initialRequest){
      state.generated=true;
      addAgent('草稿采用已带入的零售样例。正式目标 120 万，可达测算 112 万。按样例中的分配，四行共 115 万，商品负责人另留 5 万。预计新品非活动期贡献 5 万，平台额外贡献 3 万。'+(hasConflict()?'渠道与商品计划有两处交叉值不同，请先核对双方依据。':'可切换渠道、品类和周计划核对同一份明细。'));
    }
    if(!changedBudget && (restores || delays)){
      const nextDelayed = !restores;
      if(state.delayed!==nextDelayed){
        state.delayed=nextDelayed;
        state.draftRevision++;
        addAgent(nextDelayed?'已按样例将新品上市推迟两周，平台活动预算延用原计划。第 1 至 4 周从 25、30、35、25 万调整为 20、25、40、30 万，第 2 周检查点改为 25 万。':'已恢复原上市排期，四周计划回到 25、30、35、25 万，第 2 周检查点恢复至 30 万。');
      }else{addAgent(nextDelayed?'当前草稿已采用延期两周的排期。':'当前草稿已采用原上市排期。');}
    }else if(!initialRequest || changedBudget || !/拆解|渠道|品类|周计划|责任分配/.test(text)){
      addAgent(initialRequest?'右表先呈现本次合成案例的基准方案。你的其他自由输入已留在对话里，尚未据此计算或改动经营数字。':'已保留你的原话。这一试用支持新品上市后移两周及恢复原排期；其他要求尚未改动草稿。');
    }
    if(initialRequest){clearTimeout(toastTimer);$('toast').hidden=true;}
    render();
    if(initialRequest && matchMedia('(max-width:900px)').matches)focusDecompositionPane('split-title');
  }

    if(event.target.id==='gsa-editor')event.preventDefault();
  });
  document.addEventListener('input',event=>{if(event.target.id==='chat-input'&&isSales()){state.ui.draftInput=event.target.value;persist();}});
  document.addEventListener('change',event=>{if(event.target.id==='version-select'){state.ui.versionSelections[state.ui.selectedGoal]=event.target.value;persist();versions();}if(event.target.id==='source-access'){const option=selectedVersion();if(typeof state.ui.sourceAccess!=='object')state.ui.sourceAccess={};state.ui.sourceAccess[state.ui.selectedGoal+'/'+option.key]=event.target.value;persist();versions();}if(event.target.id==='case-year'){state.ui.caseYear=event.target.value;persist();decisions();}if(event.target.name==='review-conclusion'){state.ui.reviewSelected=[...document.querySelectorAll('input[name="review-conclusion"]:checked')].map(input=>input.value);persist();}});
  document.addEventListener('change',event=>{if(event.target.id==='scenario'){resetEntryExample(event.target.value);render();notify('已切换当前样例的合成发布场景。');}if(event.target.id==='lost-outcome'&&!state.operation){state.lostOutcome=event.target.value;persist();}if(event.target.id==='check-history'){state.activeCheckId=event.target.value||null;const check=selectedCheck();state.report=check?.report||null;state.nextCheckPlanNo=null;render();notify('已打开所选历史检查，计划版本、实绩与 Case 选择保持原样。');}if(event.target.id==='threshold-select'){state.threshold=event.target.value;render();notify((selectedCheck()?'下次检查的配置已更新，本记录阈值与触发理由保持原样。':state.threshold==='none'?'未配置阈值，阶段比较仍可使用。':'已使用示例阈值，任一条件达到就提示 Case。'));}});
  $('sidebar-dialog').addEventListener('cancel',event=>{event.preventDefault();closeSidebar();});
  let wasMobile=innerWidth<=760;addEventListener('resize',()=>{const mobile=innerWidth<=760;if(mobile!==wasMobile){wasMobile=mobile;state.ui.sidebarOpen=!mobile;updateSidebar();persist();}});
  $('reset-demo').addEventListener('click',()=>{resetEntryExample(state.scenario);render();notify('已重置当前合成样例。');});
  $('reopen-demo').addEventListener('click',()=>{persist();if(memoryOnly){notify('当前浏览器不提供存储，无法模拟重开恢复。请通过本地 HTTP 预览打开。');return;}location.reload();});
  $('detail-dialog').addEventListener('close',()=>{if(dialogInvoker?.isConnected)dialogInvoker.focus();});
  Object.defineProperty(window,'demoInspect',{value:()=>Object.freeze(clone({scenario:state.scenario,gsaConfirmed:state.gsaConfirmed,generated:state.generated,draftRevision:state.draftRevision,conflict:hasConflict(),aligned:state.aligned,alignedValue:state.alignedValue,publishedCount:state.published.length,published:state.published,knownPublishedNo:state.knownPublishedNo,operationCount:state.operationCount,operation:state.operation,saveCount:state.saveCount,gapStrategy:state.gapStrategy,reservePurpose:state.reservePurpose,reserveOwner:state.reserveOwner,editingDraft:state.editingDraft,check:selectedCheck(),checkHistory:state.checkHistory,activeCheckId:state.activeCheckId,nextCheckPlanNo:state.nextCheckPlanNo,threshold:state.threshold,caseChoice:selectedCheck()?.caseChoice||null,ui:state.ui,visiblePublicationCount:verifiedPublications().length})),writable:false,configurable:false});

  // Preserve a reader's position in the nested workspace scroller on an actual reload.
  const draftScrollKey=STORE+'.decomposition-scroll';
  const draftScrollContext=()=>[state.scenario,state.ui.selectedGoal,state.draftRevision,state.operation?.status||'editing'].join('|');
  addEventListener('pagehide',()=>{
    try{
      if(document.querySelector('.dc-grid')){
        sessionStorage.setItem(draftScrollKey,JSON.stringify({context:draftScrollContext(),top:$('main-scroll').scrollTop}));
      }else{sessionStorage.removeItem(draftScrollKey);}
    }catch{}
  });
  addEventListener('pageshow',()=>{
    if(performance.getEntriesByType('navigation')[0]?.type!=='reload' || !document.querySelector('.dc-grid'))return;
    try{
      const saved=JSON.parse(sessionStorage.getItem(draftScrollKey));
      if(saved?.context===draftScrollContext() && Number.isFinite(saved.top)){
        requestAnimationFrame(()=>{$('main-scroll').scrollTop=saved.top;});
      }
    }catch{}
  });

  if (seedEntryPreview && previewEntry==='plan-a'){
    startEntryExample('missing');
    entryFields().linked=true;
    render();
    document.querySelector('[data-testid="plan-a-recommend-inline"]')?.scrollIntoView({block:'center'});
  }else if (seedEntryPreview && previewEntry!=='ready'){
    startEntryExample(previewEntry);
  }else{
    render();
  }
})();
</script>
</body>
</html>
