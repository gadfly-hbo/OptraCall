<script>
(()=>{
  'use strict';
  const STORE='optracall.goal-decomposition.integrated.v1';
  const $=id=>document.getElementById(id);
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone=value=>JSON.parse(JSON.stringify(value));
  let memoryOnly=false;
  function initial(scenario='normal'){return {schema:2,scenario,lostOutcome:'saved',gsaConfirmed:false,generated:false,tab:'plan',messages:[],draftRevision:1,delayed:false,reservePurpose:'新品上市预留',reserveOwner:'商品负责人',gapStrategy:true,aligned:false,alignedValue:50,alignmentBasis:'',alignmentDraftValue:'',alignmentDraftBasis:'',alignmentError:'',published:[],knownPublishedNo:null,editingDraft:true,operation:null,operationCount:0,saveCount:0,report:null,checkHistory:[],activeCheckId:null,nextCheckPlanNo:null,threshold:'configured'};}
  function restore(){try{const value=JSON.parse(sessionStorage.getItem(STORE));if(value&&[1,2].includes(value.schema)&&['normal','conflict','lost'].includes(value.scenario)){if(value.schema===1){value.editingDraft=!value.knownPublishedNo;value.checkHistory=value.check?[{...value.check,id:'CHECK-001',threshold:value.threshold||'configured',caseChoice:value.caseChoice||null}]:[];value.activeCheckId=value.checkHistory[0]?.id||null;value.nextCheckPlanNo=null;value.schema=2;delete value.check;delete value.caseChoice;}return value;}}catch{}return initial();}
  let state=restore(),dialogInvoker=null,toastTimer;
  const uiDefaults=()=>({selectedGoal:'sales',draftInput:'',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',sidebarOpen:innerWidth>760,selectedVersion:'',versionSelections:{},sourceAccess:{},caseYear:'',newCases:[],caseContinuations:[],handoffs:[],reviewSelected:[],nextCycleDraft:null});
  state.ui={...uiDefaults(),...(state.ui||{})};
  let primaryOpen=true,projectsOpen=true;
  const isSales=()=>state.ui.selectedGoal==='sales';
  const verifiedPublications=()=>state.published.filter(pub=>state.knownPublishedNo!==null&&pub.no<=state.knownPublishedNo);
  function captureInput(){const input=$('chat-input');if(input&&isSales())state.ui.draftInput=input.value;}

  function persist(){try{sessionStorage.setItem(STORE,JSON.stringify(state));}catch{memoryOnly=true;}}
  function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4800);}
  const selectedCheck=()=>state.checkHistory.find(c=>c.id===state.activeCheckId)||null;
  const currentPublished=()=>state.published.find(p=>p.no===state.knownPublishedNo);
  const checkPlan=()=>{const c=selectedCheck();return state.published.find(p=>p.no===(c?.planNo||state.nextCheckPlanNo||state.knownPublishedNo));};
  function comparisonFor(report,p){const weeks=p.weeks||(p.delayed?[20,25,40,30]:[25,30,35,25]);const actuals=report==='two-periods'?[23.75,28.5]:[27],plans=report==='two-periods'?weeks.slice(0,2):[weeks[1]];return {actuals,plans,percentages:actuals.map((actual,index)=>(actual-plans[index])/plans[index]*100)};}
  function triggerFor(report,threshold,percentages){if(report==='incomplete')return {type:'incomparable',reason:'数据待补，不计已确认偏离期'};if(threshold==='none')return {type:'unconfigured',reason:'未设置提示阈值'};let consecutive=0;for(let i=percentages.length-1;i>=0&&percentages[i]<0;i--)consecutive++;if(percentages.at(-1)<=-10+1e-8)return {type:'magnitude',reason:'本期不利偏差达到 10% 幅度阈值'};if(consecutive>=2)return {type:'consecutive',reason:'连续 2 期偏低，达到连续期数阈值'};return {type:'none',reason:'未达到不利偏差或连续偏低提示条件'};}
  const statusText=()=>state.operation?.status==='unknown'?'发布结果待核':state.editingDraft&&state.generated?(state.knownPublishedNo?'修订草稿 · 当前生效 v'+state.knownPublishedNo:'拆解草稿'):state.knownPublishedNo?'已发布 · v'+state.knownPublishedNo:state.gsaConfirmed?'待发起拆解':'待确认总目标';
  const hasConflict=()=>state.scenario==='conflict'&&!state.aligned;
  const allocations=()=>{const value=state.scenario==='conflict'&&state.aligned?state.alignedValue:50;return [{id:'G-01',scope:'线下 × 羽绒服',amount:value,owner:'门店负责人',strategy:'重点门店新品陈列'},{id:'G-02',scope:'线上 × 羽绒服',amount:value===45?35:30,owner:'电商负责人',strategy:'平台活动增量'},{id:'G-03',scope:'线上 × 针织',amount:20,owner:'电商负责人',strategy:'会员专属组合'},{id:'G-04',scope:'线下 × 针织',amount:15,owner:'门店负责人',strategy:'基础款连带销售'}];};
  function canPublish(){return state.gsaConfirmed&&state.generated&&!hasConflict()&&state.reservePurpose.trim()&&state.reserveOwner.trim()&&state.gapStrategy&&state.editingDraft&&!state.operation;}
  function opDetails(){if(!state.operation)return '';const op=state.operation;return `<details class="details"><summary>发布操作与准确引用</summary><div class="details-body"><dl><dt>原操作</dt><dd class="mono">${esc(op.id)}</dd><dt>草稿修订</dt><dd>r${op.draftRevision}</dd><dt>总目标 GSA</dt><dd class="mono">GSA-retail-202701 / v1</dd><dt>状态</dt><dd>${esc(op.status==='accepted'?'已完成':op.status==='not-executed'?'已确认未执行':'结果待核')}</dd><dt>提交次数</dt><dd>${op.attempts} 次，同一个业务意图</dd><dt>正式版本数</dt><dd>${state.knownPublishedNo?verifiedPublications().length+(state.operation?.status==='unknown'?' 个已核实，新发布待核':''):'尚无已核实版，原发布结果待核'}</dd></dl><p style="margin-top:10px">这些标识由系统保存。负责人无需手工填写或记住。</p></div></details>`;}
  function goalInfo(){return isSales()?{id:'G-retail-202701',title:'1 月净销售额达到 120 万元',period:'2027 年 1 月',scope:'零售事业部 · 全渠道与门店',owner:'林负责人',due:'2027-01-31',year:'2027'}:{id:'G-east-repurchase-2026q4',title:'华东直营会员 30 日有效复购率达到 24%',period:'2026 年第四季度',scope:'华东直营 · 成熟会员队列',owner:'周负责人',due:'2026-12-31',year:'2026'};}
  function pageHead(){const info=goalInfo();return `<div class="page-head"><div><div class="eyebrow">目标管理</div><h1 data-testid="current-goal">${info.title}</h1><div class="target-context"><span>${info.period}</span><span aria-hidden="true">·</span><span>${info.scope}</span><button class="text-button" data-action="goal-directory" data-testid="goal-switch">切换目标</button></div></div><span class="status ${!isSales()?'success':state.operation?.status==='unknown'?'warning':!state.editingDraft&&state.knownPublishedNo?'success':''}" data-testid="page-status">${isSales()?statusText():'历史已采用 · 只读'}</span></div><section class="target-toolbar" aria-label="当前目标的版本、决策与执行"><div class="effective-label">当前生效版 <strong>${isSales()?state.knownPublishedNo?'GSA v1 · 拆解表 v'+state.knownPublishedNo:state.gsaConfirmed?'总目标 GSA v1':'原目标 v1 · G/S 已采用':'原 GSA v2 · 正式目标 24%'}</strong></div><div class="actions"><button data-action="versions" data-testid="versions-sources">版本与来源</button><button data-action="decisions" data-testid="related-decisions">关联决策</button><button data-action="execution" data-testid="execution-handoff">执行承接</button></div></section>${isSales()?`<nav class="steps" aria-label="目标工作阶段"><button class="step ${state.tab==='plan'?'active':''}" data-action="tab-plan" data-testid="plan-tab"><span class="num">${state.gsaConfirmed?'✓':'1'}</span>${state.gsaConfirmed?'拆解与发布':'确认总目标 GSA'}</button><button class="step ${state.tab==='follow'?'active':''}" data-action="tab-follow" data-testid="follow-tab" ${!state.knownPublishedNo?'disabled':''}><span class="num">2</span>阶段跟进</button><button class="step ${state.tab==='review'?'active':''}" data-action="tab-review" data-testid="review-tab"><span class="num">3</span>到期复盘</button></nav>`:''}`;}
  function legacyPage(){return `<section class="legacy-hero"><span class="source-badge">已采用旧目标 · 历史只读演示</span><h2 style="margin-top:12px">原 GSA v2 · 华东直营复购经营目标</h2><div class="legacy-grid"><div><span>最后生效正式目标</span><strong>24%</strong></div><div><span>期初承诺 · 仅作备忘</span><strong>23%</strong></div><div><span>期末可比实绩</span><strong>24.5%</strong></div></div><div class="note success">依据最后生效的原 GSA v2，达到目标并超过 0.5 个百分点。原 v1 的历史检查仍按当时的 23% 对照，不用新版本改写。</div><dl class="version-source-grid"><dt>G</dt><dd>2026Q4 华东直营成熟会员队列的 30 日有效复购率达到 24%。</dd><dt>S</dt><dd>直营店首购回访试点，按成熟观察窗核对效果。</dd><dt>原 GSA 的 A</dt><dd>原 Case C-E11 / 看板 B-E07 的实际授权与检查记录，仍按原口径回看。这里不补造新方案中的“计划 A”。</dd><dt>状态</dt><dd>本目标仅演示历史阅读、准确导出与原 Case／项目／看板详情，不开放新拆解编辑。</dd></dl><p class="small-text muted">返回 2027 年 1 月销售目标时，其未发送输入、拆解草稿、发布操作、检查与 Case 选择原样保留。</p></section>`;}
  function openAux(title,body){openDialog(title,body);$('detail-dialog').classList.add('aux-dialog');}
  function directory(){openAux('切换目标',`<p class="small-text muted">默认进入当前工作，无需先选目标。目录只在需要切换时打开，各目标保留自己的准确版本、范围与记录。</p><div data-testid="goal-directory"><button class="directory-option" data-action="choose-goal" data-goal="sales" data-testid="directory-sales" aria-pressed="${isSales()}"><strong>1 月净销售额达到 120 万元</strong><small>2027 年 1 月 · 零售事业部 · 全渠道与门店</small><small>正在拟定本期 GSA 与拆解，可体验完整发布流程</small></button><button class="directory-option" data-action="choose-goal" data-goal="legacy" data-testid="directory-legacy" aria-pressed="${!isSales()}"><strong>华东直营会员 30 日有效复购率达到 24%</strong><small>2026 年第四季度 · 华东直营 · 成熟会员队列</small><small>已采用原 GSA v2 · 本次只读历史演示</small></button></div><details class="details"><summary>总目标的两种入口</summary><div class="details-body"><p>有适用正式战略发布时，承接该发布版中的明确 G。战略尚未启动或尚无适用正式版时，才可在目标管理中手动拟定并记录来源。</p><p style="margin-top:9px">本次两个示例均已有适用正式战略值，不开放另填一个组织总目标。Excel 是资料或既有目标表的导入方式，不是第三个正式目标来源。</p></div></details>`);}
  function versionOptions(){if(!isSales())return [{key:'old-v2',label:'原 GSA v2 · 当前生效 · 24%',kind:'legacy',no:2,target:'24%'},{key:'old-v1',label:'原 GSA v1 · 历史只读 · 23%',kind:'legacy',no:1,target:'23%'}];return [{key:'adopted-gs',label:'原目标 v1 · 已采用 G/S 与原实际安排',kind:'adopted' },...(state.gsaConfirmed?[{key:'gsa-v1',label:'总目标 GSA v1 · 已确认计划 A',kind:'gsa'}]:[]),...verifiedPublications().map(pub=>({key:'plan-'+pub.no,label:'拆解表 v'+pub.no+(pub.no===state.knownPublishedNo?' · 当前生效':' · 历史只读'),kind:'plan',pub}))];}
  function selectedVersion(){const options=versionOptions();state.ui.versionSelections=state.ui.versionSelections||{};const requested=state.ui.versionSelections[state.ui.selectedGoal];return options.find(v=>v.key===requested)||(!isSales()?options[0]:options.at(-1));}
  function versionRef(option){const info=goalInfo();return option.kind==='plan'?'GDT-retail-202701/v'+option.pub.no:option.kind==='gsa'?'GSA-retail-202701/v1':option.kind==='adopted'?info.id+'/v1':'GSA-east-2026q4/v'+option.no;}
  function sourceUnavailable(option){return (state.ui.sourceAccess||{})[state.ui.selectedGoal+'/'+option.key]||'available';}
  function versions(){const option=selectedVersion(),options=versionOptions(),info=goalInfo(),access=sourceUnavailable(option),historical=option.kind==='plan'?option.pub.no!==state.knownPublishedNo:option.kind==='legacy'?option.no!==2:false;const current=access==='available';openAux('版本与来源',`<p class="small-text muted">${info.title} · ${info.period} · ${info.scope}</p><div class="form-field" style="margin-top:14px"><label for="version-select">查看准确版本</label><select id="version-select" data-testid="version-select" style="width:100%">${options.map(item=>`<option value="${item.key}" ${item.key===option.key?'selected':''}>${item.label}</option>`).join('')}</select></div><p class="small-text muted" style="margin-top:10px">${historical?'正在只读查看历史版本，当前生效指针保持不变。':'这里只列已知的原已采用记录、已确认总 GSA 及已核实拆解版。候选草稿不冒充正式版。'}</p>${isSales()&&state.operation?.status==='unknown'?'<div class="note warning" data-testid="versions-pending" style="margin-top:12px">原发布操作结果待核，未核实的新版本不会提前列出或导出。原已核实生效版仍保留。</div>':''}<div class="handoff-snapshot" style="margin-top:13px"><strong>${option.label}</strong><div class="mono" style="margin-top:5px" data-testid="selected-version-ref">${esc(versionRef(option))}</div></div>${!current?`<div class="note warning" style="margin-top:13px" data-testid="source-unavailable">${access==='denied'?'当前没有读取权限。':'原来源暂时失读。'}保留上方准确身份与原选择，不能改用最新版，也不能导出未核实正文。恢复原来源后再核对。</div>`:versionBody(option)}<div class="actions" style="margin-top:15px"><button class="primary small" data-action="export-version" data-testid="export-version" ${current?'':'disabled'}>${option.kind==='plan'?'导出此正式拆解 HTML':option.kind==='adopted'?'导出原 GSA（原口径）':'导出此准确 GSA HTML'}</button>${isSales()&&option.kind==='plan'?'<button class="small" data-action="view-version-checks">查看本版检查与 Case 引用</button>':''}</div><details class="details"><summary>原型评审 · 来源读取异常</summary><div class="details-body"><label class="small-text">模拟此准确来源 <select id="source-access" data-testid="source-access"><option value="available" ${access==='available'?'selected':''}>可读取</option><option value="denied" ${access==='denied'?'selected':''}>无读权</option><option value="unavailable" ${access==='unavailable'?'selected':''}>暂时失读</option></select></label></div></details>`);}
  function versionBody(option){const sales=isSales(),p=option.pub;return `<dl class="version-source-grid" data-testid="version-body"><dt>期间与范围</dt><dd>${goalInfo().period} · ${goalInfo().scope}</dd><dt>正式目标</dt><dd>${sales?'120 万元':option.target}；${!sales&&option.no===1?'当时的正式目标，现仅历史回看':'以本版已采用值为准'}。</dd><dt>原战略发布</dt><dd>${sales?'S-2027 / v3 · G-2027-01':option.no===1?'S-east-2026 / v3 · 初始正式复购目标23%':'S-east-2026 / v4 · 正式修订复购目标24%'}，准确发布来源原样保留。</dd><dt>指标与基线</dt><dd>${sales?'合成 SAP 净销售额 / v2；可比期 108 万元；同口径可达测算 112 万元，差额 8 万元。':'合成 SAP 30日有效复购率 / v3；基线 22%；按成熟同队列有效复购人数／合格会员数核算，退款处理按原定义。'}</dd><dt>策略 S</dt><dd>${sales?'新品增长与平台活动共同补足增量。':'直营店首购回访试点，按成熟观察窗核对。'}</dd><dt>${option.kind==='adopted'||option.kind==='legacy'?'原 GSA 的 A':'计划 A'}</dt><dd>${option.kind==='adopted'?'本条原目标已采用 G/S。原实际安排为 Case C-014 决定 D2、项目 P-007 方案 v2 与看板 B-021 的门店陈列试点，2026-11-20 明确授权，陈店长负责、已完成、反馈待整理。本版没有新总 GSA 的计划 A，不从旧授权补造本期计划。':option.kind==='legacy'?'原 Case C-E11 决定 D4、项目 P-E03 方案 v3／看板 B-E07 的首购后7日回访试点，2026-10-01 明确授权，周店长负责、已完成，成熟队列观察已记录；按历史原口径保留，不补造新计划 A。':'月初核对新品试点与可售货品；第 2 周检查全渠道可比净销售额与增量依据；月末对照准确实绩复盘。仅已确认计划，不是行动授权。'}</dd><dt>责任与期限</dt><dd>${goalInfo().owner} · ${goalInfo().due}</dd><dt>留存与修订</dt><dd>${p?'2026-11-25 · '+(p.no===1?'首次拆解发布':'新品延后两周，只调整子目标阶段计划，G/S/上层计划 A 不变'):option.kind==='legacy'?option.no===2?'2026-10-15 生效 · 上游正式战略发布 v4 修订目标后，经观察窗与资源复核承接 24%，替代原 v3 的 23%；期初承诺仅备忘。':'2026-09-25 采用 · 承接上游正式战略发布 v3 的 23%；后由原 GSA v2 承接战略 v4 的 24% 替代。':'2026-11-25 · '+(option.kind==='gsa'?'确认总 GSA v1，补齐本期计划 A，未授权经营执行。':'原已采用 G/S，历史采用事实不重写。')}</dd></dl>${p?`<div class="aux-section-title">本准确拆解版的正式明细</div><div class="table-scroll"><table><thead><tr><th>目标行</th><th>责任范围</th><th>金额</th><th>负责人</th></tr></thead><tbody>${p.allocations.map(row=>`<tr><td>${row.id}</td><td>${row.scope}</td><td>${row.amount} 万</td><td>${row.owner}</td></tr>`).join('')}<tr><td>预留</td><td>${esc(p.reserve.purpose)}</td><td>5 万</td><td>${esc(p.reserve.owner)}</td></tr></tbody></table></div><div class="aux-section-title">本版冻   function versionEvidence(){const option=selectedVersion();if(option.kind!=='plan')return;const rows=state.checkHistory.filter(c=>c.planNo===option.pub.no);openAux('本版检查与 Case 引用',`<p class="small-text muted">只读回看 ${esc(versionRef(option))}，不会切换当前生效版或改写旧检查。</p>${rows.length?rows.map(c=>`<div class="record-card"><h3>${esc(c.id)} · 计划 v${c.planNo}</h3><p>${c.report==='incomplete'||c.trigger.type==='incomparable'?'已覆盖范围实绩':'可比实绩'} ${esc(c.sourceRef)} · ${c.comparison.actuals.join(' / ')} 万<br>原计划 ${c.comparison.plans.join(' / ')} 万 · ${c.report==='incomplete'||c.trigger.type==='incomparable'?'整体待核，缺失覆盖不作零，不给整体偏差百分数':'原偏差 '+c.comparison.percentages.map(v=>Number(v.toFixed(2))+'%').join(' / ')}<br>保存的阈值 ${c.threshold==='none'?'未配置':'10% 或连续 2 期'} · ${esc(c.trigger.reason)}<br>Case ${c.caseChoice==='existing'?'已选择 C-014':c.caseChoice==='new'?'已选择新 Case 草稿':'未选择，不强制新建'}</p></div>`).join(''):'<div class="aux-empty">本准确版尚无已保存的阶段检查引用。</div>'}`);}
  function caseRecords(){const base=isSales()?[{id:'C-014',title:'活动后新品转化',goal:'sales',goalVersion:'原目标 v1 · G/S',strategy:'S1 新品增长与平台活动',period:'2027 年 1 月',scope:'零售事业部全渠道与门店',status:'进行中',year:'2027',basis:'原目标 G-retail-202701/v1 与活动观察记录 ACT-01/r1',historical:false},{id:'C-008',title:'活动预热前测',goal:'sales',goalVersion:'原目标 v1 · G/S',strategy:'S1 新品增长与平台活动',period:'2027 年 1 月',scope:'重点试点门店',status:'已关闭',year:'2027',basis:'原试点记录 ACT-PRE/r2；关闭结论保留',historical:true}]:[{id:'C-E11',title:'华东直营首购回访试点',goal:'legacy',goalVersion:'原 GSA v1 · 历史 23%',strategy:'S1 首购回访与成熟队列观察',period:'2026 年第四季度',scope:'华东直营试点门店',status:'已关闭',year:'2026',basis:'原 GSA-east-2026q4/v1 与成熟队列观察 OBS-E/r3',historical:true}];const createdFromCheck=isSales()?state.checkHistory.find(c=>c.caseChoice==='new'):null;const projected=createdFromCheck?[{id:'C-015',title:'本期偏差的独立判断草稿',goal:'sales',goalVersion:'原目标 v1 · 总 GSA v1',strategy:'S1 新品增长与平台活动',period:'2027 年 1 月',scope:'零售事业部全渠道与门店',status:'草稿待确认',year:'2027',basis:'负责人在 '+createdFromCheck.id+' 明确选择另建 Case 草稿；实绩 '+createdFromCheck.sourceRef,planRef:'GDT-retail-202701/v'+createdFromCheck.planNo+' / G-TOTAL / '+createdFromCheck.checkpointId,historical:false}]:[];return base.concat(projected,state.ui.newCases.filter(c=>c.goal===state.ui.selectedGoal)).filter((record,index,all)=>all.findIndex(item=>item.id===record.id)===index);}
  function decisions(){const year=state.ui.caseYear||goalInfo().year,rows=caseRecords().filter(c=>year==='all'||c.year===year);openAux('关联决策',`<p class="small-text muted">先查看以本目标某准确版为主目标的 Case。按当前目标周期展示，年度筛选可选。没有待决事项时，无需先建 Case。</p><label class="form-field" style="display:block;margin-top:12px"><span class="small-text">年度范围</span><select id="case-year" data-testid="case-year" style="margin-left:8px"><option value="${goalInfo().year}" ${year===goalInfo().year?'selected':''}>目标周期 · ${goalInfo().year}</option><option value="all" ${year==='all'?'selected':''}>全部已关联年度</option></select></label>${rows.length?rows.map(c=>`<div class="record-card"><h3>${c.id} · ${esc(c.title)} <span class="status ${c.status==='进行中'?'':'warning'}">${c.status}</span></h3><p>主目标 · ${esc(c.goalVersion)}<br>具体策略 · ${esc(c.strategy)}<br>范围／周期 · ${esc(c.scope)} · ${esc(c.period)}<br>原依据 · ${esc(c.basis)}${c.planRef?'<br>准确拆解与检查 · '+esc(c.planRef):''}</p>${c.historical?'<p>已关闭或历史版本，仅查看原记录，不自动当作进行中事项续接。</p>':c.status==='草稿待确认'?'<p>已保存草稿，去原 Case 入口继续核对。尚非进行中，不自动续接或授权。</p>':'<p>同一问题优先续接此事项，原目标与原证据不自动切换到新拆解版。</p>'}<div class="actions"><button class="small" data-action="case-detail" data-case-id="${c.id}" data-testid="case-${c.id}">查看原 Case</button>${c.status==='进行中'&&!c.historical?`<button class="small" data-action="case-continue" data-case-id="${c.id}">续接此 Case</button>`:''}</div></div>`).join(''):'<div class="aux-empty">此范围没有已关联 Case，不推断没有经营问题。</div>'}<div class="actions" style="margin-top:15px">${isSales()?'<button class="primary small" data-action="case-new" data-testid="proactive-case">为重点试点主动建立 Case</button>':'<span class="small-text muted">本目标仅演示历史只读，不办理新 Case。</span>'}</div><p class="boundary">主动 Case 可从原已采用 G+S 准入，不要求先发布新拆解表、配置阈值或选择实绩。本页只是原 Case 入口的窄演示，不重建 Case 全系统。</p>`);}
  function findCase(id){return caseRecords().find(c=>c.id===id);}
  function caseDetail(id){const c=findCase(id);if(!c)return;openAux('原 Case 详情 · '+c.id,`<h3>${esc(c.title)}</h3><dl class="version-source-grid"><dt>主目标</dt><dd>${esc(c.goalVersion)} · ${goalInfo().id}</dd><dt>具体 S</dt><dd>${esc(c.strategy)}</dd><dt>原范围</dt><dd>${esc(c.scope)} · ${esc(c.period)}</dd><dt>状态</dt><dd>${c.status}${c.historical?' · 历史记录，不自动续接':''}</dd><dt>原依据</dt><dd>${esc(c.basis)}</dd>${c.planRef?'<dt>准确拆解／检查</dt><dd>'+esc(c.planRef)+'</dd>':''}<dt>后续</dt><dd>${c.status==='已关闭'?'原关闭结论与效果观察保留，继续阅读不重新打开。':c.status==='草稿待确认'?'草稿待原 Case 入口核对确认，尚非进行中，不产生经营授权。':'尚需负责人做经营取舍。打开或续接不等于已有行动授权。'}</dd></dl>${c.status==='进行中'&&!c.historical?`<button class="small" data-action="case-continue" data-case-id="${c.id}" data-testid="continue-original-case">续接此原 Case</button>`:''}${c.status==='草稿待确认'?`<button class="small" data-action="case-draft-entry" data-case-id="${c.id}" data-testid="case-draft-entry">去原 Case 入口继续（草稿待确认）</button>`:''}<p class="boundary">仅模拟进入原 Case 的准确详情，完整方案编辑、任务派发及反馈仍在原产品入口办理。</p>`);}

  function execution(){const records=state.ui.handoffs.filter(r=>r.goal===state.ui.selectedGoal),pubs=isSales()?verifiedPublications():[],existing=existingExecution();openAux('执行承接',`<p class="small-text muted">计划、项目方案和真实行动授权分别回看。GSA 确认、拆解发布或预览都不会自动创建项目、任务或授权经营行动。</p><h3 class="aux-section-title">目标层计划</h3><div class="note">${isSales()?state.gsaConfirmed?'总目标 GSA v1 的计划 A 已确认，仍只是计划。':'本期总 GSA 的计划 A 尚未确认，原 G/S 与原授权记录仍可回看。':'旧目标的原 GSA A 来自原 Case／项目／看板实际安排，按原口径保留；不补造新计划 A。'}</div><h3 class="aux-section-title">已有项目与实际授权记录</h3><div class="record-card"><h3>${existing.project} · ${existing.title}</h3><p>${existing.plan}<br>原目标引用 · ${existing.goal}<br>实际授权 · ${existing.authority}<br>实际负责人 · ${existing.owner} · 进度 ${existing.progress}<br>反馈 · ${existing.feedback}</p><div class="actions"><button class="small" data-action="project-detail">原项目方案详情</button><button class="small" data-action="board-detail">原行动看板详情</button></div></div>${isSales()?'<button class="text-button" data-action="original-project-preview" data-testid="original-project-preview" style="margin-top:12px">从原已采用 G/S 发起项目 · 原入口预览</button>':''}<h3 class="aux-section-title">按正式拆解目标行承接</h3>${isSales()&&state.operation?.status==='unknown'?'<div class="note warning" style="margin-bottom:12px">新发布结果待核，只能使用已核实的旧正式版，不能用未知版本或草稿生成执行。</div>':''}${pubs.length?`<form id="handoff-preview-form"><div class="form-row"><div class="form-field"><label for="handoff-plan">准确正式拆解版</label><select id="handoff-plan" data-testid="handoff-plan" style="width:100%">${pubs.map(pub=>`<option value="${pub.no}" ${pub.no===state.knownPublishedNo?'selected':''}>v${pub.no}${pub.no===state.knownPublishedNo?' · 当前生效':' · 历史版'}</option>`).join('')}</select></div><div class="form-field"><label for="handoff-line">目标行</label><select id="handoff-line" data-testid="handoff-line" style="width:100%">${pubs.find(pub=>pub.no===state.knownPublishedNo).allocations.map(row=>`<option value="${row.id}">${row.id} · ${row.scope}</option>`).join('')}</select></div></div><button type="submit" class="primary small" style="margin-top:13px" data-testid="preview-handoff">预览准确版本承接</button></form>`:'<div class="aux-empty" data-testid="handoff-no-published">暂无可用的已核实正式拆解表。仍可查看已有项目／看板与原已采用目标的项目入口，但不能用本次新草稿生成执行。</div>'}${records.length?`<h3 class="aux-section-title">已明确选择的承接引用</h3>${records.map(r=>`<div class="record-card"><h3>${r.projectId} · 项目方案草稿</h3><p>${r.planRef} · ${r.line.id} ${r.line.scope} · ${r.line.amount} 万<br>计划责任 · ${r.line.owner}<br>状态 · 已明确承接引用，项目方案尚未确认，无实际行动授权</p><button class="small" data-action="handoff-detail" data-handoff-id="${r.id}">查看原承接记录</button></div>`).join('')}`:''}<p class="boundary">同一目标／准确拆解版／目标行已有承接时，优先打开原记录。新版本不会静默迁移旧项目或改写其行动证据。</p>`);}
  function originalExecutionDetail(kind){const e=existingExecution();if(kind==='project')openAux('原项目方案 · '+e.project,`<h3>${e.title}</h3><dl class="version-source-grid"><dt>方案状态</dt><dd>${e.plan}</dd><dt>准确原引用</dt><dd>${e.goal}</dd><dt>范围</dt><dd>${e.scope}</dd><dt>行动权威</dt><dd>实际授权由原 Case／看板记录核对，不从“项目方案已确认”推断全部行动已授权。</dd></dl><button class="small" data-action="board-detail">查看原行动看板</button>`);else openAux('原行动看板 · '+e.board,`<h3>${e.action}</h3><dl class="version-source-grid"><dt>明确授权依据</dt><dd>${e.authority}</dd><dt>原目标／方案</dt><dd>${e.goal} · ${e.project}</dd><dt>实际负责人</dt><dd>${e.owner}</dd><dt>实际进度</dt><dd>${e.progress}</dd><dt>原反馈</dt><dd>${e.feedback}</dd></dl><p class="boundary">这是已有合成行动记录的只读演示。新 GSA 计划、发布拆解或项目承接不会修改这条授权或进度。</p>`);}
  function previewHandoff(no,lineId){const pub=verifiedPublications().find(pub=>pub.no===Number(no)),line=pub?.allocations.find(row=>row.id===lineId);if(!isSales()||!pub||!line){notify('未能核对准确正式版与目标行，原选择保留。');return;}const existing=state.ui.handoffs.find(r=>r.goal==='sales'&&r.version===pub.no&&r.line.id===lineId);if(existing){handoffDetail(existing.id);return;}const checkpoint=pub.checkpoints?.find(cp=>cp.goalId===lineId);if(!checkpoint){openAux('原行级检查点待核','<p class="small-text">准确正式拆解快照没有可读取的本行检查点，保留原表与目标行身份，不从当前草稿或行金额补造历史凭据。本次新拆解行承接暂不提交，仍可回看原已采用目标的项目入口及已有执行记录。</p>');return;}openAux('确认承接到项目方案草稿',`<p class="small-text muted">固定已发布的准确版本与本目标行。常规项目工作不要求先建 Case。</p><dl class="version-source-grid"><dt>总目标</dt><dd>${esc(pub.gsa)} · G-retail-202701</dd><dt>正式拆解</dt><dd>GDT-retail-202701/v${pub.no}</dd><dt>目标行</dt><dd>${line.id} · ${line.scope} · ${line.amount} 万</dd><dt>计划责任</dt><dd>${line.owner}</dd><dt>检查点</dt><dd>${checkpoint.date} 期末核对 ${checkpoint.target} 万 · ${checkpoint.id}。不把总表周计划当成本行目标。</dd></dl><div class="note">本次只形成项目方案草稿的准确引用。具体任务、人员安排、项目方案确认及行动授权仍在原项目／Case／看板办理。</div><div class="actions" style="margin-top:15px"><button class="primary small" data-action="confirm-handoff" data-plan-no="${pub.no}" data-line-id="${lineId}" data-testid="confirm-handoff">明确承接为项目方案草稿</button></div>`);}
  function confirmHandoff(no,lineId){const pub=verifiedPublications().find(p=>p.no===Number(no)),line=pub?.allocations.find(r=>r.id===lineId);if(!pub||!line||!isSales())return;const checkpoint=pub.checkpoints?.find(cp=>cp.goalId===lineId);if(!checkpoint){notify('原正式快照的行级检查点待核，保留原选择，未新增承接记录。');return;}let record=state.ui.handoffs.find(r=>r.goal==='sales'&&r.version===pub.no&&r.line.id===lineId);if(!record){record={id:'handoff-'+(state.ui.handoffs.length+1),goal:'sales',version:pub.no,projectId:'P-DEMO-'+(state.ui.handoffs.length+1),planRef:'GDT-retail-202701/v'+pub.no,gsaRef:pub.gsa,line:clone(line),checkpoint:clone(checkpoint),authority:null,projectPlanStatus:'draft'};state.ui.handoffs.push(record);}persist();handoffDetail(record.id);notify('已明确保存准确承接引用，未创建实际执行任务或行动授权。');}
  function handoffDetail(id){const r=state.ui.handoffs.find(r=>r.id===id&&r.goal===state.ui.selectedGoal);if(!r)return;openAux('原承接记录 · '+r.projectId,`<h3>项目方案草稿 · 尚未确认方案</h3><dl class="version-source-grid"><dt>父总目标 GSA</dt><dd>${r.gsaRef?esc(r.gsaRef):'原承接记录未记录父 GSA，需沿准确冻结拆解表回源，不能用当前默认值补填。'}</dd><dt>准确原计划</dt><dd>${r.planRef}</dd><dt>目标行</dt><dd>${r.line.id} · ${r.line.scope} · ${r.line.amount} 万</dd><dt>计划责任</dt><dd>${r.line.owner}</dd><dt>原检查点</dt><dd>${r.checkpoint.id} · ${r.checkpoint.date} · ${r.checkpoint.target} 万</dd><dt>实际授权</dt><dd>无。承接引用不等于任务、人员或经营行动授权。</dd><dt>进度／反馈</dt><dd>尚无实际执行记录。</dd></dl><p class="boundary">这是同一引用的原记录，重复承接不会新增项目草稿。以后发布新版，也不自动改写本记录。</p>`);}
  function reviewPage(){const selected=state.ui.reviewSelected||[];return `<section class="card"><div class="card-head"><div><h2>到期对照与下一阶段</h2><p class="small-text muted" style="margin-top:4px">合成到期情景 · 最后生效正式目标，不受拆解周计划修订影响</p></div><span class="status">原检查保留</span></div><div class="card-body"><div class="legacy-grid"><div><span>最后生效正式目标 G</span><strong>120 万</strong></div><div><span>期初承诺 · 仅作备忘</span><strong>120 万</strong></div><div><span>期末可比实绩</span><strong>123 万</strong></div></div><div class="note success">以原正式目标／已确认 GSA v1 的 120 万为准，达到目标并超过 3 万。拆解 v2 若仅调整时间计划，不会把总 G 改成别的数值。总量达成不证明新品或平台活动的贡献已获因果验证。</div><details class="details"><summary>阶段检查仍按各自原版本回看</summary><div class="details-body">${state.checkHistory.length?state.checkHistory.map(c=>`<p>${esc(c.id)} · 拆解表 v${c.planNo} · ${esc(c.sourceRef)} · ${esc(c.trigger.reason)}${c.caseChoice?' · 原 Case 选择保留':''}</p>`).join(''):'尚无已保存阶段检查，本合成期末摘要不补造缺失过程证据。'}</div></details><h3 class="aux-section-title">负责人选择带入下一期的结论或待验证假设</h3><label class="review-choice"><input type="checkbox" name="review-conclusion" value="new-product" ${selected.includes('new-product')?'checked':''}><span><strong>继续观察重点门店新品陈列试点（待验证假设）</strong><br><span class="muted">原依据 Case C-014 / ACT-01/r1 只说明试点资料。Case 仍进行中，实际执行反馈待整理，尚不能认定策略有效；适用范围仅重点直营门店，继续试验与扩展均标待验证。</span></span></label><label class="review-choice"><input type="checkbox" name="review-conclusion" value="timing" ${selected.includes('timing')?'checked':''}><span><strong>新品上市延后时重排阶段目标，不改写历史检查</strong><br><span class="muted">原依据为本次拆解发布版与原阶段检查引用，适用范围为同类供货约束。未发生修订时只作待验证建议。</span></span></label><div class="actions" style="margin-top:15px"><button class="primary" data-action="draft-next-cycle" data-testid="draft-next-cycle">让 Agent 据所选结论起草下一期</button></div>${state.ui.nextCycleDraft?`<div class="record-card" data-testid="next-cycle-draft"><h3>2027 年 2 月目标草稿 · 未采用／未发布</h3><p>${state.ui.nextCycleDraft.conclusions.map(c=>esc(c.title)+' · 原依据 '+esc(c.source)+' · 适用范围 '+esc(c.scope)).join('<br>')}</p><p>正式目标值与资源约束待下一期总目标 GSA 核对，原复盘与本期生效目标不变。Agent 输出为脚本模拟。</p></div>`:''}</div></section>`;}
  function metrics(){return `<div class="metric-grid"><div class="metric"><span>正式目标值</span><strong>120<em>万</em></strong><small>来源于正式战略发布版</small></div><div class="metric"><span>可达测算值</span><strong>112<em>万</em></strong><small>同期间、同范围、同口径</small></div><div class="metric gap"><span>待策略补足的差额</span><strong>8<em>万</em></strong><small>120 − 112，保留原测算</small></div></div>`;}
  function gsa(){return `<div class="gsa-layout"><section class="card" aria-labelledby="gsa-title"><div class="card-head"><div><h2 id="gsa-title">先确认总目标的 G + S + A</h2><p class="muted small-text" style="margin-top:5px">承接战略选择，再形成拆解依据</p></div><span class="status">待确认</span></div><div class="gsa-rows"><div class="gsa-row"><span class="gsa-letter">G</span><div><h3>1 月净销售额达到 120 万元</h3><p>零售事业部 · 2027.01.01—01.31<br>净销售额 = 已支付商品金额 − 同归属期退款，不含运费。基线为可比门店与渠道。</p><div class="source-line"><span class="source-badge">SAP 净销售额 / v2</span><span>正式战略目标 G-2027-01</span></div></div></div><div class="gsa-row"><span class="gsa-letter">S</span><div><h3>新品增长与平台活动共同补足增量</h3><p>稳定可比业务贡献，重点门店开展新品陈列与回访，平台活动聚焦新增转化。新品与活动贡献按不重叠范围估算。</p></div></div><div class="gsa-row"><span class="gsa-letter">A</span><div><h3>关键行动与阶段检查点</h3><ul><li>月初重点门店完成新品试点，观察可售货品与转化。</li><li>第 2 周核对活动期可比净销售额与增量依据。</li><li>月末按准确实绩复盘，任务、人员和执行授权由后续承接。</li></ul></div></div></div><div class="gsa-footer"><p>一次确认总目标 G、S 与上层 A。<br>确认后进入拆解，不会自动启动经营行动。</p><button class="primary" data-action="confirm-gsa" data-testid="confirm-gsa">确认 GSA，开始拆解 <span aria-hidden="true">→</span></button></div></section><aside class="stack"><div>${metrics()}<div class="note">测算帮助判断可达性。正式目标仍为 120 万，8 万差额需要在拆解发布前说明补足策略与预期贡献。</div></div><div class="card"><div class="card-body info-list"><div><h3>已带入当前工作</h3><p>正式战略发布版、指标定义、经营范围及可用的获准资料。</p></div><div><h3>确认后与 Agent 协作</h3><p>按贡献分配子目标，再结合商品与经营节奏排出时间计划。方法和工具由 Agent 按问题选择。</p></div><div><h3>只处理必要的经营取舍</h3><p>无需重录已承接的目标，也不要求逐项审批普通读取。</p></div></div></div></aside></div>`;}
  function chat(){const welcome=state.generated?(state.editingDraft?'已根据确认的 GSA 形成右侧拆解草稿。正式目标、测算和差额分别保留，责任分配与时间计划可以继续调整。':'右侧为当前生效的正式拆解表，发布内容保持只读。需要微小计划调整时，可另起拆解修订草稿。'):'总目标 GSA v1 已确认。我会沿用本次获准材料，提出贡献分配、补缺策略和时间计划。你可以直接提出约束，也可以从下面的请求开始。';return `<section class="card chat-card" aria-labelledby="agent-title"><div class="card-head"><div class="agent-title"><span class="agent-glyph" aria-hidden="true">✦</span><div><h2 id="agent-title">与目标 Agent 一起拆解</h2><p class="small-text faint" style="margin-top:2px">自主选择适用方法与工具</p></div></div><span class="status">脚本模拟</span></div><div class="chat-context"><span aria-hidden="true">▧</span><span>已带入 GSA v1、SAP v2 与示例经营材料</span></div><div class="chat-log" id="chat-log" aria-live="polite"><div class="message agent"><div class="author">目标 Agent</div>${welcome}${!state.generated?'':`<div class="answer-point"><span class="point-number">1</span><span>可达测算 112 万，正式目标 120 万，差额 8 万。</span></div><div class="answer-point"><span class="point-number">2</span><span>新品非活动期增量 5 万 + 平台额外增量 3 万，按不重叠范围预计覆盖差额。</span></div><div class="answer-point"><span class="point-number">3</span><span>已分配 115 万，另列有用途与责任人的 5 万预留。预留不代表可达性缺口已消失。</span></div>`}</div>${state.messages.map(m=>`<div class="message ${m.role}"><div class="author">${m.role==='user'?'你':'目标 Agent · 模拟'}</div>${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div>${!state.generated?'<div class="suggestion-row"><button class="suggestion" data-action="suggest-initial" data-testid="suggest-initial">按渠道、品类拆解，并安排周计划</button></div>':state.editingDraft&&!state.operation?'<div class="suggestion-row"><button class="suggestion" data-action="suggest-delay" data-testid="suggest-delay">新品延后两周，活动预算不变</button><button class="suggestion" data-action="show-evidence">查看测算与增量依据</button></div>':''}<form class="composer" id="chat-form"><label class="screen-reader" for="chat-input">向目标 Agent 提出拆解要求</label><textarea id="chat-input" data-testid="chat-input" placeholder="例如，按渠道与品类拆解，预留 5 万用于新品上市…" ${!state.editingDraft||state.operation?'disabled':''}>${esc(state.ui.draftInput||'')}</textarea><div class="composer-foot"><small>${!state.editingDraft?'正式版只读，可另起修订':state.operation?'发布意图已提交，先核对原操作结果':'提出约束，Agent 更新受影响的草稿'}</small><button class="primary small" type="submit" data-testid="send-message" ${!state.editingDraft||state.operation?'disabled':''}>发送 <span aria-hidden="true">↑</span></button></div></form></section>`;}
  function conflict(){if(!hasConflict())return '';return `<div class="issue-card" role="alert" data-testid="cross-conflict"><div class="issue-head"><h3>同口径交叉项尚未对齐</h3><span class="status error">只能保存草稿</span></div><div class="issue-body"><p class="small-text">1 月 · 零售事业部 · 净销售额 · 线下 × 羽绒服</p><div class="compare"><div>渠道计划<strong>50 万</strong><p>依据 · 门店目标表 r4</p></div><div class="versus">差 5 万</div><div>商品计划<strong>45 万</strong><p>依据 · 商品配置表 r3</p></div></div><p class="small-text muted">另一处「线上 × 羽绒服」同时为 30 万与 35 万。两个视图各自合计都是 120 万，但两处同口径交叉项均需对齐。差异不能转成预留。Agent 不替双方决定哪个数值有效。</p><details class="details"><summary>查看两边原明细与合计</summary><div class="details-body"><table><thead><tr><th>相同交叉单元</th><th>渠道计划</th><th>商品计划</th></tr></thead><tbody><tr><td>线下 × 羽绒服</td><td>50</td><td>45</td></tr><tr><td>线上 × 羽绒服</td><td>30</td><td>35</td></tr><tr><td>线上 × 针织</td><td>20</td><td>20</td></tr><tr><td>线下 × 针织</td><td>15</td><td>15</td></tr><tr><td>新品上市预留</td><td>5</td><td>5</td></tr><tr><td>合计（万元）</td><td>120</td><td>120</td></tr></tbody></table><p style="margin-top:9px">本演示支持双方采用任一原有方案的完整明细。50 万方案同时把商品视图的「线上 × 羽绒服」35 万调为 30 万。45 万方案同时把渠道视图的「线上 × 羽绒服」30 万调为 35 万。先展示变化，不能只改一个单元就宣称对平。</p></div></details><form id="align-form"><div class="form-row"><div class="form-field"><label for="aligned-value">双方已协商一致值 · 万元</label><input id="aligned-value" data-testid="aligned-value" type="number" step="1" min="0" placeholder="45 或 50" value="${esc(state.alignmentDraftValue)}" required ${state.alignmentError?'aria-invalid="true"':''}></div><div class="form-field"><label for="alignment-basis">双方确认依据</label><input id="alignment-basis" data-testid="alignment-basis" type="text" placeholder="例如，商品与渠道负责人已确认采用门店明细 r4" value="${esc(state.alignmentDraftBasis)}" required></div></div>${state.alignmentError?`<p class="small-text" style="color:var(--error);margin-top:8px" role="alert">${esc(state.alignmentError)}</p>`:''}<div class="actions" style="margin-top:12px"><button type="submit" class="small" data-testid="apply-alignment">按双方确认明细更新并重新校验</button></div></form></div></div>`;}
  function draftTable(){const rows=allocations();const allocated=rows.reduce((sum,r)=>sum+r.amount,0);return `<div class="table-scroll"><table aria-label="目标拆解草稿明细" data-testid="decomposition-table"><thead><tr><th>子目标 / 责任范围</th><th>正式分配</th><th>负责人</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.scope)}<span class="subtle-line">${esc(r.id)} · ${esc(r.strategy)}</span><span class="subtle-line">期末检查 01.31 · ${r.amount} 万</span></td><td class="table-target">${r.amount} 万</td><td>${esc(r.owner)}</td></tr>`).join('')}<tr class="reserve-row"><td>新品上市预留<span class="subtle-line">单独预留，不计入子目标已分配</span></td><td class="table-target">5 万</td><td>${esc(state.reserveOwner||'待补责任人')}</td></tr><tr class="total-row"><td>已分配 ${allocated} + 预留 5</td><td>120 万</td><td>${allocated===115?'金额对平 ✓':'金额待核'}</td></tr></tbody></table></div>`;}
  function splitBody(){return `<div class="card-body">${metrics()}<div class="allocation-line"><span>已分配 <strong>115 万</strong></span><span>有用途、有责任人的预留 <strong>5 万</strong></span></div><div class="allocation-bar" aria-label="115万元已分配，5万元预留"><span></span></div>${conflict()}${state.aligned?`<div class="note success" style="margin-top:15px" data-testid="alignment-result">双方已采用 ${state.alignedValue} 万方案的完整明细。${state.alignedValue===50?'商品视图的线上 × 羽绒服同步从 35 万调整为 30 万':'渠道视图的线上 × 羽绒服同步从 30 万调整为 35 万'}，两个视图重新汇总均为 120 万。<br><span class="small-text">确认依据 · ${esc(state.alignmentBasis)}</span></div>`:''}</div>${draftTable()}<div class="card-body" style="border-top:1px solid var(--line)"><div class="subhead" style="margin-top:0"><h3>8 万测算缺口，预计怎样补足</h3><button class="inline-button" data-action="show-gap" data-testid="edit-gap">${!state.editingDraft||state.operation?'查看':'核对 / 编辑'}</button></div><p class="small-text muted" data-testid="gap-strategy">${state.gapStrategy?'新品非活动期增量 5 万 + 平台额外增量 3 万 = 8 万。两项范围不重叠，均为计划预期，后续按实绩检验。':'尚未说明补缺策略及预期贡献，暂不能发布。'}</p><div class="subhead"><h3>时间计划 · 按商品与经营节奏</h3><button class="inline-button" data-action="show-timeline">查看检查点</button></div><div class="bar-chart" aria-label="分周计划，已分配共115万元"><div class="week"><div class="week-bar" style="height:54px">${state.delayed?20:25} 万</div>第 1 周</div><div class="week current"><div class="week-bar" style="height:66px">${state.delayed?25:30} 万</div>第 2 周</div><div class="week"><div class="week-bar" style="height:78px">${state.delayed?40:35} 万</div>第 3 周</div><div class="week"><div class="week-bar" style="height:54px">${state.delayed?30:25} 万</div>第 4 周</div></div><p class="small-text faint" style="margin-top:10px">${state.delayed?'新品上市推迟两周，前两周各移后 5 万，后两周各承接 5 万。总分配与 8 万补缺策略不变。':'基础款提供稳定贡献，活动与新品形成不同周曲线。115 万已排期，5 万预留待明确后修订发布。'}</p><details class="details"><summary>预留用途、责任人与发布前校验</summary><div class="details-body"><p>预留用途 · ${esc(state.reservePurpose||'尚未填写')}<br>预留责任人 · ${esc(state.reserveOwner||'尚未填写')}</p>${state.editingDraft&&!state.operation?'<button class="small" data-action="edit-reserve" style="margin-top:10px" data-testid="edit-reserve">编辑预留</button>':''}<div class="check-list"><div class="rule-line"><span class="check">${state.reservePurpose&&state.reserveOwner?'✓':'!'}</span><span>${state.reservePurpose&&state.reserveOwner?'已分配 115 + 有用途、有责任人的预留 5 = 正式目标 120':'预留用途或责任人待补，余额不能作为合法预留'}</span></div><div class="rule-line"><span class="check">${hasConflict()?'!':'✓'}</span><span>${hasConflict()?'两处同口径交叉项未对齐，发布受阻':'同口径交叉项一致'}</span></div><div class="rule-line"><span class="check">${state.gapStrategy?'✓':'!'}</span><span>${state.gapStrategy?'补缺策略与预期贡献覆盖 8 万差额':'补缺策略或贡献待补'}</span></div><div class="rule-line"><span class="check">✓</span><span>引用 GSA v1、SAP v2；责任范围与阶段检查点已列明</span></div></div></div></details>${opDetails()}</div>`;}
  function recovery(){if(state.operation?.status!=='unknown'&&state.operation?.status!=='not-executed')return '';const op=state.operation;return `<section class="card" style="margin-bottom:16px" data-testid="recovery-card"><div class="card-body"><div class="note warning"><strong>${op.status==='not-executed'?'已查明，原发布操作确定未执行':'发布请求已发出，结果还未核实'}</strong><p style="margin-top:5px">${op.status==='not-executed'?'服务端已确认原请求未提交，且没有在途写入。原草稿和发布意图仍在，可明确重试同一编号与同一内容，不创建第二份操作。':'连接中断不能证明发布失败。先只读核对原操作，保留已确认的草稿与可能已保存的正式版。'}</p></div><div class="actions" style="margin-top:13px">${op.status==='not-executed'?'<button class="primary" data-action="retry-publish" data-testid="retry-publish">重试原发布意图</button>':'<button class="primary" data-action="query-publish" data-testid="query-publish">核对原发布结果</button>'}<span class="small-text muted">${op.queries?'已只读核对 '+op.queries+' 次':'不会重新发送发布请求'}</span></div>${op.lastQuery==='unknown'?'<p class="small-text" role="status" style="margin-top:11px;color:var(--warning)">仍无法确认结果。保持待核，正式发布按钮继续停用。可以稍后再查或重新打开本演示。</p>':''}</div></section>`;}
  function publishedReceipt(){if(!state.knownPublishedNo)return '';const p=currentPublished();return `<section class="card" style="margin-bottom:16px" data-testid="published-receipt"><div class="receipt"><div class="receipt-title"><span class="receipt-icon" aria-hidden="true">✓</span><div><h3>目标拆解表 v${p.no} 已正式发布${state.editingDraft?' · 当前仍生效':''}</h3><p class="small-text muted">${state.editingDraft?'下方正在编辑新的拆解草稿。修订期间，原发布版及其检查、Case 选择仍可回看。':'负责人已核对并发布。下游使用准确版本，已完成的检查不会随新版本切换。'}</p></div></div><div class="reference"><div><strong>零售事业部 · 2027 年 1 月</strong><code>${esc(p.id)} / v${p.no} · GSA v1 · ${p.delayed?'修订后周计划':'初始周计划'}</code></div><button class="inline-button" data-action="show-reference" data-testid="view-reference">查看下游引用</button></div><div class="actions" style="margin-top:13px"><button class="small" data-action="tab-follow" data-testid="start-follow">${selectedCheck()?'回看阶段检查与 Case':'选定实绩，开始阶段跟进'} <span aria-hidden="true">→</span></button>${!state.editingDraft?'<button class="small ghost" data-action="revise" data-testid="revise-plan">修订拆解计划</button>':''}</div></div></section>`;}
  function plan(){if(!state.gsaConfirmed)return gsa();return `${publishedReceipt()}${recovery()}<div class="work-grid">${chat()}<section class="card" aria-labelledby="split-title"><div class="card-head"><div><h2 id="split-title">目标拆解表</h2><p class="small-text faint" style="margin-top:3px">${state.generated?state.editingDraft?'依据 GSA v1 · 草稿 r'+state.draftRevision:'依据 GSA v1 · 已发布版本':'等 Agent 形成可核对的方案'}</p></div><span class="status ${hasConflict()&&state.generated?'error':!state.editingDraft&&state.knownPublishedNo?'success':''}">${!state.editingDraft&&state.knownPublishedNo?'正式版 v'+state.knownPublishedNo:hasConflict()&&state.generated?'交叉项待对齐':'草稿'}</span></div>${state.generated?splitBody():`<div class="card-body">${metrics()}</div><div class="empty-state"><div class="empty-illustration" aria-hidden="true"><i></i><i></i><i></i></div><h3>把贡献分配与时间计划放在一起核对</h3><p>向左侧 Agent 发送请求后，<br>这里会呈现子目标、预留、补缺策略与阶段计划。</p></div>`}<div class="publish-footer"><p>${state.operation?.status==='unknown'?'原发布结果待核。先核对原操作，不重复提交。':hasConflict()&&state.generated?'交叉冲突必须先拉齐。草稿和双方依据都会保留。':!state.editingDraft?'本版已发布。执行任务、人员安排和经营授权按后续入口承接。':'核对后一次发布拆解计划。具体任务和执行授权由下游承接。'}</p><div class="actions"><button class="small" data-action="save-draft" data-testid="save-draft" ${!state.generated||!state.editingDraft||state.operation?'disabled':''}>保存草稿</button><button class="primary" data-action="review-publish" data-testid="publish-button" ${canPublish()?'':'disabled'}>${!state.editingDraft?'已发布':'核对并发布'}</button></div></div></section></div>`;}
  function follow(){
    const p=checkPlan();if(!p){state.tab='plan';return plan();}
    const c=selectedCheck(),pending=c?.report==='incomplete',two=c?.report==='two-periods';
    const weeks=p.weeks||(p.delayed?[20,25,40,30]:[25,30,35,25]);
    const {actuals,plans,percentages}=c?.comparison||comparisonFor(c?.report||state.report,p);
    const savedThreshold=c?.threshold||state.threshold;
    const format=value=>String(Number(value.toFixed(2)));
    const signed=value=>(value>0?'+':'')+format(value)+'%';
    const readOnly=!!c;
    const sourceRef=c?.sourceRef||(pending?'actual-202701-w2-partial/r1':two?'actual-202701-w1-w2/r1':'actual-202701-w2-complete/r2');
    return `<div class="follow-layout"><div class="stack"><section class="card"><div class="card-head"><div><h2>${readOnly?'回看已完成的阶段检查':'先选实绩，再对照准确计划'}</h2><p class="small-text faint" style="margin-top:4px">第 2 周汇总检查点 · 目标拆解表 v${p.no} · 零售事业部 G-TOTAL</p></div><span class="status ${c&&!pending?'success':pending?'warning':''}">${c?pending?'数据待补':'已保存检查':'待选实绩'}</span></div><div class="card-body">
      ${state.checkHistory.length?`<div class="form-field"><label for="check-history">检查记录 · 各自保留原计划、实绩与 Case 选择</label><select id="check-history" data-testid="check-history" style="width:100%">${!c?`<option value="" selected>下一次检查 · 使用 v${p.no} · 待选实绩</option>`:''}${state.checkHistory.slice().reverse().map(item=>`<option value="${esc(item.id)}" ${c?.id===item.id?'selected':''}>${esc(item.id)} · 计划 v${item.planNo} · ${item.report==='two-periods'?'连续两期完整实绩':item.report==='incomplete'?'覆盖待补':'第 2 周完整实绩'}${item.caseChoice?' · 已有 Case 选择':''}</option>`).join('')}</select></div>`:''}
      <p class="small-text muted" style="margin-top:${state.checkHistory.length?'13':'0'}px">${readOnly?'本记录只读回看，实绩来源与计划版本保持原样。需要开展下一次检查时，明确选用当前生效版后再选实绩。':'负责人只选定一次本次实绩。Agent 核对期间、范围、口径、截至时间和覆盖程度，再比较偏差。'}</p>
      ${readOnly?`<div class="actions" style="margin-top:13px"><button class="small" data-action="next-check" data-testid="next-check">按当前生效 v${state.knownPublishedNo} 开始下一次检查</button><span class="small-text muted">不会改写 ${esc(c.id)} 或替换其原引用版</span></div>`:''}
      <form id="report-form" class="select-row"><div class="form-field"><label for="report-select">${readOnly?'本记录已选定的实绩资料':'本次使用的实绩资料'}</label><select id="report-select" data-testid="report-select" ${readOnly?'disabled':''}><option value="" ${!(c?.report||state.report)?'selected':''}>请选择本次实绩</option><option value="complete" ${(c?.report||state.report)==='complete'?'selected':''}>第 2 周完整实绩 · 全部渠道与门店 · 27 万</option><option value="incomplete" ${(c?.report||state.report)==='incomplete'?'selected':''}>第 2 周局部实绩 · 缺两家门店 · 27 万</option><option value="two-periods" ${(c?.report||state.report)==='two-periods'?'selected':''}>连续两期完整实绩 · 23.75 / 28.5 万</option></select></div>${!readOnly?'<button class="primary" type="submit" data-testid="compare-report">选定并分析</button>':''}</form>
      ${c?`<div class="comparison-metrics"><div><span>引用版阶段计划</span><strong data-testid="check-plan-values">${plans.map(format).join(' / ')}<small>万元 · 第 ${two?'1、2':'2'} 周</small></strong></div><div><span>${pending?'已覆盖范围实绩':'可比实绩'}</span><strong data-testid="check-actual-values">${actuals.map(format).join(' / ')}<small>万元 · ${pending?'尚缺两家门店':'覆盖完整'}</small></strong></div><div><span>${pending?'整体偏差':'可比偏差'}</span><strong style="color:${pending?'var(--warning)':percentages.some(value=>value<0)?'var(--error)':'var(--success)'}" data-testid="check-percentages">${pending?'待核':percentages.map(signed).join(' / ')}<small>${pending?'局部数值不能当作整体':two?'同一实绩资料，按本记录引用版比较':percentages[0]<0?'低于计划 '+format(plans[0]-actuals[0])+' 万':'高于计划 '+format(actuals[0]-plans[0])+' 万'}</small></strong></div></div>
      <div class="note ${pending?'warning':'success'}" data-testid="comparison-result">${pending?'本报表缺两家门店。本期只说明已覆盖范围与待补门店，不把缺失数据记为零，也不计为已确认偏离期。':'Agent 已核对同一期间、范围、SAP 净销售额 v2 与完整覆盖。比较本记录引用的目标拆解表 v'+p.no+'，实绩数值不随计划修订变化。'}</div>

      <details class="details"><summary>本次检查的证据与准确引用</summary><div class="details-body"><dl><dt>检查记录</dt><dd>${esc(c.id)}</dd><dt>检查点</dt><dd>CP-202701-W2-TOTAL</dd><dt>计划</dt><dd class="mono">${esc(p.id)} / v${p.no} / G-TOTAL</dd><dt>目标与策略</dt><dd>GSA v1 · G-TOTAL · S1 新品增长与平台活动</dd><dt>实绩来源</dt><dd data-testid="check-source-ref">${esc(sourceRef)}</dd><dt>截至时间</dt><dd>2027.01.14 23:59（演示）</dd></dl></div></details>`:''}
    </div></section></div><aside class="card"><div class="card-head"><h2>检查设置与承接</h2></div><div class="card-body"><div class="threshold-row"><span>${c?'下次检查提示阈值':'Case 提示阈值'}</span><select id="threshold-select" data-testid="threshold-select" aria-label="Case提示阈值"><option value="configured" ${state.threshold==='configured'?'selected':''}>已设置</option><option value="none" ${state.threshold==='none'?'selected':''}>尚未设置</option></select></div><div class="mini-stat"><span class="muted">不利偏差幅度</span><strong>${savedThreshold==='configured'?'≥ 10%':'未设置'}</strong></div><div class="mini-stat"><span class="muted">连续偏低期数</span><strong>${savedThreshold==='configured'?'≥ 2 期':'未设置'}</strong></div><p class="small-text muted" style="margin-top:10px">${c?'下方规则属于本记录保存的阈值。调整上方选项仅影响下一次检查，原触发理由与 Case 选择保持不变。':'任一阈值达到就提示。未设置阈值也可正常核对实绩和分析偏差。'}</p><div class="note" style="margin-top:16px">已有同一问题的 Case 优先续接。是否新建由负责人决定，提示本身不会创建 Case 或授权行动。</div><button class="inline-button" data-action="show-reference" style="margin-top:14px">查看本记录固定引用</button></div></aside></div>`;
  }
  function caseCard(c,p,percentages){
    const choice=c.caseChoice?`<div class="note success" style="margin-top:12px" data-testid="case-choice-result">${c.caseChoice==='existing'?'已选择续接 Case C-014。':'已明确选择新建 Case 草稿 C-015。'}保留 ${esc(c.id)}、GSA v1、拆解表 v${p.no}、G-TOTAL、汇总检查点及原实绩引用。后续行动仍需原入口授权。</div>`:'';
    if(c.report==='incomplete')return choice;
    const trigger=c.trigger||triggerFor(c.report,c.threshold||'configured',percentages);
    if(trigger.type==='unconfigured')return '<p class="small-text muted" style="margin-top:15px" data-testid="case-no-threshold">偏差分析已完成。尚未设置 Case 提示阈值，不额外阻断本次检查。</p>'+choice;
    const magnitude=trigger.type==='magnitude',prompt=trigger.type==='magnitude'||trigger.type==='consecutive';

    switch(action){case'confirm-gsa':state.gsaConfirmed=true;state.tab='plan';render();notify('总目标 GSA v1 已确认，开始与 Agent 拆解。');$('chat-input')?.focus();break;case'suggest-initial':$('chat-input').value='按渠道、品类拆解目标，并结合新品与平台活动安排周计划。预留 5 万用于新品上市，由商品负责人承担。';$('chat-input').focus();break;case'suggest-delay':$('chat-input').value='新品延后两周，活动预算不变，请更新受影响的周计划。';$('chat-input').focus();break;case'save-draft':if(state.generated&&!state.operation&&state.editingDraft){state.saveCount++;persist();notify('草稿 r'+state.draftRevision+' 已保存。'+(hasConflict()?'交叉冲突与双方依据原样保留。':'尚未形成正式发布版。'));}break;case'review-publish':reviewPublish();break;case'confirm-publish':closeDialog();publish();break;case'query-publish':query();break;case'retry-publish':retry();break;case'tab-plan':state.tab='plan';render();break;case'tab-follow':if(state.knownPublishedNo){state.tab='follow';render();}break;case'edit-reserve':showReserve();break;case'show-gap':showGap();break;case'show-reference':reference();break;case'show-timeline':timeline();break;case'show-evidence':evidence();break;case'revise':state.editingDraft=true;state.operation=null;state.draftRevision++;state.tab='plan';addAgent('已在原 GSA v1 下建立新的拆解草稿，旧发布版及其引用保持原样。微小计划调整可只修订拆解表；若触及 G、S、上层 A，应先重新确认 GSA。');render();notify('已另起拆解修订草稿，可继续提出调整。');break;case'continue-case':if(selectedCheck())selectedCheck().caseChoice='existing';render();notify('已选择续接已有 Case，准确计划与实绩引用已带入演示承接卡。');break;case'new-case':openDialog('确认另建 Case 草稿',`<p class="small-text">已有同一问题的 Case C-014。若本次确有独立决策问题，可另建草稿，并保留与原事项的关联。</p><p class="boundary">这里只模拟负责人明确选择，不启动行动，也不产生真实 Case。</p>`,`<button data-dialog-close>返回已有事项</button><button class="primary" data-action="confirm-new-case" data-testid="confirm-new-case">明确另建 Case 草稿</button>`);break;case'confirm-new-case':closeDialog();if(selectedCheck())selectedCheck().caseChoice='new';render();notify('已模拟建立独立 Case 草稿，后续取舍与行动由负责人承接。');break;case'next-check':state.activeCheckId=null;state.nextCheckPlanNo=state.knownPublishedNo;state.report=null;render();notify('已明确选用当前生效 v'+state.knownPublishedNo+' 开始下一次检查，历史检查保持原版。');break;case'observe':notify('本次检查和提示已保留，负责人选择继续观察，没有创建 Case。');break;}}
  document.addEventListener('click',event=>{const close=event.target.closest('[data-dialog-close]');if(close){closeDialog();return;}const button=event.target.closest('[data-action]');if(button&&!button.disabled)handleAction(button.dataset.action,button);});
  document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();sendMessage($('chat-input').value);}if(event.target.id==='align-form'){event.preventDefault();const value=Number($('aligned-value').value),basis=$('alignment-basis').value.trim();state.alignmentDraftValue=$('aligned-value').value;state.alignmentDraftBasis=basis;if(![45,50].includes(value)||!basis){state.alignmentError='本演示请采用双方已确认的 45 万或 50 万完整方案，并填写双方确认依据。正式产品由 Agent 核对完整明细，不能只改一个交叉值。';render();$('aligned-value')?.focus();return;}state.aligned=true;state.alignedValue=value;state.alignmentBasis=basis;state.alignmentError='';state.draftRevision++;addAgent('已依据双方确认采用 '+value+' 万方案的完整明细，同时展示受影响的另一个交叉单元，重新汇总各视图合计仍为 120 万。冲突没有转成预留，可继续核对后发布。');render();notify('双方确认依据与受影响明细已保存，交叉项重新校验通过。');}if(event.target.id==='reserve-form'){event.preventDefault();state.reservePurpose=$('reserve-purpose').value.trim();state.reserveOwner=$('reserve-owner').value.trim();state.draftRevision++;closeDialog();render();notify(state.reservePurpose&&state.reserveOwner?'预留用途与责任人已更新。':'草稿已保存，预留字段待补，发布保持停用。');}if(event.target.id==='gap-form'){event.preventDefault();state.gapStrategy=$('gap-present').checked;state.draftRevision++;closeDialog();render();notify(state.gapStrategy?'补缺策略已保留在草稿中。':'草稿已保存，补缺策略待补，不能发布。');}if(event.target.id==='report-form'){event.preventDefault();if(selectedCheck())return;const report=$('report-select').value;if(!report){notify('请选定本次使用的实绩资料。');$('report-select').focus();return;}const plan=checkPlan();if(!plan)return;state.report=report;const comparison=comparisonFor(report,plan),trigger=triggerFor(report,state.threshold,comparison.percentages);const check={id:'CHECK-'+String(state.checkHistory.length+1).padStart(3,'0'),report,planNo:plan.no,goalId:'G-TOTAL',checkpointId:'CP-202701-W2-TOTAL',caseChoice:null,threshold:state.threshold,comparison,trigger,sourceRef:report==='incomplete'?'actual-202701-w2-partial/r1':report==='two-periods'?'actual-202701-w1-w2/r1':'actual-202701-w2-complete/r2'};state.checkHistory.push(check);state.activeCheckId=check.id;state.nextCheckPlanNo=null;render();notify(report==='incomplete'?'覆盖不完整，保留待补，不给整体偏差结论。':'新检查已保存，按所选的准确发布版分析，原检查记录保持原样。');}});
  document.addEventListener('submit',event=>{if(event.target.id==='proactive-case-form'){event.preventDefault();const title=$('case-title').value.trim();if(!title){notify('事项名称仍需说明。');return;}const duplicate=caseRecords().find(c=>c.title===title&&['进行中','草稿待确认'].includes(c.status));if(duplicate){caseDetail(duplicate.id);notify('已有同一事项，优先打开原 Case，没有另建。');return;}const c={id:'C-DEMO-'+(state.ui.newCases.length+1),title,goal:'sales',goalVersion:'原目标 v1 · G/S',strategy:'S1 新品增长与平台活动',period:'2027 年 1 月',scope:'零售事业部重点试点门店',status:'草稿待确认',year:'2027',basis:'负责人明确建立重点试点；原目标 G-retail-202701/v1；尚未授权行动',historical:false};state.ui.newCases.push(c);persist();caseDetail(c.id);notify('已明确建立合成 Case 草稿，未创建任务或行动授权。');}if(event.target.id==='handoff-preview-form'){event.preventDefault();previewHandoff($('handoff-plan').value,$('handoff-line').value);}});
  document.addEventListener('input',event=>{if(event.target.id==='chat-input'&&isSales()){state.ui.draftInput=event.target.value;persist();}});
  document.addEventListener('change',event=>{if(event.target.id==='version-select'){state.ui.versionSelections[state.ui.selectedGoal]=event.target.value;persist();versions();}if(event.target.id==='source-access'){const option=selectedVersion();if(typeof state.ui.sourceAccess!=='object')state.ui.sourceAccess={};state.ui.sourceAccess[state.ui.selectedGoal+'/'+option.key]=event.target.value;persist();versions();}if(event.target.id==='case-year'){state.ui.caseYear=event.target.value;persist();decisions();}if(event.target.name==='review-conclusion'){state.ui.reviewSelected=[...document.querySelectorAll('input[name="review-conclusion"]:checked')].map(input=>input.value);persist();}});
  document.addEventListener('change',event=>{if(event.target.id==='scenario'){if($('chat-input'))$('chat-input').value='';state=initial(event.target.value);state.ui=uiDefaults();render();notify('演示场景已重置，请从确认 GSA 开始。');}if(event.target.id==='lost-outcome'&&!state.operation){state.lostOutcome=event.target.value;persist();}if(event.target.id==='check-history'){state.activeCheckId=event.target.value||null;const check=selectedCheck();state.report=check?.report||null;state.nextCheckPlanNo=null;render();notify('已打开所选历史检查，计划版本、实绩与 Case 选择保持原样。');}if(event.target.id==='threshold-select'){state.threshold=event.target.value;render();notify((selectedCheck()?'下次检查的配置已更新，本记录阈值与触发理由保持原样。':state.threshold==='none'?'未配置阈值，阶段比较仍可使用。':'已使用示例阈值，任一条件达到就提示 Case。'));}});

  let wasMobile=innerWidth<=760;addEventListener('resize',()=>{const mobile=innerWidth<=760;if(mobile!==wasMobile){wasMobile=mobile;state.ui.sidebarOpen=!mobile;updateSidebar();persist();}});
  $('reset-demo').addEventListener('click',()=>{if($('chat-input'))$('chat-input').value='';state=initial(state.scenario);state.ui=uiDefaults();render();notify('本场景的合成状态已重置。');});
  $('reopen-demo').addEventListener('click',()=>{persist();if(memoryOnly){notify('当前浏览器不提供存储，无法模拟重开恢复。请通过本地 HTTP 预览打开。');return;}location.reload();});
  $('detail-dialog').addEventListener('close',()=>{if(dialogInvoker?.isConnected)dialogInvoker.focus();});
  Object.defineProperty(window,'demoInspect',{value:()=>Object.freeze(clone({scenario:state.scenario,gsaConfirmed:state.gsaConfirmed,generated:state.generated,draftRevision:state.draftRevision,conflict:hasConflict(),aligned:state.aligned,alignedValue:state.alignedValue,publishedCount:state.published.length,published:state.published,knownPublishedNo:state.knownPublishedNo,operationCount:state.operationCount,operation:state.operation,saveCount:state.saveCount,gapStrategy:state.gapStrategy,reservePurpose:state.reservePurpose,reserveOwner:state.reserveOwner,editingDraft:state.editingDraft,check:selectedCheck(),checkHistory:state.checkHistory,activeCheckId:state.activeCheckId,nextCheckPlanNo:state.nextCheckPlanNo,threshold:state.threshold,caseChoice:selectedCheck()?.caseChoice||null,ui:state.ui,visiblePublicationCount:verifiedPublications().length})),writable:false,configurable:false});
