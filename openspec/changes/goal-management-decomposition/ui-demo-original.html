      <label for="scenario">演示场景 <select id="scenario" data-testid="scenario-select"><option value="normal">正常发布</option><option value="conflict">交叉冲突</option><option value="lost">发布失答恢复</option></select></label>
      <label for="lost-outcome" id="lost-label" hidden>模拟结果 <select id="lost-outcome" data-testid="lost-outcome"><option value="saved">已保存，回包丢失</option><option value="not-executed">确定未执行</option><option value="unknown">仍未知</option><option value="not-found">未查到回执，仍待核</option></select></label>
      <span class="demo-caption">合成资料 · Agent 回复为脚本模拟 · 切换场景将重置演示</span>
      <button class="small ghost" id="reset-demo" data-testid="reset-demo">重置场景</button>
      <button class="small" id="reopen-demo" data-testid="reopen-demo">模拟重新打开</button>
    </section>
    <div class="workspace" id="workspace"></div>
  </main>
</div>
<div class="toast" role="status" aria-live="polite" id="toast" hidden></div>
<dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<script>
(()=>{
  'use strict';
  const STORE='optracall.goal-decomposition.option-original.v1';
  const $=id=>document.getElementById(id);
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone=value=>JSON.parse(JSON.stringify(value));
  let memoryOnly=false;
  function initial(scenario='normal'){return {schema:2,scenario,lostOutcome:'saved',gsaConfirmed:false,generated:false,tab:'plan',messages:[],draftRevision:1,delayed:false,reservePurpose:'新品上市预留',reserveOwner:'商品负责人',gapStrategy:true,aligned:false,alignedValue:50,alignmentBasis:'',alignmentDraftValue:'',alignmentDraftBasis:'',alignmentError:'',published:[],knownPublishedNo:null,editingDraft:true,operation:null,operationCount:0,saveCount:0,report:null,checkHistory:[],activeCheckId:null,nextCheckPlanNo:null,threshold:'configured'};}
  function restore(){try{const value=JSON.parse(sessionStorage.getItem(STORE));if(value&&[1,2].includes(value.schema)&&['normal','conflict','lost'].includes(value.scenario)){if(value.schema===1){value.editingDraft=!value.knownPublishedNo;value.checkHistory=value.check?[{...value.check,id:'CHECK-001',threshold:value.threshold||'configured',caseChoice:value.caseChoice||null}]:[];value.activeCheckId=value.checkHistory[0]?.id||null;value.nextCheckPlanNo=null;value.schema=2;delete value.check;delete value.caseChoice;}return value;}}catch{}return initial();}
  let state=restore(),dialogInvoker=null,toastTimer;
  function persist(){try{sessionStorage.setItem(STORE,JSON.stringify(state));}catch{memoryOnly=true;}}
  function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4800);}
  const selectedCheck=()=>state.checkHistory.find(c=>c.id===state.activeCheckId)||null;
  const currentPublished=()=>state.published.find(p=>p.no===state.knownPublishedNo);
  const checkPlan=()=>{const c=selectedCheck();return state.published.find(p=>p.no===(c?.planNo||state.nextCheckPlanNo||state.knownPublishedNo));};
  function comparisonFor(report,p){const weeks=p.weeks||(p.delayed?[20,25,40,30]:[25,30,35,25]);const actuals=report==='two-periods'?[23.75,28.5]:[27],plans=report==='two-periods'?weeks.slice(0,2):[weeks[1]];return {actuals,plans,percentages:actuals.map((actual,index)=>(actual-plans[index])/plans[index]*100)};}
  function triggerFor(report,threshold,percentages){if(report==='incomplete')return {type:'incomparable',reason:'数据待补，不计已确认偏离期'};if(threshold==='none')return {type:'unconfigured',reason:'未设置提示阈值'};let consecutive=0;for(let i=percentages.length-1;i>=0&&percentages[i]<0;i--)consecutive++;if(percentages.at(-1)<=-10+1e-8)return {type:'magnitude',reason:'本期不利偏差达到 10% 幅度阈值'};if(consecutive>=2)return {type:'consecutive',reason:'连续 2 期偏低，达到连续期数阈值'};return {type:'none',reason:'未达到不利偏差或连续偏低提示条件'};}
  const statusText=()=>state.operation?.status==='unknown'?'发布结果待核':state.editingDraft&&state.generated?(state.knownPublishedNo?'修订草稿 · 当前生效 v'+state.knownPublishedNo:'拆解草稿'):state.knownPublishedNo?'已发布 · v'+state.knownPublishedNo:'待确认总目标';
  const hasConflict=()=>state.scenario==='conflict'&&!state.aligned;
  const allocations=()=>{const value=state.scenario==='conflict'&&state.aligned?state.alignedValue:50;return [{id:'G-01',scope:'线下 × 羽绒服',amount:value,owner:'门店负责人',strategy:'重点门店新品陈列'},{id:'G-02',scope:'线上 × 羽绒服',amount:value===45?35:30,owner:'电商负责人',strategy:'平台活动增量'},{id:'G-03',scope:'线上 × 针织',amount:20,owner:'电商负责人',strategy:'会员专属组合'},{id:'G-04',scope:'线下 × 针织',amount:15,owner:'门店负责人',strategy:'基础款连带销售'}];};
  function canPublish(){return state.gsaConfirmed&&state.generated&&!hasConflict()&&state.reservePurpose.trim()&&state.reserveOwner.trim()&&state.gapStrategy&&state.editingDraft&&!state.operation;}
  function opDetails(){if(!state.operation)return '';const op=state.operation;return `<details class="details"><summary>发布操作与准确引用</summary><div class="details-body"><dl><dt>原操作</dt><dd class="mono">${esc(op.id)}</dd><dt>草稿修订</dt><dd>r${op.draftRevision}</dd><dt>总目标 GSA</dt><dd class="mono">GSA-retail-202701 / v1</dd><dt>状态</dt><dd>${esc(op.status==='accepted'?'已完成':op.status==='not-executed'?'已确认未执行':'结果待核')}</dd><dt>提交次数</dt><dd>${op.attempts} 次，同一个业务意图</dd><dt>正式版本数</dt><dd>${state.knownPublishedNo?state.published.length:'待核，不能从前端状态推断'}</dd></dl><p style="margin-top:10px">这些标识由系统保存。负责人无需手工填写或记住。</p></div></details>`;}
  function pageHead(){return `<div class="page-head"><div><div class="eyebrow">GOAL MANAGEMENT</div><h1>把目标变成可兑现的计划</h1><p class="page-description">2027 年 1 月净销售额 · 零售事业部 · 林负责人</p><div class="source-line"><span class="source-badge">战略发布版 S-2027 / v3</span><span>总目标 GSA ${state.gsaConfirmed?'v1 已确认':'待确认'}</span></div></div><span class="status ${state.operation?.status==='unknown'?'warning':!state.editingDraft&&state.knownPublishedNo?'success':''}" data-testid="page-status">${statusText()}</span></div><nav class="steps" aria-label="目标工作阶段"><button class="step ${state.tab==='plan'?'active':''}" data-action="tab-plan" data-testid="plan-tab"><span class="num">${state.gsaConfirmed?'✓':'1'}</span>${state.gsaConfirmed?'拆解与发布':'确认总目标 GSA'}</button><button class="step ${state.tab==='follow'?'active':''}" data-action="tab-follow" data-testid="follow-tab" ${!state.knownPublishedNo?'disabled':''}><span class="num">2</span>阶段跟进</button><span class="step faint" style="cursor:default"><span class="num">3</span>到期复盘 · 后续范围</span></nav>`;}
  function metrics(){return `<div class="metric-grid"><div class="metric"><span>正式目标值</span><strong>120<em>万</em></strong><small>来源于正式战略发布版</small></div><div class="metric"><span>可达测算值</span><strong>112<em>万</em></strong><small>同期间、同范围、同口径</small></div><div class="metric gap"><span>待策略补足的差额</span><strong>8<em>万</em></strong><small>120 − 112，保留原测算</small></div></div>`;}
  function gsa(){return `<div class="gsa-layout"><section class="card" aria-labelledby="gsa-title"><div class="card-head"><div><h2 id="gsa-title">先确认总目标的 G + S + A</h2><p class="muted small-text" style="margin-top:5px">承接战略选择，再形成拆解依据</p></div><span class="status">待确认</span></div><div class="gsa-rows"><div class="gsa-row"><span class="gsa-letter">G</span><div><h3>1 月净销售额达到 120 万元</h3><p>零售事业部 · 2027.01.01—01.31<br>净销售额 = 已支付商品金额 − 同归属期退款，不含运费。基线为可比门店与渠道。</p><div class="source-line"><span class="source-badge">SAP 净销售额 / v2</span><span>正式战略目标 G-2027-01</span></div></div></div><div class="gsa-row"><span class="gsa-letter">S</span><div><h3>新品增长与平台活动共同补足增量</h3><p>稳定可比业务贡献，重点门店开展新品陈列与回访，平台活动聚焦新增转化。新品与活动贡献按不重叠范围估算。</p></div></div><div class="gsa-row"><span class="gsa-letter">A</span><div><h3>关键行动与阶段检查点</h3><ul><li>月初重点门店完成新品试点，观察可售货品与转化。</li><li>第 2 周核对活动期可比净销售额与增量依据。</li><li>月末按准确实绩复盘，任务、人员和执行授权由后续承接。</li></ul></div></div></div><div class="gsa-footer"><p>一次确认总目标 G、S 与上层 A。<br>确认后进入拆解，不会自动启动经营行动。</p><button class="primary" data-action="confirm-gsa" data-testid="confirm-gsa">确认 GSA，开始拆解 <span aria-hidden="true">→</span></button></div></section><aside class="stack"><div>${metrics()}<div class="note">测算帮助判断可达性。正式目标仍为 120 万，8 万差额需要在拆解发布前说明补足策略与预期贡献。</div></div><div class="card"><div class="card-body info-list"><div><h3>已带入当前工作</h3><p>正式战略发布版、指标定义、经营范围及可用的获准资料。</p></div><div><h3>确认后与 Agent 协作</h3><p>按贡献分配子目标，再结合商品与经营节奏排出时间计划。方法和工具由 Agent 按问题选择。</p></div><div><h3>只处理必要的经营取舍</h3><p>无需重录已承接的目标，也不要求逐项审批普通读取。</p></div></div></div></aside></div>`;}
  function chat(){const welcome=state.generated?(state.editingDraft?'已根据确认的 GSA 形成右侧拆解草稿。正式目标、测算和差额分别保留，责任分配与时间计划可以继续调整。':'右侧为当前生效的正式拆解表，发布内容保持只读。需要微小计划调整时，可另起拆解修订草稿。'):'总目标 GSA v1 已确认。我会沿用本次获准材料，提出贡献分配、补缺策略和时间计划。你可以直接提出约束，也可以从下面的请求开始。';return `<section class="card chat-card" aria-labelledby="agent-title"><div class="card-head"><div class="agent-title"><span class="agent-glyph" aria-hidden="true">✦</span><div><h2 id="agent-title">与目标 Agent 一起拆解</h2><p class="small-text faint" style="margin-top:2px">自主选择适用方法与工具</p></div></div><span class="status">脚本模拟</span></div><div class="chat-context"><span aria-hidden="true">▧</span><span>已带入 GSA v1、SAP v2 与示例经营材料</span></div><div class="chat-log" id="chat-log" aria-live="polite"><div class="message agent"><div class="author">目标 Agent</div>${welcome}${!state.generated?'':`<div class="answer-point"><span class="point-number">1</span><span>可达测算 112 万，正式目标 120 万，差额 8 万。</span></div><div class="answer-point"><span class="point-number">2</span><span>新品非活动期增量 5 万 + 平台额外增量 3 万，按不重叠范围预计覆盖差额。</span></div><div class="answer-point"><span class="point-number">3</span><span>已分配 115 万，另列有用途与责任人的 5 万预留。预留不代表可达性缺口已消失。</span></div>`}</div>${state.messages.map(m=>`<div class="message ${m.role}"><div class="author">${m.role==='user'?'你':'目标 Agent · 模拟'}</div>${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div>${!state.generated?'<div class="suggestion-row"><button class="suggestion" data-action="suggest-initial" data-testid="suggest-initial">按渠道、品类拆解，并安排周计划</button></div>':state.editingDraft&&!state.operation?'<div class="suggestion-row"><button class="suggestion" data-action="suggest-delay" data-testid="suggest-delay">新品延后两周，活动预算不变</button><button class="suggestion" data-action="show-evidence">查看测算与增量依据</button></div>':''}<form class="composer" id="chat-form"><label class="screen-reader" for="chat-input">向目标 Agent 提出拆解要求</label><textarea id="chat-input" data-testid="chat-input" placeholder="例如，按渠道与品类拆解，预留 5 万用于新品上市…" ${!state.editingDraft||state.operation?'disabled':''}></textarea><div class="composer-foot"><small>${!state.editingDraft?'正式版只读，可另起修订':state.operation?'发布意图已提交，先核对原操作结果':'提出约束，Agent 更新受影响的草稿'}</small><button class="primary small" type="submit" data-testid="send-message" ${!state.editingDraft||state.operation?'disabled':''}>发送 <span aria-hidden="true">↑</span></button></div></form></section>`;}
  function conflict(){if(!hasConflict())return '';return `<div class="issue-card" role="alert" data-testid="cross-conflict"><div class="issue-head"><h3>同口径交叉项尚未对齐</h3><span class="status error">只能保存草稿</span></div><div class="issue-body"><p class="small-text">1 月 · 零售事业部 · 净销售额 · 线下 × 羽绒服</p><div class="compare"><div>渠道计划<strong>50 万</strong><p>依据 · 门店目标表 r4</p></div><div class="versus">差 5 万</div><div>商品计划<strong>45 万</strong><p>依据 · 商品配置表 r3</p></div></div><p class="small-text muted">另一处「线上 × 羽绒服」同时为 30 万与 35 万。两个视图各自合计都是 120 万，但两处同口径交叉项均需对齐。差异不能转成预留。Agent 不替双方决定哪个数值有效。</p><details class="details"><summary>查看两边原明细与合计</summary><div class="details-body"><table><thead><tr><th>相同交叉单元</th><th>渠道计划</th><th>商品计划</th></tr></thead><tbody><tr><td>线下 × 羽绒服</td><td>50</td><td>45</td></tr><tr><td>线上 × 羽绒服</td><td>30</td><td>35</td></tr><tr><td>线上 × 针织</td><td>20</td><td>20</td></tr><tr><td>线下 × 针织</td><td>15</td><td>15</td></tr><tr><td>新品上市预留</td><td>5</td><td>5</td></tr><tr><td>合计（万元）</td><td>120</td><td>120</td></tr></tbody></table><p style="margin-top:9px">本演示支持双方采用任一原有方案的完整明细。50 万方案同时把商品视图的「线上 × 羽绒服」35 万调为 30 万。45 万方案同时把渠道视图的「线上 × 羽绒服」30 万调为 35 万。先展示变化，不能只改一个单元就宣称对平。</p></div></details><form id="align-form"><div class="form-row"><div class="form-field"><label for="aligned-value">双方已协商一致值 · 万元</label><input id="aligned-value" data-testid="aligned-value" type="number" step="1" min="0" placeholder="45 或 50" value="${esc(state.alignmentDraftValue)}" required ${state.alignmentError?'aria-invalid="true"':''}></div><div class="form-field"><label for="alignment-basis">双方确认依据</label><input id="alignment-basis" data-testid="alignment-basis" type="text" placeholder="例如，商品与渠道负责人已确认采用门店明细 r4" value="${esc(state.alignmentDraftBasis)}" required></div></div>${state.alignmentError?`<p class="small-text" style="color:var(--error);margin-top:8px" role="alert">${esc(state.alignmentError)}</p>`:''}<div class="actions" style="margin-top:12px"><button type="submit" class="small" data-testid="apply-alignment">按双方确认明细更新并重新校验</button></div></form></div></div>`;}
  function draftTable(){const rows=allocations();const allocated=rows.reduce((sum,r)=>sum+r.amount,0);return `<div class="table-scroll"><table aria-label="目标拆解草稿明细" data-testid="decomposition-table"><thead><tr><th>子目标 / 责任范围</th><th>正式分配</th><th>负责人</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.scope)}<span class="subtle-line">${esc(r.id)} · ${esc(r.strategy)}</span></td><td class="table-target">${r.amount} 万</td><td>${esc(r.owner)}</td></tr>`).join('')}<tr class="reserve-row"><td>新品上市预留<span class="subtle-line">单独预留，不计入子目标已分配</span></td><td class="table-target">5 万</td><td>${esc(state.reserveOwner||'待补责任人')}</td></tr><tr class="total-row"><td>已分配 ${allocated} + 预留 5</td><td>120 万</td><td>${allocated===115?'金额对平 ✓':'金额待核'}</td></tr></tbody></table></div>`;}
  function splitBody(){return `<div class="card-body">${metrics()}<div class="allocation-line"><span>已分配 <strong>115 万</strong></span><span>有用途、有责任人的预留 <strong>5 万</strong></span></div><div class="allocation-bar" aria-label="115万元已分配，5万元预留"><span></span></div>${conflict()}${state.aligned?`<div class="note success" style="margin-top:15px" data-testid="alignment-result">双方已采用 ${state.alignedValue} 万方案的完整明细。${state.alignedValue===50?'商品视图的线上 × 羽绒服同步从 35 万调整为 30 万':'渠道视图的线上 × 羽绒服同步从 30 万调整为 35 万'}，两个视图重新汇总均为 120 万。<br><span class="small-text">确认依据 · ${esc(state.alignmentBasis)}</span></div>`:''}</div>${draftTable()}<div class="card-body" style="border-top:1px solid var(--line)"><div class="subhead" style="margin-top:0"><h3>8 万测算缺口，预计怎样补足</h3><button class="inline-button" data-action="show-gap" data-testid="edit-gap">${!state.editingDraft||state.operation?'查看':'核对 / 编辑'}</button></div><p class="small-text muted" data-testid="gap-strategy">${state.gapStrategy?'新品非活动期增量 5 万 + 平台额外增量 3 万 = 8 万。两项范围不重叠，均为计划预期，后续按实绩检验。':'尚未说明补缺策略及预期贡献，暂不能发布。'}</p><div class="subhead"><h3>时间计划 · 按商品与经营节奏</h3><button class="inline-button" data-action="show-timeline">查看检查点</button></div><div class="bar-chart" aria-label="分周计划，已分配共115万元"><div class="week"><div class="week-bar" style="height:54px">${state.delayed?20:25} 万</div>第 1 周</div><div class="week current"><div class="week-bar" style="height:66px">${state.delayed?25:30} 万</div>第 2 周</div><div class="week"><div class="week-bar" style="height:78px">${state.delayed?40:35} 万</div>第 3 周</div><div class="week"><div class="week-bar" style="height:54px">${state.delayed?30:25} 万</div>第 4 周</div></div><p class="small-text faint" style="margin-top:10px">${state.delayed?'新品上市推迟两周，前两周各移后 5 万，后两周各承接 5 万。总分配与 8 万补缺策略不变。':'基础款提供稳定贡献，活动与新品形成不同周曲线。115 万已排期，5 万预留待明确后修订发布。'}</p><details class="details"><summary>预留用途、责任人与发布前校验</summary><div class="details-body"><p>预留用途 · ${esc(state.reservePurpose||'尚未填写')}<br>预留责任人 · ${esc(state.reserveOwner||'尚未填写')}</p>${sta   function recovery(){if(state.operation?.status!=='unknown'&&state.operation?.status!=='not-executed')return '';const op=state.operation;return `<section class="card" style="margin-bottom:16px" data-testid="recovery-card"><div class="card-body"><div class="note warning"><strong>${op.status==='not-executed'?'已查明，原发布操作确定未执行':'发布请求已发出，结果还未核实'}</strong><p style="margin-top:5px">${op.status==='not-executed'?'服务端已确认原请求未提交，且没有在途写入。原草稿和发布意图仍在，可明确重试同一编号与同一内容，不创建第二份操作。':'连接中断不能证明发布失败。先只读核对原操作，保留已确认的草稿与可能已保存的正式版。'}</p></div><div class="actions" style="margin-top:13px">${op.status==='not-executed'?'<button class="primary" data-action="retry-publish" data-testid="retry-publish">重试原发布意图</button>':'<button class="primary" data-action="query-publish" data-testid="query-publish">核对原发布结果</button>'}<span class="small-text muted">${op.queries?'已只读核对 '+op.queries+' 次':'不会重新发送发布请求'}</span></div>${op.lastQuery==='unknown'?'<p class="small-text" role="status" style="margin-top:11px;color:var(--warning)">仍无法确认结果。保持待核，正式发布按钮继续停用。可以稍后再查或重新打开本演示。</p>':''}</div></section>`;}
  function publishedReceipt(){if(!state.knownPublishedNo)return '';const p=currentPublished();return `<section class="card" style="margin-bottom:16px" data-testid="published-receipt"><div class="receipt"><div class="receipt-title"><span class="receipt-icon" aria-hidden="true">✓</span><div><h3>目标拆解表 v${p.no} 已正式发布${state.editingDraft?' · 当前仍生效':''}</h3><p class="small-text muted">${state.editingDraft?'下方正在编辑新的拆解草稿。修订期间，原发布版及其检查、Case 选择仍可回看。':'负责人已核对并发布。下游使用准确版本，已完成的检查不会随新版本切换。'}</p></div></div><div class="reference"><div><strong>零售事业部 · 2027 年 1 月</strong><code>${esc(p.id)} / v${p.no} · GSA v1 · ${p.delayed?'修订后周计划':'初始周计划'}</code></div><button class="inline-button" data-action="show-reference" data-testid="view-reference">查看下游引用</button></div><div class="actions" style="margin-top:13px"><button class="small" data-action="tab-follow" data-testid="start-follow">${selectedCheck()?'回看阶段检查与 Case':'选定实绩，开始阶段跟进'} <span aria-hidden="true">→</span></button>${!state.editingDraft?'<button class="small ghost" data-action="revise" data-testid="revise-plan">修订拆解计划</button>':''}</div></div></section>`;}
  function plan(){if(!state.gsaConfirmed)return gsa();return `${publishedReceipt()}${recovery()}<div class="work-grid">${chat()}<section class="card" aria-labelledby="split-title"><div class="card-head"><div><h2 id="split-title">目标拆解表</h2><p class="small-text faint" style="margin-top:3px">${state.generated?state.editingDraft?'依据 GSA v1 · 草稿 r'+state.draftRevision:'依据 GSA v1 · 已发布版本':'等 Agent 形成可核对的方案'}</p></div><span class="status ${hasConflict()&&state.generated?'error':!state.editingDraft&&state.knownPublishedNo?'success':''}">${!state.editingDraft&&state.knownPublishedNo?'正式版 v'+state.knownPublishedNo:hasConflict()&&state.generated?'交叉项待对齐':'草稿'}</span></div>${state.generated?splitBody():`<div class="card-body">${metrics()}</div><div class="empty-state"><div class="empty-illustration" aria-hidden="true"><i></i><i></i><i></i></div><h3>把贡献分配与时间计划放在一起核对</h3><p>向左侧 Agent 发送请求后，<br>这里会呈现子目标、预留、补缺策略与阶段计划。</p></div>`}<div class="publish-footer"><p>${state.operation?.status==='unknown'?'原发布结果待核。先核对原操作，不重复提交。':hasConflict()&&state.generated?'交叉冲突必须先拉齐。草稿和双方依据都会保留。':!state.editingDraft?'本版已发布。执行任务、人员安排和经营授权按后续入口承接。':'核对后一次发布拆解计划。具体任务和执行授权由下游承接。'}</p><div class="actions"><button class="small" data-action="save-draft" data-testid="save-draft" ${!state.generated||!state.editingDraft||state.operation?'disabled':''}>保存草稿</button><button class="primary" data-action="review-publish" data-testid="publish-button" ${canPublish()?'':'disabled'}>${!state.editingDraft?'已发布':'核对并发布'}</button></div></div></section></div>`;}
  function follow(){

      <p class="small-text muted" style="margin-top:${state.checkHistory.length?'13':'0'}px">${readOnly?'本记录只读回看，实绩来源与计划版本保持原样。需要开展下一次检查时，明确选用当前生效版后再选实绩。':'负责人只选定一次本次实绩。Agent 核对期间、范围、口径、截至时间和覆盖程度，再比较偏差。'}</p>

      <form id="report-form" class="select-row"><div class="form-field"><label for="report-select">${readOnly?'本记录已选定的实绩资料':'本次使用的实绩资料'}</label><select id="report-select" data-testid="report-select" ${readOnly?'disabled':''}><option value="" ${!(c?.report||state.report)?'selected':''}>请选择本次实绩</option><option value="complete" ${(c?.report||state.report)==='complete'?'selected':''}>第 2 周完整实绩 · 全部渠道与门店 · 27 万</option><option value="incomplete" ${(c?.report||state.report)==='incomplete'?'selected':''}>第 2 周局部实绩 · 缺两家门店 · 27 万</option><option value="two-periods" ${(c?.report||state.report)==='two-periods'?'selected':''}>连续两期完整实绩 · 23.75 / 28.5 万</option></select></div>${!readOnly?'<button class="primary" type="submit" data-testid="compare-report">选定并分析</button>':''}</form>
      ${c?`<div class="comparison-metrics"><div><span>引用版阶段计划</span><strong data-testid="check-plan-values">${plans.map(format).join(' / ')}<small>万元 · 第 ${two?'1、2':'2'} 周</small></strong></div><div><span>${pending?'已覆盖范围实绩':'可比实绩'}</span><strong data-testid="check-actual-values">${actuals.map(format).join(' / ')}<small>万元 · ${pending?'尚缺两家门店':'覆盖完整'}</small></strong></div><div><span>${pending?'整体偏差':'可比偏差'}</span><strong style="color:${pending?'var(--warning)':percentages.some(value=>value<0)?'var(--error)':'var(--success)'}" data-testid="check-percentages">${pending?'待核':percentages.map(signed).join(' / ')}<small>${pending?'局部数值不能当作整体':two?'同一实绩资料，按本记录引用版比较':percentages[0]<0?'低于计划 '+format(plans[0]-actuals[0])+' 万':'高于计划 '+format(actuals[0]-plans[0])+' 万'}</small></strong></div></div>
      <div class="note ${pending?'warning':'success'}" data-testid="comparison-result">${pending?'本报表缺两家门店。本期只说明已覆盖范围与待补门店，不把缺失数据记为零，也不计为已确认偏离期。':'Agent 已核对同一期间、范围、SAP 净销售额 v2 与完整覆盖。比较本记录引用的目标拆解表 v'+p.no+'，实绩数值不随计划修订变化。'}</div>

      <details class="details"><summary>本次检查的证据与准确引用</summary><div class="details-body"><dl><dt>检查记录</dt><dd>${esc(c.id)}</dd><dt>检查点</dt><dd>CP-202701-W2-TOTAL</dd><dt>计划</dt><dd class="mono">${esc(p.id)} / v${p.no} / G-TOTAL</dd><dt>目标与策略</dt><dd>GSA v1 · G-TOTAL · S1 新品增长与平台活动</dd><dt>实绩来源</dt><dd data-testid="check-source-ref">${esc(sourceRef)}</dd><dt>截至时间</dt><dd>2027.01.14 23:59（演示）</dd></dl></div></details>`:''}
    </div></section></div><aside class="card"><div class="card-head"><h2>检查设置与承接</h2></div><div class="card-body"><div class="threshold-row"><span>${c?'下次检查提示阈值':'Case 提示阈值'}</span><select id="threshold-select" data-testid="threshold-select" aria-label="Case提示阈值"><option value="configured" ${state.threshold==='configured'?'selected':''}>已设置</option><option value="none" ${state.threshold==='none'?'selected':''}>尚未设置</option></select></div><div class="mini-stat"><span class="muted">不利偏差幅度</span><strong>${savedThreshold==='configured'?'≥ 10%':'未设置'}</strong></div><div class="mini-stat"><span class="muted">连续偏低期数</span><strong>${savedThreshold==='configured'?'≥ 2 期':'未设置'}</strong></div><p class="small-text muted" style="margin-top:10px">${c?'下方规则属于本记录保存的阈值。调整上方选项仅影响下一次检查，原触发理由与 Case 选择保持不变。':'任一阈值达到就提示。未设置阈值也可正常核对实绩和分析偏差。'}</p><div class="note" style="margin-top:16px">已有同一问题的 Case 优先续接。是否新建由负责人决定，提示本身不会创建 Case 或授权行动。</div><button class="inline-button" data-action="show-reference" style="margin-top:14px">查看本记录固定引用</button></div></aside></div>`;

  function caseCard(c,p,percentages){
    const choice=c.caseChoice?`<div class="note success" style="margin-top:12px" data-testid="case-choice-result">${c.caseChoice==='existing'?'已选择续接 Case C-014。':'已明确选择新建 Case 草稿 C-015。'}保留 ${esc(c.id)}、GSA v1、拆解表 v${p.no}、G-TOTAL、汇总检查点及原实绩引用。后续行动仍需原入口授权。</div>`:'';
    if(c.report==='incomplete')return choice;
    const trigger=c.trigger||triggerFor(c.report,c.threshold||'configured',percentages);
    if(trigger.type==='unconfigured')return '<p class="small-text muted" style="margin-top:15px" data-testid="case-no-threshold">偏差分析已完成。尚未设置 Case 提示阈值，不额外阻断本次检查。</p>'+choice;
    const magnitude=trigger.type==='magnitude',prompt=trigger.type==='magnitude'||trigger.type==='consecutive';
    if(!prompt)return '<p class="small-text muted" style="margin-top:15px" data-testid="case-no-trigger">按本记录准确计划计算，'+esc(trigger.reason)+'。</p>'+choice;
    return `<div class="case-card" data-testid="case-prompt"><h3>${esc(trigger.reason)}</h3><p>${magnitude?'本期低于计划达到 10% 即提示，不需要再等到连续 2 期。':'同一报告的实绩为 23.75 / 28.5 万，本记录计划为 25 / 30 万，单期均偏低 5%，连续 2 期达到提示条件。'}</p><p>已有关联事项 <strong>Case C-014 · 活动后新品转化</strong>（进行中），与当前 G+S 匹配，建议优先续接。</p>${choice||`<div class="actions" style="margin-top:12px"><button class="primary small" data-action="continue-case" data-testid="continue-case">续接已有 Case</button><button class="small" data-action="new-case" data-testid="new-case">另建 Case</button><button class="small ghost" data-action="observe" data-testid="observe">继续观察</button></div>`}</div>`;
  }
  function render(){persist();$('scenario').value=state.scenario;$('lost-label').hidden=state.scenario!=='lost';$('lost-outcome').value=state.lostOutcome;$('lost-outcome').disabled=!!state.operation;$('workspace').innerHTML=pageHead()+(state.tab==='follow'?follow():plan())+`<p class="content-note">基线讨论稿 0a45c50 · 虚构经营资料与脚本模拟 · 不调用真实 Agent，不办理实际发布或经营授权${memoryOnly?' · 浏览器存储不可用，当前仅内存演示，重新打开不能恢复':''}</p>`;const log=$('chat-log');if(log)log.scrollTop=log.scrollHeight;}
  function openDialog(title,body,footer=''){dialogInvoker=document.activeElement;$('dialog-content').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="ghost small" data-dialog-close aria-label="关闭弹窗">✕</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;$('detail-dialog').showModal();const focus=$('detail-dialog').querySelector('[autofocus],input,textarea,button');focus?.focus();}
  function closeDialog(){if($('detail-dialog').open)$('detail-dialog').close();if(dialogInvoker?.isConnected)dialogInvoker.focus();}
  function addAgent(text){state.messages.push({role:'agent',text});}
  function sendMessage(text){text=text.trim();if(!text||!state.editingDraft||state.operation)return;if(!state.gsaConfirmed){notify('先确认总目标 GSA，再进入子目标拆解。');return;}state.messages.push({role:'user',text});if(!state.generated){state.generated=true;addAgent(state.scenario==='conflict'?'已形成拆解草稿。发现渠道与商品两份计划虽然各合计 120 万，但线下 × 羽绒服分别为 50 万与 45 万，线上 × 羽绒服也同时为 30 万与 35 万。须由双方先对齐交叉明细，不能用预留冲掉差异。':'已形成右侧草稿。已分配 115 万，5 万预留由商品负责人承担。8 万测算缺口分别由非活动期新品预计 5 万与平台额外增量预计 3 万补足。请核对责任、分配与计划后发布。');}else if(/延后|推迟|两周|2周/.test(text)){state.delayed=true;state.draftRevision++;addAgent('已把新品上市计划后移两周，前两周各移后 5 万，后两周各承接 5 万。已分配金额仍为 115 万，预留仍为 5 万；正式目标与原测算分别保留。修改依据已记入本草稿。');}else{addAgent('已把你的补充作为草稿约束保留。本原型只模拟已定义的交互，不生成真实预测。可继续核对预留、补缺策略及交叉项，或用“新品延后两周”体验草稿更新。');}render();}
  function completePublish(op){let existing=state.published.find(p=>p.operationId===op.id);if(!existing){existing={no:state.published.length+1,id:'GDT-retail-202701',operationId:op.id,gsa:'GSA-retail-202701/v1',draftRevision:op.draftRevision,delayed:state.delayed,weeks:state.delayed?[20,25,40,30]:[25,30,35,25],scope:'零售事业部全渠道与门店',allocations:clone(allocations()),reserve:{amount:5,purpose:state.reservePurpose,owner:state.reserveOwner},gapStrategies:[{name:'新品非活动期增量',expected:5},{name:'平台额外增量',expected:3}]};state.published.push(existing);}return existing;}
  function publish(){if(!canPublish()){notify('发布条件尚未满足，请处理具体待核项。');return;}state.operationCount++;const op={id:'demo-publish-'+String(state.operationCount).padStart(4,'0'),draftRevision:state.draftRevision,status:'accepted',attempts:1,queries:0,receipt:'accepted',versionNo:null,lastQuery:null};state.operation=op;if(state.scenario==='lost'){op.status='unknown';op.receipt=state.lostOutcome==='saved'?'accepted':state.lostOutcome==='not-executed'?'not-executed':state.lostOutcome==='not-found'?'not-found':'unknown';if(op.receipt==='accepted')op.versionNo=completePublish(op).no;render();notify('发布响应中断。原意图已保留，请先核对原操作结果。');}else{op.versionNo=completePublish(op).no;state.knownPublishedNo=op.versionNo;state.editingDraft=false;render();notify('目标拆解表 v'+op.versionNo+' 已发布，可按准确版本引用。');}}
  function query(){const op=state.operation;if(!op||op.status!=='unknown')return;op.queries++;if(op.receipt==='accepted'){op.status='accepted';op.lastQuery='accepted';state.knownPublishedNo=op.versionNo;state.editingDraft=false;render();notify('已找到原操作保存的 v'+op.versionNo+'，没有新增发布版本。');}else if(op.receipt==='not-executed'){op.status='not-executed';op.lastQuery='not-executed';render();notify('服务端已确认原请求未提交且无在途写入，可以明确重试同一编号与内容。');}else{op.lastQuery='unknown';render();notify(op.receipt==='not-found'?'未查到回执不证明原操作未执行。保留原操作，继续待核。':'结果仍未知。保留原操作与草稿，继续待核。');}}
  function retry(){const op=state.operation;if(!op||op.status!=='not-executed')return;op.attempts++;op.receipt='accepted';op.status='accepted';op.versionNo=completePublish(op).no;state.knownPublishedNo=op.versionNo;state.editingDraft=false;render();notify('原发布意图已完成，同一操作只形成一个正式版本。');}
  function reviewPublish(){if(!canPublish())return;const no=state.published.length+1;openDialog('核对并发布目标拆解表',`<p class="small-text muted">本次确认的是贡献分配与阶段计划。发布后形成可供下游引用的准确版本。</p><div style="margin-top:13px"><div class="review-line"><span>总目标依据</span><strong>GSA v1 · 正式目标 120 万</strong></div><div class="review-line"><span>可达测算 / 差额</span><strong>112 万 / 8 万</strong></div><div class="review-line"><span>已分配 + 明确预留</span><strong>115 万 + 5 万 = 120 万</strong></div><div class="review-line"><span>预留用途 / 责任人</span><strong>${esc(state.reservePurpose)} / ${esc(state.reserveOwner)}</strong></div><div class="review-line"><span>交叉项与补缺策略</span><strong>已对齐 · 预计贡献覆盖 8 万</strong></div><div class="review-line"><span>将形成正式版</span><strong>目标拆解表 v${no}</strong></div></div><p class="boundary">发布不创建任务，不代负责人安排人员或授权经营行动。下游由各自原入口承接。</p>`,`<button data-dialog-close>返回核对</button><button class="primary" data-action="confirm-publish" data-testid="confirm-publish">确认发布 v${no}</button>`);}
  function showReserve(){openDialog('核对预留用途与责任人',`<p class="small-text muted">预留 5 万属于目标分配，单独列示。缺少用途或责任人时不能发布。</p><form id="reserve-form" style="margin-top:15px"><div class="form-field"><label for="reserve-purpose">预留用途</label><input id="reserve-purpose" data-testid="reserve-purpose" value="${esc(state.reservePurpose)}"></div><div class="form-field" style="margin-top:12px"><label for="reserve-owner">责任人</label><input id="reserve-owner" data-testid="reserve-owner" value="${esc(state.reserveOwner)}"></div><div class="actions" style="margin-top:18px;justify-content:flex-end"><button class="primary" type="submit" data-testid="save-reserve">保存到草稿</button></div></form>`);}
  function showGap(){const editable=state.editingDraft&&!state.operation;openDialog('测算缺口与补足策略',`<div class="review-line"><span>正式目标 − 可达测算</span><strong>120 − 112 = 8 万</strong></div><div class="review-line"><span>新品非活动期增量</span><strong>预计 5 万</strong></div><div class="review-line"><span>平台额外增量</span><strong>预计 3 万</strong></div><p class="small-text muted" style="margin-top:13px">新品按非活动期范围测算，平台增量仅计活动额外贡献，两者不重复。预期贡献不是已实现结果。Agent 自主选择方法并说明证据，Host 只核对发布契约。</p>${editable?`<form id="gap-form" style="margin-top:16px"><label style="display:flex;gap:8px;align-items:flex-start;font-size:12px"><input type="checkbox" id="gap-present" data-testid="gap-present" ${state.gapStrategy?'checked':''}><span>草稿已包含上述补缺策略、贡献及范围依据</span></label><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="primary" type="submit" data-testid="save-gap">保存到草稿</button></div></form>`:''}`);}
  function reference(){const p=state.tab==='follow'?checkPlan():currentPublished();openDialog('下游引用准确的发布版',`<p class="small-text muted">${p?'本期正式版已固定。':'本原型展示计划发布后的引用形式。'}项目任务与 Case 各自记录准确版本及子目标，不随新草稿自动切换。</p><div style="margin-top:12px"><div class="review-line"><span>总目标</span><strong>GSA-retail-202701 / v1</strong></div><div class="review-line"><span>拆解计划</span><strong>GDT-retail-202701 / v${p?.no||1}</strong></div><div class="review-line"><span>本次汇总目标 / 检查点</span><strong>G-TOTAL / CP-202701-W2-TOTAL</strong></div><div class="review-line"><span>下游采用状态</span><strong>尚未办理行动授权</strong></div></div><p class="boundary">子目标引用示例为本表 G-01（线下 × 羽绒服），与本次总目标汇总检查分别记录。若只调整子目标检查点，修订拆解表即可。触及总目标 G、S 或上层 A 时须重新核对总目标 GSA。历史检查保留原版。</p>`);}
  function timeline(){openDialog('时间计划与阶段检查点',`<p class="small-text muted">每个责任目标均有对应阶段计划。此处展示总目标 G-TOTAL 的第 2 周汇总检查，阶段金额与本表引用版绑定。各子目标有独立检查点，不能把本表汇总金额当作单个子目标计划。</p><div style="margin-top:12px"><div class="review-line"><span>第 2 周汇总 · CP-202701-W2-TOTAL</span><strong>阶段计划 ${state.delayed?25:30} 万</strong></div><div class="review-line"><span>月末 · CP-202701-END</span><strong>期末正式目标 120 万</strong></div></div><p class="boundary">新品上市、可售货品与平台活动共同影响时间曲线。Agent 按实际约束安排，月份、周和单日粒度按需要展开。本原型仅展示周计划。</p>`);}
  function evidence(){openDialog('本次草稿采用的示例依据',`<div class="info-list"><div><h3>我情 · 可比经营数据 r2</h3><p>门店与渠道覆盖一致的净销售额、商品可售节奏。示例测算可达 112 万。</p></div><div><h3>行情与敌情 · 已获准材料</h3><p>活动日历与竞品公开促销观察仅作为外部假设。资料不足时说明影响，不强制凑齐三类材料。</p></div><div><h3>增量与经营约束</h3><p>新品与平台活动按不重叠范围估算 5 万、3 万。需要后续实绩验证，不能把数学对平当成因果成立。</p></div></div><p class="boundary">所有内容均为虚构资料。Demo 不执行预测算法或真实工具，正式产品沿统一 Pi 接入在权限内自主选择方法。</p>`);}
  function handleAction(action){switch(action){case'confirm-gsa':state.gsaConfirmed=true;render();notify('总目标 GSA v1 已确认，开始与 Agent 拆解。');$('chat-input')?.focus();break;case'suggest-initial':$('chat-input').value='按渠道、品类拆解目标，并结合新品与平台活动安排周计划。预留 5 万用于新品上市，由商品负责人承担。';$('chat-input').focus();break;case'suggest-delay':$('chat-input').value='新品延后两周，活动预算不变，请更新受影响的周计划。';$('chat-input').focus();break;case'save-draft':if(state.generated&&!state.operation&&state.editingDraft){state.saveCount++;persist();notify('草稿 r'+state.draftRevision+' 已保存。'+(hasConflict()?'交叉冲突与双方依据原样保留。':'尚未形成正式发布版。'));}break;case'review-publish':reviewPublish();break;case'confirm-publish':closeDialog();publish();break;case'query-publish':query();break;case'retry-publish':retry();break;case'tab-plan':state.tab='plan';render();break;case'tab-follow':if(state.knownPublishedNo){state.tab='follow';render();}break;case'edit-reserve':showReserve();break;case'show-gap':showGap();break;case'show-reference':reference();break;case'show-timeline':timeline();break;case'show-evidence':evidence();break;case'revise':state.editingDraft=true;state.operation=null;state.draftRevision++;state.tab='plan';addAgent('已在原 GSA v1 下建立新的拆解草稿，旧发布版及其引用保持原样。微小计划调整可只修订拆解表；若触及 G、S、上层 A，应先重新确认 GSA。');render();notify('已另起拆解修订草稿，可继续提出调整。');break;case'continue-case':if(selectedCheck())selectedCheck().caseChoice='existing';render();notify('已选择续接已有 Case，准确计划与实绩引用已带入演示承接卡。');break;case'new-case':openDialog('确认另建 Case 草稿',`<p class="small-text">已有同一问题的 Case C-014。若本次确有独立决策问题，可另建草稿，并保留与原事项的关联。</p><p class="boundary">这里只模拟负责人明确选择，不启动行动，也不产生真实 Case。</p>`,`<button data-dialog-close>返回已有事项</button><button class="primary" data-action="confirm-new-case" data-testid="confirm-new-case">明确另建 Case 草稿</button>`);break;case'confirm-new-case':closeDialog();if(selectedCheck())selectedCheck().caseChoice='new';render();notify('已模拟建立独立 Case 草稿，后续取舍与行动由负责人承接。');break;case'next-check':state.activeCheckId=null;state.nextCheckPlanNo=state.knownPublishedNo;state.report=null;render();notify('已明确选用当前生效 v'+state.knownPublishedNo+' 开始下一次检查，历史检查保持原版。');break;case'observe':notify('本次检查和提示已保留，负责人选择继续观察，没有创建 Case。');break;}}
  document.addEventListener('click',event=>{const close=event.target.closest('[data-dialog-close]');if(close){closeDialog();return;}const button=event.target.closest('[data-action]');if(button&&!button.disabled)handleAction(button.dataset.action);});
  document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();sendMessage($('chat-input').value);}if(event.target.id==='align-form'){event.preventDefault();const value=Number($('aligned-value').value),basis=$('alignment-basis').value.trim();state.alignmentDraftValue=$('aligned-value').value;state.alignmentDraftBasis=basis;if(![45,50].includes(value)||!basis){state.alignmentError='本演示请采用双方已确认的 45 万或 50 万完整方案，并填写双方确认依据。正式产品由 Agent 核对完整明细，不能只改一个交叉值。';render();$('aligned-value')?.focus();return;}state.aligned=true;state.alignedValue=value;state.alignmentBasis=basis;state.alignmentError='';state.draftRevision++;addAgent('已依据双方确认采用 '+value+' 万方案的完整明细，同时展示受影响的另一个交叉单元，重新汇总各视图合计仍为 120 万。冲突没有转成预留，可继续核对后发布。');render();notify('双方确认依据与受影响明细已保存，交叉项重新校验通过。');}if(event.target.id==='reserve-form'){event.preventDefault();state.reservePurpose=$('reserve-purpose').value.trim();state.reserveOwner=$('reserve-owner').value.trim();state.draftRevision++;closeDialog();render();notify(state.reservePurpose&&state.reserveOwner?'预留用途与责任人已更新。':'草稿已保存，预留字段待补，发布保持停用。');}if(event.target.id==='gap-form'){event.preventDefault();state.gapStrategy=$('gap-present').checked;state.draftRevision++;closeDialog();render();notify(state.gapStrategy?'补缺策略已保留在草稿中。':'草稿已保存，补缺策略待补，不能发布。');}if(event.target.id==='report-form'){event.preventDefault();if(selectedCheck())return;const report=$('report-select').value;if(!report){notify('请选定本次使用的实绩资料。');$('report-select').focus();return;}const plan=checkPlan();if(!plan)return;state.report=report;const comparison=comparisonFor(report,plan),trigger=triggerFor(report,state.threshold,comparison.percentages);const check={id:'CHECK-'+String(state.checkHistory.length+1).padStart(3,'0'),report,planNo:plan.no,goalId:'G-TOTAL',checkpointId:'CP-202701-W2-TOTAL',caseChoice:null,threshold:state.threshold,comparison,trigger,sourceRef:report==='incomplete'?'actual-202701-w2-partial/r1':report==='two-periods'?'actual-202701-w1-w2/r1':'actual-202701-w2-complete/r2'};state.checkHistory.push(check);state.activeCheckId=check.id;state.nextCheckPlanNo=null;render();notify(report==='incomplete'?'覆盖不完整，保留待补，不给整体偏差结论。':'新检查已保存，按所选的准确发布版分析，原检查记录保持原样。');}});
  document.addEventListener('change',event=>{if(event.target.id==='scenario'){state=initial(event.target.value);render();notify('演示场景已重置，请从确认 GSA 开始。');}if(event.target.id==='lost-outcome'&&!state.operation){state.lostOutcome=event.target.value;persist();}if(event.target.id==='check-history'){state.activeCheckId=event.target.value||null;const check=selectedCheck();state.report=check?.report||null;state.nextCheckPlanNo=null;render();notify('已打开所选历史检查，计划版本、实绩与 Case 选择保持原样。');}if(event.target.id==='threshold-select'){state.threshold=event.target.value;render();notify((selectedCheck()?'下次检查的配置已更新，本记录阈值与触发理由保持原样。':state.threshold==='none'?'未配置阈值，阶段比较仍可使用。':'已使用示例阈值，任一条件达到就提示 Case。'));}});
  $('reset-demo').addEventListener('click',()=>{state=initial(state.scenario);render();notify('本场景的合成状态已重置。');});
  $('reopen-demo').addEventListener('click',()=>{persist();if(memoryOnly){notify('当前浏览器不提供存储，无法模拟重开恢复。请通过本地 HTTP 预览打开。');return;}location.reload();});
  $('detail-dialog').addEventListener('close',()=>{if(dialogInvoker?.isConnected)dialogInvoker.focus();});
  Object.defineProperty(window,'demoInspect',{value:()=>Object.freeze(clone({scenario:state.scenario,gsaConfirmed:state.gsaConfirmed,generated:state.generated,draftRevision:state.draftRevision,conflict:hasConflict(),aligned:state.aligned,alignedValue:state.alignedValue,publishedCount:state.published.length,published:state.published,knownPublishedNo:state.knownPublishedNo,operationCount:state.operationCount,operation:state.operation,saveCount:state.saveCount,gapStrategy:state.gapStrategy,reservePurpose:state.reservePurpose,reserveOwner:state.reserveOwner,editingDraft:state.editingDraft,check:selectedCheck(),checkHistory:state.checkHistory,activeCheckId:state.activeCheckId,nextCheckPlanNo:state.nextCheckPlanNo,threshold:state.threshold,caseChoice:selectedCheck()?.caseChoice||null})),writable:false,configurable:false});
  render();
})();
</script>
