function analysis(){const disabled=state.busy||['busy','archived'].includes(state.scenario);const incomplete=state.scenario==='incomplete';const taskState=state.scenario==='busy'?'运行中':state.scenario==='archived'?'已归档 · 只读':incomplete?'分析未完成':'报告已交付';return `<div class="heading title-row"><div><div class="small muted" style="margin-bottom:5px">示例零售项目</div><h1>复购变化分析</h1><p>理解十月新客复购变化及其可能原因</p></div><span class="badge ${state.scenario==='busy'?'blue':incomplete?'warn':'good'}">${taskState}</span></div><div class="workspace"><section class="conversation" aria-label="分析对话"><div class="question"><div class="message-head"><span class="avatar" aria-hidden="true">我</span><strong>分析目标</strong></div><p>十月新客复购率下降了，能否帮我分析原因，并说明哪些结论还需要更多证据？</p></div><div class="message-head"><span class="avatar" aria-hidden="true">O</span><strong>OptraCall</strong><span class="small muted">今天 10:36</span></div><article class="report"><div class="row spread"><h2>${incomplete?'复购变化分析 · 阶段稿':'复购变化分析报告'}</h2><span class="small muted">虚构分析示例</span></div><p class="summary">当前下降主要与<strong>新客批次和渠道结构变化</strong>有关。现有资料还不足以认定促销效果变差。</p><div class="report-grid"><div><h3>已核对的比较前提</h3><p>区分新老客结构，统一复购口径，并单独说明观察窗口尚不完整的批次。</p></div><div><h3>判断与限制</h3><p>可比批次的渠道内变化较小；渠道结构变化是主要线索，因果解释仍需更多证据。</p></div></div><div class="report-footer row spread"><span class="small muted">${incomplete?'阶段成果（未完成）':state.scenario==='busy'?'既有成果（当前仍在运行）':'最终成果'} · 复购变化分析.md</span><button class="btn small" data-action="report">查看报告</button></div></article><section class="extract-box" aria-labelledby="extract-heading"><div class="row spread"><div><h2 id="extract-heading">把这次分析留下来</h2><p class="small muted">提炼可迁移的方法与判断依据，保存到 SAP 分析方法。</p></div></div>${incomplete?'<div class="notice warn" style="margin-top:12px">来源尚未完成。主动整理时会保留“不完整来源”说明，不补造未记录的判断依据。</div>':''}<div class="row action"><button id="extract-button" class="btn primary" data-action="extract" ${disabled?'disabled':''} aria-describedby="extract-help">${state.busy?'<span class="spin "clear-filters">清除筛选</button></div>'}<p class="small muted" style="margin-top:16px">未发布内容可在这里管理；后续任务仅沿 SAP 策略参考已发布且有权访问的版本。</p>`;}

function editor(){const m=method(),draft=state.editing;return`<button class="btn ghost back" data-action="cancel-edit">← 返回方法详情</button><div class="heading"><div class="row" style="margin-bottom:8px"><span class="badge ${m.origin==='ir'?'blue':''}">${icon(m.origin)}</span><span class="badge warn">编辑尚未保存</span></div><h1>编辑分析方法</h1><p>基于 v${draft.base.n} 整理。保存会生成新的未发布版本，原有版本保持可追溯。</p></div>${state.feedback?`<div class="notice ${state.feedback.kind} rule-note" role="${state.feedback.kind==='bad'?'alert':'status'}">${escapeHtml(state.feedback.text)}</div>`:''}<form id="method-form" class="form" novalidate>${fields.map(([key,label])=>`<div class="field"><label for="edit-${key}">${label}${key==='name'?' <span class="small muted">（必填）</span>':''}</label>${key==='name'?`<input id="edit-name" name="name" required aria-describedby="name-error" value="${escapeHtml(draft.values[key])}"><span id="name-error" class="small" style="color:var(--bad)" hidden>请输入方法名称。</span>`:`<textarea id="edit-${key}" name="${key}" aria-describedby="method-content-error" rows="${key==='logic'?5:3}">${escapeHtml(draft.values[key])}</textarea>`}</div>`).join('')}<p id="method-content-error" class="small" style="color:var(--bad)" role="alert" hidden>请保留可读的方法内容；不要求填写全部栏目。</p><details><summary>来源与版本说明</summary><p class="body-copy">${escapeHtml(draft.base.source)}</p><p class="small muted" style="margin-top:9px">原始来源分类保持；本次新增内容属于后续整理，不冒称原任务当时已采用。</p></details><div class="notice">保存后仍未发布。${m.published?referenceText(m)+'。':'目前没有可供后续任务参考的发布版。'}</div><div class="form-actions"><button type="submit" class="btn primary">保存为未发布版本</button><button type="button" class="btn" data-action="save-publish">保存并发布</button><button type="button" class="btn ghost" data-action="cancel-edit">取消编辑</button></div><span class="edit-state" id="edit-state">${draft.dirty?'有未保存修改':'尚未修改内容'}</span></form>`;}
function bindInputs(){const search=$('#method-search');if(search)search.addEventListener('input',event=>{const pos=event.target.selectionStart;state.query=event.target.value;$('#main').innerHTML=library();bindInputs();$('#method-search').focus();$('#method-search').setSelectionRange(pos,pos);});$('#origin-filter')?.addEventListener('change',event=>{state.origin=event.target.value;render();$('#origin-filter').focus();});$('#status-filter')?.addEventListener('change',event=>{state.status=event.target.value;render();$('#status-filter').focus();});const form=$('#method-form');if(form){form.addEventListener('input',event=>{if(!fields.some(([key])=>key===event.target.name))return;state.editing.values[event.target.name]=event.target.value;state.editing.dirty=fields.some(([key])=>state.editing.values[key]!==state.editing.base[key]);$('#edit-state').textContent=state.editing.dirty?'有未保存修改':'尚未修改内容';if(event.target.name==='name'&&event.target.value.trim()){$('#edit-name').removeAttribute('aria-invalid');$('#name-error').hidden=true;}});form.addEventListener('submit',event=>{event.preventDefault();saveEdit(false);});}}
function startExtract(){if(state.busy||['busy','archived'].includes(state.scenario))return;state.extract='idle';state.extractMessage='';state.pending=null;state.busy=true;const token=++state.token,scenario=state.scenario;render();announce('正在提炼分析方法');setTimeout(()=>{if(token!==state.token)return;state.busy=false;if(scenario==='extract-fail'){state.extract='failed';state.extractMessage='提取未完成，未新增方法。原报告和 Session 保持，可明确重试。';}else if(scenario==='reuse'){state.extract='reused';state.extractMessage='这次完整沿用“新客复购可比性检查 v1”，已关联原版本，不生成重复方法。';}else if(scenario==='none'){state.extract='empty';state.extractMessage='本次没有发现值得单独保存的新方法。分析已完成，不为凑记录生成方法。';}else if(state.extractedId){state.extract='saved';state.extractMessage='本次提炼已保存，沿用已保存结果，未重复新增方法。';}else{state.pending=extractedMethod(scenario==='incomplete');if(scenario==='save-fail'){state.extract='save-failed';state.extractMessage='提炼已完成，但保存失败。尚未新增 SAP 方法；本页保留待保存结果，可重试保存。';}else saveExtraction();}render();announce(state.extractMessage);},700);}
function extractedMethod(incomplete){return{id:'repurchase',name:'复购变化分析',origin:'ir',published:null,updated:'刚刚',versions:[{n:1,status:'draft',name:'复购变化分析',conditions:'用于理解新客复购在不同期间、渠道与批次间的变化。需要一致用户标识、购买日期、渠道与相关业务背景。',logic:'先统一复购口径和观察窗口，识别可比批次；再区分渠道结构变化与渠道内变化。结合活动、缺货等背景检验其他解释，将证据支持程度与判断分开表达。',judgment:'当可比批次的渠道内变化较小、整体变化随渠道占比改变时，结构变化可作为主要解释线索。若窗口不完整或缺少对照，不将相关性写成促销因果。',limits:'当前方法源于单次虚构分析，不代表跨场景已验证。'+(incomplete?' 来源未完成，仍缺少最终结论及部分检查；后续整理不得补造原任务未记录的判断。':' 不完整观察窗口与渠道识别差异会影响可比性。'),source:'原任务：复购变化分析\nSession：示例会话 12\n报告：复购变化分析.md\n相关记忆：观察窗口可比性检查\n已引用 SAP 方法：新客复购可比性检查 v1'+(incomplete?'\n来源完整性：任务尚未完成，按用户主动要求整理现有材料。':''),note:incomplete?'首次保存；来源未完成的局限已保留。':'从任务记录后置提炼，首次保存。',error:false}]};}
function saveExtraction(){if(!state.pending)return;if(state.scenario==='save-fail'){state.extract='save-failed';state.extractMessage='保存仍未成功。待保存结果继续保留在本页，未把它标记为 SAP 可用方法。';return;}if(!state.methods.some(m=>m.id===state.pending.id))state.methods.push(state.pending);state.extractedId=state.pending.id;state.pending=null;state.extract='saved';state.extractMessage='已保存“复购变化分析 v1”到 SAP，当前未发布。可查看、编辑，发布后才可供后续任务参考。';}
function openMethod(id,n){guard(()=>{state.page='sap';state.tab='methods';state.selected=id;state.version=n??state.methods.find(m=>m.id===id)?.versions.at(-1).n;state.editing=null;state.feedback=null;render();$('#main').focus();});}
function edit(){const m=method(),v=version();state.editing={base:structuredClone(v),values:Object.fromEntries(fields.map(([key])=>[key,v[key]])),dirty:false};state.feedback=null;render();$('#edit-name').focus();}
function saveEdit(publishAfter){const draft=state.editing,m=method();if(!draft)return;if(!draft.values.name.trim()){$('#edit-name').setAttribute('aria-invalid','true');$('#name-error').hidden=false;$('#edit-name').focus();announce('请输入方法名称。');return;}if(!fields.slice(1).some(([key])=>draft.values[key].trim())){$('#method-content-error').hidden=false;$('#edit-logic').focus();announce('请保留可读的方法内容；不要求填写全部栏目。');return;}if(state.scenario==='save-fail'){state.feedback={kind:'bad',text:'保存失败，编辑内容仍保留在本页。未创建新版本，也未尝试发布。'};render();announce(state.feedback.text);return;}const changed=fields.some(([key])=>draft.values[key]!==draft.base[key]);let v;if(!changed){v=m.versions.find(v=>v.n===draft.base.n);state.feedback={kind:'good',text:`内容未变化，沿用 v${v.n}，没有生成重复版本。`};}else{v={...structuredClone(draft.base),...draft.values,name:draft.values.name.trim(),n:m.versions.at(-1).n+1,status:'draft',error:false,note:draft.base.error?`纠正 v${draft.base.n} 的问题，保存时未发布。`:`基于 v${draft.base.n} 后续整理，保存时未发布。`};m.versions.push(v);m.name=v.name;m.updated='刚刚';state.feedback={kind:'good',text:`v${v.n} 已保存，尚未发布。${referenceText(m)}。`};}state.version=v.n;state.editing=null;if(publishAfter)publishVersion(m,v,true);render();$('#main').focus();announce(state.feedback.text);}
function publishVersion(m,v,combined=false){if(v.status==='published'){state.feedback={kind:'good',text:`v${v.n} 已发布，无需重复发布。`};return;}if(state.scenario==='publish-fail'){state.feedback={kind:'bad',text:`发布失败。v${v.n} 已保存但未发布，不能供后续任务参考；${referenceText(m)}。可保留当前版本并重试发布。`};return;}v.status='published';m.published=v.n;m.updated='刚刚';state.feedback={kind:'good',text:`${combined?'已保存并发布':'已发布'} v${v.n}。有权访问的后续任务可沿 SAP 统一策略参考；原任务、报告及旧版本保持。`};toast(`v${v.n} 发布成功，已进入 SAP 可参考范围。`);}
$('#scenario').addEventListener('change',event=>{state.scenario=event.target.value;if(state.page==='analysis')render();announce('已切换演示情境，现有方法和未保存编辑均保留。');});
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
if(action==='theme'){const dark=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme-toggle').textContent=dark?'亮色':'暗色';$('#theme-toggle').setAttribute('aria-label',dark?'切换为亮色主题':'切换为暗色主题');return;}
if(action==='nav-analysis')guard(()=>go('analysis'));if(action==='nav-sap')guard(()=>go('sap'));if(action==='tab-metrics')guard(()=>go('sap','metrics'));if(action==='tab-methods')guard(()=>go('sap'));
if(action==='open-method')openMethod(button.dataset.id,button.dataset.version===undefined?undefined:Number(button.dataset.version));
if(action==='extract')startExtract();
if(action==='cancel-extract'){state.token++;state.busy=false;state.extract='cancelled';state.extractMessage='已取消提取，未新增方法。原分析成果和来源记录保持。';render();announce(state.extractMessage);}
if(action==='retry-extract-save'){saveExtraction();render();announce(state.extractMessage);}
if(action==='clear-filters'){state.query='';state.origin='all';state.status='all';render();$('#method-search').focus();}
if(action==='back-list')guard(()=>{state.selected=null;state.version=null;state.editing=null;state.feedback=null;render();$('#main').focus();});
if(action==='edit')edit();if(action==='cancel-edit')guard(()=>{state.editing=null;state.feedback=null;render();$('#main').focus();});
if(action==='save-publish')saveEdit(true);
if(action==='publish'){const m=method(),v=version();publishVersion(m,v);render();$('#main').focus();announce(state.feedback.text);}
if(action==='version'){state.version=Number(button.dataset.version);state.feedback=null;render();$('#main').focus();}
if(action==='report')modal('复购变化分析.md','<span class="badge">虚构成果 · 历史只读</span><h3 style="margin-top:16px">主要判断</h3><p>十月整体复购变化与新客批次和渠道结构变化相关。可比批次内变化较小，不能仅凭同期变化认定促销效果变差。</p><h3 style="margin-top:16px">保留的限制</h3><p>部分新客观察窗口尚不完整。后续方法的保存、发布或纠正均不改写本报告当时的内容。</p>','<button class="btn primary" data-action="dialog-cancel">关闭报告</button>');
if(action==='source'){const m=method(),v=version();const original={window:'用户：比较不同新客批次的复购表现。\nAgent：先检查各批次是否拥有相同的观察机会。不完整窗口单独列示，不与成熟批次直接比较。',promo:'示例分析手册：对比促销前后表现前，统一指标定义和期间，并检查节假日、上新、缺货及渠道变化等同期影响。没有可比对照时，观察差异仅作为线索。',store:'示例经营笔记：将收入、客流、转化和成本放在同一业务背景中理解。把事实、可能解释与建议分开。',channel:'用户：哪个渠道的复购表现更好？\nAgent：本次直接比较各渠道的本月复购率，并据此排序。\n后续纠错记录：该比较遗漏了观察窗口与新老客结构差异。原报告保持，旧版停止默认推荐。',repurchase:'用户：十月新客复购率下降了，请分析原因并说明证据限制。\nAgent：先检查复购口径、观察窗口和批次可比性，再区分渠道结构变化与渠道内变化。\n报告摘录：可比批次的渠道内变化较小，整体下降与渠道结构变化相关；现有资料不足以认定促销效果变差。'}[m.id]||'来源内容未记录，保持未知。';modal('原始来源与摘录',`<p class="body-copy">${escapeHtml(v.source)}</p><h3 style="margin-top:20px;margin-bottom:8px">${m.origin==='ir'?'Session／报告原文摘录':'原始资料摘录'}</h3><p class="body-copy">${escapeHtml(original)}</p><div class="notice" style="margin-top:16px">以上为本原型的虚构来源原文。历史原件保持；后续编辑不改写这里的原始摘录，未记录的判断依据保持未知。</div>`,'<button class="btn primary" data-action="dialog-cancel">关闭来源</button>');}
if(action==='reset')confirmAction('重置演示？','<p>将清空本页演示中的新增方法、编辑和发布操作，恢复最初的虚构资料。没有操作真实产品数据。</p>',()=>{state={page:'analysis',tab:'methods',scenario:'normal',methods:fixture(),selected:null,version:null,editing:null,query:'',origin:'all',status:'all',extract:'idle',extractMessage:'',pending:null,extractedId:null,busy:false,token:state.token+1,feedback:null};$('#scenario').value='normal';render();$('#main').focus();toast('演示已重置。');},'重置演示');
if(action==='dialog-cancel')closeDialog();if(action==='dialog-confirm'){const callback=dialogCallback;closeDialog();callback?.();}
});
render();
</script>
</body>
