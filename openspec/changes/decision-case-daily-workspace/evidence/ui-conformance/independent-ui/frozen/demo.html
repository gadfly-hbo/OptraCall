const issueRelationExamples={
 'case-retention':{order:['calibration','causes','expansion'],edges:[{from:'calibration',to:'expansion',label:'提供比较口径'},{from:'causes',to:'expansion',label:'提供核查反馈'}]},
 'case-career':{order:['reflection','interviews','direction'],edges:[{from:'reflection',to:'direction',label:'提供实践体验'},{from:'interviews',to:'direction',label:'提供岗位线索'}]}
};
function issueViewMode(){return scene().issueView==='tree'?'tree':'list'}
function issueGraphData(){
 const items=scene().items,map=new Map(items.map(i=>[i.id,i])),example=issueRelationExamples[base().caseId]||{order:[],edges:[]};
 const edges=example.edges.filter(e=>map.has(e.from)&&map.has(e.to)),linkedIds=new Set(edges.flatMap(e=>[e.from,e.to]));
 const ids=[...example.order.filter(id=>linkedIds.has(id)),...[...linkedIds].filter(id=>!example.order.includes(id))];
 return {nodes:ids.map(id=>map.get(id)),edges,unlinked:items.filter(i=>!linkedIds.has(i.id))};
}
function issueViewSwitch(placement){const mode=issueViewMode();return `<div class="issue-view-switch" role="group" aria-label="事项显示方式"><button type="button" data-act="issue-view" data-view="list" data-placement="${placement}" aria-pressed="${mode==='list'}">列表</button><button type="button" data-act="issue-view" data-view="tree" data-placement="${placement}" aria-pressed="${mode==='tree'}">树状图</button></div>`}
function issueTreeNode(i){return `<button type="button" class="issue-tree-node ${i.id===scene().selected?'active':''}" data-act="issue" data-id="${esc(i.id)}" aria-current="${i.id===scene().selected?'true':'false'}" aria-label="选择事项：${esc(i.title)}，第${i.round}轮" title="${esc(i.title)}"><span class="issue-tree-name">${esc(i.title)}</span><span class="issue-tree-round">第 ${i.round} 轮 · ${esc(i.phase)}</span><span class="issue-tree-status ${esc(i.tone)}">${esc(i.choices.length?'本轮已记录取舍':i.status)}</span></button>`}
function renderIssueGraph(placement='desktop'){
 const g=issueGraphData();if(!scene().items.length)return '<div class="empty-list">还没有建立事项。创建后可在这里查看关系。</div>';
 const index=new Map(g.nodes.map((n,i)=>[n.id,i])),marker='issue-link-marker-'+placement;
 const lines=g.edges.map((e,k)=>{const from=index.get(e.from)*142+56,to=index.get(e.to)*142+56,rail=5+(k%3)*6;return `<path d="M24 ${from} H${rail} V${to} H22" fill="none" stroke="#b59bd6" stroke-width="1.5" marker-end="url(#${marker})"/>`}).join('');
 const graph=g.nodes.length?`<p class="issue-tree-intro">沿已标注关系看事项承接。</p><div class="issue-relation-graph" style="height:${g.nodes.length*142}px"><svg viewBox="0 0 24 ${g.nodes.length*142}" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="${marker}" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0 L4 2 L0 4" fill="none" stroke="#a68bc9" stroke-width="1"/></marker></defs>${lines}</svg>${g.nodes.map(i=>{const outgoing=g.edges.filter(e=>e.from===i.id);return `<div class="issue-tree-row">${issueTreeNode(i)}${outgoing.length?`<span class="issue-tree-link-label">${esc(outgoing.map(e=>e.label).join('、'))}</span>`:''}</div>`}).join('')}</div><div class="issue-relation-sr">${g.edges.map(e=>`${esc(g.nodes.find(n=>n.id===e.from).title)}，${esc(e.label)}，供${esc(g.nodes.find(n=>n.id===e.to).title)}参考。`).join('')}</div><p class="issue-tree-note">线表示承接依据，可并行推进。<br>示例关系不代表原因已经证实。</p>`:'';
 const unlinked=g.unlinked.length?`<p class="issue-unlinked-label">关系尚未标注，可直接继续工作。</p>${g.unlinked.map(i=>`<div class="issue-unlinked-node">${issueTreeNode(i)}</div>`).join('')}`:'';
 return `<div class="issue-tree-content">${graph}${unlinked}</div>`;
}

function issueList(){const items=scene().items;return `<aside class="issue-sidebar" aria-label="Case内事项"><div class="issue-sidebar-top"><h3>Case 内事项 <span class="meta">${items.length}</span></h3><button class="square-btn" data-act="new-issue" aria-label="新建事项" title="新建事项">${icon('plus')}</button></div>${issueViewSwitch('desktop')}${issueViewMode()==='tree'?renderIssueGraph('desktop'):items.length?items.map((i,n)=>`<button class="issue-item ${i.id===scene().selected?'active':''}" data-act="issue" data-id="${esc(i.id)}" aria-current="${i.id===scene().selected?'true':'false'}"><span class="issue-name">${esc(i.title)}</span><span class="issue-sub">${esc(i.sub)}</span><span class="issue-status ${esc(i.tone)}">${esc(i.choices.length?'本轮已记录取舍':i.status)}</span></button>`).join(''):'<div class="empty-list">还没有建立事项。</div>'}<div class="issue-side-footer">${icon('case')}事项属于当前 Case<br>在一件具体问题里持续推进。</div></aside>`}

 if(!caseMeta(sceneKey))return;const w=state.workspace;
 if(fromProject){
  if(w.view!=='project'){w.projectReturn={view:'projects'};w.projectTaskType='all'}

function commitPreparation(){const d=currentPreparation();if(!d||d.discarded)return;if(d.createdScene){openCase(d.createdScene);return}if(d.committed&&d.caseScene){openCase(d.caseScene);return}if(!d.title.trim()||!d.goal.trim()||!d.strategy.trim()){toast('请先明确这件事的名字、目标与策略。');return}const match=preparationMatch(d);if(match){const st=state.scenes[match],item=st.items.find(i=>i.id===st.selected);if(item)queueTransfer(match,item.id,d.originalInput,d.intakeToken||d.id);d.createdScene=match;d.creationState='continued';save();openCase(match);toast('已定位相同目标版本的原 Case；新输入单独保留，未覆盖或发送。');return}if(!d.adoption){const existing=bundleById(d.bundleRef);const adoption=existing||{id:uid('bundle'),goalId:uid('goal'),goalVersion:1,strategyId:uid('strategy'),strategyVersion:1,title:d.title.trim(),goal:d.goal.trim(),strategy:d.strategy.trim(),source:'林予安明确采纳 · 本页保存',adopted:true,originalInput:d.originalInput,originalCandidate:{...d.originalCandidate}};if(!existing)state.goalAdoptions[adoption.id]=adoption;d.adoption={...adoption};save()}
 if(d.caseScene){const b=state.dynamicCases[d.caseScene];if(!b)return;const version=(b.gsHistory.at(-1)?.version||1)+1;b.name=d.title.trim();b.goal=d.adoption.goal;b.strategy=d.adoption.strategy;b.bundleRef=d.adoption.id;b.gsHistory.push({version,goal:b.goal,strategy:b.strategy,bundleRef:b.bundleRef,origin:'用户明确采纳调整',time:'本页保存',originalCandidate:{...d.originalCandidate}});d.committed=true;save();openCase(d.caseScene);toast('已另存并采纳新 G/S 版本；旧版本与原输入保留。');return}
 if(d.simulateInterruption&&!d.interruptionExperienced){d.interruptionExperienced=true;d.creationState='pending';save();render();focusWorkspaceDestination();toast('演示分支：G/S 已采纳，Case 创建尚未完成。');return}
 const existingAfterAdoption=caseForBundle(d.adoption.id);if(existingAfterAdoption){d.createdScene=existingAfterAdoption;save();openCase(existingAfterAdoption);return}
 const key=uid('local-case'),caseId=uid('case'),item=newIssueFromInput(d.originalInput),b={local:true,caseId,name:d.title.trim(),goal:d.adoption.goal,strategy:d.adoption.strategy,bundleRef:d.adoption.id,org:'林予安的工作空间',orgIcon:'林',orgType:'个人工作区',project:'尚无关联项目',secondProject:'',issues:[],originalInput:d.originalInput,gsHistory:[{version:1,goal:d.adoption.goal,strategy:d.adoption.strategy,bundleRef:d.adoption.id,origin:'用户明确采纳并创建',time:'本页保存',originalCandidate:{...d.originalCandidate}}]};state.dynamicCases[key]=b;state.scenes[key]={selected:item.id,browse:'selected',assetScope:'issue',items:[item]};d.createdScene=key;d.creationState='created';save();openCase(key);toast('G/S 已明确采纳，Case 与第一件事项已建立；未授权行动。')}
function updatePreparationMatch(){const d=currentPreparation();if(!d)return;const match=preparationMatch(d),el=$('#preparationMatch');if(el)el.textContent=match?'这组目标/策略版本已有 Case「'+caseMeta(match).name+'」，将带着原输入继续，不重复创建。':d.bundleRef?'沿用已采纳的目标/策略版本；尚无对应 Case。':'当前是新的候选草稿；采纳前不改变已有目标。';if($('#commitPreparation'))$('#commitPreparation').textContent=preparationActionText(d)}
function renderLocalCaseContext(){const b=base();return b.local?`<div class="local-case-context"><span>G/S 已由你明确采纳 · v${b.gsHistory.at(-1).version} · 原输入与旧版保留</span><button class="inline-link" data-act="revise-local-gs">准备 G/S 调整</button>${sourceButton('local-case:'+state.scene+':all','查看输入与采纳记录')}</div>`:''}
function modalDraftKey(formId){return state.scene+'/'+(formId==='newIssueForm'?'case':current()?.id||'none')+'/'+formId}
function captureModalDraft(){const form=$('#modal').querySelector('#choiceForm,#feedbackForm,#newIssueForm');if(!form||form.dataset.submitted==='true')return;const fields={};form.querySelectorAll('input[name],textarea[name],select[name]').forEach(el=>{if(el.type!=='hidden')fields[el.name]=el.value});state.modalDrafts[modalDraftKey(form.id)]=fields;save()}
function restoreModalDraft(){const form=$('#modal').querySelector('#choiceForm,#feedbackForm,#newIssueForm');if(!form)return;const fields=state.modalDrafts[modalDraftKey(form.id)];if(fields)for(const[name,value]of Object.entries(fields)){const el=form.querySelector(`[name="${CSS.escape(name)}"]`);if(el&&el.type!=='hidden')el.value=value}}
function clearModalDraft(formId){delete state.modalDrafts[modalDraftKey(formId)]}
function requestDiscard(kind,id=null){const label=kind==='home'?'首页这段输入与整理草稿':kind==='preparation'?'这份 Case 准备草稿':'当前这段待带入片段';openModal(`${modalHeader('明确放弃这份草稿？',label)}<div class="dialog-body"><p class="plain-note">只放弃${label}。其他草稿、已发送对话与正式保存的目标、取舍、反馈都保留。关闭本弹窗会继续保留草稿。</p><div class="dialog-actions" style="margin-top:22px"><button class="btn" data-act="close">继续保留</button><button class="btn danger" data-act="confirm-discard" data-kind="${kind}" data-id="${esc(id||'')}">确认放弃这份草稿</button></div></div>`,false,'[data-act="close"]')}
function discardDraft(kind,id){if(kind==='home'){state.home.input='';state.home.result=null}else if(kind==='preparation'){const d=state.creationDrafts[id];if(d)d.discarded=true;state.workspace.view='home'}else if(kind==='transfer'){const t=(state.transfers[transferKey()]||[]).find(t=>t.id===id);if(t)t.status='discarded'}save();lastFocus=null;returnSelector=null;closeModal();render();focusWorkspaceDestination();toast('已放弃指定草稿，其他内容保留。')}
function handleHomeInput(e){if(e.target.id==='homeInput'){state.home.input=e.target.value;save();document.querySelectorAll('[data-act="arrange-intake"],[data-act="prepare-case"]').forEach(b=>{if(b.closest('.intake-controls'))b.disabled=!state.home.input.trim()});return true}if(['prepareTitle','prepareGoal','prepareStrategy'].includes(e.target.id)){const d=currentPreparation();if(!d||d.adoption)return true;d[e.target.id==='prepareTitle'?'title':e.target.id==='prepareGoal'?'goal':'strategy']=e.target.value;if(e.target.id!=='prepareTitle'){const b=bundleById(d.bundleRef);if(b&&(d.goal!==b.goal||d.strategy!==b.strategy)){d.bundleRef=null;d.mode='edited';if($('#adoptedBundleSelect'))$('#adoptedBundleSelect').value=''}}save();updatePreparationMatch();return true}if(e.target.closest?.('#choiceForm,#feedbackForm,#newIssueForm'))captureModalDraft();return false}
function handleHomeChange(e){if(e.target.id==='intakeCandidate'){state.home.result.targetScene=e.target.value;save();render();$('#intakeCandidate')?.focus();return true}if(e.target.id==='adoptedBundleSelect'){const d=currentPreparation(),b=bundleById(e.target.value);if(d&&!d.adoption&&b){d.bundleRef=b.id;d.goal=b.goal;d.strategy=b.strategy;d.mode='adopted';save();render();$('#adoptedBundleSelect')?.focus()}return true}if(e.target.id==='simulateCreateInterruption'){const d=currentPreparation();if(d){d.simulateInterruption=e.target.checked;save()}return true}if(e.target.closest?.('#choiceForm,#feedbackForm,#newIssueForm'))captureModalDraft();return false}
function handleHomeAction(el){const a=el.dataset.act;if(a==='analysis-foundation-guide'){openModal(`${modalHeader('逐步建设分析资产','从实际工作中积累，可按需开展')}<div class="dialog-body"><article class="source-article"><h3>把有用的方法留下来</h3><p>分析资产可以包括可复用的分析方法、Skill、计算脚本和模型，并保留适用范围、来源与版本。</p><p>Case 的观察报告属于具体成果；其中有复用价值的方法可以进一步整理为资产候选，再按发布与使用规则维护。</p><p>当前工作可以直接继续，无需先完成分析资产建设。</p></article></div>`,true);return true}if(a==='foundation'&&base().local){const b=base(),strategy=el.dataset.kind==='战略选择';openModal(`${modalHeader(el.dataset.kind,b.name+' · 当前 Case 资料范围')}<div class="dialog-body"><article class="source-article"><h3>${strategy?esc(b.strategy):'尚未关联这类基础资料'}</h3><p>${strategy?'沿用你明确采纳的策略版本；如需调整，可在当前 Case 准备新的 G/S 建议。':'当前 Case 尚未关联'+esc(el.dataset.kind)+'。你可以按需要补充，继续工作无需先建设。'}</p>${strategy?sourceButton('strategy','查看当前策略原记录'):''}</article></div>`,true);return true}if(a==='arrange-intake'){arrangeIntake();return true}if(a==='intake-example'){const example=el.dataset.example==='personal'?'补充两次访谈中我最在意的工作片段':'三店试点有新观察，想继续讨论是否扩围';state.home.input=state.home.input?state.home.input+'\n'+example:example;save();render();$('#homeInput')?.focus();return true}if(a==='pending-request'){openPendingRequest(el.dataset.id);return true}if(a==='continue-intake'){continueIntake(el.dataset.scene);return true}if(a==='prepare-case'){prepareCase(el.dataset.mode);return true}if(a==='prepare-from-bundle'){prepareCase('adopted',el.dataset.bundle);return true}if(a==='resume-preparation'){state.workspace.preparationId=el.dataset.id;showWorkspace('prepare');return true}if(a==='revise-local-gs'){prepareRevision();return true}if(a==='manual-preparation'){const d=currentPreparation();if(d){d.mode='manual';save();$('#prepareGoal')?.focus();toast('可直接编辑目标与策略，不需要模型。')}return true}if(a==='append-transfer'){appendTransfer(el.dataset.id);return true}if(a==='keep-transfer'||a==='expand-transfer'){foldTransfer(el.dataset.id,a==='keep-transfer');return true}if(a==='discard-home'){requestDiscard('home');return true}if(a==='discard-preparation'){requestDiscard('preparation',el.dataset.id);return true}if(a==='discard-transfer'){requestDiscard('transfer',el.dataset.id);return true}if(a==='confirm-discard'){discardDraft(el.dataset.kind,el.dataset.id);return true}return false}
function caseScopedSource(sk,id,version='latest'){const b=caseMeta(sk);if(!b)return null;if(id==='goal'||id==='strategy'||id==='all'){const history=b.local?b.gsHistory:[{version:1,goal:b.goal,strategy:b.strategy,origin:'原目标/策略记录',time:sk==='personal'?'第1周':'11月12日'}],chosen=version?.startsWith('v')?history.find(v=>'v'+v.version===version)||history.at(-1):history.at(-1);return{title:b.name+' · '+(id==='goal'?'目标原记录':id==='strategy'?'策略原记录':'输入与 G/S 采纳记录'),type:b.local?'用户明确采纳记录':'目标与策略原记录',time:chosen.time,version:'v'+chosen.version,caseIds:[b.caseId],caseNames:{[b.caseId]:b.name},issueNames:[],caseVersions:b.local?history:[],globalContext:state.workspace.view!=='case',body:`${b.local?`<h3>最初的输入</h3><p class="source-entry-input">${esc(b.originalInput)}</p>`:''}<h3>G · 已采纳目标</h3><p>${esc(chosen.goal)}</p><h3>S · 已采纳策略</h3><p>${esc(chosen.strategy)}</p><h3>结果边界</h3><p>目标结果待补。G/S 采纳、Case 建立与行动授权分别记录；这里没有宣布目标达成。</p>${b.local?`<h3>原版本与采纳记录</h3>${history.map(v=>`<p>v${v.version} · ${esc(v.origin)}<br>G：${esc(v.goal)}<br>S：${esc(v.strategy)}</p>`).join('')}`:''}`}}
 const family=sk==='personal'?'personal':'enterprise',r=originalSourceContent(id,version,family);return r?{...r,globalContext:true}:null}
function homeSourceContent(id,version){if(id.startsWith('request:')){const req=pendingRequestFixtures.find(r=>r.id===id.slice(8));if(!req)return null;const b=caseMeta(req.scene),i=state.scenes[req.scene].items.find(i=>i.id===req.issueId);return{title:'原请求：'+req.action,type:'明确请求原记录',time:req.date,version:'原保存版',caseIds:[b.caseId],issueNames:[i.title],globalContext:state.workspace.view!=='case',body:`<h3>原请求正文</h3><p>${esc(req.body)}</p><h3>请求归属</h3><p>请求人：${esc(req.requester)}<br>承担人：${esc(req.assignee)}<br>事项：${esc(i.title)} · 第 ${req.round} 轮</p><h3>回应方式</h3><p>沿原事项保存${req.resolutionKind==='choice'?'取舍':'实际反馈'}，并关联回应这条请求后，首页会读回结果。浏览、关闭和普通建议不会完成请求。</p>`}}if(id.startsWith('case-source:')){const[,sk,source]=id.split(':');return caseScopedSource(sk,source,version)}if(id.startsWith('local-case:')){const[,sk,source]=id.split(':');return caseScopedSource(sk,source,version)}if(id.startsWith('bundle:')){const b=bundleById(id.slice(7));if(!b)return null;return{title:b.title+' · 已采纳 G/S',type:'目标/策略原采纳记录',time:b.source,version:'目标 v'+b.goalVersion+' · 策略 v'+b.strategyVersion,caseIds:[],issueNames:[],goalContext:true,globalContext:true,body:`<h3>已采纳目标</h3><p>${esc(b.goal)}</p><h3>已采纳策略</h3><p>${esc(b.strategy)}</p><h3>记录身份与版本</h3><p>这组目标与策略以原采纳记录和版本继续引用；同标题或相似文字不替代原身份。${caseForBundle(b.id)?'当前已有对应 Case。':'当前尚无对应 Case，可明确创建。'}</p>`}}if(base().local&&['goal','strategy'].includes(id))return caseScopedSource(state.scene,id,version);return undefined}
document.addEventListener('submit',e=>{if(e.target.id==='preparationForm'){e.preventDefault();if(e.target.reportValidity())commitPreparation()}});

// 本原型只用浏览器内状态，不连接模型、业务服务或外部资料。
render();
</script>
