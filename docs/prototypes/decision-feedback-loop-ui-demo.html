<div class="demo-banner"><strong>UI Demo · 合成资料 · 仅内存，刷新重置</strong><span class="disclosure">不连接模型、真实文件或业务系统；回复均为预置</span><button data-action="reset">重置本页示例</button></div>

</main>

<script>
'use strict';
const $ = (s, root=document) => root.querySelector(s);
const esc = value => String(value??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const originalReport = {id:'report-oct-01 · 抽取 extract-17 · 建议 rec-03',name:'会员经营建议 · 原决策报告',path:'060_reports/会员经营建议.md',scope:'当时抽取保存的明确片段；原报告完整历史未记录',text:'建议在两家直营门店开展为期两周的会员触达试点。保持优惠预算不变，记录触达范围与执行差异；观察复购表现后，再决定是否扩大。当前证据不足以保证全门店提升。'};
const cases = {none:{name:'无 Case',rule:'不提供任何 Case 特殊规则。'},pilot:{name:'直营两店试点',rule:'限两家直营店；观察期为 2026-10-14 至 10-27；不自动扩大至其他门店。'},franchise:{name:'加盟渠道季度计划',rule:'加盟门店活动需单独审批；季度预算与直营两店试点不共用。'}};
const initialVersions = [
 {n:1,time:'10-13 17:30',executed:'no',outcome:'截至首个已知反馈尚未执行，正在准备试点。',metric:'尚未形成可比较的观察结果。',effect:'unknown',score:'',review:'首个已知版本，无更早历史；此前是否存在被覆盖反馈未知。'},
 {n:2,time:'10-28 10:20',executed:'yes',outcome:'两店试点已完成；部分执行时段不一致。',metric:'用户回录：复购率由 18% 到 20%，仅涉及两店会员订单。',effect:'unknown',score:'4',review:'观察期较短，期间有并行促销。已观察到变化，尚不能认定是建议带来的效果。'}
];
const initialReview = () => ({version:'2',caseId:'none',attachFeedback:true,noMaterials:false,question:'这次两店试点的观察，能支持扩大会员触达吗？请评估证据边界，也可以指出旧建议不适用或还缺什么。',period:'2026-10-14 至 2026-10-27',nature:'合成观察资料',unknowns:'同期有促销；两店执行时段不一致；未提供客户 / SKU 结构。',report:true,observation:true,observationMode:'full',schedule:false,scheduleMode:'ref'});
let state, modalTrigger, toastTimer;
function init(){state={view:'board',versions:clone(initialVersions),feedbackDraft:null,review:initialReview(),preview:null,confirmed:false,sourceTick:0,reportChanged:false,missingFull:false,archived:false,closedCase:false,reviewError:'',tasks:[],canCreate:true,intent:1,createMode:'normal',operation:null,task:null,taskTab:'chat'};}
function currentFeedback(){return state.versions.at(-1);}
function feedbackText(v){if(!v)return '未取得已保存反馈。不能补造执行或效果。';return `反馈 v${v.n} · ${v.time}\n是否按建议执行：${executionLabel(v.executed)}\n执行记录：${v.outcome||'未记录'}\n指标变化（用户回录）：${v.metric||'未记录'}\n效果判断：${effectLabel(v.effect)}\n主观评分：${v.score?`${v.score}/5`:'未填写'}（不代表验证）\n复盘说明：${v.review||'未记录'}`;}
function executionLabel(v){return {yes:'按建议执行',partial:'部分按建议执行',no:'未按建议执行',unknown:'尚未确认 / 未取得记录'}[v]||'未知';}
function effectLabel(v){return {unknown:'效果未知',positive:'用户认为有改善（未经独立验证）',negative:'用户认为变差（未经独立验证）',none:'用户未观察到改善（未经独立验证）'}[v]||'效果未知';}
function toast(message){$('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4800);}
function go(view){state.view=view;render();$('#workspace').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function render(){const labels={board:'决策看板',review:'基于反馈复盘',task:'普通复盘任务',requirements:'新需求草稿',next:'下一轮普通任务'};$('#breadcrumb').textContent=labels[state.view];$('#analysisWorkspace').setAttribute('aria-pressed',String(['task','next','requirements'].includes(state.view)));$('#decisionWorkspace').setAttribute('aria-pressed',String(['board','review'].includes(state.view)));document.querySelectorAll('.sidebar .nav-button').forEach(b=>{b.removeAttribute('aria-current');});$('#workspace').innerHTML=({board:boardView,review:reviewView,task:taskView,requirements:requirementsView,next:nextView}[state.view])();}
function heading(eyebrow,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div><div class="actions">${actions}</div></div>`;}
function boardView(){const v=currentFeedback();return `${heading('DECISION BOARD','决策看板','把人工行动、反馈与下一次判断接起来。当前为合成项目「10 月会员经营」。',`<span class="pill ${state.archived?'warn':''}">${state.archived?'项目已归档 · 只读':'项目进行中'}</span>`)}
<section class="stats" aria-label="看板状态"><div class="stat"><small>已采纳建议</small><strong>1</strong><span>采纳是用户决定</span></div><div class="stat"><small>已完成行动</small><strong>1</strong><span>done 仅表示人工记录</span></div><div class="stat"><small>反馈修订</small><strong>${state.versions.length}<span> 份</span></strong><span>当前 v${v.n} · 效果可保持未知</span></div></section>
<div class="report-row"><span class="report-icon" aria-hidden="true">MD</span><div><strong>会员经营建议 · 原决策报告</strong><small>report-oct-01 · 已保存抽取片段；完整原稿历史未记录</small></div><button class="btn small" data-action="original-source">查看原依据</button></div>
<div class="section-title"><h2>从建议到结果</h2><small>3 个泳道 · 1 项反馈</small></div>
<section class="board" aria-label="决策泳道">
<section class="lane"><div class="lane-title"><h3><span aria-hidden="true">◇</span> 判断建议</h3><span>已判断 1</span></div><article class="lane-card"><div class="row"><span class="pill accent">已采纳</span><span class="pill">合成建议 · 中优先级</span></div><h4>先以两家直营店试点，再决定是否扩大会员触达</h4><p>预算不变，保留执行差异与观察范围。原建议没有承诺经营效果。</p><div class="task-note"><strong>采用理由 · 用户记录</strong>两店范围可控，先补充执行和结果观察。<br>核算分歧：原记录未记载，不事后补造。</div><details class="notice-gap"><summary>查看建议原文依据</summary><p class="notice-gap">${esc(originalReport.text)}</p></details><div class="actions"><button class="btn small" data-action="original-source">原报告与来源</button></div></article></section>
<section class="lane"><div class="lane-title"><h3><span aria-hidden="true">↗</span> 行动跟进</h3><span>已完成 1</span></div><article class="lane-card"><div class="row"><span class="pill good">done · 人工完成</span><span class="pill">task-action-02</span></div><h4>执行两店会员触达试点并回录结果</h4><p>负责人：李楠（合成人物）<br>计划观察：10-14 至 10-27</p><div class="task-note"><strong>完成记录不等于已按建议执行</strong>实际执行与效果在右侧反馈单独填写。Host 不取数、不计算效果，也不派发经营动作。</div><div class="actions"><button class="btn small" data-action="edit-feedback" ${state.archived?'disabled':''}>更新反馈</button></div>${state.archived?'<p class="small notice-gap">已归档，只读；可查看已有记录。</p>':''}</article></section>
<section class="lane"><div class="lane-title"><h3><span aria-hidden="true">↻</span> 结果复盘</h3><span>当前 v${v.n}</span></div><article class="lane-card feedback-card"><div class="row"><span class="pill accent">反馈 v${v.n}</span><span class="pill warn">${esc(effectLabel(v.effect))}</span></div><h4>已完成试点，效果仍待判断</h4><div class="feedback-summary"><dl><dt>实际执行</dt><dd>${esc(executionLabel(v.executed))}</dd><dt>结果回录</dt><dd>${esc(v.metric||'尚未记录')}</dd><dt>主观评分</dt><dd>${v.score?`${esc(v.score)} / 5`:'未填写'} · 不代表验证</dd></dl></div><p>${esc(v.review)}</p><div class="actions"><button class="btn small" data-action="history">反馈历史</button><button class="btn primary small" data-action="review" ${state.archived?'disabled':''}>基于此反馈复盘</button></div>${state.task?'<button class="btn link small" data-action="task-nav">返回已有复盘草稿 →</button>':''}</article></section>
</section><div class="info-line">建议采纳、是否按建议执行、任务状态与效果判断分别记录。所有观察均为合成用户回录，评分不代表专业核算或效果验证。</div><div class="boundary"><details><summary>边界示例与本页操作</summary><div class="actions"><button class="btn" data-action="toggle-archive">${state.archived?'模拟恢复项目':'模拟归档项目'}</button><button class="btn" data-action="about">查看演示范围</button></div><p class="small muted notice-gap">归档仅模拟只读；不代表真实项目状态，也不停止其他任务。</p></details></div>`;}
function versionOptions(){return `<option value="none" ${state.review.version==='none'?'selected':''}>未取得反馈 · 继续追问</option>`+state.versions.map(v=>`<option value="${v.n}" ${String(v.n)===state.review.version?'selected':''}>反馈 v${v.n} · ${v.time}${v.n===currentFeedback().n?' · 当前':''}</option>`).join('');}
function reviewView(){const r=state.review;return `${heading('FEEDBACK REVIEW','基于反馈复盘','先核对本次交付的资料，再创建本项目内的新普通任务。资料少、效果未知也可以提问。','<button class="btn" data-action="board">返回看板</button>')}
<div class="review-grid"><div><section class="panel"><div class="panel-head"><div><h2>复盘问题与范围</h2><p>原建议 rec-03 · 行动 task-action-02 · 10 月会员经营</p></div><span class="pill">草稿留在本页内存</span></div>
<div class="section-block"><h3><span class="section-number">01</span>选定当时的反馈</h3><label class="field"><span>反馈版本</span><select id="reviewVersion" data-review="version">${versionOptions()}</select><small>历史版本保持原文；选旧版本不会用当前反馈替换。当前最新为 v${currentFeedback().n}，本次仍选 ${r.version==='none'?'未取得反馈':'v'+r.version}。</small></label><button class="btn link small" data-action="history">查看已保存反馈全文 →</button></div>
<div class="section-block"><fieldset><legend><span class="section-number">02</span>适用 Case</legend><p class="small muted">同项目有两个 Case。由你选择，默认无 Case。</p><div class="case-options">${Object.entries(cases).map(([id,c])=>`<label class="choice"><input type="radio" name="reviewCase" data-review="caseId" value="${id}" ${id==='franchise'&&state.closedCase?'disabled':''} ${r.caseId===id?'checked':''}><span><strong>${c.name}</strong><small>${c.rule}${id==='franchise'&&state.closedCase?' · 已结束，需在既有 Case 入口重开后继续；本 Demo 不重开。':''}</small></span></label>`).join('')}</div></fieldset></div>
<div class="section-block"><h3><span class="section-number">03</span>你想继续了解什么</h3><label class="field"><span>目标问题</span><textarea id="reviewQuestion" data-review="question" aria-describedby="questionHelp reviewError">${esc(r.question)}</textarea><small id="questionHelp">可直接提问；不要求完整效果表、RAP 或固定分析步骤。</small></label><details class="notice-gap"><summary>补充观察条件（选填）</summary><div class="field-grid"><label class="field"><span>观察期<span class="optional">选填</span></span><input data-review="period" value="${esc(r.period)}"></label><label class="field"><span>资料性质<span class="optional">选填</span></span><select data-review="nature"><option ${r.nature==='合成观察资料'?'selected':''}>合成观察资料</option><option ${r.nature==='合成模拟执行'?'selected':''}>合成模拟执行</option><option ${r.nature==='尚未取得观察'?'selected':''}>尚未取得观察</option></select></label></div><label class="field"><span>不确定项<span class="optional">选填</span></span><textarea data-review="unknowns">${esc(r.unknowns)}</textarea></label></details></div>
</section><section class="panel"><div class="panel-head"><div><h2>本次选入材料</h2><p>只选择本次需要的合成资料；没有文件也可以继续。</p></div></div>
<label class="choice"><input type="checkbox" data-review="noMaterials" ${r.noMaterials?'checked':''}><span><strong>不主动附带任何材料 · 0 项</strong><small>仅保留来源关联与普通问题；不交付已取消的反馈、Case、报告或附件正文。</small></span></label><div class="material"><label class="material-top"><input type="checkbox" data-review="attachFeedback" ${r.attachFeedback?'checked':''} ${r.noMaterials?'disabled':''}><span><strong>所选反馈正文</strong></span></label><small>可取消正文，来源版本关联仍保留。选“未取得反馈”时不补造反馈正文。</small></div><div class="material"><label class="material-top"><input type="checkbox" data-review="report" ${r.noMaterials?'disabled':''} ${r.report?'checked':''}><span><strong>原决策依据 · 已保存抽取片段</strong></span></label><small>原报告 report-oct-01；只交付当时可得片段，不把当前文件冒充历史全文。</small></div>
<div class="material"><label class="material-top"><input type="checkbox" data-review="observation" ${r.noMaterials?'disabled':''} ${r.observation?'checked':''}><span><strong>两店试点观察.csv</strong></span></label><small>合成资料 · 观察期会员订单；不是完整经营数据。</small><label class="sr-only" for="observationMode">两店试点观察的交付方式</label><select id="observationMode" data-review="observationMode" ${r.noMaterials?'disabled':''}><option value="full" ${r.observationMode==='full'?'selected':''}>提供全文（本页预置的 3 行合成 CSV）</option><option value="ref" ${r.observationMode==='ref'?'selected':''}>仅固定引用，未固定当时全文</option></select>${state.missingFull?'<small style="color:var(--danger)">边界示例：全文当前不可读。可取消选择，或明确仅固定引用。</small>':''}</div>
<div class="material"><label class="material-top"><input type="checkbox" data-review="schedule" ${r.noMaterials?'disabled':''} ${r.schedule?'checked':''}><span><strong>同期促销安排.pdf</strong></span></label><small>仅有文件引用与用户说明，未取得正文。</small><span class="pill notice-gap" style="margin-left:24px">仅引用 · 不表示 Agent 已读</span></div>
</section></div>
<div><section class="panel review-preview" aria-label="实际交付预览"><div class="preview-top"><h2>实际交付预览</h2><span class="pill ${state.preview?'accent':''}">${state.preview?'已生成 · 待确认':'尚未生成'}</span></div><p class="small muted">看清哪些是正文、片段、引用，以及仍然未知的内容。</p><div id="previewArea">${previewHTML()}</div><div id="reviewError" class="error-text" role="alert" aria-live="assertive">${esc(state.reviewError)}</div><div class="actions notice-gap"><button class="btn" data-action="refresh-preview">${state.preview?'刷新预览':'生成交付预览'}</button></div><label class="confirm-row"><input type="checkbox" id="previewConfirm" ${state.confirmed?'checked':''} ${!state.preview||state.archived?'disabled':''}><span>我已核对本次资料范围，允许据此创建普通任务草稿；此动作不发送模型。</span></label><button class="btn primary" style="width:100%" data-action="create-task" ${!state.canCreate?'disabled':''}>${state.operation?.status==='unknown'?'创建结果待确认':!state.canCreate?'本次交接已创建草稿':'创建普通复盘任务草稿'}</button>${state.task&&state.operation?.status!=='unknown'?'<button class="btn link" data-action="task-nav">打开已创建的草稿 →</button>':''}${!state.canCreate&&(!state.operation||state.operation.status==='found')?'<button class="btn link" data-action="another-handoff">另建一次交接 · 重新选择 Case →</button>':''}${state.operation&&state.operation.status==='unknown'?'<div class="note warn notice-gap">原操作 '+state.operation.id+'：'+(state.operation.partial?'资料副本已在内存模拟保留；目标任务创建结果未知。':'创建回执未知；不能假定失败或另建任务。')+'<br>没有自动重试。</div><button class="btn notice-gap" data-action="query-operation">查询原操作 · 不重新创建</button>':''}<p class="small muted notice-gap">方法、工具、是否计算或澄清由 Agent 自主决定。Host 只交付选定资料与来源。</p></section>

function sourceSignature(){return JSON.stringify({review:state.review,tick:state.sourceTick});}

// Keep keyboard focus inside the open native dialog, including browser chrome edges.
document.addEventListener('keydown',event=>{
  const dialog=$('#modal');
  if(!dialog.open||event.key!=='Tab')return;
  const focusable=[...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>{
    const style=getComputedStyle(el);
    return el.tabIndex>=0&&!el.matches(':disabled')&&el.getClientRects().length>0&&style.visibility!=='hidden'&&style.display!=='none'&&!el.closest('[hidden],[inert]');
  });
  if(!focusable.length){event.preventDefault();dialog.focus({preventScroll:true});return;}
  const index=focusable.indexOf(document.activeElement);
  if(event.shiftKey&&(index<=0)){event.preventDefault();focusable.at(-1).focus({preventScroll:true});}
  else if(!event.shiftKey&&(index<0||index===focusable.length-1)){event.preventDefault();focusable[0].focus({preventScroll:true});}
});

function presetReply(p,first){if(!first)return '【后续预置回复】\n这是一条用于演示普通续聊的固定回复，不分析你刚输入的新问题。当前任务没有强制阶段，可以继续编辑、提问或补充资料。\n\n本轮来源仍以对应回执为准；新增或变更材料应重新明确选入。';let text='【复盘结果 · 本页预置，未运行模型或计算】\n\n';if(p.noMaterials)return text+'本轮主动材料为 0 项，只取得你输入的普通问题与来源关联。不能声称读过反馈、Case、原报告或附件，也不能据其计算效果。可以继续讨论条件或明确请求补充；此处仍为预置回复。';if(!p.feedbackIncluded)text+='目前没有取得已保存反馈，不能推定试点已经执行或产生效果。可以先追问执行情况，或讨论在信息不足时还能作出什么判断。\n\n';else text+=`本轮依据是用户选定的反馈 v${p.feedback.n}，不是看板此刻的最新值。人工完成、按建议执行和观察到变化是不同的陈述。\n\n`;if(p.materials.some(m=>m.source==='obs-synthetic-02'&&m.type==='全文'))text+='合成观察正文包含两店试点前后记录，但没有对照、客户结构及促销影响的充分证据。仅凭这份观察，不能将变化归因为会员触达，也不能保证扩大范围后仍有效。\n\n';else text+='本次未取得可用的观察全文。仅有引用或用户回录时，无法完整复算；可以受限讨论条件，也可以请求补充，不应假称已读引用文件。\n\n';text+=p.caseId==='franchise'?'本次明确选的是“加盟渠道季度计划”。它要求加盟活动单独审批，不能把直营两店执行权限带入。\n\n':p.caseId==='pilot'?'本次 Case 范围仅为两家直营店。超出观察期、门店和预算条件时，应重新判断。\n\n':'本次没有选择 Case，不采用任何候选 Case 的特殊规则。\n\n';text+='可供你审核的一条经验：把两店试点作为有限观察，保留促销、客群和执行差异；在门店类型、预算、时期或审批条件改变时重新判断，不直接扩展为全门店通用规则。\n\n下一步可继续追问，或由你明确梳理新需求、关联报告到 Case。没有自动经营动作，也没有自动发布经验。';return text;}

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='close'){closeModal();return;}if(a==='theme'){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#themeButton').setAttribute('aria-label',dark?'切换为浅色主题':'切换为深色主题');toast(dark?'已切换深色主题 · 仅本页内存':'已切换浅色主题 · 仅本页内存');return;}if(a==='board'){go('board');return;}if(a==='review'){go('review');return;}if(a==='task-nav'){go('task');return;}if(a==='task-tab'){state.taskTab=b.dataset.tab;render();return;}if(a==='about'){about();return;}if(a==='unavailable'){openModal('此导航未接入 Demo','保留产品外壳，不模拟真实接入。','<p class="prose">本页只演示决策反馈回流。分析资产、场景组合、连接器、Case 看板及其他业务插件没有连接到此独立原型。</p><div class="dialog-footer"><button class="btn primary" data-action="close">返回当前演示</button></div>');return;}if(a==='menu'){openModal('演示导航','其他产品导航没有接入。','<div class="actions"><button class="btn" data-action="mobile-board">决策反馈看板</button><button class="btn" data-action="mobile-task">普通复盘任务</button></div><p class="small muted notice-gap">分析资产、场景组合、连接器与其他业务插件未接入本 Demo。</p>');return;}if(a==='mobile-board'||a==='mobile-task'){closeModal();go(a==='mobile-board'?'board':'task');return;}if(a==='reset'){openModal('重置本页示例','会清空本页内存中的反馈新版本与全部草稿。没有真实数据受影响。','<p class="prose">恢复为反馈 v1 / v2、无 Case、未发送的初始状态。主题保持当前选择。</p><div class="dialog-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirm-reset">重置示例</button></div>');return;}if(a==='confirm-reset'){closeModal();init();go('board');toast('本页示例已重置。');return;}if(a==='original-source'){originalSource();return;}if(a==='history'){openHistory();return;}if(a==='edit-feedback'){openFeedback();return;}if(a==='ask-without-feedback'){state.review.version='none';invalidate('未取得明确执行反馈；未保存新修订，可以直接提问。');closeModal();go('review');return;}if(a==='review-version'){state.review.version=b.dataset.version;invalidate('已选择历史反馈版本，请刷新预览并确认。');closeModal();go('review');return;}if(a==='refresh-preview'){makePreview();render();return;}if(a==='create-task'){createTask();return;}if(a==='change-report'){state.reportChanged=true;state.sourceTick++;invalidate('SOURCE_CHANGED：原报告当前位置变化。旧片段仍保留；请刷新预览核对可得范围并重新确认。');render();return;}if(a==='missing-full'){state.missingFull=!state.missingFull;state.sourceTick++;invalidate('附件可读范围变化，请刷新预览。不可读全文可以取消或仅固定引用后继续。');render();return;}if(a==='change-feedback'){saveFeedback(true);return;}if(a==='no-feedback'){state.review.version='none';invalidate('未取得反馈示例：行动可能仍 doing / 尚未确认是否执行；可不保存反馈，直接提出普通复盘问题。');render();return;}if(a==='toggle-case-closed'){state.closedCase=!state.closedCase;state.sourceTick++;invalidate(state.closedCase?'加盟 Case 已结束，只读；可改选无 Case 继续普通任务。':'Case 可选状态已恢复，请刷新预览。');render();return;}if(a==='another-handoff'){state.canCreate=true;state.intent++;state.operation=null;state.createMode='normal';state.review.caseId='none';invalidate('已开始另一份明确交接。旧任务与回执保留，可重新选择其他 Case 或无 Case。');render();return;}if(a==='toggle-archive'){state.archived=!state.archived;state.sourceTick++;if(state.view==='review')invalidate(state.archived?'项目已归档，只读；草稿和历史保留。':'项目已恢复；请刷新预览并重新确认。');render();toast(state.archived?'已模拟归档，只读；草稿与历史保留。':'已模拟恢复项目；未发送草稿保留。');return;}if(a==='simulate-unknown'||a==='simulate-partial'){state.createMode=a==='simulate-partial'?'partial':'unknown';state.reviewError='已设置下一次创建场景：'+(state.createMode==='partial'?'资料已留、任务结果待确认。':'创建回执 UNKNOWN。')+'准备预览、确认后创建；不会自动重试。';render();return;}if(a==='simulate-conflict'){state.review.question+='（本页修改了同一意图的载荷）';invalidate('INTENT_CONFLICT：不同载荷不能重试同一操作。原操作与修改后的草稿均保留；请查询原操作。');render();return;}if(a==='query-operation'){queryOperation();return;}if(a==='send-task'){sendTask();return;}if(a==='receipt'){if(state.task)openModal('固定来源与范围',state.task.sent.length?'此处展示最近一轮实际模拟交付；原反馈变化不追改此回执。':'待发送资料预览 · 目前模型没有收到任何内容。',receiptHTML(state.task.sent.at(-1)?.receipt||state.task.source),true);return;}if(a==='turn-receipt'){const m=state.task?.sent[Number(b.dataset.turn)];if(m)openModal('第 '+(Number(b.dataset.turn)+1)+' 轮交付回执',m.id+' · 仅内存模拟，没有真实模型读取。',receiptHTML(m.receipt),true);return;}if(a==='requirements'){openRequirements();return;}if(a==='save-case'){openCaseSave();return;}if(a==='next'){go('next');return;}if(a==='send-next'){if(state.archived){toast('项目已归档，只读。');return;}if(!state.task.nextDraft.trim()){$('#nextError').textContent='请输入问题后再模拟发送。';$('[data-draft=next]').setAttribute('aria-invalid','true');$('[data-draft=next]').setAttribute('aria-describedby','nextError');$('[data-draft=next]').focus();return;}const used=!!state.task.caseSave&&state.task.nextUse;state.task.nextSent={used,body:used?`本轮问题：${state.task.nextDraft}\n\n用户明确选择的资料正文：\n${state.task.caseSave.lesson}\n来源：${state.task.caseSave.caseName} / ${state.task.caseSave.bodyKind} / case-experience-demo-01\n适用范围：直营两店有限观察；加盟审批、预算、客群或执行条件不同须重新判断。\n只提供这份明确经验，未提供 Case 全部历史。`:`本轮问题：${state.task.nextDraft}\n\n未选入任何经验。没有提供 Case 历史、旧反馈或报告正文。`,reply:used?'【预置回答】已模拟取得本轮明确选定的复盘资料，不等于已验证其中结论。当前问题涉及加盟门店，审批与预算条件可能不同，因此不能因资料曾关联 Case 就直接照搬；还需核对证据和适用范围。仍可自主选择方法、追问或分析，不自动沿用旧建议。':'【预置回答】本轮没有选入经验，我不能假称已经读取两店反馈或 Case 历史。可根据当前问题讨论范围，或由你补充和选入需要的资料。'};render();toast('已保存本轮模拟回执并显示预置回答。');return;}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.feedback){state.feedbackDraft[el.dataset.feedback]=el.value;return;}if(el.dataset.review){const key=el.dataset.review;state.review[key]=el.type==='checkbox'?el.checked:el.value;invalidate('选择或正文已变化，请刷新预览并重新确认。');$('#previewArea').innerHTML=previewHTML();$('#reviewError').textContent=state.reviewError;$('#previewConfirm').checked=false;$('#previewConfirm').disabled=true;if(key==='noMaterials')render();return;}if(el.dataset.draft==='task'){state.task.input=el.value;el.removeAttribute('aria-invalid');const error=$('#taskError');if(error)error.textContent='';return;}if(el.dataset.draft==='requirementBackground'){state.task.requirement.background=el.value;state.task.requirement.generated='';return;}if(el.dataset.draft==='requirementSource'){state.task.requirement.sourceBody=el.value;state.task.requirement.generated='';return;}if(el.dataset.draft==='next'){state.task.nextDraft=el.value;el.removeAttribute('aria-invalid');if($('#nextError'))$('#nextError').textContent='';}});
document.addEventListener('change',event=>{if(event.target.id==='taskOwnerSelect'){const t=state.tasks.find(x=>x.id===event.target.value);if(t){state.task=t;state.taskTab='chat';render();}return;}if(event.target.id==='previewConfirm'){state.confirmed=event.target.checked;return;}if(event.target.id==='nextUse'){state.task.nextUse=event.target.checked;return;}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='feedbackForm'){if(state.feedbackDraft.executed==='unknown'){$('#feedbackError').textContent='尚未取得明确执行反馈，不能存为“未执行”。可选择明确是 / 否，或用“未取得明确反馈，直接提问”。';const el=$('[data-feedback=executed]');el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','feedbackError');el.focus();return;}saveFeedback();return;}if(event.target.id==='caseForm'){const id=$('#saveCaseId').value;const ref=$('#caseReference').checked;const judgment=$('#caseJudgment').checked;const adopt=$('#caseAdopt').checked;const lesson=$('#caseLesson').value.trim();if(id==='none'||(!ref&&!judgment&&!adopt)||((adopt||judgment)&&!lesson)){$('#caseError').textContent=id==='none'?'请明确选择一个目标 Case。':!ref&&!judgment&&!adopt?'请至少选择关联报告引用、采用副本或更新当前判断中的一个动作。':'请保留一段可审核的经验 / 当前判断正文。';$('#saveCaseId').setAttribute('aria-invalid',id==='none'?'true':'false');$('#caseActions').setAttribute('aria-invalid',!ref&&!judgment&&!adopt?'true':'false');$('#caseLesson').setAttribute('aria-invalid',(adopt||judgment)&&!lesson?'true':'false');(id==='none'?$('#saveCaseId'):(adopt||judgment)&&!lesson?$('#caseLesson'):$('#caseReference')).focus();return;}state.task.caseSave={caseId:id,caseName:cases[id].name,reference:ref,adopt,judgment,editedText:adopt||judgment?lesson:null,lesson:adopt||judgment?lesson:state.task.sent[0].reply,bodyKind:adopt||judgment?'用户明确采用 / 更新的正文':'关联报告中的原预置回复全文（未采用编辑稿）',sourceFeedback:state.task.source.feedback?.n||null};closeModal();render();toast(`已模拟保存至 ${cases[id].name}：${ref?'关联报告引用':''}${adopt?' · 采用所选正文副本':''}${judgment?' · 更新当前判断':''}。下轮仍需明确选用。`);}});
init();render();
</script>
</body>
