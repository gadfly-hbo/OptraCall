else if(a==='open-case')openCase(id);else if(a==='focus-case'){state.selected=id;state.tab='overview';render()}
else if(a==='close-drawer')$('#caseDrawer').close();else if(a==='close-edit')closeEdit();else if(a==='close-task')$('#taskDialog').close();else if(a==='detail-tab'){state.tab=b.dataset.value;render()}
else if(a==='new-case')openForm('new-case');else if(a==='edit-case')openForm('edit-case',{id});else if(a==='close-case')openForm('close-case',{id});else if(a==='add-note')openForm('add-note',{id});else if(a==='link-project')openForm('link-project',{id});else if(a==='link-file')openForm('link-file',{id});else if(a==='unlink-project')openForm('unlink-project',{caseId:cid,projectId:pid});else if(a==='new-project')openForm('new-project',{caseId:cid});else if(a==='new-task')openForm('new-task',{projectId:pid,caseId:cid});else if(a==='edit-project'){p._previousReason=p.reason;openForm('edit-project',{projectId:pid})}
else if(a==='reopen-case'){c.status='analyzing';const reason=c.closeReason;c.closeReason='';caseEvent(c,'重新打开 Case','恢复为分析中。原结束原因：'+reason);render();notify('Case 已重新打开，历史结束记录保留。')}
else if(a==='toggle-closed'){state.showClosed=!state.showClosed;render()}else if(a==='clear-filter'){state.search='';state.filter='all';$('#searchInput').value='';$('#statusFilter').value='all';render()}
else if(a==='project-space'){if($('#caseDrawer').open)$('#caseDrawer').close();state.view='projects';$('#sidebar').classList.remove('mobile-open');render();notify('已打开项目看板；不会自动携带 Case 背景。')}
else if(a==='restore-project'){p.archived=false;state.changes++;render();notify('项目已在本页恢复；Case 状态保持不变。')}
else if(a==='open-task'){if($('#editDialog').open)closeEdit();openTask(pid,b.dataset.task,cid);$('#taskBody').insertAdjacentHTML('beforeend',`<section style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)"><p class="tiny" style="margin-bottom:10px">围绕这份工作建立事项时，关联的是整个“${esc(p.name)}”项目。</p><div class="inline" style="flex-wrap:wrap"><button class="btn small" data-action="task-new-case" data-project="${pid}">从此任务建立 Case</button><button class="btn small" data-action="task-link-case" data-project="${pid}">关联已有 Case</button></div></section>`)}else if(a==='task-new-case')startTaskCaseLink('new-case',pid);else if(a==='task-link-case')startTaskCaseLink('link-project-to-case',pid);else if(a==='preview-file'){const f=c.artifacts.find(f=>f.id===b.dataset.file);previewFile(c,f)}else if(a==='repair-file'){const f=c.artifacts.find(f=>f.id===b.dataset.file);closeEdit();openForm('link-file',{id:c.id});formData.repairId=f.id}
else if(a==='set-view-mode')setViewMode(b.dataset.mode);else if(a==='project-preview')openProjectPreview(pid);
else if(a==='feature'){$('#editTitle').textContent=b.dataset.value;$('#editDescription').textContent='保留 OptraCall 现有导航位置';$('#editBody').innerHTML='<div class="note">本原型聚焦 Case 看板及其与现有项目的关系。此入口的原有功能不在本次 Demo 中展开。</div><div class="form-actions" style="margin-top:20px"><button class="btn" data-action="close-edit">返回 Demo</button></div>';$('#editDialog').showModal()}
else if(a==='preview-context'){const s=taskSelection,cc=getCase(s.caseId),pp=getProject(s.projectId),prompt=$('#previewPrompt').value.trim();if(!prompt){notify('先输入一个问题，再预览本次输入。');$('#previewPrompt').focus();return}$('#editTitle').textContent='本次输入预览';$('#editDescription').textContent='仅展示选择的背景和问题，没有发送请求。';$('#editBody').innerHTML=`<div class="note">${cc?'当前 Case：'+esc(cc.title):'直接项目入口，未附加 Case 背景'}<br>原项目：${esc(pp.name)}</div>${cc?`<p class="field-label" style="margin-top:18px">本次携带的精简背景</p><div class="prose">项目范围：${esc(pp.scope||'未填写')}<br>当前判断：${esc(cc.judgement||'未填写')}<br>关键未知：${esc(cc.unknown||'未填写')}<br>Case 下一步：${esc(cc.next||'未填写')}<br>项目下一步：${esc(pp.next||'未填写')}</div>`:''}<p class="field-label" style="margin-top:20px">你的问题</p><p class="prose">${esc(prompt)}</p><p class="tiny" style="margin-top:18px">正式版本在发送时带入所选背景，由现有 Pi 会话处理。原任务历史仍然保留，本次选择不表示历史已经隔离。</p><div class="form-actions" style="margin-top:20px"><button class="btn" data-action="close-edit">返回任务</button></div>`;$('#editDialog').showModal()}
else if(a==='demo-state'){$('#editTitle').textContent='本页演示状态';$('#editDescription').textContent='所有修改仅存在当前页面内存中，刷新后恢复合成初始数据。';$('#editBody').innerHTML=`<div class="note">Case 看板：${state.caseMode==='cards'?'方块':'列表'} · 项目看板：${state.projectMode==='cards'?'方块':'列表'}<br>${cases.length} 个 Case · ${projects.length} 个现有项目 · ${state.changes} 次演示修改</div><pre class="state-code">${esc(JSON.stringify({caseView:state.caseMode,projectView:state.projectMode,cases:cases.map(c=>({case:c.id,status:statusNames[c.status],projects:c.projectIds})),projects:projects.map(p=>({project:p.id,name:p.name,status:workNames[p.status],taskCount:p.tasks.length,linkedCases:sharedCount(p.id)}))},null,2))}</pre><div class="form-actions"><button class="btn" data-action="close-edit">关闭</button></div>`;$('#editDialog').showModal()}});
document.addEventListener('submit',e=>{if(e.target.id==='demoForm')submitForm(e)});
document.addEventListener('change',e=>{if(e.target.matches('[data-case-status]')){const c=getCase(e.target.dataset.caseStatus),next=e.target.value;if(next==='closed'){e.target.value=c.status;openForm('close-case',{id:c.id})}else if(c.status!==next){const old=statusNames[c.status];c.status=next;caseEvent(c,'修改 Case 状态',old+' → '+statusNames[next]);render();notify('Case 状态已在本页更新。')}}if(e.target.matches('#demoForm select[name=status]')){const input=$('#demoForm input[name=reason]');if(input&&e.target.value!==getProject(formData.projectId)?.status)input.value=''}});
$('#searchInput').addEventListener('input',e=>{state.search=e.target.value;render()});$('#statusFilter').addEventListener('change',e=>{state.filter=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('mobile-open');if(!['ArrowLeft','ArrowRight'].includes(e.key)||!e.target.closest('.view-mode-switch'))return;e.preventDefault();const mode=e.target.dataset.mode==='cards'?'list':'cards';setViewMode(mode);$(mode==='cards'?'#cardModeButton':'#listModeButton').focus()});
render();
</script>
</body>
</html>
