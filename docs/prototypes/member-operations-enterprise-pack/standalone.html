  s.goal=($('#goal')?.value||'').trim();

  if(key&&!/复购/.test(s.goal)){startOther(key);return}
  if(!/会员|复购/.test(s.goal)){toast('本演示支持会员运营宽目标和门店复购用途。');return}

    '<p class="muted">此用途演示到建设起点。门店复购可继续操作发布、使用和修订。</p><div class="hero-actions">'+btn('继续本包的门店复购','namedStart','primary')+btn('提出其他建设目标','newGoal','link')+(s.hasPanorama?btn('返回全景','panorama','link'):'')+'</div>';
}
function register(){
  modal('登记参考','按来源、准确版本与原文内容识别重复。','<label class="field"><span>获准的示例来源</span><select id="importRef">'+references.map((r,i)=>'<option value="'+i+'">'+r[0]+' · v'+r[1]+'</option>').join('')+'</select></label><label class="field"><span>登记情形</span><select id="importType"><option value="same">同源同版原文再次提供</option><option value="conflict">同源同版、正文不同</option></select></label>',btn('返回','close')+btn('核对并登记','doRegister','primary'));
}
function startAsk(n){
  if(!s.published){go('preview');return}
  if(n===2&&!s.revised){go('revision');return}
  if(n===1&&s.revised)n=2;
  s.currentTask=n;s.project=1;s.role=n===2?'两店数据核算岗':'总部月报';go('ask');
}
function doRun(){
  const n=s.currentTask;s.role=$('#role').value;
  const previous=s.reports.filter(r=>r.version===n).length;
  const id=(n===1?'A-':'B-')+String((n===1?17:26)+previous);
  s.reports.push({id,version:n,role:s.role,ready:done()});
  s.reportId=id;
  if(n===1)s.oldTask=true;else s.newTask=true;
  go('answer')
}
const handlers={
  reset:()=>modal('重新开始演示？','仅清除这一页的虚构演示操作。','<p>从建设目标和三份演示附件重新开始。</p>',btn('继续当前演示','close')+btn('重新开始','resetYes','primary')),
  resetYes:()=>{dismiss();s=initial();go('start')},
  help:()=>modal('演示说明','织屿服饰为虚构企业，经营资料和回执均为演示样例。','<p>从体系工作台提出目标，选门店复购并确认一份发布预览，再到项目的分析窗口查看当时依据、反馈和修订。左栏和 Studio 页签可随时回看。</p><p>演示不连接产品、模型或任何企业资料。参考卡片说明来源和段落位置，内容为演示转述。</p>'),
  toggle:()=>{const app=$('.app');if(matchMedia('(max-width:720px)').matches){app.classList.toggle('mobile-open')}else{app.classList.toggle('collapsed')}},
  studio:()=>{go(s.archive&&s.project===0?'archive':starter())},
  coverage:()=>go(s.hasPanorama?'panorama':starter()),
  build:()=>go(s.archive&&s.project===0?'archive':s.feedback?'revision':starter()),
  publication:()=>go(s.published?'receipts':'preview'),
  settings:()=>go('settings'),
  close:dismiss, refBuild:()=>{dismiss();go(s.archive&&s.project===0?'archive':starter())},
  broad:()=>{s.goal=broad;$('#goal').value=s.goal;$('#goal').focus()},
  specific:()=>{s.goal=specific;$('#goal').value=s.goal;$('#goal').focus()},
  begin, namedStart:()=>{dismiss();s.activeUse='';s.started=true;s.selected=true;s.goal=specific;go('draft')},
  newGoal:()=>{s.activeUse='';s.goal=broad;go('start')},choose:()=>{s.activeUse='';s.selected=true;go('draft')}, draft:()=>go('draft'), panorama:()=>go('panorama'),
  preview:()=>go('preview'), receipts:()=>go('receipts'), history:()=>go('history'),
  scenario:()=>modal('演示发布异常','仅改变本次虚构 SAP 分项的回执情形。','<label class="field"><span>SAP 指标发布结果</span><select id="resultMode">'+[['ok','成功'],['unknown','结果未知'],['failed','发布失败']].map(([val,t])=>'<option value="'+val+'" '+(s.receipts===val?'selected':'')+'>'+t+'</option>').join('')+'</select></label><p>依赖异常时只挂起受影响的计算用途。</p>',btn('返回','close')+btn('采用此情形','setScenario','primary')),
  setScenario:()=>{s.receipts=$('#resultMode').value;dismiss();toast('已选择虚构发布回执情形')},
  publish:()=>{if(!s.scope||s.published)return;s.published=1;go('receipts')},
  recover:()=>{
    if(s.receipts==='unknown'){
      modal('查原发布回执','P-032 · 同一请求与同一目标指纹。','<p>原 SAP 记录显示该请求实际成功，目标版本 m5 与确认预览一致。查证后补记回执并恢复依赖用途。</p>',btn('返回','close')+btn('据原回执更新资格','recovered','primary'))
    }else{
      modal('修正受影响的 SAP 候选','P-032 失败 · 原因是经确认的指纹与 SAP 候选不一致。','<p>已回原指标查明为说明字段更新，准备了准确候选和新的发布请求 P-032b。范围、输入映射和其余已发布条目沿用。</p>',btn('返回','close')+btn('确认受影响项并发布','recovered','primary'))
    }
  },
  recovered:()=>{s.recovered=true;dismiss();go('receipts');toast(s.receipts==='failed'?'P-032b 已成功，P-032 原失败保留。':'P-032 原请求查证成功。')},
  ask1:()=>startAsk(1), ask2:()=>startAsk(2), run:doRun,
  old:()=>openReport(firstReport(1)?.id),newReport:()=>openReport(s.reports.filter(r=>r.version===2).at(-1)?.id),feedbackOriginal:()=>openReport(s.feedbackId),
  basis:()=>basis(0), basis0:()=>basis(0), basis1:()=>basis(1), feedback,
  saveFeedback:()=>{
    const body=$('#issue').value.trim(),subject=$('#subject').value.trim();
    if((!s.feedback&&!body)||!subject){toast('请保留反馈主题及问题证据。');return}
    let entry=s.feedbackSources.find(item=>item.reportId===s.reportId);
    if(!s.feedback)s.feedbackId=s.reportId;else s.addedEvidence=true;
    if(!entry){entry={reportId:s.reportId,notes:[]};s.feedbackSources.push(entry)}
    const allNotes=s.feedbackSources.flatMap(item=>item.notes);
    let addition=body;
    for(const known of allNotes){if(addition.startsWith(known))addition=addition.slice(known.length).trim()}
    if(addition&&!allNotes.includes(addition))entry.notes.push(addition);
    s.feedback=true;dismiss();go('answer');toast('已关联原事项 F-08')
  },
  revision:()=>go('revision'),investigate:()=>{s.check=true;go('revision')},revPreview,
  approveRevision:()=>{s.revised=true;s.published=2;dismiss();go('receipts')},
  register,doRegister:()=>{
    const i=Number($('#importRef').value), same=$('#importType').value==='same';
    modal(same?'已找到相同版本':'同版正文不同，待核来源',references[i][0]+' · v'+references[i][1],'<p>'+(same?'复用原登记记录。两条路线可共同引用该来源，登记数仍为 8。':'保留原版及其引用。本次不同正文未替换原记录，须由来源维护者核实。')+'</p>',btn('返回目录','close')+btn('查看原参考','ref'+i,'primary'))
  },
  project0:()=>projectDialog(0),project1:()=>projectDialog(1),
  switchProject0:()=>{s.project=0;dismiss();go(starter())},switchProject1:()=>{s.project=1;dismiss();go(starter())},
  archiveProject:()=>{s.archive=true;s.project=0;dismiss();go('archive')},
  continueProject:()=>{s.project=1;go(starter());toast('在本项目接续原包 '+identity)}
};
document.addEventListener('click', e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a.startsWith('use-'))startOther(a.slice(4));
  else if(/^mat\d+$/.test(a))mat(Number(a.slice(3)));
  else if(/^ref\d+$/.test(a))ref(Number(a.slice(3)));
  else if(a.startsWith('record-'))openReport(a.slice(7));
  else if(handlers[a])handlers[a]();
});
document.addEventListener('input',e=>{
  if(e.target.id==='refsearch'){s.search=e.target.value;$('#refrows').innerHTML=refRows()}
  if(e.target.id==='goal')s.goal=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.name==='scope'){s.scope=e.target.value;screen.querySelector('[data-act=publish]').disabled=false}
});
dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
render();

</script>
<script>
const bundledOriginals = {"04-nike-membership-public.md": "# T04｜Nike 会员运营主数据、指标体系与本体公开参考模板\n\n版本 v0.2 · 2026-11-12 · 公开参考草稿，供审核\n\n\n本版增加指标体系、三类资产关联和分项状态；上一版原文保留在[同名 v0.1 模板](../04-nike-membership-public.md)。全部候选与公开参考仍待用户审核，目标企业正式资产尚未建立。\n\n\n建设路线：会员运营领域 T02 → Nike 会员运营公开参考 T04 → 目标企业会员运营。此处“部门”按业务功能域组织；Nike 内部会员部门名称、汇报关系、系统分工和权限尚无本次可用证据。共享企业、品牌、商品、渠道与门店引用 [T01](01-sportswear-industry.md)／[T03](03-nike-enterprise-public.md)，会员概念引用 [T02](02-membership-domain.md)。\n\n本稿通过购物、运动内容、活动体验、服务和偏好等功能组织公开参考。这些分组是建模建议，不是对 Nike 内部部门设置的陈述。事实来源 N03–N08 及访问限制见[Nike 研究记录](../nike-public-reference-sources-v0.1.md)。\n\n## 公开参考内容\n\n| 参考项 | 来源可支持的事实 | 建模建议及边界 |\n| --- | --- | --- |\n| 美国会员计划视图 | 美国会员页展示免费加入及 Nike App、NRC、NTC、SNKRS 等入口 | 建立带市场范围的计划视图及触点参考；不推断全部地区均可用或属于同一技术账户系统 |\n| 中国会员计划视图 | 中国会员页展示课程、线下活动、定制、SNKRS 中国 App 和会员体验 | 建立购物、内容、活动与服务定义，不把这些功能强制折叠为购买行为 |\n| 地区化权益 | 美国与中国会员页展示的权益内容和条件有所不同 | 权益定义关联市场、渠道、条件及准确来源，动态网页查阅日与业务生效日分开 |\n| 条款与订单条件 | 中国销售条款说明平台附加规定、账户状态和下单条件等可影响适用规则 | 营销说明、政策和具体订单条件分别保留；无法判断优先或冲突时回源核定 |\n| 偏好设置 | 澳大利亚帮助页描述部分网站／App 设置及跨平台保存 | 建立偏好记录及适用平台；不推断全球所有字段实时同步 |\n\n以上事实分别见 [Nike 美国会员页](https://www.nike.com/membership)、[Nike 中国会员页](https://www.nike.com.cn/membership)、[中国销售条款](https://agreementservice.svs.nike.com.cn/rest/agreement?agreementType=termsOfSale&country=CN&language=zh&requestType=redirect&uxId=com.nike.tos)及[澳大利亚设置帮助](https://www.nike.com/au/help/a/nike-settings/app)。实际资格与权益履行须回到相应地区、期间和具体规则。\n\n## 主数据模板：公开填充与企业待定\n\n字段类型和统一来源／时间字段沿 T02 与[包说明](README.md)。下表字段均为本包逻辑字段，不是 Nike 内部字段。\n\n| 对象 | 建议关键字段 | 公开资料可填充 | 保持未知／企业内化时填写 |\n| --- | --- | --- | --- |\n| `MemberProgramView` 计划公开视图 | `view_id:text`、`public_name:text`、`market_scope:ref[]`、`source_ref:ref`、`underlying_program_ref:ref?` | 中国／美国页面名称、地区及展示内容 | 不同视图是否属于同一全球计划、实际计划主键和运营组织；本对象是资料视图而非认定独立计划 |\n| `Account`／`ProgramMembership` | `account_id:text`、`source_namespace:text`、`membership_id:text`、`program_ref:ref`、`status:code`、`valid_period:period?` | 可定义账号和入会关系两个概念；不创建真实个人实例 | 企业注册与入会是否同一动作、状态、退出流程及账号映射 |\n| `Touchpoint` | `touchpoint_id:text`、`public_name:text`、`touchpoint_type:code`、`market_scope:ref[]`、`source_ref:ref` | 来源明确地区内的官网、App 或活动入口 | 全部可用国家、账号共享、接口和事件可得性 |\n| `BenefitDefinition` | `benefit_id:text`、`type:code`、`description:text`、`eligibility_rule_ref:ref?`、`market_scope:ref[]`、`valid_period:period?` | 资料展示的权益类别及明确条件 | 未公开门槛、实际领取对象、目标企业是否采用此权益 |\n| `BusinessRule`／`PolicyDocumentVersion` | `rule_id:text`、`document_ref:ref`、`scope:map`、`conditions:text?`、`exceptions:text?`、`effective_period:period?` | 官方规则原文、版本和明示范围 | 没有写明的例外、生效时间及优先关系 |\n| `ContentService` | `service_id:text`、`name:text`、`service_type:code`、`touchpoint_refs:ref[]`、`access_rule_ref:ref?` | 公开提及的课程、定制或其他服务定义 | 完整内容库、服务资格及内部服务目录 |\n| `CampaignActivity` | `activity_id:text`、`public_name:text`、`type:code`、`market_scope:ref[]`、`rule_ref:ref?` | 有来源的活动类别或公开活动定义 | 全量活动、实际报名／到场数据及内部活动码 |\n| `PreferenceDefinition`／偏好记录 | `preference_key:text`、`value_domain:ref`、`platform_scope:ref[]`、`source_ref:ref`、`valid_period:period?` | 帮助页明确的设置类别和适用平台 | 内部字段、实时同步承诺、每名会员实际选择 |\n| `IdentityLink` | `from_ref:ref`、`to_ref:ref`、`link_type:code`、`evidence_ref:ref`、`verification_state:code` | 只能提供结构槽位，不从公共页面填真实关联 | 身份归并规则、历史合并拆分和目标企业实际映射 |\n| 权限／用途定义与记录 | `purpose_id:text`、`scope:text`、`policy_ref:ref?`、`record_source:ref?`、`effective_period:period?` | 官方政策可作为范围和概念参考，细节限已取得原文 | 内部同意记录结构、全部数据流及目标企业适用依据 |\n\n本次资料未足以核定 Nike 的等级、积分、家庭会员、付费订阅及内部优惠券体系；这些内容继续作为 T02 可选模块。未知不表达为“不存在”。内部会员数、活跃阈值、生命周期分层、留存与复购定义均保持未知。\n\n## 本体模板\n\n以下均为建模建议；只有明确引用的名称、体验及条款内容作为公开事实。\n\n| 关系／事件 | 含义与约束候选 |\n| --- | --- |\n| 计划公开视图—描述—会员计划 | 页面是计划说明来源；先保留地区视图，不因名称相同就合并全球制度 |\n| 会员关系—连接—账号／主体与会员计划 | 入会关系引用准确计划范围；自然人身份和账号一致性需证据 |\n| 计划—通过—触点提供内容／服务／活动 | 触点、服务定义与参与事实分别建模；有入口不等于某会员已参与 |\n| 权益定义—受限于—业务规则版本 | 明确地区、期间、渠道、商品和资格；条件未知时不得写“全员无条件” |\n| 会员关系—符合资格／获授／领取／使用—权益 | 四类语义及相应事件分开；公开营销信息只支持权益介绍，不证明个体资格或使用 |\n| 账号—具有—偏好记录 | 偏好项、值、来源、适用平台与有效期分别记录；推断标签另有方法依据 |\n| 账号／主体—参与—交易角色 | 购买者、付款者、收件人和会员可能不同；访客订单允许会员关联未知 |\n| 注册／入会／退出／身份关联变更 | 作为候选事件骨架；内部状态机、必经步骤和真实事件字段待企业资料 |\n| 报名／活动参与／课程使用／服务履行 | 区分定义与实际事件、报名与到场、访问与使用，不直接推断营销效果 |\n| 权限选择／撤回—引用—目的及政策版本 | 模型表达有范围的历史记录；具体制度和获准数据由目标企业核定 |\n\n```mermaid\nflowchart LR\n    P[主体或账号] --> M[会员关系]\n    M --> G[会员计划]\n    V[地区公开视图] -.描述.-> G\n    G --> B[权益／内容／服务／活动定义]\n    R[政策与业务规则版本] --> B\n    T[触点] --> B\n    P --> E[参与或使用事件]\n    E --> B\n```\n\n图是本包模型建议，不描述 Nike 内部架构。真实账号关联、事件采集和资格计算都须由企业证据补齐。\n\n## 目标企业内化示例工作表\n\n| 参考内容 | 企业可选动作 | 必需依据 |\n| --- | --- | --- |\n| 账号、计划与会员关系分离 | 采用，或保留概念分离并映射同一来源记录 | 实际注册入会流程、主键、资格与状态定义 |\n| 多触点内容、活动和服务 | 按已有业务取舍或扩展 | 企业实际触点、服务、活动清单及数据覆盖 |\n| 地区化、条件化权益 | 采用规则结构，重新填写企业制度 | 企业权益条款、门槛、例外、期间与权威来源 |\n| 等级／积分等可选机制 | 有证据时启用 | 企业实际制度和流水定义；不因标杆模板就默认存在 |\n| 共享身份与偏好 | 采用追溯结构，核定具体事实 | 获准关联资料、业务规则和状态历史 |\n\n正式企业资产的发布、后续普通分析实际使用及任务贡献，并回现有 Studio 两层体系。本轮成果到三类资产参考模板为止，用户提供资料后再进行企业内化。\n\n## 指标体系：公开事实启发的测量建议\n\n公开资料确认了若干会员体验、触点和带条件权益；它们没有提供本次所需的内部会员 KPI、计算公式、活跃窗口、分层门槛或完整数据结构。因此本节**全部运营指标均为 M：建模建议**，不是 Nike 已采用指标。F 仅表示其所依托的体验或业务概念可在来源查到。`metricKey` 是本模板参考项，未绑定正式 SAP 包。\n\n| 测量主题 | F：公开业务线索 | M：候选指标族 | U：内部制度与数据 |\n| --- | --- | --- | --- |\n| 资格与规模 | 会员加入及地区公开计划视图，N03／N04 | 账号、有效会员关系、新增资格 | 全球计划是否统一、资格状态、去重与历史 |\n| 运动与内容参与 | 课程、活动及运动触点，N03／N04 | 合格内容参与、报名／到场、服务使用 | 内部活跃判定、事件名、采集覆盖与 KPI |\n| 购物与体验 | 定制、商品体验及购物入口，N03–N05 | 购买会员关系、服务／定制订单、关联交易 | 会员交易映射、统计资格、退款归属 |\n| 权益履行 | 地区化权益及条件，N03–N05 | 资格覆盖、授予、使用、履行及时性 | 是否逐实例管理、分母、窗口和履约数据 |\n| 偏好与服务 | 部分平台设置与偏好帮助，N07 | 有来源的偏好资料覆盖、服务案件 | 内部字段、同步能力、联系许可及运营目标 |\n\n## 候选指标条目\n\n下列骨架供目标企业决定采用、调整、排除或新增；定义及公式核定后进入原 SAP，目录和本体只保存准确引用。\n\n| metricKey／候选名称（M） | 定义或测量骨架 | 对象、粒度、单位 | 维度、时间及资格 | 所需资料与未知 |\n| --- | --- | --- | --- | --- |\n| `nike.ref.member.active_memberships` 有效会员关系数 | 在约定时点满足计划及状态规则的不同关系数 | `ProgramMembership`；计划内关系；个 | 地区、计划、品牌；资格期间、状态及账号／主体范围待核 | 内部状态与身份历史未知；不能用网页注册人数或账号替代 |\n| `nike.ref.content.participating_memberships` 内容参与会员关系数 | 期间有约定合格内容参与事件的不同关系数 | 会员关系；个／期间 | 内容、触点、市场；有效参与及去重待核 | 官网只支持内容入口概念，不提供此事件或 KPI 定义 |\n| `nike.ref.activity.attended_memberships` 活动到场会员关系数 | 可核实际到场事件关联的不同关系数 | 会员关系×活动；个 | 活动、市场、时间；报名与到场分开，身份可关联 | 需要报名／到场与身份依据，公开活动页不证明实际参与 |\n| `nike.ref.service.customization_orders` 合格定制订单数 | 在企业约定订单状态下的不同定制服务订单数 | 服务订单；单 | 服务、市场、渠道、期间；取消退款影响待核 | N04 只启发服务概念，内部订单键与资格规则未知 |\n| `nike.ref.benefit.fulfilled_instances` 权益履行实例数 | 有依据确认符合规则履行的不同权益实例数 | 权益实例；份等待企业定义单位 | 权益版本、市场、渠道、期间；资格、授予和使用分开 | 逐实例机制及事件是否存在未知，不能默认所有权益有券实例 |\n| `nike.ref.benefit.fulfillment_rate` 权益履行率 | 同一合格且完成观察资格的授予／服务队列中，按规则履行的比例 | 权益实例或服务单位，企业择定；比率 | 承诺、有效期、截止与例外一致，未知不能当未履行 | 对应规则与完整分母、履行记录待企业资料；不是 Nike 官方 SLA |\n| `nike.ref.preference.sourced_coverage` 有来源的偏好记录覆盖率 | 指定资料范围内，具有明确来源与适用期间偏好记录的合格对象比例 | 账号／主体择一；比率 | 目的、平台、市场、时点；主动与推断分开 | N07 支持部分设置概念，不支持全量字段、实际选择或全球同步 |\n| `nike.ref.purchase.member_net_sales` 会员关联交易净额 | 在核定身份及购买规则下归属会员范围的净金额 | 交易行及归属；货币 | 地区、商品、门店渠道、期间；退款及多主体分摊待核 | 访客、购买人／付款人／收件人可不同；真实关联和金额规则未知 |\n\n不能从这些候选反推 Nike 内部目标、绩效、工具部署或现有数据完备性。T02 的留存、生命周期、等级、积分及价值指标继续作为通用可选内容，有企业依据再采用。\n\n## 四种指标关系的候选表达\n\n| 关系类别 | 可建模的内容 | 本节边界 |\n| --- | --- | --- |\n| 目录归属 | 资格规模、内容参与、活动服务、权益和交易等主题 | 本包分类建议，不代表内部部门及 KPI 目录 |\n| 公式依赖 | 例如履行率引用同队列履行数与合格观察分母 | 队列、单位、期间、状态与例外先核定；缺分母时保持待核 |\n| 统计分解 | 按市场、计划、触点或活动分组 | 多触点参与可能重叠，跨触点人数不能直接相加；计划统一性未知 |\n| 分析用途关联 | 参与、权益和交易可以共同作为分析输入 | 浏览、参加、购买和效果分别留证，不能形成未经证明的因果链 |\n\n## 三类资产关联表\n\n以下逻辑项与 T01／T02 共享身份含义，保持参考归属。`ont.*` 为建模建议项，不是 Nike 内部本体或已生成图节点。\n\n| 主数据／关系项 | 参考指标 | 事件、维度、时间及资格 | 本体关联候选 | 实际 Binding 与待核 |\n| --- | --- | --- | --- | --- |\n| `md.account`、`md.program_membership`、计划公开视图 | `nike.ref.member.active_memberships` | 注册、加入、退出、状态期间；地区计划范围 | `ont.view_describes_program`、`ont.membership_valid_at` | 原计划、账号与关系键未知；不由页面名合并全球资格 |\n| 触点、内容／活动、会员关系 | 内容参与、活动到场指标 | 访问、内容使用、报名、到场分别表达 | `ont.access_via_touchpoint`、`ont.participates_in` | 公开入口不能证明真实事件字段、身份或参与覆盖 |\n| 权益定义／规则、可选实例 | 权益履行数与履行率 | 资格、授予、履行及截止；市场、渠道及例外 | `ont.eligible_for`、`ont.fulfilled_under_rule` | 公开条款与营销资料并存，实际适用及实例机制待核 |\n| 偏好定义、账号／主体 | 有来源偏好记录覆盖 | 声明／更新、来源、用途、平台及有效期 | `ont.expresses_preference`、`ont.preference_scope` | 未披露字段、个人选择及同步保证保持未知 |\n| 会员关系、`md.store`、`md.sku` | 会员关联交易净额 | 订单、付款、退货、退款；参与角色与时间归属 | `ont.transaction_role_of`、`ont.refund_of_transaction` | 内部交易—会员关联未知，访客允许未关联 |\n\n## 企业内化与四项状态\n\n每项标记 F／M／U 及来源地区、时间范围，保存参考准确版本、参考 item、目标 item、采用动作、企业证据和差异理由。数据不支持的标杆内部内容保持未知，目标企业可用自身制度补齐并形成独立正式资产。\n\n当前各运营候选的目标企业状态均为：定义待核、数据未映射、当前不可计算、实际使用未验；公开体验有来源不改变这些状态。候选／正式身份另存。定义可核但缺数据时，只能按核定范围发布定义参考，不能显示为已测量或经营有效。\n", "03-nike-enterprise-public.md": "# T03｜Nike 企业主数据、指标体系与本体公开参考模板\n\n版本 v0.2 · 2026-11-12 · 公开参考草稿，供审核\n\n\n本版增加指标体系、三类资产关联和分项状态；上一版原文保留在[同名 v0.1 模板](../03-nike-enterprise-public.md)。全部候选与公开参考仍待用户审核，目标企业正式资产尚未建立。\n\n\n建设路线：运动鞋服行业 T01 → Nike 企业公开参考 T03 → 目标企业。T03 引用 [T01](01-sportswear-industry.md) 的共享对象，在公开资料能够支持的位置填充事实，增加标杆差异；全部内部字段与组织实现保持待核。证据编号 N01–N08、原文链接和访问限制见[Nike 研究记录](../nike-public-reference-sources-v0.1.md)。\n\n## 已知公开事实与参考实例\n\n下表“参考标识”仅为本模板命名，用来连接资料，不是 Nike 生产系统编码。公开名称、业务描述、资料期间与本包逻辑分类分别保存。\n\n| 参考对象 | 公开事实与范围 | 模板如何表达 | 来源 |\n| --- | --- | --- | --- |\n| 企业 `REF.NIKE.Enterprise` | NIKE, Inc. 的 FY2026 年报披露企业业务及品牌组合 | 企业身份与品牌身份分别建对象；法律实体全量清单另核 | [N01：FY2026 10-K，Item 1](https://investors.nike.com/sec-filings/all-sec-filings/content/0000320187-26-000088/nke-20260531.htm) |\n| 品牌参考集合 | 年报涉及 NIKE、Jordan、Converse | 品牌关系保留年报期间，不从品牌名称推定同名法人 | N01 |\n| 商品类别参考集合 | 公开业务包含鞋、服装及器材等 | 作为分类候选；内部商品分类树和编码未知 | N01 |\n| 经营渠道参考 | NIKE Direct 包含自营零售及数字销售，另有批发经营 | 直销／批发经营路径、具体触点、经营主体分别表达 | N01 |\n| 报告分部参考 | NIKE Brand 的四个地理报告分部；Converse 另列 | 增加报告范围对象，与法律组织及运营单元分别关联 | N01，Our Markets／Segment Information |\n| 制造网络参考 | 年报区分合同制造商与其工厂 | 伙伴主体与物理设施分开；具体供货关系不得全连接 | N01，Manufacturing |\n| 商品展示参考 | 中国站一商品页展示名称、颜色和公开款式号 | 外部显示标识带页面来源；不认定其等同内部 SKU 或可据后缀拆出颜色键 | [N02：中国商品示例](https://www.nike.com.cn/t/everyday-all-court-8p-%E7%AF%AE%E7%90%83-5DG2xC) |\n\n这组实例说明公开参考的填写方式，不构成完整品牌库、门店库、商品库或组织全图。年报所述报告分部与原文的财年口径一起保存，不把资料查阅日写成组织变更生效日。\n\n## 主数据模板：复用与扩展\n\n以下均为建模建议。T01 中的定义和统一来源／时间字段继续适用。\n\n| 对象 | 建议字段／对 T01 的扩展 | 公开参考能填什么 | 保持未知的内容 |\n| --- | --- | --- | --- |\n| `Enterprise`／`LegalEntity` | `entity_id`、`entity_kind`、`official_name`、`jurisdiction?`、`external_ids[]` | 资料所述企业名称、文件身份和披露期间 | 内部企业主键、全量法人层级及系统映射 |\n| `Brand` | `brand_id`、`name`、`enterprise_relation_ref`、`market_scope`、`valid_period?` | 已公开的品牌名称和资料中的关系 | 所有授权链、内部品牌码和目标企业是否采用同构层级 |\n| `ReportingSegment`，本稿扩展 | `segment_id`、`name`、`reporting_period`、`coverage_description`、`source_ref` | 年报列示的报告范围 | 全量国家映射、是否与具体运营单元一一对应 |\n| `ProductStyle`／`SellableSKU` | `external_display_identifier`、`identifier_scheme`、`display_attributes`、`source_page` | 页面确实展示的标识及属性 | 内部款、款色、尺码库存主键与算法 |\n| `Channel`／`Touchpoint` | `business_route`、`touchpoint_type`、`operator_ref?`、`market_scope` | 年报经营路径与官网可见入口 | 全部平台账号、门店接入及身份共享安排 |\n| `Store`／`FacilitySite` | `business_unit_ref?`、`physical_site_ref?`、`operator_ref?`、`location_type` | 来源能确认的对象类别；有具体来源才填实例 | 完整地点与经营主体名录、内部地点键 |\n| `BusinessPartner`／制造设施 | `partner_id`、`partner_role`、`facility_refs[]`、`relationship_scope` | 制造商与工厂分离这一公开业务结构 | 未披露的合同、逐商品制造关系及权威系统 |\n| `PolicyDocumentVersion`，本稿扩展 | `document_id`、`subject`、`market_scope`、`published_at?`、`effective_at?`、`source_ref`、`related_rule_refs[]` | 官方文件和政策的准确版本、范围、原文位置 | 未写明的优先规则、生效时间和内部制度 |\n\n`PolicyDocumentVersion` 是来源及受管文件记录；`BusinessRule` 是从资料核定的业务规则，两者通过依据关系连接。模板不把文件本身等同于已完成核定的企业规则。\n\n## 本体模板\n\n以下对象类型与关系名称为本包建议。公开事实是其建模依据，不证明 Nike 内部已采用相同本体。\n\n| 主体—关系—客体 | 语义及限定 |\n| --- | --- |\n| 企业—具有品牌关系—品牌 | 关系类型、披露期间和来源明确；品牌不是组织类型的同义词 |\n| 企业—按范围报告—报告分部 | 报告维度独立；与组织和市场的对照需有具体证据 |\n| 报告分部—覆盖—市场范围描述 | 先保留来源描述；逐国家归属未核定时不补造枚举 |\n| 商品款—归属—品牌／商品类别 | 各关系分别维护；商品变体对款的归属沿 T01 核定 |\n| 销售经营路径—通过—门店／数字触点 | “直销”作为经营路径，“App”作为入口，两者可以关联而不互代 |\n| 伙伴—承担角色—制造商／经销等角色 | 同一组织可有多角色；实际角色实例需要来源 |\n| 制造商—经营—工厂；商品—制造于—设施 | 两段关系分别核查，年报概况不生成所有商品与所有工厂的连接 |\n| 业务规则—依据—政策文件版本 | 明确地区、渠道、商品、时间及例外；规则未知时保留引用与待核项 |\n\n订购、付款、拆分交付、取消、退货与退款沿 T01 分开建事件。中国销售条款 N05 可以支持这些流程概念与条件化规则的参考；具体企业事件表、状态枚举、基数和统计影响由目标企业材料核定。\n\n## 内化到目标企业的差异表\n\n| 参考结构 | 目标企业处理方式 | 需用户资料支持的内容 |\n| --- | --- | --- |\n| 多品牌与品牌关系 | 采用／简化／调整／新增 | 实际品牌、持有或授权关系及适用范围 |\n| 报告分部与经营市场 | 可采用各自对象，也可排除不需要的维度 | 企业报告方式、组织范围与市场编码 |\n| 直销／批发及触点 | 按企业经营模式调整 | 自营、加盟、经销、平台等实际关系及来源 |\n| 商品款与变体 | 沿实际粒度建立映射 | 款、款色、SKU、包装、尺码与外部标识字典 |\n| 伙伴与设施 | 按现有供应与履约业务采用 | 主体、工厂／仓库／地点、角色和期间 |\n\n目标企业的结论与映射记录独立身份、证据与版本。参考中缺少的内部组织、身份和制度仍标未知，留待目标企业补充。\n\n## 指标体系：公开披露与建议分列\n\n本版于 2026-11-12 再次核对 [FY2026 官方 10-K](https://investors.nike.com/sec-filings/all-sec-filings/content/0000320187-26-000088/nke-20260531.htm) 中 Results of Operations／Gross Margin、Segment Information 及零售门店表。公开报表列示收入、销售成本、毛利、毛利率，并按其报告范围展示收入与门店资料。这里仅整理度量类别与口径边界，不抄录金额或建立真实计算包。\n\n下表 `F` 指度量在公开报告中出现；`M` 指本包的参考归类及字段结构。`metricKey` 是参考项标识，不是 Nike 系统码或正式 SAP 指标。收入确认、成本、合并调节、货币中性变化等须回到完整原文，不能由下表短定义代替。\n\n| 主题／metricKey | F：可核公开内容 | M：定义与对象粒度骨架 | 维度、单位、时间与资格 | 数据要求与未知 |\n| --- | --- | --- | --- | --- |\n| 经营规模／`nike.pub.reported_revenues` | 年报的 Revenues | 一个合并／报告范围在财年内的已报告收入 | 报告范围、品牌／产品／渠道等仅按原文可得分组；报表列明的货币单位与财年 | 原财务表、附注及范围；内部逐笔收入映射未知 |\n| 经营价值／`nike.pub.reported_cost_of_sales` | 年报的 Cost of sales | 同财务范围和财年的已报告销售成本 | 与收入范围和币种一致；按原表单位 | 账务与成本附注；商品或门店级分摊未知 |\n| 经营价值／`nike.pub.reported_gross_profit` | 年报的 Gross profit | 读取原报表毛利；本包建议与同范围收入及成本建立核对关系 | 财务范围与财年；货币 | 完整表及调节依据；业务流水差额不自动等于报表毛利 |\n| 经营价值／`nike.pub.reported_gross_margin` | 年报的 Gross margin | 读取原报表比率；模板建议核对同范围毛利与收入的关系 | 同一报告范围／财年；百分比 | 不直接平均分部毛利率，零收入及调整遵原文 |\n| 经营结构／`nike.pub.reported_revenue_breakdown` | 年报的地理、产品及经营渠道收入展示 | 各报告维度内的分组收入 | 各自报告维度、期间和单位；不是任意可交叉切片数据 | 报告范围与完整合并调节；未披露的维度交叉保持未知 |\n| 经营网络／`nike.pub.reported_store_count` | 年报零售门店表 | 指定报告时点及门店类别的已报告数量 | 地区、品牌／店类以原表为准；家；报告时点 | 完整表及分类说明；非全渠道所有合作店名录，内部门店键未知 |\n\n公开指标可参考地组织为经营规模、经营价值、经营结构和经营网络主题。T01 的库存周转、履约及时性等也可作为目标企业候选，但本次来源不据此证明 Nike 采用这些内部 KPI、公式或阈值。Nike 的内部会员、商品生命周期及经营诊断指标体系仍未知。\n\n## 指标关系模板\n\n| 关系类别 | 公开参考可以支持什么 | 内化限制 |\n| --- | --- | --- |\n| 目录归属 | 本包把公开度量归入上述四个主题 | 是建模建议，不是 Nike 内部指标目录 |\n| 公式依赖 | 建议把毛利与收入／成本、毛利率与毛利／收入作同范围核对 | 正式计算以准确 SAP 定义及完整财务政策为准，不从报表标题推导全部调整规则 |\n| 统计分解 | 在各原报告维度内核对收入分组与相应总额 | 地区、产品、渠道是不同视角，不跨维度重复求和；范围及调节项须完整 |\n| 分析用途关联 | 可将规模、渠道结构与毛利共同用于经营分析 | 不能据其并列就断言渠道变化导致毛利变化；原文解释与独立证据分别处理 |\n\n目录与模型不保存另一份可独立修改的正式公式。后续若形成 SAP 包，各参考项绑定准确包 ID、版本和指标名；原 `SourceRef.locator` 的含义保持，项定位单独记录。\n\n## 三类资产关联表\n\n以下关联均为 `M`，不是 Nike 内部模型或数据血缘。\n\n| 主数据／参考对象 | 指标参考项 | 本体关系与时间条件 | 实际 Binding 与证据状态 |\n| --- | --- | --- | --- |\n| 企业／法律及报告范围 | `nike.pub.reported_revenues`、成本、毛利及毛利率 | `ont.financial_measure_for_scope`；财年与合并范围明确 | 可引用原报表定位；内部账务明细及目标企业映射未核 |\n| `ReportingSegment`、`Market` | 公开收入分组 | `ont.reports_under_segment`；报告分部不直接等于法人或运营组织 | 报告表维度可查；完整国家／内部组织关联待证据 |\n| 品牌、商品分类 | 产品／品牌范围内公开度量 | `ont.product_classified_as`、`ont.measure_for_product_scope` | 报表分类与内部款色码映射未知，不推算 SKU 级收入 |\n| `Channel`、`Touchpoint` | 公开渠道收入展示 | `ont.operates_via_channel`；直销／批发与具体入口分别表达 | 公开经营路径有依据；订单触点和会员共享映射未知 |\n| `md.store` 对应门店、地点、经营者 | 公开门店数量 | `ont.operated_by_during`、`ont.store_at_site`；报告时点及类别明确 | 原表不构成全量门店主表；经营记录和历史映射待资料 |\n\n## 企业内化与四项状态\n\n每个公开参考项保留 N01 及财年、表名／章节；目标企业记录独立的报告范围、期间、单位、数据和政策，不迁入 Nike 的数值或制度。公开报表可读不代表目标企业已完成数据映射。\n\n定义状态分别标“公开报表定义范围可查／内部规则未知／目标企业待核”；数据映射、当前可计算及实际使用仍分别记录。参考文件审核通过不能把目标企业任何指标标为正式、可计算或使用通过。若公开表格解析后用于一次限定参考分析，也只核定该公开输入及用途，不推广到内部经营数据。\n"};
document.addEventListener('click', function (event) {
  const a=event.target.closest('a[href*="reference-templates/v0.2/"]');
  if (!a) return;
  const name=a.getAttribute('href').split('/').pop();
  if (name in bundledOriginals) a.href=URL.createObjectURL(new Blob([bundledOriginals[name]], {type:'text/plain;charset=utf-8'}));
}, true);
</script>
