  function assets(){return `<section class="panel"><div class="panel-head"><h2>三类原资产及实际映射</h2>${b('detail','查看准确来源组合','ghost','sources')}</div>${table(['资产','原权威／身份','关联与当前限制','查看'],[['会员关系模型','Studio · 正式 r1','账号、计划、成员关系分开；真实身份待企业资料核定',b('detail','查看','ghost','master')],['会员度量体系',`原 SAP ${version(state.formal)}`,'本体引用准确指标，不复制公式',b('detail','查看原 SAP','ghost','sap')],['会员资格规则',`当前可用 r${state.formal}；候选 r${state.draft}`,'规则／事实／用途／检查与版本绑定',b('detail','查看','ghost','rule')],['样本字段映射','原 Binding · 合成 r1','membership_key、state_code、有效期与观察时点',b('detail','查看事实','ghost','facts')]].map(r=>r.map((x,i)=>i===3?x:esc(x))))}</section><p class="quiet section">模型与字典不是自动 MDM 黄金记录；当前目录与内容均为演示，不代表已存在目标企业正式资产。</p>`;}
  function references(){return `<section class="panel"><div class="panel-head"><h2>两条参考路线，每站三类成果</h2></div><div class="panel-body"><div class="route"><strong>运动鞋服行业 → Nike 企业公开参考 → 目标企业</strong><p>共用门店、商品、交易、组织与时间语义，按企业资料独立核定。</p></div><div class="route"><strong>会员运营领域 → Nike 会员运营公开业务域 → 目标会员运营</strong><p>共用账号、计划、资格、权益和购买关联。Nike 内部 KPI、主键和未公开政策保持未知。</p></div></div></section><section class="section panel"><div class="panel-head"><h2>逐项内化与差异</h2></div>${table(['参考项','动作','目标候选','企业依据（均为虚构）'],[['通用计划成员关系','采用并核粒度','账号参加指定计划的一条关系','示例制度 r1'],['公开会员体验触点','参考，机制待核','不预设积分、等级或付费','资料缺口保留'],['会员资格状态','修改','受控 r2：仅正常','示例政策修订 r2'],['内部身份算法','排除未知推断','不得按设备相似自动归并','缺企业映射依据']].map(r=>r.map(esc)))}</section>`;}
  function rulePanel(){const issue=state.custom?'自定义稿尚未核业务含义':state.scenario==='conflict'?'宽限关系同时命中符合与不符合，当前资格用途存在冲突':state.scenario==='unsupported'?'当前表达包含否定／递归，超出首批支持范围':state.scenario==='missing'?'M-03 缺有效期事实，不能作为明确不符合':state.scenario==='source'?'政策来源已撤回，不能使用旧结果恢复当前资格':state.scenario==='incomplete'?'执行预算边界触发，推导未完成':state.scenario==='scope'?'请求其他企业来源被拒绝，不返回其事实':state.scenario==='error'?'引擎加载失败，未输出经营结论':'';return `${readiness()}${issue?note(esc(issue),'amber'):''}<div class="split"><section class="panel"><div class="panel-head"><div><h2>会员资格政策候选 r${state.draft}</h2><small>样例变化：正常＋宽限 → 仅正常；两版都是虚构政策情境</small></div>${badge(state.checked&&!state.custom?'已有预置核查':'待核候选',state.checked&&!state.custom?'green':'amber')}</div><div class="panel-body"><p>${esc(state.custom?state.customText:rulesText(2))}</p>${meta([['执行支持','拟复用官方 0.7.0；有限、无环、正向合取'],['关联对象','会员关系／资格状态／观察时点'],['关联指标','原 SAP demo-member-foundation@1.1.0'],['事实条件','入会关系、明确状态、带依据的有效期事实'],['执行边界','无否定即失败、聚合、任意回调或业务动作'],['独立核验','未运行；预置结果不是专业验收']])}<div class="actions section">${b('edit','编辑候选（演示）','secondary','',readonly())}${b('checks','查看预置核查','primary','',readonly()||state.custom)}${state.custom?b('restore','另存受控样例','secondary','',readonly()):''}${state.customHistory.length?b('detail','查看候选历史','ghost','draft-history'):''}</div></div></section><aside class="panel"><div class="panel-head"><h2>按需查看依据</h2></div><div class="panel-body stack"><div>${b('detail','规则与执行表示','ghost','rule')}<small>同一准确修订内绑定</small></div><div>${b('detail','样本事实与前提','ghost','facts')}<small>事实不足不当作不符合</small></div><div>${b('detail','三类关联及影响','ghost','impact')}<small>主数据、SAP、规则与 Binding</small></div>${b('preview','准备发布预览','primary','',readonly()||!state.checked||state.custom||previewLocked()||(!safeRule()&&state.scenario!=='conflict'))}</div></aside></div>`;}
  function evolutionView(){return `<div class="split"><section class="panel"><div class="panel-head"><div><h2>企业基础层建设任务</h2><small>同企业默认执行项目：基础资产建设（虚构）；不强制选择具体分析题</small></div>${badge('任务未真实启动','amber')}</div><div class="panel-body"><label class="form-label" for="goal">自然语言建设目标</label><textarea id="goal" ${readonly()?'readonly':''}>${esc(state.goal)}</textarea><p class="quiet section">资料：T01–T04 v0.2 参考＋示例会员制度、字段字典、4条合成样本。分批补资料，不要求先凑齐全部历史。</p><div class="actions">${b('plan','查看预置建设整理','primary','',readonly())}${b('sub','查看候选与规则核验','secondary','rules')}</div><div class="section">${note('这里不运行 Agent。下面仅表达未来产品中由建设 Agent 自主整理、查证和选用工具的结果。')}<ol class="trace"><li><strong>三类并行内化</strong><small>模型身份、指标统计对象、关系与资格规则共享含义。</small></li><li><strong>事实绑定与候选试验</strong><small>检查准确来源、时间与样本边界，调用官方能力的结果另留证。</small></li><li><strong>必要业务问题集中处理</strong><small>材料不能裁定的政策差异交人；不要求逐字段审批。</small></li><li><strong>准备准确用途及发布组合</strong><small>定义、规则执行、指标计算及实际使用状态分别表达。</small></li></ol></div></div></section><aside class="panel"><div class="panel-head"><h2>任务演进贡献</h2></div><div class="panel-body"><p class="quiet">${state.feedback?state.feedback==='local'?'已保存仅本案演示贡献；企业正式规则未变。':'已保存企业修订建议；仍待建设者核定，未改正式源。':'普通任务可反馈新资料、规则变化或共享缺陷，不直接修改企业正式源。'}</p>${b('feedback','查看／提交贡献（演示）','secondary','',readonly())}${b('history','查看原报告依据','ghost')}</div></aside></div>`;}
  function publicationView(){const pub=state.publication;return `${pub?.state==='unknown'?note('原演示请求 '+esc(pub.id)+'：规则源成功、SAP UNKNOWN。新组合尚未合格，普通任务沿原组合 r'+state.formal+'；只查询原请求，不重发。','amber'):pub?.state==='limited'?note('已模拟发布限定定义用途；未授予会员规则执行或完整计数资格。','amber'):pub?note('已模拟发布新组合 r'+state.formal+'／SAP '+version(state.formal)+'。原报告和已运行任务保持原版；这不是实际发布。','green'):note('当前可用组合 r'+state.formal+'。候选、检查和正式发布是不同事实。')}<div class="split"><section class="panel"><div class="panel-head"><div><h2>本次准确发布范围</h2><small>候选 r${state.draft}／SAP 1.1.0，事实条件及三类依赖一起核对</small></div>${badge(previewLocked()?'已留发布结果／原请求待核':ready()?'可预览（演示）':'检查待核／用途受限','amber')}</div><div class="panel-body">${meta([['拟发布用途',esc(scopeText())],['准确组合',esc(previewSelection())],['排除项',limited()?'会员规则执行／完整计数；缺口与冲突保留':'全企业总体、未提供数据、复杂表达及图依赖用途'],['检查依据',state.checked&&!state.custom?'受控样例预置检查；非真实SDK回执':'尚未核定；不能确认正式用途'],['实际使用','普通Pi及独立核验均未运行']])}<div class="actions section">${b('preview','查看准确发布预览','primary','',readonly()||!state.checked||state.custom||previewLocked()||(!safeRule()&&state.scenario!=='conflict'))}${pub?.state==='unknown'?b('query-publication','查询原发布结果','secondary'):''}${b('sub','回到规则核验','secondary','rules')}</div></div></section><aside class="panel"><div class="panel-head"><h2>版本与使用</h2></div><div class="panel-body"><div class="history"><strong>原报告 R01（预置）</strong><small>规则 r1／SAP 1.0.0／输入 sample-v1<br>3条符合、1条明确不符合</small>${b('history','查看固定依据','ghost')}</div><div class="history"><strong>当前合格组合 r${state.formal}</strong><small>新任务才发现新版；运行中任务不静默换版</small>${b('view','进入普通分析任务','ghost','task')}</div><div class="history"><strong>图表示</strong><small>未刷新（演示）；规则工具与准确正文的独立用途不以全图为前置</small></div></div></aside></div>`;}
  function taskView(){const t=state.task, r=t?result(t.revision,t.scenario):null;return `<div class="split"><section class="panel"><div class="panel-head"><div><h2>${t?'分析任务 T-'+t.number:'新普通任务'}</h2><small>${t?'固定规则 r'+t.revision+'／SAP '+version(t.revision)+'／sample-v1；不接建设会话':'正式目录自动可发现，是否读取、执行与采用由 Agent 自主选择'}</small></div>${badge('预置轨迹，未真实运行','amber')}</div><div class="panel-body"><label class="form-label" for="question">分析问题</label><textarea id="question">${esc(state.question)}</textarea><div class="actions section">${b('send','发送问题（演示）','primary')}${t?b('usage-evidence','查看版本与调用依据','secondary'):''}</div>${!t?`<div class="empty"><h3>尚未读取或调用规则</h3><p>发送后展示受控轨迹；不是凭目录或引用就宣称已使用。</p></div>`:`<div class="section">${r.blocked?note(esc(r.headline),'amber'):`<p class="result-big">${esc(r.headline)}</p><p class="quiet">统计单位是计划内会员关系，不是自然人数。${r.unknown?'受影响的总数与比率暂不输出。':'结果只覆盖这4条预置样本，不代表企业总体。'}</p>`}<ol class="trace section"><li><strong>发现同企业合格正式目录</strong><small>冻结规则 r${t.revision}、SAP ${version(t.revision)}及当前用途。</small></li><li><strong>读取准确原文、原 SAP 与事实条件</strong><small>目录可见与读取正文分别记录。</small></li><li><strong>${r.blocked?'执行受限／未完成（预置）':'调用官方规则工具（预置）'}</strong><small>${r.blocked?'没有完整引擎结论，不包装成0条不符合。':'已推出、显式不符合与缺口分开；官方组件并未实际加载。'}</small>${b('usage-evidence','展开规则、事实与前提','ghost')}</li><li><strong>计算与报告解释</strong><small>沿原SAP和获准计算工具；这里没有实际计算或独立核验。</small></li></ol><div class="actions section">${b('feedback','反馈到资产体系（演示）','secondary')}${b('history','查看原报告 R01','ghost')}</div></div>`}</div></section><aside class="panel"><div class="panel-head"><h2>本次使用边界</h2></div><div class="panel-body stack"><p class="quiet">普通工具消费不获得建设、发布或业务写回权。缺资料时说明限制，可继续其他独立分析。</p>${meta([['引擎','拟复用 Semantica 0.7.0'],['规则判断','Agent按需调用，不是Host强制流程'],['公式','原SAP唯一权威'],['使用核验','真实普通Pi及专业核验未执行']])}</div></aside></div>`;}

    if(kind==='rule')return show('规则定义与执行表示',`<p>${esc(state.custom?state.customText:rulesText(2))}</p>${meta([['准确身份',`Studio 资格规则候选 r${state.draft}；定义与表示同一修订`],['来源','示例企业制度r2（虚构）；有效时间按制度核定'],['支持','有限、无环、正向合取；日期事实需原计算依据'],['当前限制','官方接口与实际安装需后续I01核；此处未加载SDK']])}<h3>声明式表示（审核示意，非当前API）</h3><pre>${esc(JSON.stringify({ruleItemId:'ont.membership_eligible_at',conditions:['joined(?m)','state_normal(?m)','valid_at_observation(?m)'],conclusion:'eligible(?m)',factSource:'sample-v1 + Binding r1',businessWriteBack:false},null,2))}</pre><p class="quiet section">既有文字规则继续可读；不支持的表达不会由适配器自行执行。</p>`);
    if(kind==='sources')return show('准确来源与三类组合',meta([['模型','md.program_membership r1（合成）'],['规则',`候选 r${state.draft}／当前合格 r${state.formal}`],['SAP',`demo-member-foundation@${version(state.formal)}`],['Binding／事实','binding.crm r1／sample-v1，4条样本'],['政策／权限','示例制度及当前企业用途；归属不代替资料权限'],['哈希／指纹','均为演示身份；实际SHA及组件行为未核']]) );
    if(kind==='impact')return show('三类资产影响',table(['关联项','影响'],[['主数据关系及状态字典','保持身份与粒度，核资格状态解释'],['原SAP指标与数据条件','资格引用修订；公式仍在SAP，不能只换版本标签'],['本体规则及执行表示','同一源修订，旧检查与预览失效'],['Binding及事实覆盖','有效期、状态和观察时点事实需对应证据'],['下游报告','新任务可用新版，原报告固定r1和原输入']].map(r=>r.map(esc))));
    if(kind==='facts')return show('样本事实与资格前提',restricted()?note('当前来源资格受限，不返回请求的事实或业务结果。','amber'):`${note('全部4条记录为虚构预置；没有读取企业数据或执行规则。')}${table(['关系','状态事实','时间事实','候选情境结果'],result(2,['conflict','missing'].includes(state.scenario)?state.scenario:'normal').items.map(r=>r.map(esc)))}<h3>事实依据</h3><p class="quiet">sample-v1＋Binding r1，观察时点是受控样例固定时点。时间比较在实际产品中需原工具及输入证据。缺少有效期不等于无效，未推出不等于显式不符合。</p>`);
  }
  function checks(){
    if(state.custom||readonly())return;
    state.checked=true;render();
    const r=result(2,state.scenario);
    show('候选检查与预置执行结果',`${note('这是受控样例的预置记录，没有运行Host／Semantica／Pi或独立核验。','amber')}${table(['核查方面','预置状态','依据与限制'],[['定义与三类关联',state.scenario==='conflict'?'存在冲突':'受控样例对应','对象、规则和准确SAP分别核定'],['结构／执行支持',state.scenario==='unsupported'?'不支持':'有限正向子集','不代替业务正确性'],['事实与来源',restricted()?'受限':state.scenario==='missing'?'部分缺失':'样本有据','身份、时间与覆盖'],['工具执行',r.blocked?'未完成／失败／未调用':'成功情境（预置）','没有实际引擎调用'],['独立普通使用','NOT_RUN','Demo不是专业验收']].map(row=>row.map(esc)))}<h3>样本结论</h3><p>${esc(r.headline)}</p>${!r.blocked?table(['会员关系','状态','时间','结果'],r.items.map(row=>row.map(esc))):''}`,`${b('close','返回候选','secondary')}${b('open-preview','查看准确预览','primary','',(previewLocked()||(!safeRule()&&state.scenario!=='conflict')))}`,'checks');
  }
  function preview(){
    if(readonly()||!state.checked||state.custom||previewLocked()||(!safeRule()&&state.scenario!=='conflict'))return;
    state.preview={revision:state.draft,scope:scopeText(),selection:previewSelection(),fingerprint:`DEMO-r${state.draft}-${state.scenario}`,valid:true};
    previewBody();
  }
  function previewBody(){const p=state.preview;if(!p)return;show('准确发布预览（演示）',`${!p.valid?note('预览后候选已变，原预览失效。必须核新稿，不能确认本指纹。','red'):note('确认只改变页面内存，不向任何产品服务发布。','amber')}${meta([['规则候选',`r${p.revision}`],['发布用途',esc(p.scope)],['准确组合',esc(p.selection)],['预览指纹',esc(p.fingerprint)+'（演示标识，非真实SHA）'],['排除与限制',limited()?'规则执行及完整计数用途排除；保留缺口／冲突':'限当前合成样本，复杂表达／全图／企业总体不含'],['使用与独立核验','均未真实执行；发布不自动改为通过']])}`,`${b('close','取消预览','secondary')}${b('stale','模拟预览后变稿','secondary','',!p.valid)}${b('confirm','确认演示发布','primary','',!p.valid||p.revision!==state.draft||!state.checked||readonly())}`,'preview');}
  function history(){show('原报告 R01：固定历史依据',`${note('原报告不会因新发布而改写。以下是预置历史，不是实际业务验收。')}${meta([['报告身份','R01（合成预置）'],['当时规则','r1：正常＋宽限'],['原SAP','demo-member-foundation@1.0.0'],['输入与映射','sample-v1／Binding r1'],['当时结果','4条样本：3条符合，1条明确不符合'],['当前组合',`r${state.formal}／SAP ${version(state.formal)}；不替换历史`],['当前来源资格',state.scenario==='source'?'已撤回，不能用于新调用；历史原依据保留':'样例合格（演示）'],['独立核验','未真实执行']])}`);}
  function usageEvidence(){const t=state.task;if(!t)return;const r=result(t.revision,t.scenario);show('本次读取、规则调用与依据',`${note('本表是预置轨迹，不是真实SDK回执或模型输出。','amber')}${meta([['请求／任务',`DEMO-T${t.number}，当前企业A，只读消费`],['固定规则',`r${t.revision}／SAP ${version(t.revision)}`],['事实输入','sample-v1／Bindingr1，限4条合成记录'],['引擎／状态',`Semantica0.7.0（拟复用，未加载）；${r.blocked?'受限／未完成（预置）':'完整情境（预置）'}`],['覆盖／截止','仅受控4条样本及其固定观察时点'],['读取与调用','目录→准确正文→规则工具；实际次数未测'],['结果限制',esc(r.headline)],['独立核验','NOT_RUN；不以作者说明代替']])}${!r.blocked?`<h3>结论与前提（预置）</h3>${table(['关系','结果','前提及依据'],r.items.map(x=>[esc(x[0]),esc(x[3]),esc(`${x[1]}；${x[2]}；sample-v1对应记录＋规则r${t.revision}`)]))}`:''}`);}
  function feedback(){show('反馈为任务贡献候选',`<p>贡献保留本次报告、准确基础版本及来源。保存不修改企业正式规则，不自动启动维护。</p><label class="form-label" for="feedback-text">说明</label><textarea id="feedback-text">观察到资格制度有新版本，需要核定有效时间及受影响指标。</textarea><label class="form-label section" for="feedback-scope">贡献范围</label><select id="feedback-scope"><option value="enterprise">建议核定为企业共享修订</option><option value="local">仅本案例外</option></select>`,`${b('close','取消','secondary')}${b('save-feedback','保存演示贡献','primary','',readonly())}`,'feedback');}
  function act(action,value){
    if(action==='close')return close();
    if(action==='view'){state.view=value;state.notice='';render();return;}
    if(action==='sub'){state.view='foundation';state.sub=value;render();return;}
    if(action==='theme'){state.dark=!state.dark;render();return;}
    if(action==='detail')return detail(value);
    if(action==='history')return history();
    if(action==='empty-scope')return show('首批范围',`<p>运动鞋服共享经营骨架＋会员运营核心。经营范围、门店渠道、商品SKU、交易退款、会员身份、资格生命周期、会员交易关联、实际参与权益八模块，三类资产同步核定。</p><p class="quiet">用户先提供现有范围、制度、指标报表及字段说明，后续补关联样本和相应历史。当前不创建企业或启动任务。</p>`);
    if(action==='build')return show('建设企业基础资产（演示）',`<p>沿原同企业项目任务，由建设Agent自主整理资料、三类资产及适合执行化的规则。</p><label for="build-goal" class="form-label">建设目标</label><textarea id="build-goal">${esc(state.goal)}</textarea><p class="quiet section">默认项目“基础资产建设”；参考和资料均为合成预置。本按钮不会创建真实项目或运行模型。</p>`,`${b('close','取消','secondary')}${b('start-build','进入演示建设任务','primary','',readonly())}`,'build');
    if(action==='start-build'){state.goal=overlay.querySelector('#build-goal').value;close();state.view='evolution';state.notice='仅进入预置建设任务；没有创建项目、派发模型或登记企业。';render();return;}
    if(action==='plan'){state.notice='预置整理：三类并行内化，缺口集中提出，规则可选执行化；未运行Agent。';render();return;}
    if(action==='edit')return show('编辑规则候选',`<label class="form-label" for="rule-edit">规则业务定义</label><textarea id="rule-edit">${esc(state.custom?state.customText:rulesText(2))}</textarea><p class="quiet section">保存形成新候选，原版保留。自定义稿的定义、事实映射、执行和旧检查均待核，预置检查不适用于它。</p>`,`${b('close','继续保留原候选','secondary')}${b('save-edit','保存新候选','primary','',readonly())}`,'edit');
    if(action==='save-edit'){const text=overlay.querySelector('#rule-edit').value.trim();if(!text)return;state.customText=text;state.custom=true;state.draft++;state.customHistory.push({revision:state.draft,text});state.checked=false;state.preview=null;close();state.notice='已另存自定义候选，旧检查和预览失效；没有真实保存企业资产。';render();return;}
    if(action==='restore'){state.custom=false;state.customText='';state.draft++;state.checked=false;state.preview=null;state.notice='已显式另存受控样例，原自定义稿保留在候选历史且不被声称检查通过；当前仍需查看该样例的预置核查。';render();return;}
    if(action==='checks')return checks();
    if(action==='preview')return preview();
    if(action==='open-preview'){close();return preview();}
    if(action==='stale'){state.draft++;state.checked=false;state.custom=true;state.customText=rulesText(2)+'（预览后新增待核限定）';state.preview.valid=false;render();return previewBody();}
    if(action==='confirm'){const p=state.preview;if(!p?.valid||p.revision!==state.draft||!state.checked||readonly())return;const id=`DEMO-P${++requestNumber}`;state.publication={id,state:state.scenario==='unknown'?'unknown':limited()?'limited':'success',revision:p.revision,scope:p.scope,selection:p.selection};if(state.publication.state==='success')state.formal=p.revision;state.preview=null;close();state.view='publication';state.notice='仅改变本页预置发布状态；没有产品请求或业务副作用。';render();return;}
    if(action==='query-publication'){state.notice=`原请求 ${state.publication.id} 仍为 UNKNOWN（预置）；没有重发。新组合不授予执行资格。`;render();return;}
    if(action==='new-task'){state.task=null;state.question=initial().question;state.notice='已重置为新的独立演示任务；发送时才固定当前合格组合。';render();return;}
    if(action==='send'){if(blank())return;state.question=document.getElementById('question').value;state.task={number:++requestNumber,revision:state.formal,scenario:state.scenario};state.notice='已载入预置普通任务轨迹，没有实际模型、规则或计算调用。';render();return;}
    if(action==='usage-evidence')return usageEvidence();
    if(action==='feedback')return feedback();
    if(action==='save-feedback'){if(readonly())return;state.feedback=overlay.querySelector('#feedback-scope').value;const type=state.feedback;close();state.notice=type==='local'?'已保存仅本案演示贡献，企业正式规则未变。':'已保存企业修订建议，仍待核定，未改正式规则或自动启动维护。';render();return;}
  }
  document.addEventListener('click',event=>{const target=event.target.closest('button[data-action]');if(!target||target.disabled)return;act(target.dataset.action,target.dataset.value);});
  document.addEventListener('change',event=>{if(event.target.id==='enterprise'){if(overlay.open)close();state.enterprise=event.target.value;state.notice='';render();}if(event.target.id==='scenario'){const scenario=event.target.value,dark=state.dark;state=initial();state.scenario=scenario;state.dark=dark;state.notice='已重置为所选受控情境；本页编辑、检查、发布与任务状态已清除。';render();}});
  document.addEventListener('input',event=>{if(event.target.id==='goal')state.goal=event.target.value;if(event.target.id==='question')state.question=event.target.value;});
  overlay.addEventListener('cancel',event=>{event.preventDefault();close();});
  overlay.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const controls=Array.from(overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],[tabindex="0"]'));
    const first=controls[0],last=controls[controls.length-1];if(!first)return;
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  });
  render();
})();

</script>
