<style>

ckground:var(--paper);padding:14px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.demo{padding:9px 28px;background:var(--soft);color:#554466;display:flex;gap:16px;justify-content:space-between;align-items:center;font-size:12px}.demo button{font-size:12px;min-height:30px;padding:3px 9px}.content{max-width:1180px;margin:auto;padding:30px 32px 80px}.intro{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.intro p{margin-top:8px;color:var(--muted);max-width:720px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:7px}.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}.panel h2{margin-bottom:12px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:18px}.grid>*{min-width:0}.grid.equal{grid-template-columns:repeat(2,minmax(0,1fr))}.row,.actions,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.actions{margin-top:18px}.tabs{margin:0 0 18px}.tabs button[aria-pressed=true]{color:var(--accent);background:var(--soft);border-color:var(--accent)}.pill{display:inline-flex;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12px;border-radius:5px;padding:2px 7px;white-space:normal}.pill.ok{color:var(--green);border-color:transparent;background:var(--greenbg)}.pill.warn{color:var(--amber);border-color:transparent;background:var(--amberbg)}.pill.bad{color:var(--red);border-color:transparent;background:var(--redbg)}.notice{border-left:3px solid var(--accent);background:var(--soft);padding:12px 14px;margin:14px 0;border-radius:0 7px 7px 0}.notice.warn{border-color:var(--amber);background:var(--amberbg)}.notice.bad{border-color:var(--red);background:var(--redbg)}.item{padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.item:first-child{padding-top:0}.item p{margin-top:5px}.item .row{justify-content:space-between}.subtle{padding:13px 15px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin:12px 0}.metric{font-size:27px;line-height:1.2;font-weight:650;margin:10px 0}.lineage{display:flex;align-items:stretch;gap:8px;margin:18px 0}.lineage>div{flex:1;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px}.lineage>span{align-self:center;color:var(--muted)}label.field{display:block;margin:12px 0}label.field>span{display:block;font-weight:550;margin-bottom:6px}input:not([type=checkbox]),select,textarea{max-width:100%;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}textarea{min-height:75px;resize:vertical}input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);vertical-align:middle;margin:0 8px 0 0}.check{display:flex;align-items:flex-start;padding:7px 0;gap:0}.check input{flex-shrink:0;margin-top:4px}.check>span{flex:1}.check small{display:block}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.facts{display:grid;grid-template-columns:110px 1fr;margin:0;gap:8px 14px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}summary{font-weight:550;color:var(--muted)}details p{margin-top:10px}.taskline{display:flex;justify-content:space-between;gap:14px;align-items:center}.taskline>div{min-width:0}.log{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.switch{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.switch:last-child{border:0}.switch label{font-weight:550}.switch input{width:20px;height:20px}.callout{font-size:12px;color:var(--muted);padding:9px 0}.receipt{background:var(--paper);border:1px solid var(--line);padding:12px 16px;border-radius:8px;min-height:46px;margin-top:16px}.tasktabs button{font-size:13px}.tasktabs{margin-bottom:16px}.tablewrap{min-width:0;max-width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;vertical-align:top;padding:11px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:550;background:var(--bg)}.skip{position:absolute;top:8px;left:8px;padding:8px;background:var(--paper);z-index:5;transform:translateY(-150%)}.skip:focus{transform:none}.mobile{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}main{min-width:0}.footnote{font-size:12px;color:var(--muted);margin:20px 0 0}.error{color:var(--red);margin-top:10px}#announce{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:min(720px,calc(100vw - 28px));background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;z-index:4;box-shadow:0 5px 20px #0002}#announce:empty{display:none}#announce button{background:transparent;color:white;border:0;min-height:24px;padding:0 0 0 14px}button.link{background:transparent;border-color:transparent;color:var(--accent);padding:2px 0;min-height:30px}ul{padding-left:20px}li{margin:6px 0}@media(max-width:980px){.shell{grid-template-columns:180px minmax(0,1fr)}.content{padding:24px 20px 80px}.grid{grid-template-columns:minmax(0,1fr)}.lineage{flex-wrap:wrap}.lineage>div{min-width:130px}.top,.demo{padding-left:20px;padding-right:20px}}@media(max-width:680px){.shell{display:block}.sidebar{display:none}.mobile{display:block}.top{padding:12px 16px}.top strong{font-size:14px}.top small{display:none}.demo{padding:9px 16px;align-items:flex-start}.demo span{max-width:75%}.content{padding:22px 16px 78px}.intro{display:block}.intro .actions{margin-top:12px}h1{font-size:24px}.panel{padding:18px}.grid.equal,.split{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:86px 1fr}.taskline{align-items:flex-start;flex-direction:column}.taskline .actions{margin-top:0}.lineage{display:grid}.lineage>span{display:none}.lineage>div{min-width:0}.mobile select{width:145px;padding:6px}.tablewrap table{min-width:500px}.demo button{white-space:nowrap}.notice{overflow-wrap:anywhere}}

<body>
<a href="#main" class="skip">跳到工作区</a>
<div class="shell"><aside class="sidebar"><div class="brand"><span>O</span>OptraCall</div><nav aria-label="主导航" id="nav"></nav><div class="navnote"><strong>会员复购改善</strong><p>合成项目 · 共享资料<br>目标、判断和行动各归原处</p></div></aside>
<main id="main" tabindex="-1"><header class="top"><strong>目标与分析工作台</strong><small>企业示例 / 2026 年第四季度</small><label class="mobile"><span class="sr">切换工作区</span><select id="mobile-nav"></select></label></header><div class="demo"><span><strong>交互 Demo · 待审核</strong>　虚构资料、仅本页内存；不执行分析、不写文件或记录，刷新复原。</span><button id="reset-demo">重置演示</button></div><div class="content" id="content"></div></main></div>
<div id="announce" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles={goals:'战略与目标',cases:'Decision Case',project:'Project 需求与任务',analysis:'分析与项目综合',review:'成果审查与反馈',assets:'方法与业务资产',settings:'设置'};
const nodes={save:'报告保存',review:'审查与修订',ir:'IR 自动提炼',case:'Case 反馈',assets:'资产沉淀'};
const initial=()=>({page:'goals',goalLevel:'enterprise',goalVersion:1,goalCandidateOpen:false,customGoal:null,goalHistory:[],caseGoal:'会员持续购买',related:true,noCase:false,planMode:'multi',selected:{T1:true,T2:true,T3:true},methods:{operations:true,research:false,ir:true},summary:'T3',workScope:null,confirmed:false,started:false,activeTask:'T1',tasks:[{id:'T1',name:'会员群体与购买变化',state:'待创建',archived:false},{id:'T2',name:'商品、服务与外部证据',state:'待创建',archived:false},{id:'T3',name:'项目综合与方案比较',state:'已有 · 空闲',archived:false}],global:{save:false,review:false,ir:false,case:false,assets:false},globalRevision:0,synthesis:'gap',reportVersion:1,revised:false,reviews:{1:{status:'reviewed',carried:false,opinion:'复购口径表述过度，应限制为窗口内重复购买。'},2:{status:'unreviewed',carried:false,opinion:null}},choice:null,authorized:false,feedback:false,irDecision:'reuse',candidate:false,published:false,methodError:false,assetFeedback:false,probeTask:'T2',probeNode:'ir',actionStarted:false,probe:'尚未检查；切换开关本身不启动工作。',market:true,marketView:false,exit:[false,false,false,false,false],oldLocator:'',receipt:''});
let state=initial();
const taskOccupied=t=>['已授权开始','已明确继续'].includes(t.state);
function summaryCandidates(){const selected=state.tasks.filter(t=>state.selected[t.id]&&!t.archived);return state.planMode==='single'?selected:state.tasks.filter(t=>!t.archived&&(state.selected[t.id]||t.state!=='待创建'));}
function effectiveWork(){return state.workScope||{taskIds:state.tasks.filter(t=>state.selected[t.id]&&!t.archived).map(t=>t.id),summaryId:state.summary,caseId:state.noCase?null:'C-01'};}
function sourceTaskIds(){const work=effectiveWork(),other=work.taskIds.filter(id=>id!==work.summaryId);return other.length?other:work.taskIds.includes(work.summaryId)?[work.summaryId]:[];}
function sourceText(){return sourceTaskIds().map(id=>id===effectiveWork().summaryId?`${id} / 本任务分析稿 v1`:id==='T1'?'T1 / 群体变化稿 v1':id==='T2'?`T2 / 事实证据稿 ${state.synthesis==='version'?'v1（已有 v2 待核）':'v1'}`:`${id} / 本轮分析稿 v1`).join('；')||'尚无可核对的本轮来源';}
function currentGoalRef(){return state.customGoal&&state.caseGoal===state.customGoal.name?'G-03 v1':state.caseGoal==='经营贡献'?'G-02 v'+state.goalVersion:'G-01 v'+state.goalVersion;}
function caseWritingAllowed(){return !state.noCase&&(!state.workScope||state.workScope.caseId==='C-01');}
const pill=(txt,kind='')=>`<span class="pill ${kind}">${esc(txt)}</span>`;
const go=(page)=>{state.page=page;render();$('main').focus();};
function say(text){$('announce').innerHTML=esc(text)+'<button type="button" data-action="dismiss" aria-label="关闭回执">×</button>';}
function receipt(text){state.receipt=text;say(text);render();}
function intro(over,title,copy,extra=''){return `<div class="intro"><div><p class="eyebrow">${over}</p><h1>${title}</h1><p>${copy}</p></div>${extra}</div>`;}
function localSwitch(key,id){return `<label class="check"><input type="checkbox" id="${id}" data-global="${key}" ${state.global[key]?'checked':''}><span>${nodes[key]}<small>全局设置，也影响其他任务尚未开始的动作</small></span></label>`;}
function taskOptions(selected=state.activeTask){return state.tasks.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${t.id} · ${esc(t.name)}${t.archived?'（已归档）':''}</option>`).join('');}
function render(){
 $('nav').innerHTML=Object.entries(titles).map(([key,label])=>`<button id="nav-${key}" data-go="${key}" ${state.page===key?'aria-current="page"':''}>${label}</button>`).join('');
 $('mobile-nav').innerHTML=Object.entries(titles).map(([key,label])=>`<option value="${key}" ${state.page===key?'selected':''}>${label}</option>`).join('');
 $('content').innerHTML=({goals:goals,cases:cases,project:project,analysis:analysis,review:review,assets:assets,settings:settings}[state.page])()+`<p class="footnote">演示基线：整体架构产品方案 v1.1。各页结果是合成场景；界面状态不代表已实现、已运行或已验收。</p>`;
 const master=$('global-all');if(master){const n=Object.values(state.global).filter(Boolean).length;master.indeterminate=n>0&&n<5;master.setAttribute('aria-checked',n>0&&n<5?'mixed':String(n===5));}
}
function goalCandidate(){if(!state.goalCandidateOpen)return '';return `<section class="panel" id="goal-candidate-panel" tabindex="-1" aria-labelledby="goal-candidate-title"><div class="row between"><h2 id="goal-candidate-title">Agent 准备的候选目标</h2>${pill(state.customGoal?'已确认用于当前事项':'待集中确认',state.customGoal?'ok':'warn')}</div><h3>建立适用会员群体复购基线</h3><p class="muted">理由：现有目标较宽，本轮先明确可比对象与观察条件，再讨论改善目标值；不凭空承诺增长。</p><dl class="facts"><dt>衡量依据</dt><dd>SAP / 适用会员复购率 / v3</dd><dt>成果标准</dt><dd>形成可复核基线、适用窗口和局限；资料不足则明确可成立的受限成果</dd><dt>基线 / 目标值</dt><dd>待资料核实，不预填数值</dd><dt>责任与范围</dt><dd>会员运营牵头；本轮获准会员群体及五店范围，商品与门店按职责协作</dd><dt>期间</dt><dd>本周期；数据观察窗随准确资料确认，不以当前日期补造历史</dd><dt>必要条件</dt><dd>获准历史范围、退款口径一致、可比观察窗及经营贡献边界</dd><dt>上层关系</dt><dd>贡献于会员持续购买；与经营贡献关联，不重复创造企业原目标</dd></dl><div class="actions"><button class="primary" id="confirm-new-goal" data-action="confirm-new-goal" ${state.customGoal?'disabled':''}>${state.customGoal?'已确认用于当前事项':'确认并用于当前事项'}</button><button id="close-goal-candidate" data-action="close-goal-candidate">${state.customGoal?'收起':'暂不采用'}</button>${state.customGoal?'<button data-go="cases">查看当前 Case 目标</button><button data-go="project">进入项目方案</button>':''}</div><p class="callout">仅本页合成候选，不要求填完整组织目标体系。旧目标、历史报告和人的决定保留原准确引用。</p></section>`;}
function goals(){const levels={enterprise:['企业 GSA','会员持续购买','引用 BSC 目标 G-01；当期先补证，再决定改善策略。'],department:['会员运营 GSA','提升适用群体持续购买','贡献于 G-01；商品部门承接供给条件，不机械分摊同一指标。'],personal:['门店员工 GSA','完成获准服务与观察','贡献于会员运营目标；具体负责人、期限和进度引用原行动。']},v=levels[state.goalLevel];return intro('管理承接 / 模块 1','让当前工作对准目标','先确认与当前事项有关的目标，无需编完整个组织的目标体系。',`<button id="prepare-goal" data-action="prepare-goal">从新问题准备目标</button>`)+goalCandidate()+`<div class="grid"><section class="panel"><div class="row between"><h2>BSC 战略目标</h2>${pill('目标版本 v'+state.goalVersion)}</div><div class="lineage"><div><small>客户</small><h3>会员持续购买</h3><p class="muted">本期重点 · G-01</p></div><span>→</span><div><small>财务</small><h3>经营贡献</h3><p class="muted">关联目标 · G-02</p></div></div><dl class="facts"><dt>衡量依据</dt><dd>SAP / 适用会员复购率 / v3</dd><dt>本期要求</dt><dd>形成适用群体的可比基线，再确定改善目标值</dd><dt>必要条件</dt><dd>退款口径一致、历史窗口足够、经营贡献不受损</dd><dt>战略关系</dt><dd>持续购买可能支持经营贡献，成本及资金影响待核</dd></dl><details><summary>查看目标用途与版本影响</summary><p>复购率为成果指标，尺码可得性为候选驱动指标，资金为必要条件，其他门店为观察范围。用途随本次情境确定，SAP 定义保持同源。</p><p>${state.goalVersion>1?'v2 修改了观察窗口：进行中 Case、任务和评价依据待核；旧报告与人的选择仍保留 v1。':'调整目标、期间或条件时，只核受影响工作并保留旧版。'}</p><button id="change-goal-version" data-action="goal-version">演示目标条件换版</button></details></section><section class="panel"><h2>各层贡献与安排</h2><div class="tabs">${Object.entries(levels).map(([k,a])=>`<button data-level="${k}" aria-pressed="${state.goalLevel===k}">${a[0].replace(' GSA','')}</button>`).join('')}</div><small>${v[0]}</small><h3>${v[1]}</h3><p class="muted">${v[2]}</p><div class="subtle"><strong>G、S、A 各有承接</strong><p>目标引用 G-01 v${state.goalVersion}；策略待选择；上层安排待明确。具体行动及反馈留在原决策看板。</p></div><div class="actions"><button class="primary" data-go="cases">查看关联 Case</button><button data-go="project">直接进入项目需求</button></div><p class="callout">查询、核对和 Studio 建设可无 Case 开展。</p></section></div>`;}
function cases(){return intro('持续经营问题 / 模块 1、4','会员复购下滑','先明确主目标，分析后再决定是否改善供应、服务或其他因素。')+`<section class="panel"><div class="row between"><h2>目标关联</h2>${pill('Case C-01 · 进行中')}</div><label class="field"><span>主目标</span><select id="case-main-goal"><option ${state.caseGoal==='会员持续购买'?'selected':''}>会员持续购买</option><option ${state.caseGoal==='经营贡献'?'selected':''}>经营贡献</option>${state.customGoal?`<option ${state.caseGoal===state.customGoal.name?'selected':''}>${esc(state.customGoal.name)}</option>`:''}</select></label><label class="check"><input id="case-related" type="checkbox" ${state.related?'checked':''}><span>关联另一目标：${state.caseGoal==='会员持续购买'?'经营贡献':'会员持续购买'}<small>保留跨部门贡献与必要条件；一个 Case 只有一个主目标。</small></span></label><dl class="facts"><dt>项目关系</dt><dd>会员复购改善 / P-01；同一项目也可支持其他 Case</dd><dt>当期依据</dt><dd>${currentGoalRef()} · SAP 口径 v3</dd><dt>当前判断</dt><dd>原因未定，需核群体变化、商品和服务等证据</dd><dt>人的选择</dt><dd>${state.choice?esc(state.choice)+' · 方案 A v2':'尚未选择'}</dd></dl><div class="actions"><button class="primary" data-go="project">准备项目方案</button><button data-go="review">查看判断与反馈</button></div><details><summary>历史和三层反馈</summary><p>${state.goalHistory.length?'原目标历史：'+state.goalHistory.map(g=>esc(g.name)+' / '+esc(g.ref)).join('；')+'。':''}旧 Case 后补目标时注明补充时点，不追写成历史已确认。执行反馈回原看板；策略反馈检查前提和成本；战略反馈检查对整体目标的贡献。</p></details></section>`;}
function project(){let selected=state.tasks.filter(t=>state.selected[t.id]&&!t.archived);return intro('项目 P-01 / 模块 2','先看全貌，选择本轮工作','准备阶段只看诉求、资料清单、已有说明和方法前提。实际数据质量与原因留到执行核实。')+`<section class="panel"><div class="row between"><h2>项目需求方案 v1</h2>${pill(state.confirmed?'本次已确认 · 尚未正式发布':'待确认',state.confirmed?'ok':'warn')}</div><p>核对适用会员复购变化，分清数量变化与业务解释，比较有依据的改善方向。</p><label class="check"><input type="checkbox" id="no-case" ${state.noCase?'checked':''}><span>本次作为无 Case 的查询 / 核对工作<small>${state.noCase?'不猜测绑定 Case，仍沿用项目需求。':'实际服务 Case C-01，主目标 '+state.caseGoal+' / '+currentGoalRef()+'。'}</small></span></label><details><summary>目标、资料与前置初判</summary><dl class="facts"><dt>资料</dt><dd>获准交易清单、会员说明、商品可得性摘要、服务访谈目录</dd><dt>已知缺口</dt><dd>首购历史可能不足；需补会员历史范围与可比观察窗</dd><dt>受限范围</dt><dd>可先核窗口内重复购买与事实证据，完整首购复购率待验证</dd><dt>TOC/TP</dt><dd>项目整体必选；具体树、工具、顺序及协作由 Agent 决定</dd></dl></details></section><div class="grid"><section class="panel"><h2>问题覆盖与本轮重点</h2><p class="muted">分类按问题形成；同层边界与遗漏按 MECE 检查，结构子项不全部创建任务。</p><div class="tablewrap"><table><thead><tr><th>覆盖方面</th><th>本轮处理</th><th>边界</th></tr></thead><tbody><tr><td>群体、人数与频次</td><td>重点</td><td>数量贡献不直接当原因</td></tr><tr><td>商品、服务与渠道</td><td>重点</td><td>共享证据引用一次</td></tr><tr><td>竞争及外部环境</td><td>纳入证据任务</td><td>来源许可及时间待核</td></tr><tr><td>长期组织能力</td><td>覆盖，暂不单列任务</td><td>有实质发现再建议</td></tr><tr><td>跨期长期效果</td><td>待观察</td><td>未成熟不宣称有效</td></tr></tbody></table></div><div class="notice warn">轻量初判：历史范围可能不足。可接受已说明的受限工作，或先补资料；未核明细，不表示数据质量已通过。</div><label class="field"><span>任务方式</span><select id="plan-mode"><option value="multi" ${state.planMode==='multi'?'selected':''}>多 Task · 维度分析与项目综合</option><option value="single" ${state.planMode==='single'?'selected':''}>单 Task · 同一任务分析并综合</option></select></label>${state.tasks.map(t=>`<label class="check"><input type="checkbox" data-plan-task="${t.id}" ${state.selected[t.id]?'checked':''} ${t.archived?'disabled':''}><span>${esc(t.name)} <small>${t.id} · ${esc(t.state)}${t.archived?' · 已归档':''}</small></span></label>`).join('')}<label class="field"><span>项目综合责任</span><select id="summary-task">${summaryCandidates().map(t=>`<option value="${t.id}" ${state.summary===t.id?'selected':''}>${esc(t.name)}（${t.id}）</option>`).join('')}</select></label><small>优先使用项目内合适任务，不强增会话；未选中的既有综合任务也可明确承接。</small></section><section class="panel"><h2>推荐能力与方法</h2><label class="check"><input checked disabled type="checkbox"><span>TOC/TP · 项目整体约定<small>目标、限制、因果前提、改变方案与效果验证；不固定分析步骤。</small></span></label><label class="check"><input type="checkbox" id="method-operations" data-method="operations" ${state.methods.operations?'checked':''}><span>运营数据分析 Skill <small>已接入。当前仍为旧报告契约，新契约待正式修订与独立测评。</small></span></label><label class="check"><input type="checkbox" id="method-research" data-method="research" ${state.methods.research?'checked':''}><span>深度研究 Skill<small>已接入；适用访谈、公开来源和多类事实证据，不只分析表格。</small></span></label><label class="check"><input type="checkbox" id="method-ir" data-method="ir" ${state.methods.ir?'checked':''}><span>SAP 方法 / 会员窗口核对 v3<small>已发布；选定后须实质采用，固定引用不静默升级。</small></span></label><div class="subtle"><strong>来源与连接</strong><p>项目已授权资料可继承；数据库范围与模型出口沿原权限。天气、商圈仍按任务显式启用。</p><button class="link" data-action="connector">查看缺失来源的配置入口</button></div><p class="muted">可取消、替换或补充能力。无匹配资产时说明基础方法与缺口，不把规划能力当已可用。</p><details><summary>确认后带入什么</summary><p>准确需求版本、实际 Case / 目标、资料、所选能力及既有权限直接交给所选 Task。正式 RAP 发布另行办理，不要求逐 Task 送入或启动。</p></details></section></div><section class="panel"><div class="row between"><div><h2>一次确认，直接承接</h2><p class="muted">本轮选择 ${selected.length} 项任务；综合由 ${esc(state.tasks.find(t=>t.id===state.summary)?.name||'尚未指定')} 承接。</p></div><div class="row"><button id="confirm-create" data-action="confirm-create">仅确认并创建</button><button class="primary" id="confirm-start" data-action="confirm-start">确认并开始</button></div></div><p class="callout">确认并开始不修改自动开关，不授予经营动作权限。此处仅预览界面状态，不发送模型请求。</p>${state.receipt?`<div class="receipt">${esc(state.receipt)}</div>`:''}</section><section class="panel"><h2>项目任务</h2>${state.tasks.map(t=>`<div class="item taskline"><div><strong>${esc(t.name)}</strong><p>${pill(t.archived?'已归档':t.state,t.archived?'':t.state.includes('开始')?'warn':'')} <small>${t.id}${t.id===state.summary?' · 项目综合责任':''}</small></p></div><div class="row"><button data-view-task="${t.id}">查看</button><button data-task-action="${t.archived?'restore':'archive'}" data-task="${t.id}" ${!t.archived&&taskOccupied(t)?'disabled':''}>${t.archived?'恢复':'归档'}</button></div></div>`).join('')}<form id="add-task-form"><label class="field"><span>新增分析 / 查证任务</span><input id="new-task-name" required maxlength="80" placeholder="例如：补核会员首购历史"></label><label class="field"><span>局部需求（可选）</span><input id="new-task-requirement" maxlength="200" placeholder="沿用项目需求，仅补充本任务说明"></label><button id="add-task" type="submit">新增任务</button></form><p class="callout">归档先处理运行与待回应，身份和会话保留；恢复不自动执行。无删除入口。</p></section>`;}
function analysis(){const t=state.tasks.find(t=>t.id===state.activeTask)||state.tasks[0];const usesT2=sourceTaskIds().includes('T2'),scenarios={gap:['阶段成果','群体变化已核实；首购历史与尺码供应证据未齐，原因未定。','补齐首购历史范围、关键款尺码可得性及群体关联。'],disagreement:['存在分歧',usesT2?'会员任务认为群体构成变化重要；商品任务仅提出缺货候选解释，证据强度不同。':'本任务记录了群体变化与缺货候选解释，两者证据强度不同，尚不能确定主因。','对照共同群体与时间窗，区分共同原因和交叉影响，避免重复归因。'],version:['来源换版待核',usesT2?'T2 商品稿由 v1 换到 v2；综合稿当前引用 v1，受影响判断待核。':'本任务的资料出现新版本，已用 v1 的受影响判断待核。','沿原任务取得准确新版本；旧稿和原审查保留，不能套用旧结论。']},a=scenarios[state.synthesis];return intro('项目执行 / 模块 3、6','分析自主开展，综合有人承接','所选方法须实际读取和运用；专业判断、顺序及任务协作交给 Agent。')+`<div class="tabs tasktabs">${state.tasks.map(t=>`<button data-view-task="${t.id}" aria-pressed="${state.activeTask===t.id}">${t.id} ${esc(t.name)}</button>`).join('')}</div><div class="grid"><section class="panel"><div class="row between"><h2>${esc(t.name)}</h2>${pill(t.archived?'已归档':t.state)}</div><dl class="facts"><dt>需求</dt><dd>项目方案 v1${state.confirmed?' · 本次已确认':' · 尚未确认'}</dd><dt>方法约定</dt><dd>项目 TOC/TP${state.methods.operations?'；运营数据分析 Skill':''}${state.methods.research?'；深度研究':''}${state.methods.ir?'；SAP 会员窗口核对 v3':''}</dd><dt>资料与权限</dt><dd>继承本次确认的准确引用；新来源或实质范围变化集中确认</dd><dt>当前限制</dt><dd>资料不足时主动说明缺什么，继续有独立依据部分</dd></dl><div class="notice">合成执行记录仅展示承接方式：读取所选 Skill / SAP v3，核适用性后使用；“已提供”与“实际采用”分开留据。</div><div class="actions"><button id="stop-task" data-action="stop-task">停止当前任务</button><button id="resume-task" data-action="resume-task" ${t.state!=='已停止'?'disabled':''}>核对原状态并明确继续</button></div><details><summary>此任务的自动代办入口</summary>${localSwitch('ir','local-task-ir')}${localSwitch('review','local-task-review')}<p>开关初始关闭，修改不立即启动动作。停止后不因开关开启而续跑。</p></details></section><section class="panel"><h2>项目综合</h2><p>责任任务：${esc(state.tasks.find(t=>t.id===effectiveWork().summaryId)?.name||'未指定')} · ${effectiveWork().summaryId}</p><div class="subtle"><strong>准确来源</strong><p>${esc(sourceText())}。${sourceTaskIds().length===1?'由本轮准确来源承接综合，不引入未选任务成果。':'共同证据只引用一次。'}</p></div><label class="field"><span>合成成果场景（审核用）</span><select id="synthesis-scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${state.synthesis===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><div class="notice warn"><strong>${a[0]}</strong><p>${a[1]}</p></div><p><strong>下一步</strong>　${a[2]}</p><details><summary>综合检查范围</summary><p>核对重要遗漏、重复解释、口径及版本、分歧、跨任务影响和证据限制。不是把报告拼接，不从 Task 结束数推断原因成立。</p></details><div class="actions"><button class="primary" data-go="review">查看合成报告与审查</button></div></section></div><section class="panel"><h2>正常交付与停止分开</h2><p>明确报告保存、自查纠错和所选方法检查继续有效，不被节点关闭取消。一次模型回合、切页或断连不等于任务完成。</p><div class="actions"><button id="normal-finish" data-action="normal-finish">预览“结束本轮并整理”</button><button data-go="settings">查看全局自动设置</button></div><p class="callout">上方按钮只载入结束界面，不模拟 Agent 的分析过程或新增成果。</p></section>`;}
function decisionPanel(){
 if(!caseWritingAllowed())return `<section class="panel"><h2>本次无 Case 关联</h2><p>本轮按项目查询 / 核对开展，不推定关联任何 Case。</p><div class="notice">当前范围不提供 Case 选择、GSA 承接或看板行动代办。需要持续经营取舍时，先明确实际关联。</div><dl class="facts"><dt>选择与授权</dt><dd>本次不写入 Case 或行动记录</dd><dt>实际发生</dt><dd>不挪用其他 Case 的反馈</dd><dt>历史</dt><dd>已有 Case 的选择、授权和反馈原样保留</dd></dl><button id="record-decision" disabled>本次未关联 Case</button><div class="actions"><button data-go="project">返回项目需求</button></div></section>`;
 return `<section class="panel"><h2>准确选择与管理承接</h2><p class="muted">方案 A v2：五店关键尺码补证后再考虑试点。用户保留经营取舍。</p><label class="field"><span>用户表达（合成）</span><select id="decision-expression"><option value="choice">采用方案 A；行动范围稍后决定</option><option value="authorized">采用方案 A，并按已确认范围安排五店试点</option></select></label><button class="primary" id="record-decision" data-action="record-decision">记录本次明确表达</button><div class="item"><strong>选择</strong><p>${state.choice?pill('已记录 · D-01','ok'):'待用户决定'} · Case C-01 / 方案 A v2</p></div><div class="item"><strong>行动授权</strong><p>${state.authorized?pill('已授权 · AU-01','ok'):'尚未授权具体经营动作'}</p></div><div class="item"><strong>实际发生</strong><p>${state.feedback?'合成反馈 F-01：五店完成一批补证；不是补货已发生':'尚无执行反馈'}</p></div><div class="item"><strong>效果验证</strong><p>未知 · 观察窗口未成熟，不据选择或行动推断业绩改善</p></div><button id="load-feedback" data-action="load-feedback" ${!state.authorized?'disabled':''}>载入合成行动反馈</button><details><summary>一次维护，其他位置引用</summary><p>Case 保存 D-01 与原话、准确方案版本；GSA 引用上层试点安排；原看板保存具体行动 A-01、负责人、期限和 F-01。重复点击回读同记录，不重复采纳。</p></details></section>`;
}
function review(){
 const current=state.reviews[state.reportVersion],hasOpinion=current.status!=='unreviewed'&&Boolean(current.opinion);
 return intro('准确成果 / 模块 4','报告、审查与人的决定分开','完整报告落项目成果区；聊天看结论、依据、条件与下一步。修订不覆盖原稿。')+`<div class="grid"><section class="panel"><div class="row between"><h2>会员复购分析报告 v${state.reportVersion}</h2>${pill(current.status==='unreviewed'?'未审':state.reportVersion===1?'已审 · 需修正':'已复查 · 仍有待补依据',hasOpinion?'warn':'')}</div><p>已核窗口内群体变化；尺码缺货仍为候选解释。首购历史不足，不能据此断言完整复购率或找到根因。</p><div class="subtle"><strong>报告与摘要</strong><p>报告保留完整方法、计算及来源；聊天摘要不复制整篇报告。当前旧运营 Skill 契约的正式改造单独测评后才能生效。</p></div><dl class="facts"><dt>保存入口</dt><dd>060_reports / 会员复购分析-v${state.reportVersion}.md（合成）</dd><dt>报告依据</dt><dd>${esc(sourceText())}；项目需求 v1</dd><dt>本次 Case</dt><dd>${!caseWritingAllowed()?'无关联，不沿用其他工作范围':'Case C-01'}</dd><dt>作者自查</dt><dd>已有合成记录，仍不替代独立审查</dd><dt>审查意见</dt><dd>${hasOpinion?esc(current.opinion):'本稿暂无审查意见；不得使用其他稿件的意见作为本稿审查。'}</dd></dl><div class="actions"><button id="carry-review" data-action="carry-review" ${!hasOpinion?'disabled':''}>${!hasOpinion?'本稿暂无意见可接回':current.carried?'本稿意见已接回原 Agent':'本稿意见接回原 Agent'}</button><button id="load-revision" data-action="load-revision">载入合成修订稿 v2</button>${state.revised?'<button id="view-original" data-action="view-original">查看原稿 v1</button>':''}</div><div class="actions"><button id="review-v2" data-action="review-v2" ${state.reportVersion!==2?'disabled':''}>载入获准复查场景</button><button data-action="exact-report">查看准确报告来源</button></div><details><summary>自动接续与原稿历史</summary>${localSwitch('review','local-review')}<p>原稿 v1 审查及意见接回状态保留；切换稿件按各稿准确状态展示。原 Agent 自主核实与修正，可保留有依据的分歧；无进展时交付限制。</p></details></section>${decisionPanel()}</div>`;
}
function assets(){const choices={reuse:'完整沿用现有方法',improve:'存在实质方法改进',none:'无可复用价值'};return intro('Studio 原专业体系 / 模块 5','让方法沉淀可追溯、可纠错','IR 属于 SAP，候选保存、正式发布、实际采用与后续验证分别记录。')+`<div class="grid"><section class="panel"><div class="row between"><h2>SAP / 会员窗口核对</h2>${pill(state.methodError?'v3 已知错误 · 停止默认推荐':'v3 已发布',state.methodError?'bad':'ok')}</div><p>真实任务来源：P-01 / T1 / 报告 v${state.reportVersion}。方法引用准确发布版，个案数字和结论不固化成通用方法。</p><label class="field"><span>合成提炼判断</span><select id="ir-decision">${Object.entries(choices).map(([k,v])=>`<option value="${k}" ${state.irDecision===k?'selected':''}>${v}</option>`).join('')}</select></label><button class="primary" id="prepare-ir" data-action="prepare-ir">手动处理本次方法</button><p class="callout">手动明确操作可单独授权，无需先打开自动节点；不会调用模型。</p><div class="notice">${state.irDecision==='reuse'?'完整沿用时只关联原 v3，不新建方法或版本。':state.irDecision==='none'?'无通用价值时不生成方法；个案结论留在任务。':'实质改进先形成原方法的未发布修订候选，保留关系和来源。'}</div>${state.candidate?`<div class="subtle"><strong>修订候选 v4</strong><p>${state.published?'已在本页演示正式发布；未证明后续实际采用。':'未发布，不作为新 Task 的正式方法依据。'}</p><button id="publish-method" data-action="publish-method" ${state.published?'disabled':''}>明确发布此合成候选</button></div>`:''}<details><summary>IR 自动节点</summary>${localSwitch('ir','local-assets-ir')}<p>关闭时不经“资产沉淀”回看会话提炼。普通专业资产修订沿自身已获准任务范围办理。</p></details></section><section class="panel"><h2>纠错回到原权威</h2><p>区分当时算错、引错或推断过度，与后来业务规则发生变化。只核已知实际引用，不承诺扫描全历史。</p><div class="actions"><button id="flag-method-error" data-action="flag-method-error">载入已核实方法缺口场景</button><button id="asset-discovery" data-action="asset-discovery">整理已发现的错误线索</button></div><div class="notice warn">${state.assetFeedback?'已沿原 SAP 反馈 F-M01 记录线索；没有重新提炼 IR 或发布方法。':'已发现的方法问题可留纠错线索；缺共享资产写权时只留具体待办。'}</div><dl class="facts"><dt>原任务</dt><dd>保留旧报告与修订关系</dd><dt>固定旧引用</dt><dd>${state.methodError?'不静默升级，但必须提示已知错误并限制受影响判断':'继续准确读取适用版本，不取 latest 冒充历史'}</dd><dt>记忆治理</dt><dd>准备纠正候选；人的纠正、排除控制继续有效</dd><dt>Case / 看板</dt><dd>引用影响说明，不改写人的选择或已发生行动</dd><dt>后续复用</dt><dd>待新分析任务实际读取并避开错误依据验证</dd></dl></section></div><section class="panel"><h2>专业 Skill 契约正式对齐</h2><div class="split"><div><strong>当前旧契约</strong><p>适用六段全文与严格行动四要素，不能只改 Host 提示词即称新版生效。</p></div><div><strong>待实施契约</strong><p>诊断 / 行动计划分层，完整报告 / 聊天摘要分工；固定候选经独立测评、明确通过回执后接入。</p></div></div><details><summary>保留原资产入口</summary><p>指标与方法、IR 沿 SAP；语义和映射沿 Studio；知识经验沿记忆候选；连接与依赖在设置。每处保留原身份、权限、版本、核定和发布。</p></details></section>`;}
function settings(){const count=Object.values(state.global).filter(Boolean).length;return intro('唯一全局设置 / 模块 6、7','自动代办与能力管理','设置作用于所有任务的后续动作。当前工作仍由用户开始或明确续接。')+`<div class="grid"><section class="panel"><div class="row between"><h2>自动模式</h2>${pill(count===0?'全部关闭':count===5?'全部开启':'部分开启 · '+count+'/5',count?'ok':'')}</div><div class="switch"><label for="global-all">全部自动节点</label><input type="checkbox" id="global-all" ${count===5?'checked':''} aria-label="切换全部自动节点"></div>${Object.entries(nodes).map(([key,name])=>`<div class="switch"><label for="global-${key}">${name}<small style="display:block">${({save:'适用成果保存；明确要求报告始终须交付',review:'适用审查、原 Agent 修订及获准复查',ir:'收尾判断复用、改进或无价值；不自动发布',case:'准确关联成果、判断及待决定 / 观察事项',assets:'已发现问题沿原候选 / 反馈入口整理'})[key]}</small></label><input type="checkbox" id="global-${key}" data-global="${key}" ${state.global[key]?'checked':''}></div>`).join('')}<div class="notice">开启不补跑、不唤醒；关闭不强杀已开始动作。立即中止请用原任务“停止”。</div><p class="muted">必要报告交付、自查及所选方法检查继续有效；停止后均不以收尾为由续跑。正式发布和经营动作权限不由开关授予。</p></section><section class="panel"><h2>跨任务生效预览</h2><p class="muted">审核用：检查动作开始前的资格，不实际派发或执行。</p><label class="field"><span>当前查看任务</span><select id="probe-task">${taskOptions(state.probeTask)}</select></label><label class="field"><span>尚未开始的新增代办</span><select id="probe-node">${Object.entries(nodes).map(([k,v])=>`<option value="${k}" ${state.probeNode===k?'selected':''}>${v}</option>`).join('')}</select></label>${localSwitch('ir','probe-local-ir')}<button id="probe-action" data-action="probe-action">检查此刻是否可接续</button><div class="receipt" id="probe-result">${esc(state.probe)}</div><div class="actions"><button id="fixture-started" data-action="fixture-started">载入“动作已开始”合成场景</button></div>${state.actionStarted?'<p class="notice warn">所示动作已开始。随后关闭开关不会强杀；该状态仅作演示。</p>':''}<details><summary>操作、未知与恢复</summary><p>同一源稿同内容复用保存；新稿不套旧审查。未知先查原请求和准确文件，不换身份重放。切页、断连和一次模型回合结束不触发收尾。</p><p>当前设置修订：${state.globalRevision}（仅本页内存）。设置不作任务启动快照，动作实际开始前读当前值。</p></details></section></div><section class="panel"><h2>设置与具体能力</h2><div class="row"><button data-action="connector">连接与来源</button><button data-action="skill-info">内置 Skill 资料</button><button data-action="model-registry">模型包注册表</button>${state.market?'<button id="open-market" data-action="market">插件市场（过渡）</button>':pill('过渡市场已从预览导航退出')}</div><p class="callout">模型供应商、模型包、连接、Skill 依赖及个人资料按各自原管理归属维护。</p>${state.marketView&&state.market?market():''}<details><summary>过渡市场退出判据（审核预览）</summary><p>以下勾选仅演示最终导航，不能当真实退出证据。</p>${['已接入能力的使用、必要管理及异常入口齐全','不经市场能完成需求、分析、成果、反馈及方法积累','项目可接受、改选、排除实际可用能力','配置、授权、历史与旧准确定位仍可访问','读取、采用、审查、选择与发布状态真实'].map((label,i)=>`<label class="check"><input type="checkbox" data-exit="${i}" ${state.exit[i]?'checked':''}><span>${label}</span></label>`).join('')}<button id="exit-market" data-action="exit-market" ${state.exit.every(Boolean)?'':'disabled'}>预览满足判据后的导航</button></details></section>`;}
function market(){return `<div class="subtle"><div class="row between"><h3>插件市场（过渡）</h3>${pill('兜底目录')}</div><p class="muted">能力仍归业务和原管理入口；场景组合及其六项展示直接取消。</p><div class="tablewrap"><table><thead><tr><th>能力</th><th>日常使用</th><th>管理 / 异常</th></tr></thead><tbody><tr><td>分析 Skill</td><td><button class="link" data-go="project">项目推荐与任务使用</button></td><td>设置查看来源、版本和依赖</td></tr><tr><td>SAP / IR / 语义</td><td><button class="link" data-go="assets">Studio 原专业模块</button></td><td>原核定与发布、错误反馈</td></tr><tr><td>数据库 / 商圈 / 天气</td><td>项目资料与任务执行</td><td><button class="link" data-action="connector">连接配置 / 缺来源</button></td></tr><tr><td>需求梳理</td><td><button class="link" data-go="project">项目主入口，Task 可选</button></td><td>独立需求历史保留</td></tr><tr><td>决策看板</td><td><button class="link" data-go="review">成果与反馈</button></td><td>原行动、反馈与来源</td></tr><tr><td>PPT 生成 / 精修</td><td>项目报告成果操作</td><td>准确稿件、版本及独立会话</td></tr><tr><td>经营推演 / 模型包</td><td>方案比较 / 预测任务</td><td>原推演快照 / 注册表</td></tr><tr><td>其他既有规划</td><td>保持规划状态</td><td>未接入，不冒充可用</td></tr></tbody></table></div><div class="actions"><button id="old-locator" data-action="old-locator">打开旧报告定位（合成）</button><button id="missing-locator" data-action="missing-locator">预览无权限 / 失读</button></div>${state.oldLocator?`<p class="notice ${state.oldLocator.includes('无权限')?'warn':''}">${esc(state.oldLocator)}</p>`:''}</div>`;}
function confirm(start){const selected=state.tasks.filter(t=>state.selected[t.id]&&!t.archived);if(!selected.length){say('请至少选择一项本轮工作。');return;}if(state.planMode==='single'&&selected.length!==1){say('单 Task 模式仅选择一项本轮工作，由该任务承担综合。');return;}const summary=summaryCandidates().find(t=>t.id===state.summary);if(!summary){say('请明确项目内可用的综合责任任务。');return;}state.workScope={taskIds:selected.map(t=>t.id),summaryId:summary.id,caseId:state.noCase?null:'C-01',goalRef:currentGoalRef()};state.confirmed=true;state.started=start;selected.forEach(t=>{if(t.state==='待创建'||t.state==='已创建 · 未执行'||t.state==='已有 · 空闲')t.state=start?'已授权开始':'已创建 · 未执行';});if(start&&summary.state==='已有 · 空闲')summary.state='已授权开始';receipt(start?'演示：需求 v1 已确认；所选任务与综合责任已承接一次开始授权，无逐 Task 送入或启动。未实际执行。':'演示：需求 v1 已确认，所选任务已创建，未执行；正式 RAP 发布仍独立。');}
function probe(){const t=state.tasks.find(t=>t.id===state.probeTask),key=state.probeNode;if(state.actionStarted){state.probe='所示动作已经开始；开关关闭不强杀。结果按原操作保留。';}else if(!t||t.archived||['已停止','本轮已整理'].includes(t.state)){state.probe='不接续：任务已停止、结束或归档；开关不唤醒历史。';}else if(!['已授权开始','已明确继续'].includes(t.state)){state.probe='不接续：此任务没有当前开始 / 续接资格；不能用开关代替授权。';}else if(key==='case'&&!caseWritingAllowed()){state.probe='不接续：本次没有 Case 关联，不能写入其他 Case。';}else if(!state.global[key]){state.probe='不接续：当前全局“'+nodes[key]+'”关闭。必要交付、自查和方法检查仍有效。';}else{state.probe='当前全局节点已开启；仅在本次权限、适用性、准确来源和去重核对后可接续。此处没有执行动作。';}render();}
$('reset-demo').addEventListener('click',()=>{state=initial();$('announce').textContent='';render();});
$('mobile-nav').addEventListener('change',e=>go(e.target.value));
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.global){state.global[t.dataset.global]=t.checked;state.globalRevision++;say('已更新同一全局设置；未启动、补跑或唤醒任何任务。');render();return;}if(t.dataset.planTask){if(state.planMode==='single'&&t.checked){Object.keys(state.selected).forEach(id=>state.selected[id]=id===t.dataset.planTask);state.summary=t.dataset.planTask;}else state.selected[t.dataset.planTask]=t.checked;if(!summaryCandidates().some(task=>task.id===state.summary))state.summary=summaryCandidates()[0]?.id||'';state.confirmed=false;render();return;}if(t.dataset.method){state.methods[t.dataset.method]=t.checked;state.confirmed=false;return;}if(t.dataset.exit!==undefined){state.exit[Number(t.dataset.exit)]=t.checked;render();return;}switch(t.id){case'global-all':Object.keys(state.global).forEach(k=>state.global[k]=t.checked);state.globalRevision++;say('所有节点已更新；已开始动作不被开关强杀。');render();break;case'case-main-goal':state.caseGoal=t.value;render();break;case'case-related':state.related=t.checked;break;case'no-case':state.noCase=t.checked;state.confirmed=false;render();break;case'plan-mode':state.planMode=t.value;state.selected={T1:true,T2:t.value==='multi',T3:t.value==='multi'};state.summary=t.value==='single'?'T1':'T3';state.confirmed=false;render();break;case'summary-task':state.summary=t.value;state.confirmed=false;break;case'synthesis-scenario':state.synthesis=t.value;render();break;case'ir-decision':state.irDecision=t.value;state.candidate=false;state.published=false;render();break;case'probe-task':state.probeTask=t.value;state.actionStarted=false;state.probe='尚未检查；动作开始前读取当前值。';render();break;case'probe-node':state.probeNode=t.value;state.actionStarted=false;render();break;}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='add-task-form'){const name=$('new-task-name').value.trim(),detail=$('new-task-requirement').value.trim();if(!name)return;const id='T'+(state.tasks.length+1);state.tasks.push({id,name,state:'已创建 · 未执行',archived:false,detail});state.selected[id]=false;receipt('已在本页新增 '+id+'，沿用项目需求'+(detail?'并带入可选局部说明':'')+'；未执行。');}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.level){state.goalLevel=b.dataset.level;render();return;}if(b.dataset.viewTask){state.activeTask=b.dataset.viewTask;go('analysis');return;}if(b.dataset.taskAction){const t=state.tasks.find(t=>t.id===b.dataset.task);if(!t)return;if(b.dataset.taskAction==='archive'&&taskOccupied(t)){say('先停止并处理当前占用，再归档。');return;}t.archived=b.dataset.taskAction==='archive';receipt(t.archived?'任务身份、会话和成果保留；归档不表示经营目标已完成。':'已恢复原任务；未自动执行。');return;}
 const a=b.dataset.action;switch(a){case'dismiss':$('announce').textContent='';break;case'prepare-goal':state.goalCandidateOpen=true;render();$('goal-candidate-panel').focus();break;case'close-goal-candidate':state.goalCandidateOpen=false;render();$('prepare-goal').focus();break;case'confirm-new-goal':if(!state.customGoal){state.goalHistory.push({name:state.caseGoal,ref:currentGoalRef()});state.customGoal={id:'G-03',version:1,name:'建立适用会员群体复购基线'};state.caseGoal=state.customGoal.name;state.confirmed=false;receipt('合成目标 G-03 v1 已确认用于当前事项；Case 与项目引用同一目标，旧目标与历史引用保留。');$('goal-candidate-panel').focus();}break;case'goal-version':state.goalVersion++;receipt('目标条件已换为合成 v'+state.goalVersion+'；进行中引用待核，旧报告和决定不回写。');break;case'confirm-create':confirm(false);break;case'confirm-start':confirm(true);break;case'stop-task':{const t=state.tasks.find(t=>t.id===state.activeTask);t.state='已停止';receipt('已载入停止界面；不继续后续自动动作、不触发 IR 收尾提炼，已有成果保留。');break;}case'resume-task':{const t=state.tasks.find(t=>t.id===state.activeTask);if(!t||t.archived||t.state!=='已停止'){say('仅可明确续接未归档的已停止任务。');break;}t.state='已明确继续';receipt('演示：核对原状态后明确续接，任务继续保持占用，须停止并收尾后才能归档；未重放旧操作。');break;}case'normal-finish':{const t=state.tasks.find(t=>t.id===state.activeTask);t.state='本轮已整理';receipt('已载入“结束本轮并整理”合成场景：有依据部分和未解决缺口一并交付；不冒充完整项目完成。');break;}case'carry-review':{const r=state.reviews[state.reportVersion];if(!r||r.status==='unreviewed'||!r.opinion){say('本稿暂无审查意见，不能沿用其他稿件意见接回状态。');break;}r.carried=true;receipt('已接回原 '+effectiveWork().summaryId+'：报告 v'+state.reportVersion+' 的准确意见；重复点击引用原意见，不搬运第二份。');break;}case'load-revision':state.revised=true;state.reportVersion=2;receipt('已载入合成新稿 v2，原 v1 保留；v1 审查状态不继承到新版。');break;case'view-original':state.reportVersion=1;render();break;case'review-v2':if(state.reportVersion!==2){say('请先选择准确 v2 稿件。');break;}state.reviews[2].status='reviewed';state.reviews[2].opinion='受影响口径已收窄；供应与效果依据仍待补。';receipt('合成复查仅覆盖 v2 受影响口径；意见接回状态独立于 v1。');break;case'exact-report':say('准确定位：项目 P-01 / 报告 v'+state.reportVersion+'；这是合成来源，无实际文件下载。');break;case'record-decision':{if(!caseWritingAllowed()){say('本次没有 Case 关联，拒绝写入 Case 选择或行动授权。');break;}const expression=$('decision-expression').value,was=state.choice;state.choice='采用方案 A';if(expression==='authorized')state.authorized=true;receipt(was?'已回读 D-01；准确方案和来源不重复保存，新增授权仅按本次明确表达记录。':'演示：Case 记录准确选择 D-01，GSA 与原看板引用；未推断实际经营动作或效果。');break;}case'load-feedback':if(!caseWritingAllowed()||!state.authorized){say('本次无准确 Case 关联或行动授权，不能载入该 Case 的行动反馈。');break;}state.feedback=true;receipt('已载入原看板合成反馈 F-01；Case / GSA 引用，效果仍待成熟观察。');break;case'prepare-ir':if(state.irDecision==='reuse'){receipt('关联已用 SAP v3；完整沿用，无新方法和版本。');}else if(state.irDecision==='none'){receipt('无可复用价值，不生成方法。');}else{state.candidate=true;receipt('演示修订候选 v4 已准备，来源与原 v3 关系保留；尚未发布。');}break;case'publish-method':state.published=true;receipt('已在本页明确发布合成 v4；旧固定引用不静默升级，新任务实际采用待验证。');break;case'flag-method-error':state.methodError=true;receipt('合成已核实缺口：SAP v3 提示错误并停止默认推荐；纠正版仍待正式发布。');break;case'asset-discovery':state.assetFeedback=true;receipt(state.global.ir?'已发现的问题沿原反馈入口整理，候选 / 发布仍分开。':'IR 关闭：仅记录已发现错误线索；不回看会话、不另建方法或修订候选。');break;case'probe-action':probe();break;case'fixture-started':state.actionStarted=true;state.probe='已载入动作已开始的合成场景；关闭开关不强杀。';render();break;case'market':state.marketView=!state.marketView;render();break;case'exit-market':if(state.exit.every(Boolean)){state.market=false;state.marketView=false;receipt('仅预览满足全部判据后的导航；真实退出仍须逐条有证据。');}break;case'old-locator':state.oldLocator='旧定位精确返回 P-01 / 报告 v1；不跳到最新稿，不继承 v2 状态。';render();break;case'missing-locator':state.oldLocator='无权限或失读：保留原准确引用，说明需核来源 / 权限；不改跳最新稿、不要求重新导入。';render();break;case'connector':say('配置入口：设置 / 连接与来源；项目范围与模型出口独立授权，连通不等于已获准读取。');break;case'skill-info':say('内置 Skill 随产品版本维护，查看来源、版本、依赖与实际可用性；不要求重新安装。');break;case'model-registry':say('模型包沿原注册表及版本；与大语言模型供应商配置分开，未新增训练平台。');break;}
});
render();
</script>
