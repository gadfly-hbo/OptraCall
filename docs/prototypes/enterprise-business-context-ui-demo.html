function renderDetail(){const origin=doc(detail.id),r=revision(origin,detail.v),d={...origin,...(r.meta||{})};$('#detailTitle').textContent=d.title;$('#detailSubtitle').textContent=`${d.kind} · ${d.stopped?'已停用，历史引用仍可读':r.state==='draft'?'工作草稿，尚未启用':'来源资料，按适用条件使用'}`;const isDraft=r.state==='draft';$('#detailBody').innerHTML=`<div class="detail-top"><label>查看修订<select id="revisionSelect">${[...d.revs].reverse().map(x=>`<option value="${x.v}" ${x.v===r.v?'selected':''}>修订 ${x.v} · ${versionName(x)}</option>`).join('')}</select></label><div class="button-row">${detail.readOnly?badge('只读浏览'):!d.unreadable?btn('新建修订','edit-doc',`data-id="${d.id}" data-v="${r.v}"`,'small'):''}${detail.readOnly?'':isDraft?btn('启用此修订','enable-doc',`data-id="${d.id}" data-v="${r.v}"`,'primary small'):d.stopped?btn('重新启用','resume-doc',`data-id="${d.id}"`,'small'):d.active!==null?btn('停用资料','stop-doc',`data-id="${d.id}"`,'small'):''}</div></div><dl class="meta-grid"><dt>来源</dt><dd>${esc(d.source||'来源待补')}</dd><dt>适用范围</dt><dd>${esc(d.scope||'未填写，使用前需判断')}</dd><dt>维护人</dt><dd>${esc(d.owner||'未填写')}</dd><dt>本版时间</dt><dd>${esc(r.date)} · 合成记录</dd><dt>选用性质</dt><dd>启用不代表内容已核实；例外与未知保留原义。</dd></dl><div class="detail-tabs" aria-label="资料内容"><button data-action="detail-tab" data-tab="body" aria-pressed="${detail.tab==='body'}">正文</button><button data-action="detail-tab" data-tab="history" aria-pressed="${detail.tab==='history'}">修订与引用</button></div>${detail.tab==='body'?d.unreadable?`<div class="info-note warning">这里只登记了合成文件来源，正文尚不可读。不会将文件登记标记成已提供全文。</div><div class="body-paper prose">历史渠道合同.pdf\n文件引用示例 · 未读取真实磁盘文件</div>`:`${isDraft?'<div class="info-note">草稿仅供维护预览；点击“启用此修订”后才可供本页新引用。</div>':''}<div class="body-paper prose">${esc(r.body)}</div>${d.sap?`<div class="divider"></div><h3>相关指标</h3><p class="source-description">${esc(d.sap)} ${badge('SAP 原发布物')}</p><button class="inline-link" data-action="sap">查看指标引用说明</button>`:''}`:`<h3>修订历史</h3>${[...d.revs].reverse().map(x=>`<div class="history-row"><span function clearFieldError(input){const form=input.form;if(!form)return;const errorId=form.id+'-'+input.name+'-error';input.removeAttribute('aria-invalid');const description=(input.getAttribute('aria-describedby')||'').split(/\s+/).filter(id=>id&&id!==errorId);if(description.length)input.setAttribute('aria-describedby',description.join(' '));else input.removeAttribute('aria-describedby');const error=document.getElementById(errorId);if(error)error.textContent='';if(!form.querySelector('[aria-invalid="true"]')){const summary=document.getElementById(form.id+'Error');if(summary)summary.textContent='';}}
function validateTextFields(form,fields,summaryId){let first;for(const [name,message]of fields){const input=form.elements.namedItem(name);clearFieldError(input);if(input.value.trim())continue;const errorId=form.id+'-'+name+'-error';document.getElementById(errorId).textContent=message;input.setAttribute('aria-invalid','true');const described=(input.getAttribute('aria-describedby')||'').split(/\s+/).filter(Boolean);input.setAttribute('aria-describedby',[...new Set([...described,errorId])].join(' '));if(!first)first=input;}if(first){document.getElementById(summaryId).textContent='请检查标出的必填内容，其余信息可以留空。';first.focus();return false;}return true;}
function saveDoc(form){const f=new FormData(form),title=String(f.get('title')).trim(),body=String(f.get('body')).trim();if(!validateTextFields(form,[['title','请填写标题，不能只包含空格。'],['body','请填写正文，不能只包含空格。']],'docFormError'))return;const values={title,kind:String(f.get('kind')),scope:String(f.get('scope')).trim(),source:String(f.get('source')).trim(),owner:String(f.get('owner')).trim()};let d=editor.id?doc(editor.id):null;if(d){const next=Math.max(...d.revs.map(x=>x.v))+1;d.revs.forEach(x=>{if(!x.meta)x.meta={title:d.title,kind:d.kind,scope:d.scope,source:d.source,owner:d.owner};});d.revs.push({v:next,state:'draft',date:'2026-10-31',body,meta:values});detail={id:d.id,v:next,tab:'body'};}else{d={...values,id:'demo-'+(state.docs.length+1),active:null,stopped:false,revs:[{v:1,state:'draft',date:'2026-10-31',body}]};state.docs.unshift(d);detail={id:d.id,v:1,tab:'body'};}$('#editDialog').close();render();if($('#detailDialog').open)renderDetail();else openDoc(d.id,detail.v);notify('已保存本页草稿。明确启用后，才能成为新引用的候选资料。');}

function sapInfo(history=false){openInfo(history?'历史 SAP 引用':'指标体系 · 已有功能入口',history?'只读展示历史指标来源，不复制原定义。':'真实产品已有指标体系；本页仅演示目录位置与只读说明，未接入后台。',`<div class="tag-row">${badge('SAP 0.2')}${badge(history?'retail-metrics@1.1.0':'retail-metrics@1.2.0','accent')}</div><h3>净收款</h3><p class="source-description">指标定义、粒度与口径由 SAP 原发布物维护。企业业务资料提供制度和数据背景；本页仅演示引用关系，不代表已读取或验证真实 SAP。</p><div class="info-note" style="margin-top:16px">当前任务初始化索引和历史报告引用可以不同。公共资料或 SAP 发布新版，不自动重建任务、替换历史依据或改变模型。</div><div class="divider"></div><h3>RAP 的位置</h3><p class="source-description">本次问题、范围、事实、假设和待确认项继续由 RAP 承载。本例未选择 RAP，可直接开始分析；不在企业资料里复制需求实例。</p>`);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='navigate')navigate(el.dataset.view);else if(a==='mobile-nav')showDialog('mobileDialog');else if(a==='close-dialog')el.closest('dialog').close();else if(a==='theme'){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#themeButton').setAttribute('aria-label',dark?'切换为浅色主题':'切换为深色主题');$('#themeButton').innerHTML=icon(dark?'sun':'moon');}else if(a==='state')stateInfo();else if(a==='reset'){openInfo('重置本页示例','清除本页内存中的演示修改，恢复预置合成内容。',`<p class="prose">会重置资料草稿、Case 引用、本案补充、模拟消息和采用状态；不涉及真实项目或文件。</p><div class="dialog-footer">${btn('保留当前演示','close-dialog')}${btn('重置示例','confirm-reset','','primary')}</div>`);}else if(a==='confirm-reset'){state=structuredClone(initial);search='';catalogSearch='';kind='全部类别';status='全部状态';document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();notify('已重置本页合成示例。');}else if(a==='clear-filter'){search='';kind='全部类别';status='全部状态';render();}else if(a==='clear-catalog-search'){catalogSearch='';render();}else if(a==='capability-open')openCapability(el.dataset.id);else if(a==='new-doc')docForm();else if(a==='open-doc')openDoc(el.dataset.id,el.dataset.v);else if(a==='catalog-doc')openDoc(el.dataset.id,el.dataset.v,true);else if(a==='edit-doc')docForm(el.dataset.id,Number(el.dataset.v));else if(a==='detail-tab'){detail.tab=el.dataset.tab;renderDetail();}else if(a==='open-revision'){detail.v=Number(el.dataset.v);detail.tab='body';renderDetail();}else if(a==='enable-doc'){const d=doc(el.dataset.id),r=revision(d,el.dataset.v);d.revs.forEach(x=>{if(x.state==='enabled')x.state='history';});r.state='enabled';d.active=r.v;if(r.meta)Object.assign(d,r.meta);d.stopped=false;renderDetail();render();notify(`已在本页启用“${d.title}”修订 ${r.v}；Case 和历史报告保持原引用。`);}else if(a==='stop-doc'){const d=doc(el.dataset.id);d.stopped=true;Object.keys(state.choices).filter(k=>k.startsWith(d.id+'@')).forEach(k=>state.choices[k]=false);renderDetail();render();notify('已在本页停用资料。历史与已有 Case 引用保留，不再供新选择。');}else if(a==='resume-doc'){const d=doc(el.dataset.id);d.stopped=false;renderDetail();render();notify('已在本页重新启用原修订，未改变既有引用。');}else if(a==='pick-case')showPicker('case');else if(a==='pick-task')showPicker('task');else if(a==='remove-ref'){state.refs=state.refs.filter(r=>r.id!==el.dataset.id);render();notify('已取消当前 Case 的关联；公共资料和历史记录未删除。');}else if(a==='new-note')noteForm();else if(a==='edit-note')noteForm(el.dataset.id);else if(a==='file-preview'){const n=state.notes.find(x=>x.id===el.dataset.id);openInfo('本案附件 · 合成内容',n.file,`<div class="body-paper prose">这是预置演示附件。\n\n本次活动的实际结算承担方、补贴是否计入实付，尚需核对真实合同和业务确认。\n\n没有读取任何真实文件。</div>`);}else if(a==='clear-choices'){candidates().forEach(x=>state.choices[x.key]=false);render();notify('已取消本轮候选材料，仍可直接模拟发送。');}else if(a==='show-receipt')receiptInfo(el.dataset.i);else if(a==='history-from-detail'){$('#detailDialog').close();navigate('history');}else if(a==='adopt-report'){state.adopted=true;render();notify('仅在本页模拟用户采用报告，不表示专业正确或业务执行。');}else if(a==='requirements')requirementsInfo();else if(a==='sap')sapInfo();else if(a==='sap-history')sapInfo(true);else if(a==='scenario')openInfo('场景组合：可选的材料与能力引用','场景帮助找到相关资产，Agent 仍自主选择分析路线。',`<h3>经营复盘 · 规划示例</h3><ul class="state-list"><li>企业业务资料：企业背景、结算说明、数据字典。</li><li>SAP：本次选择的精确指标版本。</li><li>工具与 skill：按实际问题及授权使用。</li></ul><div class="info-note">组合只提供候选引用，不复制基础资料，不规定必须经过的分析步骤。本页没有接入场景运行功能。</div>`);if(view==='library'&&$('#docList'))renderDocList();});
document.addEventListener('input',e=>{if(e.target.getAttribute('aria-invalid')==='true'&&e.target.value.trim())clearFieldError(e.target);if(e.target.id==='searchInput'){search=e.target.value;renderDocList();}if(e.target.id==='catalogSearchInput'){catalogSearch=e.target.value;renderCategoryCards();}if(e.target.id==='taskDraft')state.draft=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='kindFilter'){kind=e.target.value;renderDocList();}else if(e.target.id==='statusFilter'){status=e.target.value;renderDocList();}else if(e.target.id==='revisionSelect'){detail.v=Number(e.target.value);renderDetail();}else if(e.target.dataset.choice){state.choices[e.target.dataset.choice]=e.target.checked;const n=candidates().filter(x=>state.choices[x.key]&&!x.stopped).length;$('#selectedCount').textContent=n;$('#selectedHint').textContent=n?'可在发送后的本轮回执查看实际模拟内容。':'未选择资料，仍可发送；不替你补造前提。';}});
document.addEventListener('submit',e=>{if(e.target.id==='docForm'){e.preventDefault();saveDoc(e.target);}else if(e.target.id==='noteForm'){e.preventDefault();saveNote(e.target);}else if(e.target.id==='pickerForm'){e.preventDefault();savePicker(e.target);}else if(e.target.id==='messageForm'){e.preventDefault();sendMessage();}});
const baseRender=render;render=function(){baseRender();if(view==='library')renderDocList();};
decorate();render();
</script>
</body>
</html>
