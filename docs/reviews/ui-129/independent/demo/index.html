<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f5fa" />
  <title>OptraCall · 前端视觉改版可点击 Demo（独立设计方案）</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23f4f1ff'/%3E%3Ccircle cx='23' cy='23' r='15' fill='none' stroke='%236550c9' stroke-width='4'/%3E%3Ccircle cx='35' cy='35' r='7' fill='%23f4f1ff' stroke='%236550c9' stroke-width='4'/%3E%3C/svg%3E" />
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* ===== OptraCall Design Tokens (Layered Workspace · Preserving #6550c9 Brand Purple) ===== */
    .app {
      --bg-canvas: #f6f5fa;
      --bg-sidebar: #f0eff6;
      --bg-surface: #ffffff;
      --bg-subtle: #f3f2f8;
      --bg-hover: #eae8f3;
      --ink-primary: #1f1e28;
      --ink-secondary: #585668;
      --ink-muted: #767486;
      --border-subtle: rgba(31, 30, 40, 0.08);
      --border-default: #e2e0ec;
      --border-strong: #cecbe0;
      /* Original OptraCall Brand Purple */
      --accent: #6550c9;
      --accent-hover: #523db3;
      --accent-soft: #eeebfb;
      --accent-wash: #f6f4fe;
      --focus: #a397e0;
      /* Semantic Status Tokens (Decoupled from Brand Purple) */
      --success: #1d6f49;
      --success-bg: #eaf7f0;
      --success-border: #bfe4d1;
      --warning: #8f560a;
      --warning-bg: #fff6e5;
      --warning-border: #f1d8a3;
      --error: #b32436;
      --error-bg: #fff1f2;
      --error-border: #f5c6cc;
      --info: #2254a8;
      --info-bg: #edf4ff;
      --info-border: #c5dafc;
      /* Elevation & Radii */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 999px;
      --shadow-xs: 0 1px 2px rgba(24, 18, 46, 0.04);
      --shadow-sm: 0 2px 8px rgba(24, 18, 46, 0.05), 0 1px 2px rgba(24, 18, 46, 0.03);
      --shadow-md: 0 12px 32px rgba(24, 18, 46, 0.10), 0 2px 6px rgba(24, 18, 46, 0.04);
      --shadow-drawer: -12px 0 36px rgba(24, 18, 46, 0.12);

      display: flex;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-canvas);
      color: var(--ink-primary);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .app[data-theme="dark"] {
      color-scheme: dark;
      --bg-canvas: #17161e;
      --bg-sidebar: #131219;
      --bg-surface: #201f2a;
      --bg-subtle: #272533;
      --bg-hover: #302e3f;
      --ink-primary: #efeff5;
      --ink-secondary: #b7b5c6;
      --ink-muted: #9390a6;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-default: #333143;
      --border-strong: #46435b;
      --accent: #b7a7ff;
      --accent-hover: #c9bdff;
      --accent-soft: #2e274b;
      --accent-wash: #25203b;
      --focus: #c4b7ff;
      --success: #7bdba8;
      --success-bg: #183024;
      --success-border: #28523d;
      --warning: #f1c77d;
      --warning-bg: #332714;
      --warning-border: #594320;
      --error: #ff9fa9;
      --error-bg: #381e24;
      --error-border: #5f313b;
      --info: #8bb8ff;
      --info-bg: #1a2942;
      --info-border: #2c4670;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.28);
      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.32);
      --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.48);
      --shadow-drawer: -12px 0 40px rgba(0, 0, 0, 0.5);
    }

    /* ===== Original OptraCall Logo ===== */
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
    .brand strong { display: block; font-size: 17px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.2; }
    .brand span.brand-sub { display: block; margin-top: 2px; font-size: 11px; color: var(--ink-muted); }
    .brand-mark { width: 32px; height: 32px; display: inline-flex; position: relative; color: var(--accent); flex-shrink: 0; }
    .brand-mark .bm-outer { position: absolute; inset: 2px; border: 2.5px solid currentColor; border-radius: 50%; }
    .brand-mark .bm-inner { position: absolute; width: 12px; height: 12px; right: 0; bottom: 0; border: 2.5px solid currentColor; border-radius: 50%; background: var(--bg-sidebar); }
    .brand-mark.on-surface .bm-inner { background: var(--bg-surface); }
    .brand-mark.xs { width: 22px; height: 22px; }
    .brand-mark.xs .bm-outer { inset: 1.5px; border-width: 2px; }
    .brand-mark.xs .bm-inner { width: 8.5px; height: 8.5px; border-width: 2px; }

    /* ===== Shell: Sidebar + Topbar + Main ===== */
    .sidebar-backdrop { display: none; }
    .sidebar {
      width: 252px;
      flex: 0 0 252px;
      display: flex;
      flex-direction: column;
      padding: 18px 12px 12px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-default);
      min-height: 0;
      z-index: 30;
    }
    .sidebar.collapsed { display: none; }
    .new-project-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 38px;
      padding: 0 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-size: 13px;
      font-weight: 550;
      box-shadow: var(--shadow-xs);
      transition: border-color 140ms, background 140ms;
    }
    .new-project-btn:hover { border-color: var(--focus); background: var(--accent-wash); color: var(--accent); }
    .new-project-btn .plus-ic { color: var(--accent); font-size: 16px; line-height: 1; }

    .sidebar-section-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 10px;
      margin-top: 8px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-align: left;
    }
    .sidebar-section-btn:hover { background: var(--bg-hover); color: var(--ink-secondary); }
    .primary-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 35px;
      padding: 0 10px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 450;
      text-align: left;
      transition: background 120ms, color 120ms;
    }
    .nav-item svg { flex-shrink: 0; opacity: 0.82; }
    .nav-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
    .nav-item.selected {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-item.selected::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
    }
    .nav-item.selected svg { opacity: 1; }

    .sidebar-scroll { flex: 1; min-height: 60px; overflow-y: auto; padding-bottom: 8px; scrollbar-width: thin; }
    .proj-tree { list-style: none; margin: 2px 0 0; padding: 0; }
    .proj-row {
      display: flex;
      align-items: center;
      gap: 2px;
      border-radius: var(--radius-sm);
      padding: 2px 4px;
    }
    .proj-row:hover { background: var(--bg-hover); }
    .proj-row.active-proj { background: var(--bg-hover); }
    .proj-chevron {
      width: 20px; height: 26px; border: 0; background: transparent; color: var(--ink-muted);
      display: grid; place-items: center; border-radius: 4px; flex-shrink: 0; font-size: 12px;
    }
    .proj-name-btn {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
      border: 0; background: transparent; padding: 5px 4px; text-align: left;
      font-size: 13px; font-weight: 500; color: var(--ink-primary);
    }
    .proj-name-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj-quick-add {
      width: 24px; height: 24px; border: 0; background: transparent; color: var(--ink-muted);
      border-radius: 4px; display: grid; place-items: center; opacity: 0.65; flex-shrink: 0;
    }
    .proj-row:hover .proj-quick-add { opacity: 1; }
    .proj-quick-add:hover { background: var(--bg-surface); color: var(--accent); }
    .task-sublist { list-style: none; margin: 1px 0 6px; padding: 0 0 0 22px; }
    .task-sublist button {
      display: flex; align-items: center; gap: 7px; width: 100%;
      padding: 5px 9px; border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-secondary); font-size: 12.5px; text-align: left;
    }
    .task-sublist button:hover { background: var(--bg-hover); color: var(--ink-primary); }
    .task-sublist button.active { background: var(--bg-surface); color: var(--accent); font-weight: 550; box-shadow: var(--shadow-xs); }
    .task-sublist .t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; box-shadow: 0 0 0 3px var(--accent-soft); }
    .mini-tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--bg-subtle); color: var(--ink-muted); flex-shrink: 0; }

    .sidebar-bottom {
      display: flex; align-items: center; gap: 6px;
      padding-top: 10px; margin-top: 6px;
      border-top: 1px solid var(--border-default);
    }
    .sidebar-bottom .nav-item { flex: 1; height: 34px; }
    .configured-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); margin-left: auto; }
    .locale-pill {
      height: 28px; padding: 0 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-default); background: transparent;
      color: var(--ink-muted); font-size: 11px; font-weight: 500;
    }

    /* Main Column */
    .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-left { flex: 1; }
    .topbar-crumb {
      font-size: 13px;
      color: var(--ink-secondary);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-crumb strong { color: var(--ink-primary); font-weight: 600; }

    .workspace-switch {
      display: inline-flex;
      padding: 3px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      flex-shrink: 0;
    }
    .workspace-switch button {
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      padding: 4px 20px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      transition: background 140ms, color 140ms;
    }
    .workspace-switch button[aria-pressed="true"] {
      background: var(--bg-surface);
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--shadow-xs);
    }

    .icon-btn {
      width: 32px; height: 32px; border: 1px solid transparent; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-secondary);
      display: inline-grid; place-items: center; flex-shrink: 0;
      transition: background 120ms, color 120ms, border-color 120ms;
    }
    .icon-btn:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .icon-btn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
    .help-btn {
      display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px;
      border: 1px solid transparent; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-secondary); font-size: 12.5px; font-weight: 500;
      white-space: nowrap;
    }
    .help-btn:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .help-btn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }

    /* ===== Shared Components ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 13px; border-radius: var(--radius-sm);
      font-size: 12.5px; font-weight: 550; white-space: nowrap;
      border: 1px solid transparent; transition: all 130ms;
    }
    .btn-sm { height: 29px; padding: 0 10px; font-size: 12px; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow-xs); }
    .app[data-theme="dark"] .btn-primary { color: #161422; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-secondary { background: var(--bg-surface); color: var(--ink-primary); border-color: var(--border-default); box-shadow: var(--shadow-xs); }
    .btn-secondary:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
    .btn-danger { background: var(--error-bg); color: var(--error); border-color: var(--error-border); }
    .btn-danger:hover { filter: brightness(0.96); }
    .btn-ghost { background: transparent; color: var(--accent); padding: 0 6px; height: 28px; font-size: 12px; font-weight: 550; }
    .btn-ghost:hover { background: var(--accent-soft); }
    .btn-ghost-muted { background: transparent; color: var(--ink-secondary); padding: 0 8px; height: 28px; font-size: 12px; }
    .btn-ghost-muted:hover { background: var(--bg-hover); color: var(--ink-primary); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 550; line-height: 1.5; white-space: nowrap;
      background: var(--bg-subtle); color: var(--ink-secondary); border: 1px solid var(--border-default);
    }
    .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .badge.success { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
    .badge.warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning-border); }
    .badge.error { background: var(--error-bg); color: var(--error); border-color: var(--error-border); }
    .badge.info { background: var(--info-bg); color: var(--info); border-color: var(--info-border); }

    .mono { font-family: var(--font-mono); font-size: 11.5px; }
    .mono-pill {
      font-family: var(--font-mono); font-size: 11px; padding: 1px 6px;
      border-radius: 4px; background: var(--bg-subtle); color: var(--ink-secondary);
      border: 1px solid var(--border-subtle);
    }
    .num { font-variant-numeric: tabular-nums; }

    /* Page Container */
    .workspace-body { flex: 1; min-height: 0; display: flex; overflow: hidden; position: relative; }
    .page-scroll { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 24px 28px 40px; }
    .page-inner { max-width: 1240px; margin: 0 auto; }

    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .page-header .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 4px;
    }
    .page-header h1 {
      margin: 0 0 4px; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.3;
    }
    .page-header p.sub { margin: 0; font-size: 13px; color: var(--ink-secondary); max-width: 680px; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

    /* Unified Underline Tabs */
    .underline-tabs {
      display: flex; gap: 6px; border-bottom: 1px solid var(--border-default);
      margin-bottom: 20px; overflow-x: auto; scrollbar-width: none;
    }
    .underline-tabs button {
      position: relative; border: 0; background: transparent; color: var(--ink-secondary);
      padding: 9px 12px 11px; font-size: 13px; font-weight: 500; white-space: nowrap;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: color 120ms, background 120ms;
    }
    .underline-tabs button:hover { color: var(--ink-primary); background: var(--bg-subtle); }
    .underline-tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
    .underline-tabs button[aria-current="page"]::after {
      content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px;
      border-radius: 2px 2px 0 0; background: var(--accent);
    }
    .tab-count {
      margin-left: 5px; font-size: 11px; padding: 0 6px; border-radius: 99px;
      background: var(--bg-subtle); color: var(--ink-muted); font-variant-numeric: tabular-nums;
    }
    .underline-tabs button[aria-current="page"] .tab-count { background: var(--accent-soft); color: var(--accent); }

    /* Cards & Surfaces */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
      padding: 18px 20px;
    }
    .card + .card { margin-top: 14px; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; font-size: 15px; font-weight: 620; line-height: 1.4; }
    .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .card-meta { font-size: 12px; color: var(--ink-muted); margin: 3px 0 0; }

    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 11px 14px; border-radius: var(--radius-md); font-size: 12.5px; margin-bottom: 16px;
      background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--border-default));
      color: var(--ink-primary);
    }
    .banner.success { background: var(--success-bg); border-color: var(--success-border); color: var(--success); }
    .banner.warning { background: var(--warning-bg); border-color: var(--warning-border); color: var(--warning); }

    /* Filter Toolbar */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      flex-wrap: wrap; margin-bottom: 16px;
    }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .input, .select {
      height: 34px; padding: 0 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--ink-primary);
      font-size: 12.5px;
    }
    .input { min-width: 210px; }
    .seg-switch {
      display: inline-flex; padding: 2px; border-radius: var(--radius-sm);
      background: var(--bg-subtle); border: 1px solid var(--border-default);
    }
    .seg-switch button {
      border: 0; background: transparent; color: var(--ink-secondary);
      padding: 4px 11px; border-radius: 4px; font-size: 12px; font-weight: 500;
    }
    .seg-switch button[aria-pressed="true"] {
      background: var(--bg-surface); color: var(--accent); font-weight: 600; box-shadow: var(--shadow-xs);
    }

    /* Data Tables */
    .table-card {
      background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs);
    }
    .table-scroll { overflow-x: auto; }
    table.ui-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.ui-table th {
      text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-muted);
      background: var(--bg-subtle); padding: 10px 14px; border-bottom: 1px solid var(--border-default);
      white-space: nowrap;
    }
    table.ui-table td {
      padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); vertical-align: top;
      color: var(--ink-primary);
    }
    table.ui-table tbody tr:last-child td { border-bottom: 0; }
    table.ui-table tbody tr:hover td { background: var(--accent-wash); }
    table.ui-table tbody tr.selected td { background: var(--accent-soft); }

    /* ===== Page Specific: Project Map & Case Board ===== */
    .card-grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .proj-card {
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md);
      padding: 16px 18px; display: flex; flex-direction: column; gap: 11px; box-shadow: var(--shadow-xs);
      transition: border-color 140ms, box-shadow 140ms;
    }
    .proj-card:hover { border-color: var(--focus); box-shadow: var(--shadow-sm); }
    .proj-card h2 { margin: 0; font-size: 15px; font-weight: 620; }
    .proj-card h2 button { border: 0; background: transparent; padding: 0; text-align: left; font: inherit; color: inherit; }
    .proj-card h2 button:hover { color: var(--accent); }
    .slot-box { background: var(--bg-subtle); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 12px; color: var(--ink-secondary); }
    .slot-label { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-muted); margin-bottom: 3px; }
    .task-pill-list { display: flex; flex-direction: column; gap: 6px; }
    .task-link-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-default); background: var(--bg-surface);
      font-size: 12.5px; font-weight: 500; text-align: left; transition: all 120ms;
    }
    .task-link-btn:hover { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
    .card-foot {
      margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--ink-muted);
    }

    /* Star Map Canvas */
    .starmap-shell {
      background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs);
    }
    .starmap-stats {
      display: flex; flex-wrap: wrap; gap: 18px; padding: 11px 16px;
      border-bottom: 1px solid var(--border-default); background: var(--bg-subtle);
      font-size: 12px; color: var(--ink-secondary);
    }
    .starmap-stats strong { color: var(--ink-primary); font-size: 14px; margin-right: 4px; font-variant-numeric: tabular-nums; }
    .starmap-viewport {
      position: relative; height: 420px; overflow: hidden;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .starmap-canvas { position: relative; width: 1040px; height: 420px; transform-origin: 0 0; transition: transform 180ms ease; }
    .starmap-svg { position: absolute; inset: 0; pointer-events: none; }
    .sm-node {
      position: absolute; background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm); width: 228px;
      overflow: hidden; transition: border-color 140ms, opacity 160ms, box-shadow 140ms;
    }
    .sm-node:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
    .sm-node.dim { opacity: 0.34; }
    .sm-node-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; font-size: 10.5px; font-weight: 650; letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border-subtle);
    }
    .sm-node.case .sm-node-head { background: var(--accent-soft); color: var(--accent); }
    .sm-node.project .sm-node-head { background: var(--info-bg); color: var(--info); }
    .sm-node.task .sm-node-head { background: var(--success-bg); color: var(--success); }
    .sm-node-body { display: block; width: 100%; border: 0; background: transparent; padding: 9px 11px; text-align: left; }
    .sm-node-body strong { display: block; font-size: 13px; font-weight: 600; color: var(--ink-primary); margin-bottom: 3px; }
    .sm-node-body span { display: block; font-size: 11.5px; color: var(--ink-secondary); line-height: 1.45; }
    .sm-node-foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 10px; border-top: 1px solid var(--border-subtle); background: var(--bg-subtle);
      font-size: 11px; color: var(--ink-muted);
    }
    .sm-node-foot button { border: 0; background: transparent; color: var(--accent); font-size: 11px; font-weight: 550; padding: 2px 4px; border-radius: 4px; }
    .sm-node-foot button:hover { background: var(--accent-soft); }
    .sm-controls {
      position: absolute; right: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 4px;
      padding: 4px; border-radius: var(--radius-sm); background: var(--bg-surface);
      border: 1px solid var(--border-default); box-shadow: var(--shadow-sm); font-size: 12px;
    }
    .sm-controls button { border: 0; background: transparent; padding: 4px 8px; border-radius: 4px; color: var(--ink-secondary); }
    .sm-controls button:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .sm-legend {
      display: flex; flex-wrap: wrap; gap: 14px; padding: 9px 16px;
      border-top: 1px solid var(--border-default); font-size: 11.5px; color: var(--ink-muted);
    }
    .case-lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .case-lane { background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px; }
    .case-lane-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; font-weight: 600; }

    /* ===== Page Specific: Analysis Task ===== */
    .task-shell { flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden; }
    .task-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .task-header-band {
      padding: 14px 24px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      flex-shrink: 0;
    }
    .task-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .task-header-top h1 { margin: 0; font-size: 17px; font-weight: 650; }
    .task-step-rail {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 0;
    }
    .task-step-rail button {
      display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
      border-radius: var(--radius-sm); border: 1px solid var(--border-default); background: var(--bg-canvas);
      text-align: left; transition: all 120ms;
    }
    .task-step-rail button:hover { border-color: var(--focus); background: var(--bg-surface); }
    .task-step-rail button[aria-current="step"] { border-color: var(--accent); background: var(--accent-wash); }
    .step-num {
      width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      font-size: 11px; font-weight: 650; border: 1px solid var(--border-strong); color: var(--ink-secondary);
    }
    .task-step-rail button[aria-current="step"] .step-num { background: var(--accent); color: #fff; border-color: var(--accent); }
    .app[data-theme="dark"] .task-step-rail button[aria-current="step"] .step-num { color: #17161e; }
    .task-step-rail strong { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.25; }
    .task-step-rail small { display: block; font-size: 11px; color: var(--ink-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 12px; }
    .chat-column { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .msg-card {
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md);
      padding: 15px 18px; box-shadow: var(--shadow-xs);
    }
    .msg-card.user-msg { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 20%, var(--border-default)); }
    .msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
    .user-avatar {
      width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 650;
    }
    .msg-body { font-size: 13.5px; line-height: 1.72; color: var(--ink-primary); }
    .msg-body p { margin: 0 0 8px; }
    .msg-body p:last-child { margin-bottom: 0; }
    .process-fold {
      background: var(--bg-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      padding: 8px 12px; font-size: 12px; color: var(--ink-secondary);
    }
    .process-fold summary { cursor: pointer; font-weight: 550; }
    .report-link-strip {
      margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--bg-subtle); border: 1px solid var(--border-default);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }

    .composer-dock {
      flex-shrink: 0; padding: 10px 24px 14px;
      background: var(--bg-canvas); border-top: 1px solid var(--border-default);
    }
    .composer-inner { max-width: 820px; margin: 0 auto; }
    .context-chip-bar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px;
    }
    .composer-box {
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
      padding: 11px 14px 9px; box-shadow: var(--shadow-sm);
    }
    .composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
    .composer-box textarea {
      width: 100%; border: 0; background: transparent; resize: none; min-height: 46px; font-size: 13.5px; line-height: 1.55; outline: 0;
    }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
    .composer-bar .toolbar-group { flex-wrap: nowrap; flex-shrink: 0; }
    .send-circle {
      width: 32px; height: 32px; border-radius: 50%; border: 0;
      background: var(--accent); color: #fff; display: grid; place-items: center; flex-shrink: 0;
    }
    .app[data-theme="dark"] .send-circle { color: #17161e; }
    .tray-fold {
      margin-top: 8px; background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); padding: 7px 12px; font-size: 12px; color: var(--ink-secondary);
    }
    .tray-fold summary { cursor: pointer; font-weight: 550; display: flex; justify-content: space-between; align-items: center; }
    .tray-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-subtle); }

    /* Right Inspector Drawer (Project Files / Report Evidence / Conclusion Review) */
    .right-drawer {
      width: 356px; flex: 0 0 356px; background: var(--bg-surface);
      border-left: 1px solid var(--border-default); display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
    }
    .right-drawer.hidden { display: none; }
    .drawer-head {
      padding: 13px 16px; border-bottom: 1px solid var(--border-default);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .drawer-head h2 { margin: 0; font-size: 14px; font-weight: 620; }
    .drawer-tabs {
      display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border-default);
      background: var(--bg-subtle);
    }
    .drawer-tabs button {
      flex: 1; border: 0; border-radius: var(--radius-sm); padding: 6px 8px;
      background: transparent; color: var(--ink-secondary); font-size: 12px; font-weight: 550;
    }
    .drawer-tabs button[aria-selected="true"] { background: var(--bg-surface); color: var(--accent); box-shadow: var(--shadow-xs); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px 20px; }
    .folder-block { border: 1px solid var(--border-default); border-radius: var(--radius-sm); margin-bottom: 10px; overflow: hidden; }
    .folder-block summary {
      padding: 8px 11px; background: var(--bg-subtle); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600;
    }
    .folder-file {
      padding: 9px 11px; border-top: 1px solid var(--border-subtle); font-size: 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .folder-file-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .evidence-block {
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      padding: 12px; background: var(--bg-canvas); margin-bottom: 12px; font-size: 12.5px;
    }
    .evidence-block h3 { margin: 0 0 6px; font-size: 13px; font-weight: 620; }
    .evidence-quote {
      margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--accent);
      background: var(--bg-surface); border-radius: 0 6px 6px 0; font-size: 12px; color: var(--ink-secondary);
    }

    /* ===== Page Specific: Strategy & Goals ===== */
    .split-2col { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 18px; align-items: start; }
    .strategy-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); margin-bottom: 16px;
    }
    .gate-card {
      display: flex; gap: 14px; padding: 16px; border: 1px solid var(--border-default);
      border-radius: var(--radius-md); background: var(--bg-surface); margin-bottom: 12px;
    }
    .gate-num {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
      font-weight: 700; font-size: 13px;
    }
    .release-tree {
      display: grid; gap: 12px; justify-items: center; padding: 18px;
      background: var(--bg-canvas); border: 1px solid var(--border-default); border-radius: var(--radius-md); margin: 14px 0;
    }
    .release-node {
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      padding: 10px 16px; text-align: center; min-width: 220px; box-shadow: var(--shadow-xs);
    }
    .release-node.root { border-color: var(--accent); background: var(--accent-wash); }
    .release-children { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; }
    .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .diff-box { padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); background: var(--bg-subtle); font-size: 12.5px; }
    .diff-box.after { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 30%, var(--border-default)); }

    /* ===== Page Specific: Settings (9 Categories Rail) ===== */
    .settings-layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 22px; align-items: start; }
    .settings-rail {
      background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); padding: 10px; position: sticky; top: 0;
    }
    .rail-group-title {
      font-size: 10.5px; font-weight: 650; color: var(--ink-muted); letter-spacing: 0.05em;
      padding: 8px 10px 4px; text-transform: uppercase;
    }
    .settings-rail button {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 10px; border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink-secondary); font-size: 13px; text-align: left;
    }
    .settings-rail button:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .settings-rail button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .settings-content { max-width: 780px; }
    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
    .field-group input, .field-group select, .field-group textarea {
      width: 100%; padding: 8px 11px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-default); background: var(--bg-canvas); color: var(--ink-primary); font-size: 13px;
    }
    .field-help { margin: 5px 0 0; font-size: 12px; color: var(--ink-muted); }

    /* ===== Page Specific: Decision Board ===== */
    .kpi-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi-card {
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md);
      padding: 16px 18px; box-shadow: var(--shadow-xs);
    }
    .kpi-card .kpi-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-secondary); }
    .kpi-card strong { display: block; font-size: 28px; font-weight: 650; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
    .kpi-card p { margin: 0; font-size: 12px; color: var(--ink-muted); }
    .board-lanes-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .board-lane { background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px; }
    .board-card {
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow-xs);
    }
    .board-card:last-child { margin-bottom: 0; }
    .board-card h4 { margin: 8px 0 6px; font-size: 13.5px; font-weight: 620; line-height: 1.45; }
    .board-card p { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-secondary); }

    /* ===== Page Specific: Help ===== */
    .help-layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 28px; align-items: start; }
    .help-toc {
      position: sticky; top: 0; background: var(--bg-surface);
      border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 10px;
    }
    .help-toc ol { list-style: none; padding: 0; margin: 0; }
    .help-toc button {
      display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 8px 10px;
      border: 0; border-radius: var(--radius-sm); background: transparent;
      color: var(--ink-secondary); font-size: 12.5px; text-align: left;
    }
    .help-toc button:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .help-toc button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .help-select-mobile { display: none; width: 100%; margin-bottom: 14px; }
    .help-article { max-width: 760px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 24px 28px; }
    .help-note { border-left: 3px solid var(--accent); background: var(--accent-wash); padding: 12px 14px; border-radius: 0 8px 8px 0; margin: 16px 0; font-size: 13px; }

    /* ===== Modal / Slide-over Dialog ===== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(18, 15, 32, 0.48);
      display: flex; justify-content: flex-end; align-items: stretch;
    }
    .modal-backdrop.centered { justify-content: center; align-items: center; padding: 16px; }
    .modal-sheet {
      width: min(820px, 96vw); background: var(--bg-surface); color: var(--ink-primary);
      box-shadow: var(--shadow-drawer); display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-backdrop.centered .modal-sheet {
      width: min(560px, 96vw); max-height: 88dvh; border-radius: var(--radius-lg); border: 1px solid var(--border-default);
    }
    .modal-head {
      padding: 16px 22px; border-bottom: 1px solid var(--border-default);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
    .modal-head p { margin: 4px 0 0; font-size: 12px; color: var(--ink-muted); }
    .modal-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .modal-foot {
      padding: 13px 22px; border-top: 1px solid var(--border-default); background: var(--bg-subtle);
      display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    }

    /* Toast */
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 80;
      padding: 10px 14px; border-radius: var(--radius-md);
      background: var(--ink-primary); color: var(--bg-surface);
      font-size: 12.5px; box-shadow: var(--shadow-md); max-width: 380px;
    }

    /* ===== Responsive Breakpoints: 1100px / 960px / 760px ===== */
    @media (max-width: 1100px) {
      .split-2col { grid-template-columns: minmax(0, 1fr); }
      .case-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board-lanes-3 { grid-template-columns: minmax(0, 1fr); }
      .right-drawer {
        position: absolute; top: 0; right: 0; bottom: 0; z-index: 25;
        width: min(380px, 92vw); box-shadow: var(--shadow-drawer);
      }
    }
    @media (max-width: 960px) {
      .settings-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .settings-rail {
        position: static; display: flex; gap: 4px; overflow-x: auto; padding: 6px;
        scrollbar-width: none;
      }
      .rail-group-title { display: none; }
      .settings-rail button { width: auto; white-space: nowrap; flex-shrink: 0; padding: 7px 11px; }
      .help-layout { grid-template-columns: minmax(0, 1fr); }
      .help-toc { display: none; }
      .help-select-mobile { display: block; }
    }
    @media (max-width: 760px) {
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: min(286px, 84vw);
        box-shadow: var(--shadow-md); z-index: 50;
      }
      .sidebar-backdrop.open {
        display: block; position: fixed; inset: 0; background: rgba(18, 15, 32, 0.42); z-index: 45;
      }
      .topbar { padding: 0 12px; gap: 6px; }
      .topbar-crumb { max-width: 34vw; font-size: 12px; }
      .workspace-switch button { padding: 4px 11px; font-size: 12px; }
      .help-btn span.help-lbl { display: none; }
      .page-scroll { padding: 16px 14px 28px; }
      .page-header h1 { font-size: 19px; }
      .task-header-band { padding: 12px 14px; }
      .task-step-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chat-scroll { padding: 14px 14px 10px; }

    function applyHashRoute() {
      const raw = (location.hash || "").replace(/^#/, "");
      if (!raw) return;
      const [route, sub] = raw.split("/");
      if (route === "help") { state.helpOpen = true; render(); return; }
      const map = {
        strategy: "strategy", goals: "goals", cases: "cases", projects: "projects",
        semantic: "semantic", analytics: "analytics", settings: "settings",
        task: "chat", chat: "chat", decision: "decision"
      };
      if (map[route]) {
        state.helpOpen = false;
        state.view = map[route];
        if (route === "strategy" && sub) state.strategyStage = sub;
        if (route === "goals" && sub) state.goalStage = sub;
        if (route === "semantic" && sub) state.semanticTab = sub;
        if (route === "analytics" && sub) state.analyticsTab = sub;
        if (route === "settings" && sub) state.settingsCategory = sub;
        if ((route === "task" || route === "chat") && sub === "evidence") {
          state.rightDrawerOpen = true;
          state.rightDrawerTab = "evidence";
        }
        if (route === "cases" && sub === "detail") {
          state.openCaseId = "case-01";
        }
        render();
      }
    }

                  <button type="button" aria-current="${currentStep === id ? "step" : "false"}" data-action="${act}" data-msg="需求梳理页面在产品中按需进入（本轮 Demo 聚焦 10 个核心正式页）。">

                  }
                  if (m.role === "user") {
                    return `<article class="msg-card user-msg"><div class="msg-head"><span class="user-avatar">你</span><strong>你</strong></div><div class="msg-body">${esc(m.text)}</div></article>`;
                  }
                  return `
                    <article class="msg-card">
                      <div class="msg-head">
                        <span class="brand-mark xs on-surface" aria-hidden="true"><span class="bm-outer"></span><span class="bm-inner"></span></span>
                        <strong>OptraCall</strong>
                        <span class="card-meta" style="margin:0;">${esc(task.model)}</span>
                      </div>
                      <div class="msg-body">${fmtInline(m.text)}</div>
                      ${m.semanticRef ? `<div style="margin-top:10px;"><span class="badge info">语义与指标引用：${esc(m.semanticRef)}</span></div>` : ""}
                      ${m.reportRef ? `

                            <strong style="font-size:12.5px;">已保存正式报告 · ${esc(m.reportRef)}</strong>
                            <div class="card-meta" style="margin:2px 0 0;">位于 060_reports · 可核对固定输入与计算依据</div>

                            <button type="button" class="btn btn-primary btn-sm" data-action="open-report-evidence" data-name="${esc(m.reportRef)}">查看报告与依据 →</button>

                        <button type="button" class="btn btn-ghost-muted" data-action="mock-toast" data-msg="已将本回复标记为整理为个人知识草稿（演示模拟）。">整理为知识</button>

            <div class="composer-dock">

                      <button type="button" class="btn btn-ghost" data-action="open-drawer-files">＋ 项目文件</button>

    // ===== 9. Decision Board (决策看板) =====
    function renderDecisionPage() {
      const items = DATA.board.items.filter(it =>
        (state.boardFilterProject === "all" || it.projectId === state.boardFilterProject) &&
        (state.boardFilterEvidence === "all" || it.evidence === state.boardFilterEvidence)
      );
      const suggested = items.filter(i => i.status === "suggested");
      const adopted = items.filter(i => i.status === "adopted");
      const done = items.filter(i => i.status === "done");
      const evClass = (ev) => ev === "数据支撑" ? "success" : ev === "多源佐证" ? "info" : ev === "逻辑推断" ? "warning" : "";

      return `
        <div class="page-scroll"><div class="page-inner">
          <header class="page-header">
            <div>
              <p class="eyebrow">DECISION BOARD · 从建议到结果</p>
              <h1>决策看板</h1>
              <p class="sub">跨项目汇总 060_reports 分析报告，把判断建议、行动跟进与结果复盘放在同一处。</p>
            </div>
            <div class="header-actions">
              <button type="button" class="btn btn-secondary btn-sm" data-action="mock-toast" data-msg="演示模式：人工补充建议对话框保持原字段结构。">＋ 补充建议</button>
            </div>
          </header>

          <section class="kpi-grid-3" aria-label="看板统计">
            <div class="kpi-card"><div class="kpi-top"><span>已保存报告</span><span class="mono-pill">060_reports</span></div><strong>${DATA.board.reports.length}</strong><p>各项目已保存的正式报告文件</p></div>
            <div class="kpi-card"><div class="kpi-top"><span>待判断建议</span><span class="badge warning">需取舍</span></div><strong>${suggested.length}</strong><p>其中高优 ${suggested.filter(i => i.priority === "high").length} 项</p></div>
            <div class="kpi-card"><div class="kpi-top"><span>已采纳与复盘</span><span class="badge success">行动中</span></div><strong>${adopted.length + done.length}</strong><p>进行中 ${adopted.length} 项 · 已完成复盘 ${done.length} 项</p></div>
          </section>

          <div class="toolbar">
            <div class="toolbar-group">
              <select class="select" data-action="board-filter-proj" aria-label="按项目过滤">
                <option value="all">全部项目</option>
                ${DATA.projects.filter(p => !p.archived).map(p => `<option value="${p.id}" ${state.boardFilterProject === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
              </select>
              <select class="select" data-action="board-filter-ev" aria-label="按证据等级过滤">
                <option value="all">全部证据等级</option>
                ${["数据支撑","多源佐证","逻辑推断","经验假设"].map(ev => `<option value="${ev}" ${state.boardFilterEvidence === ev ? "selected" : ""}>${ev}</option>`).join("")}
              </select>
            </div>
            <span class="card-meta" style="margin:0;">采纳由人决定；任务完成与业务效果分别回录。</span>
          </div>

          <section class="card" style="margin-bottom:18px;">
            <div class="card-head" style="margin-bottom:10px;"><div><h3>项目报告（${DATA.board.reports.length}）</h3><p class="card-meta">每次抽取仅读取 1 份报告；证据标签不代表独立核验。</p></div></div>
            <div style="display:grid;gap:8px;">
              ${DATA.board.reports.map(r => `
                <div class="slot-box" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                  <div><strong>${esc(r.name)}</strong> <span class="card-meta" style="display:inline;">· ${esc(r.projectName)} · ${esc(r.bytes)}</span> <span class="badge" style="margin-left:6px;">${esc(r.status)}</span></div>
                  <div class="toolbar-group">
                    <button type="button" class="btn btn-secondary btn-sm" data-action="open-task-evidence" data-proj="${r.projectId}" data-name="${esc(r.name)}">查看原报告依据</button>
                    <button type="button" class="btn btn-primary btn-sm" data-action="mock-toast" data-msg="演示行为：重新抽取仅读取单份报告，不自动执行行动。">重新抽取</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>

          <section class="board-lanes-3" aria-label="决策泳道">
            <div class="board-lane">
              <div class="case-lane-head"><span>◇ 判断建议</span><span class="badge">${suggested.length} 项待判断</span></div>
              ${suggested.map(it => `<article class="board-card">
                <div style="display:flex;gap:6px;flex-wrap:wrap;"><span class="badge ${evClass(it.evidence)}">${esc(it.evidence)}</span><span class="badge ${it.priority === "high" ? "error" : "accent"}">${it.priority === "high" ? "高优" : "中优"}</span><span class="badge">${esc(it.source)}</span></div>
                <h4>${esc(it.title)}</h4>
                <p>${esc(it.impact)}</p>
                <details style="font-size:12px;color:var(--ink-muted);margin-bottom:10px;"><summary style="cursor:pointer;">查看报告引文</summary><div class="evidence-quote">${esc(it.quote)}</div></details>
                <div class="card-foot"><span>${esc(it.projectName)}</span><button type="button" class="btn btn-primary btn-sm" data-action="adopt-board-item" data-id="${it.id}">采纳建议</button></div>
              </article>`).join("") || `<p class="card-meta" style="text-align:center;padding:18px;">暂无待判断建议</p>`}
            </div>

            <div class="board-lane">
              <div class="case-lane-head"><span>↗ 行动跟进</span><span class="badge accent">${adopted.length} 项进行中</span></div>
              ${adopted.map(it => `<article class="board-card">
                <div style="display:flex;gap:6px;flex-wrap:wrap;"><span class="badge ${evClass(it.evidence)}">${esc(it.evidence)}</span><span class="badge accent">${esc(it.taskStatus || "进行中")}</span></div>
                <h4>${esc(it.title)}</h4>
                <p>${esc(it.impact)}</p>
                <div class="slot-box" style="margin-bottom:8px;">负责人：${esc(it.owner || "待指定")} · 截止：${esc(it.dueDate || "待定")}</div>
                <div class="card-foot"><span>${esc(it.projectName)}</span><button type="button" class="btn btn-secondary btn-sm" data-action="complete-board-item" data-id="${it.id}">标记完成并复盘</button></div>
              </article>`).join("")}
            </div>

            <div class="board-lane">
              <div class="case-lane-head"><span>↻ 结果复盘</span><span class="badge success">${done.length} 项已完成</span></div>
              ${done.map(it => `<article class="board-card">
                <div style="display:flex;gap:6px;flex-wrap:wrap;"><span class="badge success">任务已完成</span><span class="badge">${esc(it.evidence)}</span></div>
                <h4>${esc(it.title)}</h4>
                <div class="slot-box" style="margin-bottom:8px;">${esc(it.feedback || "已回录执行结果，待补充长期效果观察。")}</div>
                <div class="card-foot"><span>${esc(it.projectName)}</span><button type="button" class="btn btn-ghost" data-action="mock-toast" data-msg="演示行为：可基于此反馈整理为个人知识或发起下一轮分析。">整理为经验</button></div>
              </article>`).join("")}
            </div>
          </section>
        </div></div>
      `;
    }

                      </div>
                    ` : ""}
                    ${c.relations.length ? `<div class="card" style="padding:14px;"><h3 style="margin:0 0 8px;font-size:13.5px;">与其他 Case 的业务关系</h3>${c.relations.map(r => `<div class="card-meta" style="margin-bottom:6px;"><strong>${esc(getCase(r.from)?.title)}</strong> — <span class="badge ${r.kind === "supports" ? "info" : "accent"}">${esc(r.kindLabel)}</span> → <strong>${esc(getCase(r.to)?.title)}</strong><div>${esc(r.note)}</div></div>`).join("")}</div>` : ""}
                  ` : state.caseDetailTab === "projects" ? `
                    ${linkedProjs.map(p => `<div class="card" style="padding:14px;">
                      <div class="card-head"><div><h3>${esc(p.name)}</h3><p class="card-meta">${esc(p.workStatus)} · 承接人：${esc(p.assignee)}</p></div></div>
                      <div class="task-pill-list">${p.tasks.map(t => `<div class="task-link-btn"><span>${esc(t.name)}</span><div class="toolbar-group"><button type="button" class="btn btn-ghost" data-action="open-task" data-proj="${p.id}" data-task="${t.id}">打开原任务</button><button type="button" class="btn btn-primary btn-sm" data-action="open-task-with-case" data-proj="${p.id}" data-task="${t.id}">按此 Case 继续</button></div></div>`).join("")}</div>
                    </div>`).join("") || `<p class="card-meta">尚未关联项目。</p>`}
                  ` : state.caseDetailTab === "artifacts" ? `
                    ${c.artifacts.map(a => `<div class="card" style="padding:14px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;"><strong>${esc(a.name)}</strong><span class="badge success">${esc(a.availability)}</span></div>
                      <div class="card-meta mono" style="margin-top:4px;">${esc(a.path)} · SHA ${esc(a.sha)}</div>
                      <div style="margin-top:8px;"><span class="badge accent">${esc(a.role)}</span></div>
                    </div>`).join("") || `<p class="card-meta">暂无产物引用。</p>`}
                  ` : `
                    ${c.history.map(h => `<div class="slot-box" style="margin-bottom:8px;"><strong>${esc(h.title)}</strong> <span class="card-meta" style="display:inline;">· ${esc(h.time)}</span><div class="card-meta">${esc(h.detail)}</div></div>`).join("")}
                  `}
                </div>
                <div class="modal-foot">
                  <button type="button" class="btn btn-secondary" data-action="close-case-modal">关闭</button>
                  ${c.primaryTask ? `<button type="button" class="btn btn-primary" data-action="open-task-with-case" data-proj="${c.primaryTask.projectId}" data-task="${c.primaryTask.taskId}">返回原分析任务 →</button>` : ""}
                </div>
              </section>
            </div>
          `;
        }
      }

      // 2. Project Detail Drawer
      if (state.openProjectId) {
        const p = getProject(state.openProjectId);
        html += `
          <div class="modal-backdrop" data-backdrop-close="proj">
            <section class="modal-sheet" role="dialog" aria-modal="true" aria-label="项目详情">
              <div class="modal-head">
                <div><h2>${esc(p.name)}</h2><p>${p.tasks.length} 个分析任务 · ${p.linkedCases.length} 个关联 Case · 承接人：${esc(p.assignee)}</p></div>
                <button type="button" class="icon-btn" data-action="close-proj-modal" aria-label="关闭项目详情">✕</button>
              </div>
              <div class="modal-body">
                <div class="slot-box" style="margin-bottom:12px;"><span class="slot-label">项目全局工作范围</span>${esc(p.workScope)}</div>
                <div class="slot-box" style="margin-bottom:14px;"><span class="slot-label">下一步</span>${esc(p.nextStep)}</div>
                <h3 style="font-size:13.5px;margin:0 0 8px;">关联 Case</h3>
                ${p.linkedCases.map(cid => { const cc = getCase(cid); return cc ? `<div class="task-link-btn" style="margin-bottom:12px;"><span>${esc(cc.title)}</span><button type="button" class="btn btn-ghost" data-action="open-case-from-anywhere" data-id="${cc.id}">打开 Case ↗</button></div>` : ""; }).join("") || `<p class="card-meta">独立项目，尚未关联 Case。</p>`}
                <h3 style="font-size:13.5px;margin:14px 0 8px;">全部任务</h3>
                <div class="task-pill-list">${p.tasks.map(t => `<button type="button" class="task-link-btn" data-action="open-task" data-proj="${p.id}" data-task="${t.id}"><span>${esc(t.name)}</span><span style="color:var(--accent);font-size:12px;">进入原分析任务 →</span></button>`).join("")}</div>
              </div>
              <div class="modal-foot"><button type="button" class="btn btn-secondary" data-action="close-proj-modal">关闭</button></div>
            </section>
          </div>
        `;
      }

      // 3. Strategy Release -> Goal Management Handoff Modal
      if (state.handoffModalOpen) {
        const s = DATA.strategy;
        const c = s.candidate;
        html += `
          <div class="modal-backdrop centered" data-backdrop-close="handoff">
            <section class="modal-sheet" role="dialog" aria-modal="true" aria-label="核对承接的目标与策略">
              <div class="modal-head">
                <div><h2>核对承接的目标与策略</h2><p>${esc(c.title)} · v${c.no} · 发布 ${s.activePubId}</p></div>
                <button type="button" class="icon-btn" data-action="close-handoff-modal" aria-label="关闭">✕</button>
              </div>
              <div class="modal-body">
                <div class="field-group"><label>目标归属范围</label><select><option selected>${esc(s.scope)}</option><option>星岚零售（企业级）</option></select></div>
                <p class="card-meta" style="margin-bottom:10px;">勾选要带入「目标管理」的目标候选；保存后仅成为候选，需在目标管理单独核对并采纳。</p>
                ${c.goals.map((g, i) => `
                  <label class="slot-box" style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;cursor:pointer;">
                    <input type="checkbox" ${state.handoffSelected.includes(i) ? "checked" : ""} data-action="toggle-handoff-item" data-idx="${i}" style="margin-top:3px;accent-color:var(--accent);" />
                    <span><strong>G${i+1} · ${esc(g.title)}</strong><div class="card-meta">策略：${esc(g.strategy)} · 指标：${esc(g.metric)}</div></span>
                  </label>
                `).join("")}
              </div>
              <div class="modal-foot">
                <button type="button" class="btn btn-secondary" data-action="close-handoff-modal">取消</button>
                <button type="button" class="btn btn-primary" ${state.handoffSelected.length ? "" : "disabled"} data-action="confirm-handoff">保存候选并前往目标管理核对 →</button>
              </div>
            </section>
          </div>
        `;
      }

      // 4. Studio Asset Read-only Drawer
      if (state.inspectAsset) {
        const a = state.inspectAsset;
        html += `
          <div class="modal-backdrop" data-backdrop-close="asset">
            <section class="modal-sheet" role="dialog" aria-modal="true" aria-label="查看准确资产">
              <div class="modal-head">
                <div><span class="badge success">${esc(a.status)}</span><h2 style="margin-top:6px;">${esc(a.title)}</h2><p>准确版本 ${esc(a.version)} · 标识 ${esc(a.id)} · 更新于 ${esc(a.updatedAt)}</p></div>
                <button type="button" class="icon-btn" data-action="close-asset-modal" aria-label="关闭">✕</button>
              </div>
              <div class="modal-body">
                <div class="evidence-block"><h3>准确定义与口径正文</h3><p style="margin:6px 0 0;line-height:1.75;">${esc(a.body)}</p></div>
                <p class="card-meta">只读核对准确版本，不会自动改写已关联的旧目标或旧分析报告。</p>
              </div>
              <div class="modal-foot"><button type="button" class="btn btn-secondary" data-action="close-asset-modal">关闭来源</button></div>
            </section>
          </div>
        `;
      }

      return html;
    }

    function renderMainContent() {
      if (state.helpOpen) return renderHelpPage();
      switch (state.view) {
        case "strategy": return renderStrategyPage();
        case "goals": return renderGoalsPage();
        case "cases": return renderCasesPage();
        case "projects": return renderProjectsPage();
        case "semantic": return renderStudioPage("semantic");
        case "analytics": return renderStudioPage("analytics");
        case "settings": return renderSettingsPage();
        case "decision": return renderDecisionPage();
        case "chat": return renderChatPage();
        default: return renderProjectsPage();
      }
    }

    function render() {
      const root = document.getElementById("app");
      root.setAttribute("data-theme", state.theme);
      root.innerHTML = `
        ${renderSidebar()}
        <main class="main" id="main-content">
          ${renderTopbar()}
          <div class="workspace-body">${renderMainContent()}</div>
        </main>
        ${renderModals()}
        ${state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : ""}
      `;
    }

    // =========================================================================
    // Event Delegation
    // =========================================================================
    document.getElementById("app").addEventListener("click", (e) => {
      if (e.target.dataset && e.target.dataset.backdropClose) {
        const k = e.target.dataset.backdropClose;
        if (k === "case") state.openCaseId = null;
        else if (k === "proj") state.openProjectId = null;
        else if (k === "handoff") state.handoffModalOpen = false;
        else if (k === "asset") state.inspectAsset = null;
        render();
        return;
      }
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const act = btn.dataset.action;

      if (act === "nav") navigate(btn.dataset.view);
      else if (act === "toggle-sidebar") { state.sidebarOpen = !state.sidebarOpen; render(); }
      else if (act === "close-sidebar") { state.sidebarOpen = false; render(); }
      else if (act === "toggle-primary-nav") { state.primaryNavOpen = !state.primaryNavOpen; render(); }
      else if (act === "toggle-project-space") { state.projectSpaceOpen = !state.projectSpaceOpen; render(); }
      else if (act === "toggle-archived") { state.archivedOpen = !state.archivedOpen; render(); }
      else if (act === "toggle-proj") { const id = btn.dataset.id; state.expandedProjects[id] = !state.expandedProjects[id]; render(); }
      else if (act === "toggle-theme") { state.theme = state.theme === "light" ? "dark" : "light"; render(); }
      else if (act === "toggle-help") { state.helpOpen = !state.helpOpen; render(); }
      else if (act === "toggle-right-drawer") { state.rightDrawerOpen = !state.rightDrawerOpen; render(); }
      else if (act === "set-drawer-tab") { state.rightDrawerTab = btn.dataset.tab; render(); }
      else if (act === "open-drawer-files") { state.rightDrawerOpen = true; state.rightDrawerTab = "files"; render(); }
      else if (act === "open-drawer-evidence") { state.rightDrawerOpen = true; state.rightDrawerTab = "evidence"; render(); }
      else if (act === "open-drawer-review") { state.rightDrawerOpen = true; state.rightDrawerTab = "review"; render(); }
      else if (act === "open-report-evidence") { openReportEvidence(btn.dataset.name); }
      else if (act === "open-task-evidence") {
        const p = getProject(btn.dataset.proj);
        state.activeProjectId = p.id; state.activeTaskId = p.tasks[0].id;
        state.activeReportName = btn.dataset.name; state.view = "chat";
        state.rightDrawerOpen = true; state.rightDrawerTab = "evidence"; render();
      }
      else if (act === "open-proj-first-task") { const p = getProject(btn.dataset.id); openTaskFromAnywhere(p.id, p.tasks[0].id, true); }
      else if (act === "open-task") { openTaskFromAnywhere(btn.dataset.proj, btn.dataset.task, true); }
      else if (act === "open-task-with-case") { openTaskFromAnywhere(btn.dataset.proj, btn.dataset.task, true); showToast("已返回原分析任务并附带关联 Case 背景。"); }
      else if (act === "open-proj-detail") { state.openProjectId = btn.dataset.id; render(); }
      else if (act === "close-proj-modal") { state.openProjectId = null; render(); }
      else if (act === "open-case-from-anywhere") { state.openProjectId = null; openCaseFromEvidence(btn.dataset.id); }
      else if (act === "close-case-modal") { state.openCaseId = null; render(); }
      else if (act === "set-case-tab") { state.caseDetailTab = btn.dataset.tab; render(); }
      else if (act === "set-case-display") { state.caseDisplay = btn.dataset.val; render(); }
      else if (act === "set-case-reg") { state.caseRegularMode = btn.dataset.val; render(); }
      else if (act === "set-proj-mode") { state.projectMode = btn.dataset.val; render(); }
      else if (act === "star-focus") { const id = btn.dataset.id; state.caseFocusNodeId = state.caseFocusNodeId === id ? null : id; render(); }
      else if (act === "star-zoom") {
        if (btn.dataset.delta === "reset") state.starZoom = 1;
        else state.starZoom = Math.min(1.4, Math.max(0.6, +(state.starZoom + parseFloat(btn.dataset.delta)).toFixed(2)));
        render();
      }
      else if (act === "star-open") {
        if (btn.dataset.kind === "case") openCaseFromEvidence(btn.dataset.id);
        else if (btn.dataset.kind === "project") { state.view = "projects"; state.openProjectId = btn.dataset.id; render(); }
        else if (btn.dataset.kind === "task") openTaskFromAnywhere(btn.dataset.proj, btn.dataset.id, true);
      }
      else if (act === "set-strategy-stage") { state.strategyStage = btn.dataset.stage; render(); }
      else if (act === "set-release-tpl") { state.releaseTemplate = btn.dataset.tpl; render(); }
      else if (act === "open-handoff-modal") { state.handoffModalOpen = true; render(); }
      else if (act === "close-handoff-modal") { state.handoffModalOpen = false; render(); }
      else if (act === "confirm-handoff") {
        const s = DATA.strategy;
        const picked = s.candidate.goals.filter((_, i) => state.handoffSelected.includes(i));
        if (!DATA.goals.some(g => g.id === "goal-03") && picked[0]) {
          DATA.goals.unshift({
            id: "goal-03",
            title: picked[0].title,
            version: 1,
            status: "candidate",
            perspective: "营利组织",
            scope: s.scope,
            metric: `SAP 指标 ${picked[0].metric}`,
            baseline: "待补可比基线 · 需与 020_clean 历史毛利宽表核对",
            responsible: "待明确 · 华东零售事业部",
            dueAt: "2026-12-31",
            origin: `战略发布 ${s.activePubId} · ${s.candidate.title} v${s.candidate.no}`,
            outcome: `承接正式发布战略版本 ${s.activePubId}，达成「${picked[0].title}」。`,
            strategies: [picked[0].strategy],
            resources: ["盘活暂缓新开店转入的存量门店补货预算"],
            conditions: ["高频刚需断货率控制在 5% 以下"],
            linkedCaseId: "case-01"
          });
        }
        state.handoffModalOpen = false;
        state.selectedGoalId = "goal-03";
        state.handoffBanner = `已从「${s.candidate.title} · v${s.candidate.no}（${s.activePubId}）」导入 ${picked.length} 项目标候选，请在「核对与采用」逐项确认。`;
        navigate("goals", { goalStage: "adopt" });
        showToast("已保存目标候选并跳转至目标管理核对。");
      }
      else if (act === "clear-handoff-banner") { state.handoffBanner = null; render(); }
      else if (act === "set-goal-stage") { state.goalStage = btn.dataset.stage; render(); }
      else if (act === "select-goal") { state.selectedGoalId = btn.dataset.id; render(); }
      else if (act === "adopt-goal") {
        const g = DATA.goals.find(x => x.id === btn.dataset.id);
        if (g) { g.status = "adopted"; showToast(`已核对并采纳「${g.title} · v${g.version}」（演示内存状态）。`); }
      }
      else if (act === "set-studio-tab") {
        if (btn.dataset.area === "semantic") state.semanticTab = btn.dataset.tab;
        else state.analyticsTab = btn.dataset.tab;
        render();
      }
      else if (act === "set-wb-pane") { state.workbenchPane = btn.dataset.val; render(); }
      else if (act === "inspect-asset") {
        const list = (DATA.studioAssets[btn.dataset.area] && DATA.studioAssets[btn.dataset.area][btn.dataset.tab]) || [];
        state.inspectAsset = list.find(x => x.id === btn.dataset.id) || null;
        render();
      }
      else if (act === "close-asset-modal") { state.inspectAsset = null; render(); }
      else if (act === "set-settings-cat") { state.settingsCategory = btn.dataset.cat; render(); }
      else if (act === "back-from-settings") { navigate(state.lastNonSettingsView || "projects"); }
      else if (act === "set-help-ch") { state.helpChapter = Math.max(0, Math.min(DATA.helpChapters.length - 1, Number(btn.dataset.idx))); render(); }
      else if (act === "toggle-case-ctx") { state.attachedCaseContext = !state.attachedCaseContext; render(); }
      else if (act === "focus-composer") { const el = document.getElementById("demo-composer"); if (el) el.focus(); }
      else if (act === "adopt-board-item") {
        const it = DATA.board.items.find(x => x.id === btn.dataset.id);
        if (it) { it.status = "adopted"; it.owner = "林若溪"; it.dueDate = "2026-12-10"; it.taskStatus = "待办"; showToast("已采纳建议并移入「行动跟进」泳道。"); }
      }
      else if (act === "complete-board-item") {
        const it = DATA.board.items.find(x => x.id === btn.dataset.id);
        if (it) { it.status = "done"; it.feedback = "演示回录：按建议执行完成，待补充独立验证与指标观察。"; showToast("已标记完成并移入「结果复盘」泳道。"); }
      }
      else if (act === "mock-new-project") { showToast("演示行为：新建项目将创建 010_draw / 020_clean / 060_reports 三个共享目录。"); }
      else if (act === "mock-new-task") { showToast("演示行为：在所选项目中新建独立会话任务（不修改其他任务历史）。"); }
      else if (act === "mock-toast") { showToast(btn.dataset.msg || "演示交互反馈。"); }
    });

    document.getElementById("app").addEventListener("change", (e) => {
      const el = e.target;
      const act = el.dataset.action;
      if (act === "proj-filter") { state.projectFilter = el.value; render(); }
      else if (act === "case-rel-filter") { state.caseRelationFilter = el.value; render(); }
      else if (act === "switch-enterprise") { state.enterpriseId = el.value; showToast(`已切换企业范围（演示内存数据）。`); }
      else if (act === "board-filter-proj") { state.boardFilterProject = el.value; render(); }
      else if (act === "board-filter-ev") { state.boardFilterEvidence = el.value; render(); }
      else if (act === "select-help-ch") { state.helpChapter = Number(el.value); render(); }
      else if (act === "toggle-handoff-item") {
        const idx = Number(el.dataset.idx);
        if (el.checked) { if (!state.handoffSelected.includes(idx)) state.handoffSelected.push(idx); }
        else state.handoffSelected = state.handoffSelected.filter(i => i !== idx);
        render();
      }
    });

    document.getElementById("app").addEventListener("submit", (e) => {
      const form = e.target.closest("[data-action='send-demo-msg']");
      if (!form) return;
      e.preventDefault();
      const input = document.getElementById("demo-composer");
      const val = (input?.value || "").trim();
      if (!val) return;
      const proj = getProject(state.activeProjectId);
      const task = getTask(proj, state.activeTaskId);
      task.messages.push({ role: "user", text: val });
      task.messages.push({ role: "assistant", text: "（演示模拟回复）已收到你的追问，已核对 020_clean 宽表与已保存报告《华东Q3会员复购归因报告_v2.md》上下文。正式环境中由 Pi Agent 自主调用工具与模型生成实时结果。" });
      task.draft = "";
      state.composerDraft = "";
      render();
      showToast("已追加演示对话（未调用真实模型）。");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (state.handoffModalOpen) { state.handoffModalOpen = false; render(); }
        else if (state.inspectAsset) { state.inspectAsset = null; render(); }
        else if (state.openCaseId) { state.openCaseId = null; render(); }
        else if (state.openProjectId) { state.openProjectId = null; render(); }
        else if (state.helpOpen) { state.helpOpen = false; render(); }
      }
    });

    render();
    applyHashRoute();
  </script>
</body>
</html>
